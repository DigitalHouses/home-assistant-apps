type: sections
max_columns: 3
title: UPS
path: ups
icon: mdi:power-plug-battery
sections:
  - type: grid
    cards:
      - type: heading
        heading: Состояние UPS
        icon: mdi:power-plug-battery
      - type: tile
        entity: sensor.dh_app_pve_ups_status
        name: Статус
      - type: tile
        entity: sensor.dh_app_pve_ups_problems
        name: Проблемы
      - type: tile
        entity: button.dh_app_pve_ups_refresh
        name: Обновить

  - type: grid
    cards:
      - type: heading
        heading: Питание и батарея
        icon: mdi:battery-medium
      - type: entities
        entities:
          - entity: sensor.dh_app_pve_ups_battery_charge
            name: Заряд батареи
          - entity: sensor.dh_app_pve_ups_battery_runtime_minutes
            name: Прогноз работы от батареи
          - entity: sensor.dh_app_pve_ups_load
            name: Нагрузка
          - entity: sensor.dh_app_pve_ups_input_voltage
            name: Входное напряжение
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.dh_app_pve_ups_output_voltage
                state_not:
                  - unknown
                  - unavailable
            row:
              entity: sensor.dh_app_pve_ups_output_voltage
              name: Выходное напряжение
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.dh_app_pve_ups_battery_voltage
                state_not:
                  - unknown
                  - unavailable
            row:
              entity: sensor.dh_app_pve_ups_battery_voltage
              name: Напряжение батареи
      - type: history-graph
        title: Заряд / нагрузка · 24 часа
        hours_to_show: 24
        entities:
          - sensor.dh_app_pve_ups_battery_charge
          - sensor.dh_app_pve_ups_load

  - type: grid
    cards:
      - type: heading
        heading: Диагностика
        icon: mdi:alert-circle-outline
      - type: entities
        entities:
          - entity: binary_sensor.dh_app_pve_ups_nut_unavailable_problem
            name: NUT недоступен
          - entity: binary_sensor.dh_app_pve_ups_on_battery_problem
            name: Работа от батареи
          - entity: binary_sensor.dh_app_pve_ups_low_battery_problem
            name: Низкий заряд
          - entity: binary_sensor.dh_app_pve_ups_overload_problem
            name: Перегрузка
          - entity: binary_sensor.dh_app_pve_ups_replace_battery_problem
            name: Замена батареи
          - entity: binary_sensor.dh_app_pve_ups_bypass_problem
            name: Bypass
          - entity: binary_sensor.dh_app_pve_ups_power_state_unknown_problem
            name: Неизвестное состояние питания

  - type: grid
    cards:
      - type: heading
        heading: UPS Shutdown Trigger
        icon: mdi:power-settings
      - type: tile
        entity: sensor.dh_app_pve_ups_shutdown_policy
        name: NUT policy
      - type: tile
        entity: sensor.dh_app_pve_ups_policy_power_restore_delay
        name: Задержка восстановления питания

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.dh_app_pve_ups_trigger_ui_state
            state: view
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: >-
                {% set policy = 'sensor.dh_app_pve_ups_trigger_policy' %}
                {% set charge = state_attr(policy, 'active_charge_threshold_percent') %}
                {% set reserve = state_attr(policy, 'active_runtime_reserve_seconds') %}
                {% set revision = state_attr(policy, 'policy_revision') %}
                {% set guest_raw = states('sensor.dh_app_pve_ups_guest_shutdown_budget') %}
                {% set budget_raw = states('sensor.dh_app_pve_ups_shutdown_budget') %}
                {% set guest = guest_raw | int(0) %}
                {% set budget = budget_raw | int(0) %}
                {% set reserve_s = reserve | int(0) %}
                {% set trigger_s = budget + reserve_s %}
                **Policy:** {{ states(policy) }}{% if revision is not none %} · revision {{ revision }}{% endif %}  
                **Battery threshold:** {{ charge if charge is not none else '—' }} %  
                **Runtime reserve:** {{ reserve if reserve is not none else '—' }} s  
                **Guest shutdown budget:** {{ guest if guest_raw not in ['unknown', 'unavailable', 'none', ''] else '—' }} s  
                **Full shutdown budget:** {{ budget if budget_raw not in ['unknown', 'unavailable', 'none', ''] else '—' }} s  
                **Effective runtime trigger:** {% if reserve is not none and budget_raw not in ['unknown', 'unavailable', 'none', ''] %}{{ trigger_s }} s / {{ '%02d:%02d' | format(trigger_s // 60, trigger_s % 60) }}{% else %}—{% endif %}  
                **Readiness:** {{ states('sensor.dh_app_pve_ups_shutdown_readiness') | upper }}
            - type: button
              name: Config UPS trigger
              icon: mdi:tune-variant
              tap_action:
                action: perform-action
                perform_action: script.dh_app_pve_ups_trigger_open

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.dh_app_pve_ups_trigger_ui_state
            state: edit
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: >-
                {% set policy = 'sensor.dh_app_pve_ups_trigger_policy' %}
                {% set active_charge = state_attr(policy, 'active_charge_threshold_percent') %}
                {% set active_reserve = state_attr(policy, 'active_runtime_reserve_seconds') %}
                ## Configure UPS trigger

                **ACTIVE:** {{ active_charge if active_charge is not none else '—' }} % / {{ active_reserve if active_reserve is not none else '—' }} s  
                Изменения ниже меняют только **DRAFT**. PVE/NUT policy пока не применяется.
            - type: entities
              title: Draft
              entities:
                - entity: number.dh_app_pve_ups_shutdown_battery_charge_threshold
                  name: Battery threshold
                - entity: number.dh_app_pve_ups_shutdown_runtime_reserve
                  name: Runtime reserve
            - type: markdown
              content: >-
                {% set budget_raw = states('sensor.dh_app_pve_ups_shutdown_budget') %}
                {% set budget = budget_raw | int(0) %}
                {% set reserve = states('number.dh_app_pve_ups_shutdown_runtime_reserve') | int(0) %}
                {% set trigger_s = budget + reserve %}
                **DRAFT calculation**  
                Full shutdown budget: {{ budget if budget_raw not in ['unknown', 'unavailable', 'none', ''] else '—' }} s  
                Runtime trigger: {% if budget_raw not in ['unknown', 'unavailable', 'none', ''] %}{{ trigger_s }} s / {{ '%02d:%02d' | format(trigger_s // 60, trigger_s % 60) }}{% else %}—{% endif %}
            - type: grid
              columns: 2
              square: false
              cards:
                - type: button
                  name: Apply configuration
                  icon: mdi:check-circle-outline
                  tap_action:
                    action: perform-action
                    perform_action: script.dh_app_pve_ups_trigger_review
                - type: button
                  name: Cancel
                  icon: mdi:close-circle-outline
                  tap_action:
                    action: perform-action
                    perform_action: script.dh_app_pve_ups_trigger_cancel

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.dh_app_pve_ups_trigger_ui_state
            state: confirm
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: >-
                {% set policy = 'sensor.dh_app_pve_ups_trigger_policy' %}
                {% set old_charge = state_attr(policy, 'active_charge_threshold_percent') %}
                {% set old_reserve = state_attr(policy, 'active_runtime_reserve_seconds') %}
                {% set new_charge = states('number.dh_app_pve_ups_shutdown_battery_charge_threshold') | int(0) %}
                {% set new_reserve = states('number.dh_app_pve_ups_shutdown_runtime_reserve') | int(0) %}
                {% set budget_raw = states('sensor.dh_app_pve_ups_shutdown_budget') %}
                {% set budget = budget_raw | int(0) %}
                {% set trigger_s = budget + new_reserve %}
                ## Подтвердить UPS Trigger Policy

                **OLD:** {{ old_charge if old_charge is not none else '—' }} % / {{ old_reserve if old_reserve is not none else '—' }} s  
                **NEW:** {{ new_charge }} % / {{ new_reserve }} s  
                **Full shutdown budget:** {{ budget if budget_raw not in ['unknown', 'unavailable', 'none', ''] else '—' }} s  
                **NEW effective runtime trigger:** {% if budget_raw not in ['unknown', 'unavailable', 'none', ''] %}{{ trigger_s }} s / {{ '%02d:%02d' | format(trigger_s // 60, trigger_s % 60) }}{% else %}—{% endif %}
            - type: grid
              columns: 2
              square: false
              cards:
                - type: button
                  name: Подтвердить и применить
                  icon: mdi:check-decagram-outline
                  tap_action:
                    action: perform-action
                    perform_action: script.dh_app_pve_ups_trigger_apply
                - type: button
                  name: Назад
                  icon: mdi:arrow-left
                  tap_action:
                    action: perform-action
                    perform_action: script.dh_app_pve_ups_trigger_back_to_edit
