type: sections
max_columns: 3
title: Proxmox
path: proxmox
icon: phu:proxmox
sections:
  # ---------------------------------------------------------------------------
  # Column 1 · Host state and aggregate problems
  # ---------------------------------------------------------------------------
  - type: grid
    cards:
      - type: heading
        heading: Состояние Proxmox
        heading_style: title
        icon: mdi:server

      # Keep the aggregate problem card first. The App owns the problem list;
      # Lovelace only renders the retained sensor presentation.
      - type: custom:mushroom-template-card
        entity: sensor.dh_app_pve_problems
        primary: >-
          {% set active = state_attr('sensor.dh_app_pve_problems', 'active') or [] %}
          {% if states('sensor.dh_app_pve_problems') in ['unknown', 'unavailable'] %}
            Состояние проблем недоступно
          {% elif active | count == 0 %}
            Все нормально
          {% else %}
            Обнаружены проблемы · {{ active | count }}
          {% endif %}
        secondary: |-
          {% set active = state_attr('sensor.dh_app_pve_problems', 'active') or [] %}
          {% if active | count == 0 %}
            Активных проблем нет
          {% else %}
            {% for item in active %}
            • {{ item.object_name }} — {{ item.summary }}{% if item.details %} · {{ item.details }}{% endif %}
            {% endfor %}
          {% endif %}
        icon: >-
          {% set active = state_attr('sensor.dh_app_pve_problems', 'active') or [] %}
          {{ 'mdi:alert-circle' if active | count > 0 else 'mdi:check-circle' }}
        icon_color: >-
          {% if states('sensor.dh_app_pve_problems') in ['unknown', 'unavailable'] %}
            grey
          {% elif (state_attr('sensor.dh_app_pve_problems', 'active') or []) | count > 0 %}
            red
          {% else %}
            green
          {% endif %}
        multiline_secondary: true
        tap_action:
          action: more-info

      - type: custom:mushroom-template-card
        entity: sensor.dh_app_pve_system
        primary: >-
          {{ states('sensor.dh_app_pve_system') }}
        secondary: >-
          {% set manufacturer = state_attr('sensor.dh_app_pve_system', 'manufacturer') %}
          {% set model = state_attr('sensor.dh_app_pve_system', 'model') %}
          {% set pve = state_attr('sensor.dh_app_pve_system', 'proxmox_version') %}
          {% set ip = state_attr('sensor.dh_app_pve_system', 'primary_ip') %}
          {{ [manufacturer, model] | reject('in', [none, '', 'unknown']) | join(' ') }}{% if pve %} · PVE {{ pve }}{% endif %}{% if ip %} · {{ ip }}{% endif %}
        icon: mdi:server
        icon_color: blue
        multiline_secondary: true
        tap_action:
          action: more-info

      - type: tile
        entity: sensor.dh_app_pve_last_boot
        name: Последний запуск

      - type: custom:mushroom-template-card
        entity: button.dh_app_pve_refresh
        primary: Обновить
        secondary: >-
          {% set v = states('sensor.dh_app_pve_last_refresh') %}
          {% if v in ['unknown', 'unavailable', 'none', ''] %}
            Последнее обновление: —
          {% else %}
            Последнее обновление: {{ as_timestamp(v) | timestamp_custom('%d.%m.%Y %H:%M:%S', true) }}
          {% endif %}
        icon: mdi:refresh
        icon_color: blue
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.dh_app_pve_refresh

      - type: tile
        entity: sensor.dh_app_pve_last_refresh
        name: Последнее обновление

      - type: tile
        entity: sensor.dh_app_pve_last_publication
        name: Последняя публикация

  # ---------------------------------------------------------------------------
  # Column 2 · Fixed host performance metrics (no auto-entities)
  # ---------------------------------------------------------------------------
  - type: grid
    cards:
      - type: heading
        heading: Производительность
        heading_style: title
        icon: mdi:gauge

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.dh_app_pve_cpu_usage
            name: CPU
          - type: custom:mushroom-template-card
            entity: sensor.dh_app_pve_cpu_temperature
            primary: Температура CPU
            secondary: >-
              {{ states('sensor.dh_app_pve_cpu_temperature') }} °C
            icon: mdi:thermometer
            icon_color: >-
              {% if is_state('binary_sensor.dh_app_pve_cpu_temperature_problem', 'on') %}
                red
              {% elif is_state('binary_sensor.dh_app_pve_cpu_temperature_problem', 'off') %}
                blue
              {% else %}
                grey
              {% endif %}
            tap_action:
              action: more-info
          - type: tile
            entity: sensor.dh_app_pve_cpu_frequency
            name: Частота CPU
          - type: tile
            entity: sensor.dh_app_pve_memory_usage
            name: RAM
          - type: tile
            entity: sensor.dh_app_pve_swap_usage
            name: Swap

      - type: history-graph
        title: CPU / RAM / Swap · 24 часа
        hours_to_show: 24
        entities:
          - sensor.dh_app_pve_cpu_usage
          - sensor.dh_app_pve_memory_usage
          - sensor.dh_app_pve_swap_usage

      - type: history-graph
        title: Температура CPU · 24 часа
        hours_to_show: 24
        entities:
          - sensor.dh_app_pve_cpu_temperature

  # ---------------------------------------------------------------------------
  # Column 3 · Dynamic storage and disk inventory
  # ---------------------------------------------------------------------------
  - type: grid
    cards:
      - type: heading
        heading: Хранилища
        heading_style: title
        icon: mdi:database

      - type: custom:auto-entities
        card:
          type: vertical-stack
        card_param: cards
        filter:
          include:
            - entity_id: sensor.dh_app_pve_storage_*_percent_used
              attributes:
                proxmox_integration: dh_pve_app
                proxmox_section: storage
                proxmox_subject: storage
              options:
                type: custom:mushroom-template-card
                primary: >-
                  {{ state_attr(entity, 'proxmox_display_name') or state_attr(entity, 'friendly_name') or entity }}
                secondary: >-
                  {% set total = state_attr(entity, 'total_gib') %}
                  {% set storage_type = state_attr(entity, 'storage_type') %}
                  {{ states(entity) }} % занято{% if total not in [none, '', 'unknown', 'unavailable'] %} · {{ total }} GiB всего{% endif %}{% if storage_type not in [none, '', 'unknown', 'unavailable'] %} · {{ storage_type }}{% endif %}
                icon: mdi:database
                icon_color: >-
                  {% set problem = entity | replace('sensor.', 'binary_sensor.') ~ '_problem' %}
                  {% if is_state(problem, 'on') %}
                    red
                  {% elif is_state(problem, 'off') %}
                    green
                  {% else %}
                    grey
                  {% endif %}
                tap_action:
                  action: more-info
        sort:
          method: attribute
          attribute: proxmox_sort_key
        show_empty: true

      - type: heading
        heading: Физические диски
        heading_style: title
        icon: mdi:harddisk

      - type: custom:auto-entities
        card:
          type: vertical-stack
        card_param: cards
        filter:
          include:
            - entity_id: sensor.dh_app_pve_disk_*_temperature
              attributes:
                proxmox_integration: dh_pve_app
                proxmox_section: disk
                proxmox_subject: disk
                proxmox_metric: temperature
              options:
                type: custom:mushroom-template-card
                primary: >-
                  {{ state_attr(entity, 'proxmox_display_name') or state_attr(entity, 'friendly_name') or entity }}
                secondary: >-
                  {% set health = entity | replace('_temperature', '_health') %}
                  {% set wear = entity | replace('_temperature', '_wear') %}
                  {% set smart_problem = entity | replace('sensor.', 'binary_sensor.') | replace('_temperature', '_smart_problem') %}
                  {{ states(entity) }} °C{% if states(health) not in ['unknown', 'unavailable', 'none', ''] %} · SMART: {{ states(health) }}{% elif is_state(smart_problem, 'off') %} · SMART: OK{% elif is_state(smart_problem, 'on') %} · SMART: проблема{% endif %}{% if states(wear) not in ['unknown', 'unavailable', 'none', ''] %} · Wearout: {{ states(wear) }} %{% endif %}
                icon: mdi:harddisk
                icon_color: >-
                  {% set problem = entity | replace('sensor.', 'binary_sensor.') ~ '_problem' %}
                  {% if is_state(problem, 'on') %}
                    red
                  {% elif is_state(problem, 'off') %}
                    blue
                  {% else %}
                    grey
                  {% endif %}
                multiline_secondary: true
                tap_action:
                  action: more-info
        sort:
          method: attribute
          attribute: proxmox_sort_key
        show_empty: true

  # ---------------------------------------------------------------------------
  # Row 2 · Dynamic guest inventory
  # ---------------------------------------------------------------------------
  - type: grid
    cards:
      - type: heading
        heading: Виртуальные машины
        heading_style: title
        icon: mdi:server-multiple

      - type: custom:mushroom-template-card
        entity: sensor.dh_app_pve_vms
        primary: Виртуальные машины
        secondary: >-
          Запущено: {{ state_attr('sensor.dh_app_pve_vms', 'running') | int(0) }} · всего: {{ state_attr('sensor.dh_app_pve_vms', 'total') | int(0) }} · остановлено: {{ state_attr('sensor.dh_app_pve_vms', 'stopped') | int(0) }}
        icon: mdi:server-multiple
        icon_color: blue
        tap_action:
          action: more-info

      - type: custom:auto-entities
        card:
          type: vertical-stack
        card_param: cards
        filter:
          include:
            - entity_id: sensor.dh_app_pve_vm_*_status
              attributes:
                proxmox_integration: dh_pve_app
                proxmox_section: guests
                proxmox_subject: vm
                proxmox_metric: status
              options:
                type: custom:mushroom-template-card
                primary: >-
                  {{ state_attr(entity, 'proxmox_display_name') or state_attr(entity, 'friendly_name') or entity }}
                secondary: >-
                  VM {{ state_attr(entity, 'guest_id') or '—' }} · {{ states(entity) }}
                icon: mdi:server
                icon_color: >-
                  {% set s = states(entity) %}
                  {% if s == 'running' %}
                    green
                  {% elif s == 'paused' %}
                    orange
                  {% elif s == 'stopped' %}
                    grey
                  {% else %}
                    red
                  {% endif %}
                tap_action:
                  action: more-info
        sort:
          method: attribute
          attribute: proxmox_sort_key
        show_empty: true

  - type: grid
    cards:
      - type: heading
        heading: LXC
        heading_style: title
        icon: mdi:package-variant

      - type: custom:mushroom-template-card
        entity: sensor.dh_app_pve_lxcs
        primary: LXC контейнеры
        secondary: >-
          Запущено: {{ state_attr('sensor.dh_app_pve_lxcs', 'running') | int(0) }} · всего: {{ state_attr('sensor.dh_app_pve_lxcs', 'total') | int(0) }} · остановлено: {{ state_attr('sensor.dh_app_pve_lxcs', 'stopped') | int(0) }}
        icon: mdi:package-variant
        icon_color: blue
        tap_action:
          action: more-info

      - type: custom:auto-entities
        card:
          type: vertical-stack
        card_param: cards
        filter:
          include:
            - entity_id: sensor.dh_app_pve_lxc_*_status
              attributes:
                proxmox_integration: dh_pve_app
                proxmox_section: guests
                proxmox_subject: lxc
                proxmox_metric: status
              options:
                type: custom:mushroom-template-card
                primary: >-
                  {{ state_attr(entity, 'proxmox_display_name') or state_attr(entity, 'friendly_name') or entity }}
                secondary: >-
                  LXC {{ state_attr(entity, 'guest_id') or '—' }} · {{ states(entity) }}
                icon: mdi:package-variant-closed
                icon_color: >-
                  {% set s = states(entity) %}
                  {% if s == 'running' %}
                    green
                  {% elif s == 'paused' %}
                    orange
                  {% elif s == 'stopped' %}
                    grey
                  {% else %}
                    red
                  {% endif %}
                tap_action:
                  action: more-info
        sort:
          method: attribute
          attribute: proxmox_sort_key
        show_empty: true

  # ---------------------------------------------------------------------------
  # Row 2 · Fixed App-owned thresholds
  # ---------------------------------------------------------------------------
  - type: grid
    cards:
      - type: heading
        heading: Пороги уведомлений
        heading_style: title
        icon: mdi:tune-vertical

      - type: entities
        show_header_toggle: false
        entities:
          - entity: number.dh_app_pve_storage_percent_used_threshold
            name: Хранилище · занято
          - entity: number.dh_app_pve_cpu_temperature_threshold
            name: CPU · температура
          - entity: number.dh_app_pve_hdd_temperature_threshold
            name: HDD · температура
          - entity: number.dh_app_pve_ssd_temperature_threshold
            name: SSD · температура
          - entity: number.dh_app_pve_nvme_temperature_threshold
            name: NVMe · температура
          - entity: number.dh_app_pve_gpu_temperature_threshold
            name: GPU · температура

      - type: markdown
        content: >-
          Пороги принадлежат **DH PVE App**. Dashboard не сравнивает значения
          самостоятельно: красная подсветка использует готовые App-owned
          `binary_sensor.*_problem`.
