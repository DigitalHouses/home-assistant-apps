# DigitalHouses — DH PVE shutdown history / readiness card
# Requires: Mushroom, auto-entities
# Paste this card into any Lovelace dashboard view.
# Boot/shutdown history is always shown. UPS readiness/budget is added only when
# a DH PVE UPS device exists; on PVE hosts without UPS that part is skipped.

type: vertical-stack
cards:
  - type: heading
    heading: Завершение Proxmox / VM / LXC
    heading_style: title
    icon: mdi:power-cycle

  - type: custom:mushroom-template-card
    entity: sensor.dh_pve_previous_shutdown
    primary: >-
      {% set s = states(entity) %}
      {% if s == 'normal' %}
        Предыдущая остановка: штатная
      {% elif s == 'unclean' %}
        Предыдущая остановка: некорректная
      {% elif s == 'ups_power' %}
        Предыдущая остановка: из-за отключения электропитания
      {% else %}
        Предыдущая остановка: нет данных
      {% endif %}
    secondary: >-
      {% set s = states(entity) %}
      {% set shutdown_clean = state_attr(entity, 'shutdown_clean') %}
      {% set host_result = 'PVE shutdown: clean' if shutdown_clean == true else ('PVE shutdown: unclean' if shutdown_clean == false else 'PVE shutdown: нет данных') %}
      {% set total = state_attr(entity, 'guest_shutdown_total_seconds') %}
      {% set outage_fsd = state_attr(entity, 'outage_to_fsd_seconds') %}
      {% set fsd_guests = state_attr(entity, 'fsd_to_all_guests_stopped_seconds') %}
      {% set fsd_host = state_attr(entity, 'fsd_to_shutdown_seconds') %}
      {% set guests_host = state_attr(entity, 'all_guests_stopped_to_shutdown_seconds') %}
      {% if s == 'unclean' %}
        {{ host_result }} · Корректное завершение работы не зафиксировано.
      {% elif s == 'ups_power' %}
        {{ host_result }} ·
        {% if outage_fsd is not none %}Сеть→FSD {{ outage_fsd }} с · {% endif %}
        {% if fsd_guests is not none %}FSD→гости {{ fsd_guests }} с · {% endif %}
        {% if fsd_host is not none %}FSD→PVE {{ fsd_host }} с{% endif %}
        {% if guests_host is not none %} · гости→PVE {{ guests_host }} с{% endif %}
      {% elif s == 'normal' %}
        {{ host_result }} · {% if total is not none %}Все VM/LXC остановлены за {{ total }} с.{% else %}Shutdown завершён штатно.{% endif %}
      {% else %}
        История появится после следующего завершённого boot/shutdown цикла.
      {% endif %}
    icon: >-
      {% set s = states(entity) %}
      {% if s == 'normal' %} mdi:check-circle
      {% elif s == 'ups_power' %} mdi:power-plug-off
      {% elif s == 'unclean' %} mdi:alert-circle
      {% else %} mdi:help-circle-outline
      {% endif %}
    icon_color: >-
      {% set s = states(entity) %}
      {% if s == 'normal' %} green
      {% elif s == 'ups_power' %} orange
      {% elif s == 'unclean' %} red
      {% else %} grey
      {% endif %}
    multiline_secondary: true
    tap_action:
      action: more-info

  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_shutdown_history
        primary: История запусков
        secondary: >-
          Сохранено shutdown-циклов: {{ states(entity) }}
        icon: mdi:history
        icon_color: blue
        tap_action:
          action: more-info

      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_previous_shutdown
        primary: Все VM/LXC
        secondary: >-
          {% set v = state_attr(entity, 'guest_shutdown_total_seconds') %}
          {{ 'Нет данных' if v is none else v ~ ' с' }}
        icon: mdi:server-network
        icon_color: >-
          {% if states(entity) == 'unclean' %} red
          {% elif states(entity) == 'ups_power' %} orange
          {% elif states(entity) == 'normal' %} green
          {% else %} grey
          {% endif %}
        tap_action:
          action: more-info

  # UPS-only summary. If the host has no selected UPS, this renders nothing.
  - type: custom:auto-entities
    show_empty: false
    unique: true
    card:
      type: grid
      columns: 2
      square: false
    card_param: cards
    filter:
      template: >-
        {% set readiness = states('sensor.dh_pve_ups_shutdown_readiness') %}
        {% if readiness not in ['unknown', 'unavailable', 'none', ''] %}
          {{ [
            {
              'type': 'custom:mushroom-template-card',
              'entity': 'sensor.dh_pve_ups_shutdown_readiness',
              'primary': 'UPS Shutdown Readiness',
              'secondary': "{% set issues = state_attr(entity, 'issues') or [] %}{{ 'OK' if is_state(entity, 'ok') else (issues | join(' · ') if issues else states(entity)) }}",
              'icon': "{{ 'mdi:shield-check' if is_state(entity, 'ok') else ('mdi:shield-alert' if is_state(entity, 'warning') else 'mdi:shield-outline') }}",
              'icon_color': "{{ 'green' if is_state(entity, 'ok') else ('red' if is_state(entity, 'warning') else 'grey') }}",
              'multiline_secondary': true,
              'tap_action': {'action': 'more-info'}
            },
            {
              'type': 'custom:mushroom-template-card',
              'entity': 'sensor.dh_pve_ups_guest_shutdown_budget',
              'primary': 'VM/LXC budget',
              'secondary': "{{ states(entity) ~ ' с' if states(entity) not in ['unknown','unavailable','none',''] else 'Нет данных' }}",
              'icon': 'mdi:timer-sand',
              'icon_color': 'purple',
              'tap_action': {'action': 'more-info'}
            }
          ] }}
        {% else %}
          {{ [] }}
        {% endif %}

  - type: heading
    heading: Последнее завершение VM / LXC
    heading_style: subtitle
    icon: mdi:timer-check-outline

  # One card per VM/LXC. Backend supplies both the current configured timeout
  # and facts from the previous shutdown cycle.
  - type: custom:auto-entities
    show_empty: false
    unique: true
    card:
      type: grid
      columns: 2
      square: false
    card_param: cards
    filter:
      template: >-
        {% set ns = namespace(items=[]) %}
        {% for e in states.sensor | sort(attribute='entity_id') %}
          {% if state_attr(e.entity_id, 'proxmox_integration') == 'dh_pve_app'
                and state_attr(e.entity_id, 'proxmox_section') == 'guests'
                and state_attr(e.entity_id, 'proxmox_subject') in ['vm', 'lxc']
                and state_attr(e.entity_id, 'proxmox_metric') == 'shutdown_duration' %}
            {% set kind = state_attr(e.entity_id, 'proxmox_subject') | upper %}
            {% set guest_id = state_attr(e.entity_id, 'guest_id') or state_attr(e.entity_id, 'proxmox_object_id') %}
            {% set name = state_attr(e.entity_id, 'proxmox_display_name') or e.name %}
            {% set current_timeout = state_attr(e.entity_id, 'shutdown_timeout_seconds') %}
            {% set duration = state_attr(e.entity_id, 'last_shutdown_duration_seconds') %}
            {% set previous_timeout = state_attr(e.entity_id, 'last_shutdown_timeout_seconds') %}
            {% set ratio = state_attr(e.entity_id, 'last_shutdown_timeout_ratio') | float(-1) %}
            {% set result = state_attr(e.entity_id, 'last_shutdown_result') | default('unknown', true) %}
            {% set forced = state_attr(e.entity_id, 'last_shutdown_forced') | default(false, true) %}
            {% if forced or result in ['timeout', 'forced'] %}
              {% set color = 'red' %}
              {% set icon = 'mdi:timer-alert' %}
            {% elif ratio >= 0.8 %}
              {% set color = 'orange' %}
              {% set icon = 'mdi:timer-alert-outline' %}
            {% elif duration is number %}
              {% set color = 'green' %}
              {% set icon = 'mdi:timer-check-outline' %}
            {% else %}
              {% set color = 'grey' %}
              {% set icon = 'mdi:timer-question-outline' %}
            {% endif %}
            {% if duration is number %}
              {% set ratio_text = (' · ' ~ ('%.0f' | format(ratio * 100)) ~ '% прошлого timeout') if ratio >= 0 else '' %}
              {% set previous_text = (' · прошлый timeout ' ~ previous_timeout ~ ' с') if previous_timeout is not none else '' %}
              {% set current_text = (' · сейчас ' ~ current_timeout ~ ' с') if current_timeout is not none else '' %}
              {% set secondary = duration ~ ' с · ' ~ result ~ ratio_text ~ previous_text ~ current_text %}
            {% else %}
              {% set secondary = 'Нет истории shutdown' ~ ((' · timeout сейчас ' ~ current_timeout ~ ' с') if current_timeout is not none else '') %}
            {% endif %}
            {% set ns.items = ns.items + [{
              'type': 'custom:mushroom-template-card',
              'entity': e.entity_id,
              'primary': kind ~ ' ' ~ guest_id ~ ' · ' ~ name,
              'secondary': secondary,
              'icon': icon,
              'icon_color': color,
              'multiline_secondary': true,
              'tap_action': {'action': 'more-info'}
            }] %}
          {% endif %}
        {% endfor %}
        {{- ns.items -}}
    sort:
      method: entity_id
