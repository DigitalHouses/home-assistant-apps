# DH UPS Lovelace view
# Requires Mushroom and mini-graph-card.
# UPS health/problem classification is computed by dh_pve_app Python code.
# Home Assistant only renders the normalized state and attributes.

title: Электропитание
path: ups-monitor
icon: mdi:power-plug-battery-outline
type: sections
max_columns: 3

sections:
  - type: grid
    cards:
      - type: heading
        icon: mdi:heart-pulse
        heading_style: title
        heading: Состояние ИБП

      - type: custom:mushroom-template-card
        entity: sensor.dh_ups_problems
        primary: Состояние ИБП
        secondary: >-
          {{ state_attr('sensor.dh_ups_problems', 'details') or 'Нет данных' }}
        icon: >-
          {% set severity = state_attr('sensor.dh_ups_problems', 'severity') %}
          {% if severity == 'critical' %}
            mdi:alert-octagon
          {% elif severity == 'warning' %}
            mdi:alert
          {% elif severity == 'ok' %}
            mdi:check-circle
          {% else %}
            mdi:help-circle-outline
          {% endif %}
        icon_color: >-
          {% set severity = state_attr('sensor.dh_ups_problems', 'severity') %}
          {% if severity == 'critical' %}
            red
          {% elif severity == 'warning' %}
            orange
          {% elif severity == 'ok' %}
            green
          {% else %}
            grey
          {% endif %}
        multiline_secondary: true
        fill_container: true
        tap_action:
          action: more-info
        grid_options:
          columns: 12
          rows: 2

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.dh_ups_battery_charge
            primary: Батарея
            secondary: >-
              {% set s = states(entity) %}
              {% if s in ['unknown', 'unavailable', 'none', ''] %}
                Нет данных
              {% else %}
                {{ s }}%
              {% endif %}
            layout: vertical
            icon: >-
              {% set s = states(entity) %}
              {% if s in ['unknown', 'unavailable', 'none', ''] %}
                mdi:battery-unknown
              {% else %}
                {% set charge = s | int %}
                {% if charge > 90 %} mdi:battery-high
                {% elif charge > 50 %} mdi:battery-medium
                {% elif charge > 20 %} mdi:battery-low
                {% else %} mdi:battery-alert
                {% endif %}
              {% endif %}
            icon_color: >-
              {% set s = states(entity) %}
              {% if s in ['unknown', 'unavailable', 'none', ''] %}
                grey
              {% else %}
                {% set charge = s | int %}
                {% if charge > 50 %} green
                {% elif charge > 20 %} orange
                {% else %} red
                {% endif %}
              {% endif %}

          - type: custom:mushroom-entity-card
            entity: sensor.dh_ups_load
            primary_info: name
            secondary_info: state
            name: Нагрузка
            icon: mdi:speedometer
            icon_color: blue
            layout: vertical

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.dh_ups_battery_runtime_minutes
            name: Прогноз работы
            icon: mdi:timer-sand
            icon_color: purple

          - type: custom:mushroom-entity-card
            entity: sensor.dh_ups_status
            name: Режим
            icon: mdi:power-plug-battery
            icon_color: green

          - type: custom:mushroom-entity-card
            entity: sensor.dh_ups_input_voltage
            name: Входное напряжение
            icon: mdi:transmission-tower-import
            icon_color: orange

          - type: custom:mushroom-entity-card
            entity: sensor.dh_ups_output_voltage
            name: Выходное напряжение
            icon: mdi:transmission-tower-export
            icon_color: green

      - type: heading
        heading: Управление
        icon: mdi:refresh
        heading_style: subtitle

      - type: custom:mushroom-template-card
        entity: button.dh_ups_refresh
        primary: Обновить данные
        secondary: >-
          {% set v = states('sensor.dh_ups_last_refresh') %}
          {% if v in ['unknown', 'unavailable', 'none', ''] %}
            Ещё не выполнялось
          {% else %}
            {{ as_timestamp(v) | timestamp_custom('%d.%m.%Y %H:%M:%S', true) }}
          {% endif %}
        icon: mdi:refresh
        icon_color: blue
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.dh_ups_refresh
        grid_options:
          columns: 12
          rows: 1

  - type: grid
    cards:
      - type: heading
        heading: История (24ч)
        icon: mdi:chart-timeline-variant
        heading_style: title

      - type: custom:mini-graph-card
        entities:
          - entity: sensor.dh_ups_input_voltage
            name: Вход
          - entity: sensor.dh_ups_output_voltage
            name: Выход
        name: Напряжение
        hours_to_show: 24
        points_per_hour: 4
        line_width: 2
        font_size: 75
        animate: true
        show:
          labels: true
          points: false
          fill: false
          legend: true

      - type: custom:mini-graph-card
        name: Нагрузка и батарея
        hours_to_show: 24
        points_per_hour: 4
        line_width: 2
        font_size: 75
        animate: true
        show:
          labels: true
          points: false
          legend: true
        entities:
          - entity: sensor.dh_ups_battery_charge
            name: Заряд (%)
            show_fill: true
          - entity: sensor.dh_ups_load
            name: Нагрузка (%)
            show_fill: false

      - type: custom:mini-graph-card
        name: Прогноз работы от батареи
        icon: mdi:timer-sand
        entities:
          - entity: sensor.dh_ups_battery_runtime_minutes
            name: Runtime
        hours_to_show: 24
        points_per_hour: 6
        line_width: 2
        height: 90
        animate: true
        show:
          labels: true
          points: false
          legend: false
          extrema: true
          fill: fade

      - type: heading
        heading: Параметры ИБП
        icon: mdi:information-outline
        heading_style: subtitle

      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.dh_ups_battery_voltage
            name: Напряжение батареи
          - entity: sensor.dh_ups_nominal_real_power
            name: Номинальная мощность
          - entity: sensor.dh_ups_battery_charge_warning
            name: Предупреждение по заряду
          - entity: sensor.dh_ups_battery_charge_low
            name: Низкий заряд
          - entity: sensor.dh_ups_battery_runtime_low
            name: Минимальный runtime
          - entity: sensor.dh_ups_beeper_status
            name: Зуммер
          - entity: sensor.dh_ups_test_result
            name: Последний тест ИБП
          - entity: binary_sensor.dh_ups_available
            name: Данные NUT доступны

  - type: grid
    cards:
      - type: heading
        heading: Журнал событий
        icon: mdi:book-clock-outline
        heading_style: title

      - type: logbook
        title: Переключения ИБП
        hours_to_show: 48
        entities:
          - sensor.dh_ups_problems
          - binary_sensor.dh_ups_on_battery
          - binary_sensor.dh_ups_low_battery
          - binary_sensor.dh_ups_overload
          - binary_sensor.dh_ups_replace_battery
          - binary_sensor.dh_ups_bypass
          - binary_sensor.dh_ups_charging
          - binary_sensor.dh_ups_discharging

cards: []
