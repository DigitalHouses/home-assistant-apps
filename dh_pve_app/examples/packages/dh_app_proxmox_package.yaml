# =============================================================================
# DigitalHouses Proxmox Apps Package — dh_pve_app
# =============================================================================
# Recommended target:
#   /config/packages/Global/System/dh_app_proxmox_package.yaml
#
# Purpose:
#   - Recorder: keep history for all entities published by dh_pve_app
#   - Preserve the proven v7 dashboard threshold helpers
#   - Initialize unset threshold helpers once after Home Assistant startup
#
# Architecture notes:
#   - Disk health is NOT calculated here. HEALTHY/WARNING/CRITICAL comes from
#     dh_pve_app Python collectors.
#   - Threshold helpers are presentation / notification thresholds only.
#   - There are no periodic template sensors and no package-specific purge job.
#     Recorder retention remains controlled by the site's normal Recorder policy.
# =============================================================================

dh_app_proxmox_package:

  recorder:
    include:
      entities:
        - input_number.dh_proxmox_storage_usage_threshold
        - input_number.dh_proxmox_cpu_temperature_threshold
        - input_number.dh_proxmox_hdd_temperature_threshold
        - input_number.dh_proxmox_ssd_temperature_threshold
        - input_number.dh_proxmox_nvme_temperature_threshold
        - input_number.dh_proxmox_gpu_temperature_threshold

      entity_globs:
        - sensor.dh_pve_*
        - binary_sensor.dh_pve_*

  input_number:
    dh_proxmox_storage_usage_threshold:
      name: Proxmox — заполнение хранилища
      icon: mdi:database-alert
      unit_of_measurement: "%"
      min: 0
      max: 98
      step: 1
      mode: box

    dh_proxmox_cpu_temperature_threshold:
      name: Proxmox — температура CPU
      icon: mdi:cpu-64-bit
      unit_of_measurement: "°C"
      min: 0
      max: 110
      step: 1
      mode: box

    dh_proxmox_hdd_temperature_threshold:
      name: Proxmox — температура HDD
      icon: mdi:harddisk
      unit_of_measurement: "°C"
      min: 0
      max: 70
      step: 1
      mode: box

    dh_proxmox_ssd_temperature_threshold:
      name: Proxmox — температура SSD
      icon: mdi:chip
      unit_of_measurement: "°C"
      min: 0
      max: 90
      step: 1
      mode: box

    dh_proxmox_nvme_temperature_threshold:
      name: Proxmox — температура NVMe
      icon: mdi:expansion-card-variant
      unit_of_measurement: "°C"
      min: 0
      max: 110
      step: 1
      mode: box

    dh_proxmox_gpu_temperature_threshold:
      name: Proxmox — температура GPU
      icon: mdi:expansion-card
      unit_of_measurement: "°C"
      min: 0
      max: 110
      step: 1
      mode: box

  automation:
    - id: dh_proxmox_initialize_thresholds
      alias: "_[dh_app_proxmox_package]: Initialize thresholds"
      description: >-
        Preserves restored values; values <= 0 are replaced with the v7 defaults.
      triggers:
        - trigger: homeassistant
          event: start
      actions:
        - delay: "00:00:02"

        - if:
            - condition: template
              value_template: >-
                {{ states('input_number.dh_proxmox_storage_usage_threshold') | float(0) <= 0 }}
          then:
            - action: input_number.set_value
              target:
                entity_id: input_number.dh_proxmox_storage_usage_threshold
              data:
                value: 80

        - if:
            - condition: template
              value_template: >-
                {{ states('input_number.dh_proxmox_cpu_temperature_threshold') | float(0) <= 0 }}
          then:
            - action: input_number.set_value
              target:
                entity_id: input_number.dh_proxmox_cpu_temperature_threshold
              data:
                value: 90

        - if:
            - condition: template
              value_template: >-
                {{ states('input_number.dh_proxmox_hdd_temperature_threshold') | float(0) <= 0 }}
          then:
            - action: input_number.set_value
              target:
                entity_id: input_number.dh_proxmox_hdd_temperature_threshold
              data:
                value: 45

        - if:
            - condition: template
              value_template: >-
                {{ states('input_number.dh_proxmox_ssd_temperature_threshold') | float(0) <= 0 }}
          then:
            - action: input_number.set_value
              target:
                entity_id: input_number.dh_proxmox_ssd_temperature_threshold
              data:
                value: 75

        - if:
            - condition: template
              value_template: >-
                {{ states('input_number.dh_proxmox_nvme_temperature_threshold') | float(0) <= 0 }}
          then:
            - action: input_number.set_value
              target:
                entity_id: input_number.dh_proxmox_nvme_temperature_threshold
              data:
                value: 80

        - if:
            - condition: template
              value_template: >-
                {{ states('input_number.dh_proxmox_gpu_temperature_threshold') | float(0) <= 0 }}
          then:
            - action: input_number.set_value
              target:
                entity_id: input_number.dh_proxmox_gpu_temperature_threshold
              data:
                value: 85
      mode: single
