# =============================================================================
# DigitalHouses PVE Apps Package — dh_pve_app
# =============================================================================
# Recommended target:
#   /config/packages/Global/System/dh_app_pve_package.yaml
#
# Purpose:
#   - Recorder: keep history for useful dh_pve_app entities.
#
# Architecture notes:
#   - Publication profiles, averaging windows and thresholds live in dh_pve_app.
#   - Disk health is calculated by dh_pve_app Python collectors.
#   - UPS / NUT / FSD shutdown policy runs on Proxmox, not in Home Assistant.
#   - HA observes the effective UPS shutdown policy but cannot apply/edit it.
#   - Battery-test schedule number/time entities remain runtime controls.
#   - No duplicate threshold helpers, periodic template sensors or purge job.
# =============================================================================

dh_app_pve_package:

  recorder:
    include:
      entity_globs:
        - sensor.dh_pve_*
        - binary_sensor.dh_pve_*
        - number.dh_pve_ups_*
        - time.dh_pve_ups_*
