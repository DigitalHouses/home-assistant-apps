# =============================================================================
# DigitalHouses PVE notification contract
# =============================================================================
# Reusable HAOS layer only. It does not depend on private delivery services
# such as write2log, Telegram, or a specific mobile_app target.
# Consumers may listen for the Home Assistant event: dh_app_pve_notification.
# =============================================================================

dh_app_pve_notification_package:

  automation:
    - id: dh_app_pve_live_problem_notifications
      alias: DH PVE · Live diagnostic notifications
      mode: queued
      max: 20
      triggers:
        - trigger: event.received
          target:
            entity_id:
              - event.dh_app_pve_diagnostic
              - event.dh_app_pve_ups_diagnostic
          options:
            event_type:
              - problem_started
              - problem_updated
              - problem_recovered
      conditions:
        - condition: state
          entity_id: binary_sensor.bs_global_system_boot_completed
          state: "on"
      actions:
        - event: dh_app_pve_notification
          event_data:
            source: dh_app_pve
            source_entity: "{{ trigger.entity_id }}"
            kind: "{{ trigger.to_state.attributes.event_type }}"
            category: "{{ trigger.to_state.attributes.category | default('diagnostic', true) }}"
            severity: "{{ trigger.to_state.attributes.severity | default('info', true) }}"
            object_id: "{{ trigger.to_state.attributes.object_id | default('', true) }}"
            object_name: "{{ trigger.to_state.attributes.object_name | default('', true) }}"
            metric: "{{ trigger.to_state.attributes.metric | default('', true) }}"
            value: "{{ trigger.to_state.attributes.value | default(none) }}"
            average: "{{ trigger.to_state.attributes.average | default(none) }}"
            threshold: "{{ trigger.to_state.attributes.threshold | default(none) }}"
            summary: "{{ trigger.to_state.attributes.summary | default('', true) }}"
            details: "{{ trigger.to_state.attributes.details | default('', true) }}"
            active_problem_count: "{{ trigger.to_state.attributes.active_problem_count | int(0) }}"
            title: >-
              {% set kind = trigger.to_state.attributes.event_type %}
              {% set is_ups = trigger.entity_id == 'event.dh_app_pve_ups_diagnostic' %}
              {% set name = 'UPS' if is_ups else (trigger.to_state.attributes.object_name | default('Proxmox', true)) %}
              {% if kind == 'problem_started' %}
                {{ '🔋' if is_ups else '🖥️' }}⚠️ {{ name }}: обнаружена проблема
              {% elif kind == 'problem_updated' %}
                {{ '🔋' if is_ups else '🖥️' }}⚠️ {{ name }}: параметры проблемы изменились
              {% else %}
                {{ '🔋' if is_ups else '🖥️' }}✅ {{ name }}: состояние нормализовалось
              {% endif %}
            message: >-
              {% set is_ups = trigger.entity_id == 'event.dh_app_pve_ups_diagnostic' %}
              {% set metric = trigger.to_state.attributes.metric | default('', true) %}
              {% set value = trigger.to_state.attributes.value | default(none) %}
              {% set average = trigger.to_state.attributes.average | default(none) %}
              {% set threshold = trigger.to_state.attributes.threshold | default(none) %}
              {% set summary = trigger.to_state.attributes.summary | default('', true) %}
              {% if is_ups %}
                {{ summary }}
              {% elif metric == 'temperature_c' %}
                Температура: {{ value if value is not none else '—' }} °C{% if average is not none %} · среднее {{ average }} °C{% endif %}{% if threshold is not none %} · порог {{ threshold }} °C{% endif %}
              {% elif metric == 'percent_used' %}
                Занято: {{ value if value is not none else '—' }}%{% if average is not none %} · среднее {{ average }}%{% endif %}{% if threshold is not none %} · порог {{ threshold }}%{% endif %}
              {% elif metric == 'throttling' %}
                Троттлинг: {{ 'активен' if value else 'норма' }}
              {% elif metric == 'smart_passed' %}
                SMART: {{ 'норма' if value else 'ошибка' }}
              {% else %}
                {{ summary }}
              {% endif %}
            startup_reconciliation: false

    - id: dh_app_pve_ups_config_changed_notification
      alias: DH PVE · UPS Trigger config changed notification
      mode: queued
      max: 5
      triggers:
        - trigger: event.received
          target:
            entity_id: event.dh_app_pve_ups_diagnostic
          options:
            event_type:
              - config_changed
      conditions:
        - condition: state
          entity_id: binary_sensor.bs_global_system_boot_completed
          state: "on"
      actions:
        - event: dh_app_pve_notification
          event_data:
            source: dh_app_pve
            source_entity: event.dh_app_pve_ups_diagnostic
            kind: config_changed
            category: policy
            severity: info
            title: "🔋⚙️ Конфигурация UPS Trigger изменена"
            message: >-
              {% set old = trigger.to_state.attributes.old_values | default({}, true) %}
              {% set new = trigger.to_state.attributes.new_values | default({}, true) %}
              {% set old_charge = old.get('shutdown_battery_charge_threshold_percent') %}
              {% set old_reserve = old.get('runtime_reserve_seconds') %}
              {% set new_charge = new.get('shutdown_battery_charge_threshold_percent') %}
              {% set new_reserve = new.get('runtime_reserve_seconds') %}
              Было: заряд {{ (old_charge ~ '%') if old_charge is not none else '—' }}, резерв {{ (old_reserve ~ ' с') if old_reserve is not none else '—' }}.
              Стало: заряд {{ (new_charge ~ '%') if new_charge is not none else '—' }}, резерв {{ (new_reserve ~ ' с') if new_reserve is not none else '—' }}.
            old_values: "{{ trigger.to_state.attributes.old_values | default({}, true) }}"
            new_values: "{{ trigger.to_state.attributes.new_values | default({}, true) }}"
            startup_reconciliation: false

    - id: dh_app_pve_startup_problem_reconciliation
      alias: DH PVE · Startup problem reconciliation
      mode: single
      triggers:
        - trigger: state
          entity_id: binary_sensor.bs_global_system_boot_completed
          to: "on"
      actions:
        - if:
            - condition: template
              value_template: "{{ states('sensor.dh_app_pve_problems') | int(0) > 0 }}"
          then:
            - event: dh_app_pve_notification
              event_data:
                source: dh_app_pve
                source_entity: sensor.dh_app_pve_problems
                kind: startup_reconciliation
                category: diagnostic
                severity: "{{ state_attr('sensor.dh_app_pve_problems', 'severity') | default('warning', true) }}"
                title: "🖥️⚠️ Proxmox: активные проблемы после запуска"
                message: >-
                  {% set active = state_attr('sensor.dh_app_pve_problems', 'active') | default([], true) %}
                  После запуска обнаружено активных проблем: {{ active | count }}.
                  {% for item in active %}
                    {% set metric = item.get('metric', '') %}
                    {% set name = item.get('object_name', item.get('object_id', 'Proxmox')) %}
                    {% set value = item.get('value') %}
                    {% set average = item.get('average') %}
                    {% set threshold = item.get('threshold') %}
                    {% if metric == 'temperature_c' %}
                      {{ loop.index }}. {{ name }} · Температура: {{ value if value is not none else '—' }} °C{% if average is not none %} · среднее {{ average }} °C{% endif %}{% if threshold is not none %} · порог {{ threshold }} °C{% endif %}
                    {% elif metric == 'percent_used' %}
                      {{ loop.index }}. {{ name }} · Занято: {{ value if value is not none else '—' }}%{% if average is not none %} · среднее {{ average }}%{% endif %}{% if threshold is not none %} · порог {{ threshold }}%{% endif %}
                    {% elif metric == 'throttling' %}
                      {{ loop.index }}. {{ name }} · Троттлинг активен
                    {% elif metric == 'smart_passed' %}
                      {{ loop.index }}. {{ name }} · SMART: ошибка
                    {% else %}
                      {{ loop.index }}. {{ name }} · {{ item.get('summary', 'Активная проблема') }}
                    {% endif %}
                  {% endfor %}
                summary: "{{ state_attr('sensor.dh_app_pve_problems', 'summary') | default('', true) }}"
                active: "{{ state_attr('sensor.dh_app_pve_problems', 'active') | default([], true) }}"
                startup_reconciliation: true
        - if:
            - condition: template
              value_template: "{{ states('sensor.dh_app_pve_ups_problems') | int(0) > 0 }}"
          then:
            - event: dh_app_pve_notification
              event_data:
                source: dh_app_pve
                source_entity: sensor.dh_app_pve_ups_problems
                kind: startup_reconciliation
                category: diagnostic
                severity: "{{ state_attr('sensor.dh_app_pve_ups_problems', 'severity') | default('warning', true) }}"
                title: "🔋⚠️ UPS: активные проблемы после запуска"
                message: >-
                  {% set active = state_attr('sensor.dh_app_pve_ups_problems', 'active') | default([], true) %}
                  После запуска обнаружено активных проблем: {{ active | count }}.
                  {% for item in active %}
                    {{ loop.index }}. {{ item.get('summary', 'Активная проблема UPS') }}
                  {% endfor %}
                summary: "{{ state_attr('sensor.dh_app_pve_ups_problems', 'summary') | default('', true) }}"
                active: "{{ state_attr('sensor.dh_app_pve_ups_problems', 'active') | default([], true) }}"
                startup_reconciliation: true
