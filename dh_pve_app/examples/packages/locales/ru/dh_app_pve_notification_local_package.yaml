# =============================================================================
# DigitalHouses PVE local notifications — Russian site package
# =============================================================================
# Машинные события приходят от dh_pve_app.
# Логика намеренно простая: event -> trigger.id -> choose -> прямой action.
# Для этой инсталляции сообщения отправляются через script.write2log.
# =============================================================================

dh_app_pve_notification_local_package:

  automation:
    - id: dh_app_pve_notifications
      alias: DH PVE · Notifications
      mode: queued
      max: 20

      triggers:
        - trigger: event.received
          target:
            entity_id:
              - event.dh_app_pve_diagnostic
              - event.dh_app_pve_ups_diagnostic
          options:
            event_type:
              - problem_started
          id: problem_started

        - trigger: event.received
          target:
            entity_id:
              - event.dh_app_pve_diagnostic
              - event.dh_app_pve_ups_diagnostic
          options:
            event_type:
              - problem_updated
          id: problem_updated

        - trigger: event.received
          target:
            entity_id:
              - event.dh_app_pve_diagnostic
              - event.dh_app_pve_ups_diagnostic
          options:
            event_type:
              - problem_recovered
          id: problem_recovered

        - trigger: event.received
          target:
            entity_id: event.dh_app_pve_ups_diagnostic
          options:
            event_type:
              - ups_status_changed
          id: ups_status_changed

        - trigger: event.received
          target:
            entity_id: event.dh_app_pve_ups_diagnostic
          options:
            event_type:
              - battery_discharge_level_crossed
          id: battery_discharge_level_crossed

        - trigger: event.received
          target:
            entity_id: event.dh_app_pve_ups_diagnostic
          options:
            event_type:
              - battery_fully_charged
          id: battery_fully_charged

        - trigger: event.received
          target:
            entity_id: event.dh_app_pve_ups_diagnostic
          options:
            event_type:
              - shutdown_committed
          id: shutdown_committed

        - trigger: event.received
          target:
            entity_id: event.dh_app_pve_ups_diagnostic
          options:
            event_type:
              - config_changed
          id: config_changed

      conditions: []

      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id:
                    - problem_started
              sequence:
                - action: script.write2log
                  data:
                    title: "⚠️ {{ trigger.to_state.attributes.object_name }}: обнаружена проблема"
                    message: >-
                      {{ trigger.to_state.attributes.metric }}:
                      {{ trigger.to_state.attributes.current.value }}

            - conditions:
                - condition: trigger
                  id:
                    - problem_updated
              sequence:
                - action: script.write2log
                  data:
                    title: "⚠️ {{ trigger.to_state.attributes.object_name }}: параметры проблемы изменились"
                    message: >-
                      {{ trigger.to_state.attributes.metric }}:
                      {{ trigger.to_state.attributes.current.value }}

            - conditions:
                - condition: trigger
                  id:
                    - problem_recovered
              sequence:
                - action: script.write2log
                  data:
                    title: "✅ {{ trigger.to_state.attributes.object_name }}: состояние нормализовалось"
                    message: >-
                      {{ trigger.to_state.attributes.metric }}:
                      {{ trigger.to_state.attributes.current.value }}

            - conditions:
                - condition: trigger
                  id:
                    - ups_status_changed
              sequence:
                - action: script.write2log
                  data:
                    title: "🔋 UPS: состояние изменилось"
                    message: >-
                      {{ trigger.to_state.attributes.previous_status | join(', ') }}
                      →
                      {{ trigger.to_state.attributes.current_status | join(', ') }}

            - conditions:
                - condition: trigger
                  id:
                    - battery_discharge_level_crossed
              sequence:
                - action: script.write2log
                  data:
                    title: "🔋 UPS: заряд {{ trigger.to_state.attributes.current_charge_percent }}%"
                    message: >-
                      Пересечены уровни:
                      {{ trigger.to_state.attributes.crossed_thresholds | join(', ') }}%.

            - conditions:
                - condition: trigger
                  id:
                    - battery_fully_charged
              sequence:
                - action: script.write2log
                  data:
                    title: "🔋✅ UPS: батарея заряжена"
                    message: >-
                      Заряд:
                      {{ trigger.to_state.attributes.previous_charge_percent }}%
                      →
                      {{ trigger.to_state.attributes.current_charge_percent }}%.

            - conditions:
                - condition: trigger
                  id:
                    - shutdown_committed
              sequence:
                - action: script.write2log
                  data:
                    title: "🔋🛑 UPS: начато аварийное выключение"
                    message: >-
                      Причина: {{ trigger.to_state.attributes.reason }}.
                      Заряд: {{ trigger.to_state.attributes.battery_charge_percent }}%.
                      Runtime: {{ trigger.to_state.attributes.battery_runtime_seconds }} s.

            - conditions:
                - condition: trigger
                  id:
                    - config_changed
              sequence:
                - action: script.write2log
                  data:
                    title: "🔋⚙️ Конфигурация UPS Trigger изменена"
                    message: >-
                      Заряд:
                      {{ trigger.to_state.attributes.old_values.shutdown_battery_charge_threshold_percent }}%
                      →
                      {{ trigger.to_state.attributes.new_values.shutdown_battery_charge_threshold_percent }}%.
                      Резерв:
                      {{ trigger.to_state.attributes.old_values.runtime_reserve_seconds }} s
                      →
                      {{ trigger.to_state.attributes.new_values.runtime_reserve_seconds }} s.
