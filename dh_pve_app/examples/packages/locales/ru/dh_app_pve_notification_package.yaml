# =============================================================================
# DigitalHouses PVE notification contract - Russian presentation
# =============================================================================
# Reusable HAOS layer only. It does not depend on private delivery services
# such as write2log, Telegram, or a specific mobile_app target.
# Consumers may listen for the Home Assistant event: dh_app_pve_notification.
# Install exactly one notification locale (ru or en).
# =============================================================================

dh_app_pve_notification_package:

  automation:
    - id: dh_app_pve_live_problem_notifications
      alias: DH PVE · Live diagnostic notifications
      mode: queued
      max: 20
      triggers:
        - trigger: event.received
          target:
            entity_id:
              - event.dh_app_pve_diagnostic
              - event.dh_app_pve_ups_diagnostic
          options:
            event_type:
              - problem_started
              - problem_updated
              - problem_recovered
              - ups_status_changed
              - battery_discharge_level_crossed
              - battery_fully_charged
              - shutdown_committed
      conditions:
        - condition: state
          entity_id: binary_sensor.bs_global_system_boot_completed
          state: "on"
      actions:
        - choose:
            - conditions:
                - condition: template
                  value_template: >-
                    {% set attrs = trigger.to_state.attributes %}
                    {{ 'event_type' in attrs
                       and 'schema_version' in attrs
                       and attrs.schema_version == 1
                       and attrs.event_type in ['problem_started', 'problem_updated', 'problem_recovered']
                       and 'category' in attrs
                       and attrs.category is string
                       and 'severity' in attrs
                       and attrs.severity is string
                       and 'object_id' in attrs
                       and attrs.object_id is string
                       and 'object_name' in attrs
                       and attrs.object_name is string
                       and 'metric' in attrs
                       and attrs.metric is string }}
              sequence:
                - event: dh_app_pve_notification
                  event_data:
                    source: dh_app_pve
                    source_entity: "{{ trigger.entity_id }}"
                    schema_version: "{{ trigger.to_state.attributes.schema_version }}"
                    kind: "{{ trigger.to_state.attributes.event_type }}"
                    category: "{{ trigger.to_state.attributes.category }}"
                    severity: "{{ trigger.to_state.attributes.severity }}"
                    object_id: "{{ trigger.to_state.attributes.object_id }}"
                    object_name: "{{ trigger.to_state.attributes.object_name }}"
                    metric: "{{ trigger.to_state.attributes.metric }}"
                    value: "{{ trigger.to_state.attributes.get('value') }}"
                    average: "{{ trigger.to_state.attributes.get('average') }}"
                    threshold: "{{ trigger.to_state.attributes.get('threshold') }}"
                    summary: "{{ trigger.to_state.attributes.get('summary') }}"
                    details: "{{ trigger.to_state.attributes.get('details') }}"
                    active_problem_count: "{{ trigger.to_state.attributes.get('active_problem_count') }}"
                    title: >-
                      {% set kind = trigger.to_state.attributes.event_type %}
                      {% set name = trigger.to_state.attributes.object_name %}
                      {% if kind == 'problem_started' %}
                        {{ '🔋' if trigger.entity_id == 'event.dh_app_pve_ups_diagnostic' else '🖥️' }}⚠️ {{ name }}: обнаружена проблема
                      {% elif kind == 'problem_updated' %}
                        {{ '🔋' if trigger.entity_id == 'event.dh_app_pve_ups_diagnostic' else '🖥️' }}⚠️ {{ name }}: параметры проблемы изменились
                      {% else %}
                        {{ '🔋' if trigger.entity_id == 'event.dh_app_pve_ups_diagnostic' else '🖥️' }}✅ {{ name }}: состояние нормализовалось
                      {% endif %}
                    message: >-
                      {% set attrs = trigger.to_state.attributes %}
                      {% set metric = attrs.metric %}
                      {% set value = attrs.get('value') %}
                      {% set average = attrs.get('average') %}
                      {% set threshold = attrs.get('threshold') %}
                      {% if trigger.entity_id == 'event.dh_app_pve_ups_diagnostic' %}
                        {{ attrs.get('summary') }}
                      {% elif metric == 'temperature_c' %}
                        Температура: {{ value if value is not none else '—' }} °C{% if average is not none %} · среднее {{ average }} °C{% endif %}{% if threshold is not none %} · порог {{ threshold }} °C{% endif %}
                      {% elif metric == 'percent_used' %}
                        Занято: {{ value if value is not none else '—' }}%{% if average is not none %} · среднее {{ average }}%{% endif %}{% if threshold is not none %} · порог {{ threshold }}%{% endif %}
                      {% elif metric == 'throttling' %}
                        Троттлинг: {{ 'активен' if value else 'норма' }}
                      {% elif metric == 'smart_passed' %}
                        SMART: {{ 'норма' if value else 'ошибка' }}
                      {% else %}
                        {{ attrs.get('summary') }}
                      {% endif %}
                    startup_reconciliation: false

            - conditions:
                - condition: template
                  value_template: >-
                    {% set attrs = trigger.to_state.attributes %}
                    {{ 'event_type' in attrs
                       and 'schema_version' in attrs
                       and attrs.schema_version == 2
                       and attrs.event_type in ['problem_started', 'problem_updated', 'problem_recovered']
                       and 'observed_at' in attrs
                       and attrs.observed_at is string
                       and 'problem_id' in attrs
                       and attrs.problem_id is string
                       and 'category' in attrs
                       and attrs.category is string
                       and 'severity' in attrs
                       and attrs.severity is string
                       and 'object_id' in attrs
                       and attrs.object_id is string
                       and 'object_name' in attrs
                       and attrs.object_name is string
                       and 'metric' in attrs
                       and attrs.metric is string
                       and 'previous' in attrs
                       and (attrs.previous is none or attrs.previous is mapping)
                       and 'current' in attrs
                       and attrs.current is mapping
                       and 'active' in attrs.current
                       and 'value' in attrs.current
                       and 'average' in attrs.current
                       and 'threshold' in attrs.current
                       and 'active_problem_count' in attrs
                       and attrs.active_problem_count is number
                       and attrs.active_problem_count >= 0 }}
              sequence:
                - event: dh_app_pve_notification
                  event_data:
                    source: dh_app_pve
                    source_entity: "{{ trigger.entity_id }}"
                    schema_version: "{{ trigger.to_state.attributes.schema_version }}"
                    kind: "{{ trigger.to_state.attributes.event_type }}"
                    observed_at: "{{ trigger.to_state.attributes.observed_at }}"
                    problem_id: "{{ trigger.to_state.attributes.problem_id }}"
                    category: "{{ trigger.to_state.attributes.category }}"
                    severity: "{{ trigger.to_state.attributes.severity }}"
                    object_id: "{{ trigger.to_state.attributes.object_id }}"
                    object_name: "{{ trigger.to_state.attributes.object_name }}"
                    metric: "{{ trigger.to_state.attributes.metric }}"
                    previous: "{{ trigger.to_state.attributes.previous }}"
                    current: "{{ trigger.to_state.attributes.current }}"
                    active_problem_count: "{{ trigger.to_state.attributes.active_problem_count }}"
                    title: >-
                      {% set kind = trigger.to_state.attributes.event_type %}
                      {% set name = trigger.to_state.attributes.object_name %}
                      {% if kind == 'problem_started' %}
                        {{ '🔋' if trigger.entity_id == 'event.dh_app_pve_ups_diagnostic' else '🖥️' }}⚠️ {{ name }}: обнаружена проблема
                      {% elif kind == 'problem_updated' %}
                        {{ '🔋' if trigger.entity_id == 'event.dh_app_pve_ups_diagnostic' else '🖥️' }}⚠️ {{ name }}: параметры проблемы изменились
                      {% else %}
                        {{ '🔋' if trigger.entity_id == 'event.dh_app_pve_ups_diagnostic' else '🖥️' }}✅ {{ name }}: состояние нормализовалось
                      {% endif %}
                    message: >-
                      {% set attrs = trigger.to_state.attributes %}
                      {% set current = attrs.current %}
                      {% set metric = attrs.metric %}
                      {% set value = current['value'] %}
                      {% set average = current['average'] %}
                      {% set threshold = current['threshold'] %}
                      {% if metric == 'temperature_c' %}
                        Температура: {{ value if value is not none else '—' }} °C{% if average is not none %} · среднее {{ average }} °C{% endif %}{% if threshold is not none %} · порог {{ threshold }} °C{% endif %}
                      {% elif metric == 'percent_used' %}
                        Занято: {{ value if value is not none else '—' }}%{% if average is not none %} · среднее {{ average }}%{% endif %}{% if threshold is not none %} · порог {{ threshold }}%{% endif %}
                      {% elif metric == 'throttling' %}
                        Троттлинг: {{ 'активен' if value else 'норма' }}
                      {% elif metric == 'smart_passed' %}
                        SMART: {{ 'норма' if value else 'ошибка' }}
                      {% else %}
                        {{ attrs.object_name }} · {{ metric }}: {{ value if value is not none else '—' }}
                      {% endif %}
                    startup_reconciliation: false

            - conditions:
                - condition: template
                  value_template: >-
                    {% set attrs = trigger.to_state.attributes %}
                    {{ 'event_type' in attrs
                       and 'schema_version' in attrs
                       and attrs.schema_version == 2
                       and attrs.event_type == 'ups_status_changed'
                       and 'observed_at' in attrs
                       and attrs.observed_at is string
                       and 'previous_status' in attrs
                       and attrs.previous_status is sequence
                       and attrs.previous_status is not string
                       and 'current_status' in attrs
                       and attrs.current_status is sequence
                       and attrs.current_status is not string
                       and 'previous_raw_status' in attrs
                       and attrs.previous_raw_status is sequence
                       and attrs.previous_raw_status is not string
                       and 'current_raw_status' in attrs
                       and attrs.current_raw_status is sequence
                       and attrs.current_raw_status is not string }}
              sequence:
                - event: dh_app_pve_notification
                  event_data:
                    source: dh_app_pve
                    source_entity: "{{ trigger.entity_id }}"
                    schema_version: "{{ trigger.to_state.attributes.schema_version }}"
                    kind: ups_status_changed
                    category: ups
                    severity: warning
                    observed_at: "{{ trigger.to_state.attributes.observed_at }}"
                    previous_status: "{{ trigger.to_state.attributes.previous_status }}"
                    current_status: "{{ trigger.to_state.attributes.current_status }}"
                    previous_raw_status: "{{ trigger.to_state.attributes.previous_raw_status }}"
                    current_raw_status: "{{ trigger.to_state.attributes.current_raw_status }}"
                    title: >-
                      {% set previous_status = trigger.to_state.attributes.previous_status %}
                      {% set current_status = trigger.to_state.attributes.current_status %}
                      {% if 'overload' in current_status and 'overload' not in previous_status %}
                        🔋⚠️ UPS: перегрузка
                      {% elif 'overload' in previous_status and 'overload' not in current_status %}
                        🔋✅ UPS: перегрузка устранена
                      {% elif 'low_battery' in current_status and 'low_battery' not in previous_status %}
                        🔋⚠️ UPS: низкий заряд батареи
                      {% elif 'low_battery' in previous_status and 'low_battery' not in current_status %}
                        🔋✅ UPS: предупреждение о низком заряде снято
                      {% elif 'replace_battery' in current_status and 'replace_battery' not in previous_status %}
                        🔋⚠️ UPS: требуется замена батареи
                      {% elif 'replace_battery' in previous_status and 'replace_battery' not in current_status %}
                        🔋✅ UPS: предупреждение о замене батареи снято
                      {% elif 'bypass' in current_status and 'bypass' not in previous_status %}
                        🔋⚠️ UPS: включён bypass
                      {% elif 'bypass' in previous_status and 'bypass' not in current_status %}
                        🔋✅ UPS: bypass отключён
                      {% elif 'on_battery' in current_status and 'on_battery' not in previous_status %}
                        🔋⚠️ UPS: городское питание отсутствует
                      {% elif 'on_battery' in previous_status and 'on_battery' not in current_status %}
                        🔋✅ UPS: городское питание восстановлено
                      {% elif 'boost' in current_status and 'boost' not in previous_status %}
                        🔋⚠️ UPS: включён AVR Boost
                      {% elif 'boost' in previous_status and 'boost' not in current_status %}
                        🔋✅ UPS: AVR Boost отключён
                      {% elif 'trim' in current_status and 'trim' not in previous_status %}
                        🔋⚠️ UPS: включён AVR Trim
                      {% elif 'trim' in previous_status and 'trim' not in current_status %}
                        🔋✅ UPS: AVR Trim отключён
                      {% else %}
                        🔋ℹ️ UPS: состояние изменилось
                      {% endif %}
                    message: >-
                      Состояние: {{ trigger.to_state.attributes.previous_status | join(', ') }} → {{ trigger.to_state.attributes.current_status | join(', ') }}.
                    startup_reconciliation: false

            - conditions:
                - condition: template
                  value_template: >-
                    {% set attrs = trigger.to_state.attributes %}
                    {{ 'event_type' in attrs
                       and 'schema_version' in attrs
                       and attrs.schema_version == 2
                       and attrs.event_type == 'battery_discharge_level_crossed'
                       and 'observed_at' in attrs
                       and attrs.observed_at is string
                       and 'previous_charge_percent' in attrs
                       and attrs.previous_charge_percent is number
                       and 'current_charge_percent' in attrs
                       and attrs.current_charge_percent is number
                       and 'crossed_thresholds' in attrs
                       and attrs.crossed_thresholds is sequence
                       and attrs.crossed_thresholds is not string }}
              sequence:
                - event: dh_app_pve_notification
                  event_data:
                    source: dh_app_pve
                    source_entity: "{{ trigger.entity_id }}"
                    schema_version: "{{ trigger.to_state.attributes.schema_version }}"
                    kind: battery_discharge_level_crossed
                    category: ups
                    severity: warning
                    observed_at: "{{ trigger.to_state.attributes.observed_at }}"
                    previous_charge_percent: "{{ trigger.to_state.attributes.previous_charge_percent }}"
                    current_charge_percent: "{{ trigger.to_state.attributes.current_charge_percent }}"
                    crossed_thresholds: "{{ trigger.to_state.attributes.crossed_thresholds }}"
                    title: "🔋⚠️ UPS: заряд батареи {{ trigger.to_state.attributes.current_charge_percent }}%"
                    message: >-
                      Заряд: {{ trigger.to_state.attributes.previous_charge_percent }}% → {{ trigger.to_state.attributes.current_charge_percent }}% · пересечены уровни: {{ trigger.to_state.attributes.crossed_thresholds | join(', ') }}%.
                    startup_reconciliation: false

            - conditions:
                - condition: template
                  value_template: >-
                    {% set attrs = trigger.to_state.attributes %}
                    {{ 'event_type' in attrs
                       and 'schema_version' in attrs
                       and attrs.schema_version == 2
                       and attrs.event_type == 'battery_fully_charged'
                       and 'observed_at' in attrs
                       and attrs.observed_at is string
                       and 'previous_charge_percent' in attrs
                       and (attrs.previous_charge_percent is number or attrs.previous_charge_percent is none)
                       and 'current_charge_percent' in attrs
                       and (attrs.current_charge_percent is number or attrs.current_charge_percent is none)
                       and 'previous_charger_status' in attrs
                       and attrs.previous_charger_status is string
                       and 'current_charger_status' in attrs
                       and attrs.current_charger_status is string
                       and 'detection_source' in attrs
                       and attrs.detection_source is string }}
              sequence:
                - event: dh_app_pve_notification
                  event_data:
                    source: dh_app_pve
                    source_entity: "{{ trigger.entity_id }}"
                    schema_version: "{{ trigger.to_state.attributes.schema_version }}"
                    kind: battery_fully_charged
                    category: ups
                    severity: info
                    observed_at: "{{ trigger.to_state.attributes.observed_at }}"
                    previous_charge_percent: "{{ trigger.to_state.attributes.previous_charge_percent }}"
                    current_charge_percent: "{{ trigger.to_state.attributes.current_charge_percent }}"
                    previous_charger_status: "{{ trigger.to_state.attributes.previous_charger_status }}"
                    current_charger_status: "{{ trigger.to_state.attributes.current_charger_status }}"
                    detection_source: "{{ trigger.to_state.attributes.detection_source }}"
                    title: "🔋✅ UPS: батарея заряжена"
                    message: >-
                      {% set previous_charge = trigger.to_state.attributes.previous_charge_percent %}
                      {% set current_charge = trigger.to_state.attributes.current_charge_percent %}
                      Заряд: {{ (previous_charge ~ '%') if previous_charge is not none else '—' }} → {{ (current_charge ~ '%') if current_charge is not none else '—' }} · режим зарядки: {{ trigger.to_state.attributes.previous_charger_status }} → {{ trigger.to_state.attributes.current_charger_status }}.
                    startup_reconciliation: false

            - conditions:
                - condition: template
                  value_template: >-
                    {% set attrs = trigger.to_state.attributes %}
                    {{ 'event_type' in attrs
                       and 'schema_version' in attrs
                       and attrs.schema_version == 2
                       and attrs.event_type == 'shutdown_committed'
                       and 'observed_at' in attrs
                       and attrs.observed_at is string
                       and 'reason' in attrs
                       and attrs.reason is string
                       and 'battery_charge_percent' in attrs
                       and (attrs.battery_charge_percent is number or attrs.battery_charge_percent is none)
                       and 'battery_runtime_seconds' in attrs
                       and (attrs.battery_runtime_seconds is number or attrs.battery_runtime_seconds is none)
                       and 'shutdown_budget_seconds' in attrs
                       and (attrs.shutdown_budget_seconds is number or attrs.shutdown_budget_seconds is none)
                       and 'runtime_reserve_seconds' in attrs
                       and (attrs.runtime_reserve_seconds is number or attrs.runtime_reserve_seconds is none)
                       and 'runtime_guard_threshold_seconds' in attrs
                       and (attrs.runtime_guard_threshold_seconds is number or attrs.runtime_guard_threshold_seconds is none) }}
              sequence:
                - event: dh_app_pve_notification
                  event_data:
                    source: dh_app_pve
                    source_entity: "{{ trigger.entity_id }}"
                    schema_version: "{{ trigger.to_state.attributes.schema_version }}"
                    kind: shutdown_committed
                    category: ups
                    severity: critical
                    observed_at: "{{ trigger.to_state.attributes.observed_at }}"
                    reason: "{{ trigger.to_state.attributes.reason }}"
                    battery_charge_percent: "{{ trigger.to_state.attributes.battery_charge_percent }}"
                    battery_runtime_seconds: "{{ trigger.to_state.attributes.battery_runtime_seconds }}"
                    shutdown_budget_seconds: "{{ trigger.to_state.attributes.shutdown_budget_seconds }}"
                    runtime_reserve_seconds: "{{ trigger.to_state.attributes.runtime_reserve_seconds }}"
                    runtime_guard_threshold_seconds: "{{ trigger.to_state.attributes.runtime_guard_threshold_seconds }}"
                    title: "🔋🛑 UPS: начато аварийное выключение"
                    message: >-
                      {% set charge = trigger.to_state.attributes.battery_charge_percent %}
                      {% set runtime = trigger.to_state.attributes.battery_runtime_seconds %}
                      {% set budget = trigger.to_state.attributes.shutdown_budget_seconds %}
                      {% set reserve = trigger.to_state.attributes.runtime_reserve_seconds %}
                      {% set guard = trigger.to_state.attributes.runtime_guard_threshold_seconds %}
                      Причина: {{ trigger.to_state.attributes.reason }} · заряд {{ (charge ~ '%') if charge is not none else '—' }} · runtime {{ (runtime ~ ' s') if runtime is not none else '—' }} · бюджет выключения {{ (budget ~ ' s') if budget is not none else '—' }} · резерв {{ (reserve ~ ' s') if reserve is not none else '—' }} · порог runtime {{ (guard ~ ' s') if guard is not none else '—' }}.
                    startup_reconciliation: false
          default:
            - event: dh_app_pve_notification
              event_data:
                source: dh_app_pve
                source_entity: "{{ trigger.entity_id }}"
                kind: contract_error
                category: diagnostic
                severity: error
                title: "🧩❌ DH PVE: ошибка контракта machine event"
                message: >-
                  Некорректный payload события {{ trigger.to_state.attributes.event_type }} from {{ trigger.entity_id }}.
                  Получены поля: {{ trigger.to_state.attributes.keys() | list | join(', ') }}.
                startup_reconciliation: false

    - id: dh_app_pve_ups_config_changed_notification
      alias: DH PVE · UPS Trigger config changed notification
      mode: queued
      max: 5
      triggers:
        - trigger: event.received
          target:
            entity_id: event.dh_app_pve_ups_diagnostic
          options:
            event_type:
              - config_changed
      conditions:
        - condition: state
          entity_id: binary_sensor.bs_global_system_boot_completed
          state: "on"
      actions:
        - choose:
            - conditions:
                - condition: template
                  value_template: >-
                    {% set attrs = trigger.to_state.attributes %}
                    {{ 'event_type' in attrs
                       and attrs.event_type == 'config_changed'
                       and 'schema_version' in attrs
                       and attrs.schema_version == 2
                       and 'observed_at' in attrs
                       and attrs.observed_at is string
                       and 'old_values' in attrs
                       and attrs.old_values is mapping
                       and 'new_values' in attrs
                       and attrs.new_values is mapping
                       and 'shutdown_battery_charge_threshold_percent' in attrs.new_values
                       and attrs.new_values.shutdown_battery_charge_threshold_percent is number
                       and 'runtime_reserve_seconds' in attrs.new_values
                       and attrs.new_values.runtime_reserve_seconds is number
                       and 'previous_revision' in attrs
                       and attrs.previous_revision is number
                       and 'current_revision' in attrs
                       and attrs.current_revision is number }}
              sequence:
                - event: dh_app_pve_notification
                  event_data:
                    source: dh_app_pve
                    source_entity: event.dh_app_pve_ups_diagnostic
                    schema_version: "{{ trigger.to_state.attributes.schema_version }}"
                    kind: config_changed
                    category: policy
                    severity: info
                    observed_at: "{{ trigger.to_state.attributes.observed_at }}"
                    title: "🔋⚙️ Конфигурация UPS Trigger изменена"
                    message: >-
                      {% set old = trigger.to_state.attributes.old_values %}
                      {% set new = trigger.to_state.attributes.new_values %}
                      {% set old_charge = old.get('shutdown_battery_charge_threshold_percent') %}
                      {% set old_reserve = old.get('runtime_reserve_seconds') %}
                      {% set new_charge = new['shutdown_battery_charge_threshold_percent'] %}
                      {% set new_reserve = new['runtime_reserve_seconds'] %}
                      Было: заряд {{ (old_charge ~ '%') if old_charge is not none else '—' }}, резерв {{ (old_reserve ~ ' s') if old_reserve is not none else '—' }}.
                      Стало: заряд {{ new_charge }}%, резерв {{ new_reserve }} s.
                      Ревизия: {{ trigger.to_state.attributes.previous_revision }} → {{ trigger.to_state.attributes.current_revision }}.
                    old_values: "{{ trigger.to_state.attributes.old_values }}"
                    new_values: "{{ trigger.to_state.attributes.new_values }}"
                    previous_revision: "{{ trigger.to_state.attributes.previous_revision }}"
                    current_revision: "{{ trigger.to_state.attributes.current_revision }}"
                    startup_reconciliation: false
          default:
            - event: dh_app_pve_notification
              event_data:
                source: dh_app_pve
                source_entity: event.dh_app_pve_ups_diagnostic
                kind: contract_error
                category: diagnostic
                severity: error
                title: "🧩❌ DH PVE: ошибка контракта machine event"
                message: >-
                  Некорректный payload события config_changed from event.dh_app_pve_ups_diagnostic.
                  Получены поля: {{ trigger.to_state.attributes.keys() | list | join(', ') }}.
                startup_reconciliation: false

    - id: dh_app_pve_startup_problem_reconciliation
      alias: DH PVE · Startup problem reconciliation
      mode: single
      triggers:
        - trigger: state
          entity_id: binary_sensor.bs_global_system_boot_completed
          to: "on"
      actions:
        - wait_template: >-
            {% set started = states('sensor.dh_app_pve_agent_started') %}
            {% set published = states('sensor.dh_app_pve_last_publication') %}
            {{ as_timestamp(started, 0) > 0 and as_timestamp(published, 0) >= as_timestamp(started, 0) }}
          timeout: "00:05:00"
          continue_on_timeout: true
        - if:
            - condition: template
              value_template: "{{ wait.completed and states('sensor.dh_app_pve_problems') | int(0) > 0 }}"
          then:
            - event: dh_app_pve_notification
              event_data:
                source: dh_app_pve
                source_entity: sensor.dh_app_pve_problems
                kind: startup_reconciliation
                category: diagnostic
                severity: "{{ state_attr('sensor.dh_app_pve_problems', 'severity') | default('warning', true) }}"
                title: "🖥️⚠️ Proxmox: активные проблемы после запуска"
                message: >-
                  {% set active = state_attr('sensor.dh_app_pve_problems', 'active') | default([], true) %}
                  После запуска обнаружено активных проблем: {{ active | count }}.
                  {% for item in active %}
                    {% set metric = item.get('metric', '') %}
                    {% set name = item.get('object_name', item.get('object_id', 'Proxmox')) %}
                    {% set value = item.get('value') %}
                    {% set average = item.get('average') %}
                    {% set threshold = item.get('threshold') %}
                    {% if metric == 'temperature_c' %}
                      {{ loop.index }}. {{ name }} · Температура: {{ value if value is not none else '—' }} °C{% if average is not none %} · среднее {{ average }} °C{% endif %}{% if threshold is not none %} · порог {{ threshold }} °C{% endif %}
                    {% elif metric == 'percent_used' %}
                      {{ loop.index }}. {{ name }} · Занято: {{ value if value is not none else '—' }}%{% if average is not none %} · среднее {{ average }}%{% endif %}{% if threshold is not none %} · порог {{ threshold }}%{% endif %}
                    {% elif metric == 'throttling' %}
                      {{ loop.index }}. {{ name }} · Троттлинг активен
                    {% elif metric == 'smart_passed' %}
                      {{ loop.index }}. {{ name }} · SMART: ошибка
                    {% else %}
                      {{ loop.index }}. {{ name }} · {{ item.get('summary', 'Активная проблема') }}
                    {% endif %}
                  {% endfor %}
                summary: "{{ state_attr('sensor.dh_app_pve_problems', 'summary') | default('', true) }}"
                active: "{{ state_attr('sensor.dh_app_pve_problems', 'active') | default([], true) }}"
                startup_reconciliation: true
        - wait_template: >-
            {% if not is_state('binary_sensor.dh_app_pve_ups_configured', 'on') %}
              true
            {% else %}
              {% set started = states('sensor.dh_app_pve_agent_started') %}
              {% set published = states('sensor.dh_app_pve_ups_last_publication') %}
              {{ as_timestamp(started, 0) > 0 and as_timestamp(published, 0) >= as_timestamp(started, 0) }}
            {% endif %}
          timeout: "00:05:00"
          continue_on_timeout: true
        - if:
            - condition: template
              value_template: "{{ wait.completed and states('sensor.dh_app_pve_ups_problems') | int(0) > 0 }}"
          then:
            - event: dh_app_pve_notification
              event_data:
                source: dh_app_pve
                source_entity: sensor.dh_app_pve_ups_problems
                kind: startup_reconciliation
                category: diagnostic
                severity: "{{ state_attr('sensor.dh_app_pve_ups_problems', 'severity') | default('warning', true) }}"
                title: "🔋⚠️ UPS: активные проблемы после запуска"
                message: >-
                  {% set active = state_attr('sensor.dh_app_pve_ups_problems', 'active') | default([], true) %}
                  {% set labels = {
                    'nut_unavailable': 'NUT недоступен',
                    'on_battery': 'Городское питание отсутствует',
                    'low_battery': 'Низкий заряд батареи',
                    'overload': 'Перегрузка UPS',
                    'replace_battery': 'Требуется замена батареи',
                    'bypass': 'UPS работает в bypass',
                    'power_state_unknown': 'Состояние питания UPS неизвестно'
                  } %}
                  После запуска обнаружено активных проблем: {{ active | count }}.
                  {% for item in active %}
                    {% set problem_id = item.get('problem_id', '') %}
                    {{ loop.index }}. {{ labels.get(problem_id, problem_id if problem_id else 'Неизвестная проблема UPS') }}
                  {% endfor %}
                summary: "{{ state_attr('sensor.dh_app_pve_ups_problems', 'summary') | default('', true) }}"
                active: "{{ state_attr('sensor.dh_app_pve_ups_problems', 'active') | default([], true) }}"
                startup_reconciliation: true