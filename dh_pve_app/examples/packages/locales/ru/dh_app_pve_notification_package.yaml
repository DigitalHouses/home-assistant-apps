# =============================================================================
# DigitalHouses PVE notification contract - Russian presentation
# =============================================================================
# Reusable HAOS layer only. It does not depend on private delivery services
# such as write2log, Telegram, or a specific mobile_app target.
# Consumers may listen for the Home Assistant event: dh_app_pve_notification.
# Install exactly one notification locale (ru or en).
# =============================================================================

dh_app_pve_notification_package:

  automation:
    - id: dh_app_pve_live_problem_notifications
      alias: DH PVE · Live diagnostic notifications
      mode: queued
      max: 20
      triggers:
        - trigger: event.received
          target:
            entity_id:
              - event.dh_app_pve_diagnostic
              - event.dh_app_pve_ups_diagnostic
          options:
            event_type:
              - problem_started
              - problem_updated
              - problem_recovered
              - ups_status_changed
              - battery_discharge_level_crossed
              - battery_fully_charged
              - shutdown_committed
      conditions:
        - condition: state
          entity_id: binary_sensor.bs_global_system_boot_completed
          state: "on"
      actions:
        - variables:
            notification_title: >-
              {% set kind = trigger.to_state.attributes.event_type %}
              {% set is_ups = trigger.entity_id == 'event.dh_app_pve_ups_diagnostic' %}
              {% set name = 'UPS' if is_ups else (trigger.to_state.attributes.object_name | default('Proxmox', true)) %}
              {% set previous_status = trigger.to_state.attributes.previous_status | default([], true) %}
              {% set current_status = trigger.to_state.attributes.current_status | default([], true) %}
              {% set charge = trigger.to_state.attributes.current_charge_percent | default(none) %}
              {% if kind == 'problem_started' %}
                {{ '🔋' if is_ups else '🖥️' }}⚠️ {{ name }}: обнаружена проблема
              {% elif kind == 'problem_updated' %}
                {{ '🔋' if is_ups else '🖥️' }}⚠️ {{ name }}: параметры проблемы изменились
              {% elif kind == 'problem_recovered' %}
                {{ '🔋' if is_ups else '🖥️' }}✅ {{ name }}: состояние нормализовалось
              {% elif kind == 'ups_status_changed' and 'overload' in current_status and 'overload' not in previous_status %}
                🔋⚠️ UPS: перегрузка
              {% elif kind == 'ups_status_changed' and 'overload' in previous_status and 'overload' not in current_status %}
                🔋✅ UPS: перегрузка устранена
              {% elif kind == 'ups_status_changed' and 'low_battery' in current_status and 'low_battery' not in previous_status %}
                🔋⚠️ UPS: низкий заряд батареи
              {% elif kind == 'ups_status_changed' and 'low_battery' in previous_status and 'low_battery' not in current_status %}
                🔋✅ UPS: предупреждение о низком заряде снято
              {% elif kind == 'ups_status_changed' and 'replace_battery' in current_status and 'replace_battery' not in previous_status %}
                🔋⚠️ UPS: требуется замена батареи
              {% elif kind == 'ups_status_changed' and 'replace_battery' in previous_status and 'replace_battery' not in current_status %}
                🔋✅ UPS: предупреждение о замене батареи снято
              {% elif kind == 'ups_status_changed' and 'bypass' in current_status and 'bypass' not in previous_status %}
                🔋⚠️ UPS: включён bypass
              {% elif kind == 'ups_status_changed' and 'bypass' in previous_status and 'bypass' not in current_status %}
                🔋✅ UPS: bypass отключён
              {% elif kind == 'ups_status_changed' and 'on_battery' in current_status and 'on_battery' not in previous_status %}
                🔋⚠️ UPS: городское питание отсутствует
              {% elif kind == 'ups_status_changed' and 'on_battery' in previous_status and 'on_battery' not in current_status %}
                🔋✅ UPS: городское питание восстановлено
              {% elif kind == 'ups_status_changed' and 'boost' in current_status and 'boost' not in previous_status %}
                🔋⚠️ UPS: включён AVR Boost
              {% elif kind == 'ups_status_changed' and 'boost' in previous_status and 'boost' not in current_status %}
                🔋✅ UPS: AVR Boost отключён
              {% elif kind == 'ups_status_changed' and 'trim' in current_status and 'trim' not in previous_status %}
                🔋⚠️ UPS: включён AVR Trim
              {% elif kind == 'ups_status_changed' and 'trim' in previous_status and 'trim' not in current_status %}
                🔋✅ UPS: AVR Trim отключён
              {% elif kind == 'ups_status_changed' %}
                🔋ℹ️ UPS: состояние изменилось
              {% elif kind == 'battery_discharge_level_crossed' %}
                🔋⚠️ UPS: заряд батареи {{ charge if charge is not none else '—' }}%
              {% elif kind == 'battery_fully_charged' %}
                🔋✅ UPS: батарея заряжена
              {% elif kind == 'shutdown_committed' %}
                🔋🛑 UPS: начато аварийное выключение
              {% else %}
                🔋ℹ️ UPS: событие
              {% endif %}
            notification_message: >-
              {% set schema = trigger.to_state.attributes.schema_version | int(1) %}
              {% set kind = trigger.to_state.attributes.event_type %}
              {% set is_ups = trigger.entity_id == 'event.dh_app_pve_ups_diagnostic' %}
              {% set metric = trigger.to_state.attributes.metric | default('', true) %}
              {% if schema == 1 %}
                {% set value = trigger.to_state.attributes.value | default(none) %}
                {% set average = trigger.to_state.attributes.average | default(none) %}
                {% set threshold = trigger.to_state.attributes.threshold | default(none) %}
                {% set summary = trigger.to_state.attributes.summary | default('', true) %}
                {% if is_ups %}
                  {{ summary }}
                {% elif metric == 'temperature_c' %}
                  Температура: {{ value if value is not none else '—' }} °C{% if average is not none %} · среднее {{ average }} °C{% endif %}{% if threshold is not none %} · порог {{ threshold }} °C{% endif %}
                {% elif metric == 'percent_used' %}
                  Занято: {{ value if value is not none else '—' }}%{% if average is not none %} · среднее {{ average }}%{% endif %}{% if threshold is not none %} · порог {{ threshold }}%{% endif %}
                {% elif metric == 'throttling' %}
                  Троттлинг: {{ 'активен' if value else 'норма' }}
                {% elif metric == 'smart_passed' %}
                  SMART: {{ 'норма' if value else 'ошибка' }}
                {% else %}
                  {{ summary }}
                {% endif %}
              {% elif kind in ['problem_started', 'problem_updated', 'problem_recovered'] %}
                {% set current = trigger.to_state.attributes.current | default({}, true) %}
                {% set value = current.get('value') %}
                {% set average = current.get('average') %}
                {% set threshold = current.get('threshold') %}
                {% if metric == 'temperature_c' %}
                  Температура: {{ value if value is not none else '—' }} °C{% if average is not none %} · среднее {{ average }} °C{% endif %}{% if threshold is not none %} · порог {{ threshold }} °C{% endif %}
                {% elif metric == 'percent_used' %}
                  Занято: {{ value if value is not none else '—' }}%{% if average is not none %} · среднее {{ average }}%{% endif %}{% if threshold is not none %} · порог {{ threshold }}%{% endif %}
                {% elif metric == 'throttling' %}
                  Троттлинг: {{ 'активен' if value else 'норма' }}
                {% elif metric == 'smart_passed' %}
                  SMART: {{ 'норма' if value else 'ошибка' }}
                {% else %}
                  {{ trigger.to_state.attributes.object_name | default(trigger.to_state.attributes.object_id, true) }} · {{ metric }}: {{ value if value is not none else '—' }}
                {% endif %}
              {% elif kind == 'ups_status_changed' %}
                {% set previous_status = trigger.to_state.attributes.previous_status | default([], true) %}
                {% set current_status = trigger.to_state.attributes.current_status | default([], true) %}
                Состояние: {{ previous_status | join(', ') if previous_status else '—' }} → {{ current_status | join(', ') if current_status else '—' }}.
              {% elif kind == 'battery_discharge_level_crossed' %}
                {% set crossed = trigger.to_state.attributes.crossed_thresholds | default([], true) %}
                {% set previous_charge = trigger.to_state.attributes.previous_charge_percent | default(none) %}
                {% set current_charge = trigger.to_state.attributes.current_charge_percent | default(none) %}
                Заряд: {{ (previous_charge ~ '%') if previous_charge is not none else '—' }} → {{ (current_charge ~ '%') if current_charge is not none else '—' }} · пересечены уровни: {{ crossed | join(', ') }}%.
              {% elif kind == 'battery_fully_charged' %}
                {% set previous_charge = trigger.to_state.attributes.previous_charge_percent | default(none) %}
                {% set current_charge = trigger.to_state.attributes.current_charge_percent | default(none) %}
                Заряд: {{ (previous_charge ~ '%') if previous_charge is not none else '—' }} → {{ (current_charge ~ '%') if current_charge is not none else '—' }} · режим зарядки: {{ trigger.to_state.attributes.previous_charger_status | default('unknown', true) }} → {{ trigger.to_state.attributes.current_charger_status | default('unknown', true) }}.
              {% elif kind == 'shutdown_committed' %}
                Причина: {{ trigger.to_state.attributes.reason | default('unknown', true) }} · заряд {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · runtime {{ trigger.to_state.attributes.battery_runtime_seconds | default('—', true) }} с · бюджет выключения {{ trigger.to_state.attributes.shutdown_budget_seconds | default('—', true) }} с · резерв {{ trigger.to_state.attributes.runtime_reserve_seconds | default('—', true) }} с · порог runtime {{ trigger.to_state.attributes.runtime_guard_threshold_seconds | default('—', true) }} с.
              {% else %}
                Машинное событие: {{ kind }}.
              {% endif %}
        - event: dh_app_pve_notification
          event_data:
            source: dh_app_pve
            source_entity: "{{ trigger.entity_id }}"
            schema_version: "{{ trigger.to_state.attributes.schema_version | int(1) }}"
            kind: "{{ trigger.to_state.attributes.event_type }}"
            category: >-
              {% set category = trigger.to_state.attributes.category | default('', true) %}
              {{ category if category else ('ups' if trigger.entity_id == 'event.dh_app_pve_ups_diagnostic' else 'diagnostic') }}
            severity: >-
              {% set severity = trigger.to_state.attributes.severity | default('', true) %}
              {% set kind = trigger.to_state.attributes.event_type %}
              {% if severity %}
                {{ severity }}
              {% elif kind == 'shutdown_committed' %}
                critical
              {% elif kind in ['ups_status_changed', 'battery_discharge_level_crossed'] %}
                warning
              {% else %}
                info
              {% endif %}
            object_id: "{{ trigger.to_state.attributes.object_id | default('', true) }}"
            object_name: "{{ trigger.to_state.attributes.object_name | default('', true) }}"
            metric: "{{ trigger.to_state.attributes.metric | default('', true) }}"
            value: >-
              {% set schema = trigger.to_state.attributes.schema_version | int(1) %}
              {% if schema == 1 %}
                {{ trigger.to_state.attributes.value | default(none) }}
              {% else %}
                {% set current = trigger.to_state.attributes.current | default({}, true) %}
                {{ current.get('value') }}
              {% endif %}
            average: >-
              {% set schema = trigger.to_state.attributes.schema_version | int(1) %}
              {% if schema == 1 %}
                {{ trigger.to_state.attributes.average | default(none) }}
              {% else %}
                {% set current = trigger.to_state.attributes.current | default({}, true) %}
                {{ current.get('average') }}
              {% endif %}
            threshold: >-
              {% set schema = trigger.to_state.attributes.schema_version | int(1) %}
              {% if schema == 1 %}
                {{ trigger.to_state.attributes.threshold | default(none) }}
              {% else %}
                {% set current = trigger.to_state.attributes.current | default({}, true) %}
                {{ current.get('threshold') }}
              {% endif %}
            summary: >-
              {% set schema = trigger.to_state.attributes.schema_version | int(1) %}
              {{ trigger.to_state.attributes.summary | default('', true) if schema == 1 else '' }}
            details: >-
              {% set schema = trigger.to_state.attributes.schema_version | int(1) %}
              {{ trigger.to_state.attributes.details | default('', true) if schema == 1 else '' }}
            previous: "{{ trigger.to_state.attributes.previous | default(none) }}"
            current: "{{ trigger.to_state.attributes.current | default(none) }}"
            previous_status: "{{ trigger.to_state.attributes.previous_status | default([], true) }}"
            current_status: "{{ trigger.to_state.attributes.current_status | default([], true) }}"
            previous_raw_status: "{{ trigger.to_state.attributes.previous_raw_status | default([], true) }}"
            current_raw_status: "{{ trigger.to_state.attributes.current_raw_status | default([], true) }}"
            crossed_thresholds: "{{ trigger.to_state.attributes.crossed_thresholds | default([], true) }}"
            previous_charge_percent: "{{ trigger.to_state.attributes.previous_charge_percent | default(none) }}"
            current_charge_percent: "{{ trigger.to_state.attributes.current_charge_percent | default(none) }}"
            previous_charger_status: "{{ trigger.to_state.attributes.previous_charger_status | default('', true) }}"
            current_charger_status: "{{ trigger.to_state.attributes.current_charger_status | default('', true) }}"
            reason: "{{ trigger.to_state.attributes.reason | default('', true) }}"
            battery_charge_percent: "{{ trigger.to_state.attributes.battery_charge_percent | default(none) }}"
            battery_runtime_seconds: "{{ trigger.to_state.attributes.battery_runtime_seconds | default(none) }}"
            shutdown_budget_seconds: "{{ trigger.to_state.attributes.shutdown_budget_seconds | default(none) }}"
            runtime_reserve_seconds: "{{ trigger.to_state.attributes.runtime_reserve_seconds | default(none) }}"
            runtime_guard_threshold_seconds: "{{ trigger.to_state.attributes.runtime_guard_threshold_seconds | default(none) }}"
            observed_at: "{{ trigger.to_state.attributes.observed_at | default('', true) }}"
            active_problem_count: "{{ trigger.to_state.attributes.active_problem_count | int(0) }}"
            title: >-
              {{ notification_title | trim if notification_title | trim else 'DH PVE: событие' }}
            message: >-
              {{ notification_message | trim if notification_message | trim else 'Описание машинного события недоступно.' }}
            startup_reconciliation: false

    - id: dh_app_pve_ups_config_changed_notification
      alias: DH PVE · UPS Trigger config changed notification
      mode: queued
      max: 5
      triggers:
        - trigger: event.received
          target:
            entity_id: event.dh_app_pve_ups_diagnostic
          options:
            event_type:
              - config_changed
      conditions:
        - condition: state
          entity_id: binary_sensor.bs_global_system_boot_completed
          state: "on"
      actions:
        - event: dh_app_pve_notification
          event_data:
            source: dh_app_pve
            source_entity: event.dh_app_pve_ups_diagnostic
            schema_version: "{{ trigger.to_state.attributes.schema_version | int(1) }}"
            kind: config_changed
            category: policy
            severity: info
            title: "🔋⚙️ Конфигурация UPS Trigger изменена"
            message: >-
              {% set schema = trigger.to_state.attributes.schema_version | int(1) %}
              {% set old = trigger.to_state.attributes.old_values | default({}, true) %}
              {% set new = trigger.to_state.attributes.new_values | default({}, true) %}
              {% set old_charge = old.get('shutdown_battery_charge_threshold_percent') %}
              {% set old_reserve = old.get('runtime_reserve_seconds') %}
              {% set new_charge = new.get('shutdown_battery_charge_threshold_percent') %}
              {% set new_reserve = new.get('runtime_reserve_seconds') %}
              Было: заряд {{ (old_charge ~ '%') if old_charge is not none else '—' }}, резерв {{ (old_reserve ~ ' с') if old_reserve is not none else '—' }}.
              Стало: заряд {{ (new_charge ~ '%') if new_charge is not none else '—' }}, резерв {{ (new_reserve ~ ' с') if new_reserve is not none else '—' }}.{% if schema >= 2 %}
              Ревизия: {{ trigger.to_state.attributes.previous_revision | default('—', true) }} → {{ trigger.to_state.attributes.current_revision | default('—', true) }}.{% endif %}
            old_values: "{{ trigger.to_state.attributes.old_values | default({}, true) }}"
            new_values: "{{ trigger.to_state.attributes.new_values | default({}, true) }}"
            startup_reconciliation: false

    - id: dh_app_pve_startup_problem_reconciliation
      alias: DH PVE · Startup problem reconciliation
      mode: single
      triggers:
        - trigger: state
          entity_id: binary_sensor.bs_global_system_boot_completed
          to: "on"
      actions:
        - wait_template: >-
            {% set started = states('sensor.dh_app_pve_agent_started') %}
            {% set published = states('sensor.dh_app_pve_last_publication') %}
            {{ as_timestamp(started, 0) > 0 and as_timestamp(published, 0) >= as_timestamp(started, 0) }}
          timeout: "00:05:00"
          continue_on_timeout: true
        - if:
            - condition: template
              value_template: "{{ wait.completed and states('sensor.dh_app_pve_problems') | int(0) > 0 }}"
          then:
            - event: dh_app_pve_notification
              event_data:
                source: dh_app_pve
                source_entity: sensor.dh_app_pve_problems
                kind: startup_reconciliation
                category: diagnostic
                severity: "{{ state_attr('sensor.dh_app_pve_problems', 'severity') | default('warning', true) }}"
                title: "🖥️⚠️ Proxmox: активные проблемы после запуска"
                message: >-
                  {% set active = state_attr('sensor.dh_app_pve_problems', 'active') | default([], true) %}
                  После запуска обнаружено активных проблем: {{ active | count }}.
                  {% for item in active %}
                    {% set metric = item.get('metric', '') %}
                    {% set name = item.get('object_name', item.get('object_id', 'Proxmox')) %}
                    {% set value = item.get('value') %}
                    {% set average = item.get('average') %}
                    {% set threshold = item.get('threshold') %}
                    {% if metric == 'temperature_c' %}
                      {{ loop.index }}. {{ name }} · Температура: {{ value if value is not none else '—' }} °C{% if average is not none %} · среднее {{ average }} °C{% endif %}{% if threshold is not none %} · порог {{ threshold }} °C{% endif %}
                    {% elif metric == 'percent_used' %}
                      {{ loop.index }}. {{ name }} · Занято: {{ value if value is not none else '—' }}%{% if average is not none %} · среднее {{ average }}%{% endif %}{% if threshold is not none %} · порог {{ threshold }}%{% endif %}
                    {% elif metric == 'throttling' %}
                      {{ loop.index }}. {{ name }} · Троттлинг активен
                    {% elif metric == 'smart_passed' %}
                      {{ loop.index }}. {{ name }} · SMART: ошибка
                    {% else %}
                      {{ loop.index }}. {{ name }} · {{ item.get('summary', 'Активная проблема') }}
                    {% endif %}
                  {% endfor %}
                summary: "{{ state_attr('sensor.dh_app_pve_problems', 'summary') | default('', true) }}"
                active: "{{ state_attr('sensor.dh_app_pve_problems', 'active') | default([], true) }}"
                startup_reconciliation: true
        - wait_template: >-
            {% if not is_state('binary_sensor.dh_app_pve_ups_configured', 'on') %}
              true
            {% else %}
              {% set started = states('sensor.dh_app_pve_agent_started') %}
              {% set published = states('sensor.dh_app_pve_ups_last_publication') %}
              {{ as_timestamp(started, 0) > 0 and as_timestamp(published, 0) >= as_timestamp(started, 0) }}
            {% endif %}
          timeout: "00:05:00"
          continue_on_timeout: true
        - if:
            - condition: template
              value_template: "{{ wait.completed and states('sensor.dh_app_pve_ups_problems') | int(0) > 0 }}"
          then:
            - event: dh_app_pve_notification
              event_data:
                source: dh_app_pve
                source_entity: sensor.dh_app_pve_ups_problems
                kind: startup_reconciliation
                category: diagnostic
                severity: "{{ state_attr('sensor.dh_app_pve_ups_problems', 'severity') | default('warning', true) }}"
                title: "🔋⚠️ UPS: активные проблемы после запуска"
                message: >-
                  {% set active = state_attr('sensor.dh_app_pve_ups_problems', 'active') | default([], true) %}
                  {% set labels = {
                    'nut_unavailable': 'NUT недоступен',
                    'on_battery': 'Городское питание отсутствует',
                    'low_battery': 'Низкий заряд батареи',
                    'overload': 'Перегрузка UPS',
                    'replace_battery': 'Требуется замена батареи',
                    'bypass': 'UPS работает в bypass',
                    'power_state_unknown': 'Состояние питания UPS неизвестно'
                  } %}
                  После запуска обнаружено активных проблем: {{ active | count }}.
                  {% for item in active %}
                    {% set problem_id = item.get('problem_id', '') %}
                    {{ loop.index }}. {{ labels.get(problem_id, problem_id if problem_id else 'Неизвестная проблема UPS') }}
                  {% endfor %}
                summary: "{{ state_attr('sensor.dh_app_pve_ups_problems', 'summary') | default('', true) }}"
                active: "{{ state_attr('sensor.dh_app_pve_ups_problems', 'active') | default([], true) }}"
                startup_reconciliation: true