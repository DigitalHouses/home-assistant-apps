# =============================================================================
# DigitalHouses — DH PVE UPS Dashboard
# =============================================================================
# Requires: Mushroom, mini-graph-card
#
# UPS/NUT shutdown policy is configured on Proxmox during explicit commissioning.
# Home Assistant observes the effective policy; it cannot apply/edit NUT policy.
# Battery-test controls and their scheduler remain runtime controls.
# =============================================================================

title: Электропитание
path: ups-monitor2
icon: mdi:power-plug-battery-outline
type: sections
max_columns: 4

badges:
  - type: entity
    entity: sensor.dh_pve_ups_status
    name: UPS
    show_name: true
    show_state: true
    show_icon: true
  - type: entity
    entity: sensor.dh_pve_ups_battery_charge
    name: Батарея
    show_name: true
    show_state: true
    show_icon: true
  - type: entity
    entity: sensor.dh_pve_ups_load
    name: Нагрузка
    show_name: true
    show_state: true
    show_icon: true
  - type: entity
    entity: sensor.dh_pve_ups_shutdown_policy
    name: Защита
    show_name: true
    show_state: true
    show_icon: true
  - type: entity
    entity: sensor.dh_pve_ups_test_state
    name: Тест
    show_name: true
    show_state: true
    show_icon: true
  - type: entity
    entity: sensor.dh_pve_ups_problems
    name: Проблемы
    show_name: true
    show_state: true
    show_icon: true

sections:
  - type: grid
    cards:
      - type: heading
        heading: Состояние ИБП
        heading_style: title
        icon: mdi:heart-pulse

      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_ups_problems
        primary: |-
          {% set count = states(entity) | int(0) %}
          {% if count == 0 %}
            ИБП работает нормально
          {% elif count == 1 %}
            Обнаружена 1 проблема
          {% else %}
            Обнаружено проблем: {{ count }}
          {% endif %}
        secondary: >-
          {{ state_attr(entity, 'details') or 'Нет данных о состоянии ИБП' }}
        icon: >-
          {% set severity = state_attr(entity, 'severity') %}
          {% if severity == 'critical' %} mdi:alert-octagon
          {% elif severity == 'warning' %} mdi:alert
          {% elif severity == 'ok' %} mdi:check-circle
          {% else %} mdi:help-circle-outline
          {% endif %}
        icon_color: >-
          {% set severity = state_attr(entity, 'severity') %}
          {% if severity == 'critical' %} red
          {% elif severity == 'warning' %} orange
          {% elif severity == 'ok' %} green
          {% else %} grey
          {% endif %}
        multiline_secondary: true
        fill_container: true
        tap_action:
          action: more-info
        grid_options:
          columns: 12
          rows: 2

      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: template
            entity: binary_sensor.dh_pve_ups_available
            icon: >-
              {% if is_state(entity, 'on') %} mdi:lan-connect
              {% else %} mdi:lan-disconnect
              {% endif %}
            icon_color: >-
              {% if is_state(entity, 'on') %} green
              {% else %} red
              {% endif %}
            content: NUT
            tap_action:
              action: more-info
          - type: template
            entity: binary_sensor.dh_pve_ups_on_battery
            icon: >-
              {% if is_state(entity, 'on') %} mdi:power-plug-off
              {% else %} mdi:transmission-tower
              {% endif %}
            icon_color: >-
              {% if is_state(entity, 'on') %} orange
              {% else %} green
              {% endif %}
            content: >-
              {% if is_state(entity, 'on') %} Батарея
              {% else %} Сеть
              {% endif %}
            tap_action:
              action: more-info
          - type: template
            entity: binary_sensor.dh_pve_ups_charging
            icon: mdi:battery-charging
            icon_color: >-
              {% if is_state(entity, 'on') %} green
              {% else %} grey
              {% endif %}
            content: Заряд
            tap_action:
              action: more-info
          - type: template
            entity: binary_sensor.dh_pve_ups_discharging
            icon: mdi:battery-minus
            icon_color: >-
              {% if is_state(entity, 'on') %} orange
              {% else %} grey
              {% endif %}
            content: Разряд
            tap_action:
              action: more-info
          - type: template
            entity: binary_sensor.dh_pve_ups_low_battery
            icon: mdi:battery-alert
            icon_color: >-
              {% if is_state(entity, 'on') %} red
              {% else %} grey
              {% endif %}
            content: Low
            tap_action:
              action: more-info
          - type: template
            entity: binary_sensor.dh_pve_ups_overload
            icon: mdi:gauge-full
            icon_color: >-
              {% if is_state(entity, 'on') %} red
              {% else %} grey
              {% endif %}
            content: Overload
            tap_action:
              action: more-info
          - type: template
            entity: binary_sensor.dh_pve_ups_bypass
            icon: mdi:transit-connection-variant
            icon_color: >-
              {% if is_state(entity, 'on') %} orange
              {% else %} grey
              {% endif %}
            content: Bypass
            tap_action:
              action: more-info
          - type: template
            entity: binary_sensor.dh_pve_ups_replace_battery
            icon: mdi:battery-sync
            icon_color: >-
              {% if is_state(entity, 'on') %} red
              {% else %} grey
              {% endif %}
            content: Replace
            tap_action:
              action: more-info

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.dh_pve_ups_battery_charge
            primary: Батарея
            secondary: >-
              {% set s = states(entity) %}
              {{ 'Нет данных' if s in ['unknown','unavailable','none',''] else s ~ ' %' }}
            layout: vertical
            icon: >-
              {% set v = states(entity) | int(-1) %}
              {% if v < 0 %} mdi:battery-unknown
              {% elif v <= 20 %} mdi:battery-alert
              {% elif v <= 50 %} mdi:battery-medium
              {% else %} mdi:battery-high
              {% endif %}
            icon_color: >-
              {% set v = states(entity) | int(-1) %}
              {% if v < 0 %} grey
              {% elif v <= 20 %} red
              {% elif v <= 50 %} orange
              {% else %} green
              {% endif %}
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.dh_pve_ups_load
            primary: Нагрузка
            secondary: >-
              {% set s = states(entity) %}
              {{ 'Нет данных' if s in ['unknown','unavailable','none',''] else s ~ ' %' }}
            layout: vertical
            icon: mdi:speedometer
            icon_color: >-
              {% set v = states(entity) | float(-1) %}
              {% if v < 0 %} grey
              {% elif v >= 90 %} red
              {% elif v >= 70 %} orange
              {% else %} blue
              {% endif %}
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.dh_pve_ups_battery_runtime_minutes
            primary: Прогноз работы
            secondary: >-
              {% set s = states(entity) %}
              {{ 'Нет данных' if s in ['unknown','unavailable','none',''] else s ~ ' мин' }}
            icon: mdi:timer-sand
            icon_color: purple
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.dh_pve_ups_status
            primary: Режим
            secondary: '{{ states(entity) }}'
            icon: mdi:power-plug-battery
            icon_color: >-
              {% if is_state('binary_sensor.dh_pve_ups_on_battery','on') %} orange
              {% elif is_state('binary_sensor.dh_pve_ups_available','off') %} grey
              {% else %} green
              {% endif %}
            tap_action:
              action: more-info

      - type: heading
        heading: Электропитание
        heading_style: subtitle
        icon: mdi:transmission-tower

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.dh_pve_ups_input_voltage
            primary: Вход
            secondary: >-
              {% set s = states(entity) %}
              {{ 'Нет данных' if s in ['unknown','unavailable','none',''] else s ~ ' В' }}
            icon: mdi:transmission-tower-import
            icon_color: orange
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.dh_pve_ups_output_voltage
            primary: Выход
            secondary: >-
              {% set s = states(entity) %}
              {{ 'Нет данных' if s in ['unknown','unavailable','none',''] else s ~ ' В' }}
            icon: mdi:transmission-tower-export
            icon_color: green
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.dh_pve_ups_battery_voltage
            primary: Батарея
            secondary: >-
              {% set s = states(entity) %}
              {{ 'Нет данных' if s in ['unknown','unavailable','none',''] else s ~ ' В' }}
            icon: mdi:sine-wave
            icon_color: blue
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.dh_pve_ups_nominal_real_power
            primary: Номинал
            secondary: >-
              {% set s = states(entity) %}
              {{ 'Нет данных' if s in ['unknown','unavailable','none',''] else s ~ ' Вт' }}
            icon: mdi:flash
            icon_color: blue
            tap_action:
              action: more-info

      - type: heading
        heading: Обновление
        heading_style: subtitle
        icon: mdi:refresh

      - type: custom:mushroom-template-card
        entity: button.dh_pve_ups_refresh
        primary: Обновить данные ИБП
        secondary: >-
          {% set v = states('sensor.dh_pve_ups_last_refresh') %}
          {% if v in ['unknown','unavailable','none',''] %}
            Ещё не выполнялось
          {% else %}
            {{ as_timestamp(v) | timestamp_custom('%d.%m.%Y %H:%M:%S', true) }}
          {% endif %}
        icon: mdi:refresh
        icon_color: blue
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.dh_pve_ups_refresh

  - type: grid
    cards:
      - type: heading
        heading: Аварийное отключение
        heading_style: title
        icon: mdi:shield-power

      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_ups_shutdown_policy
        primary: >-
          {% if is_state(entity, 'Enabled') %}
            Защита питания включена
          {% elif is_state(entity, 'Commissioning') %}
            NUT shutdown не активирован
          {% else %}
            Политика: {{ states(entity) }}
          {% endif %}
        secondary: >-
          {% set role = state_attr(entity, 'role') | default('unknown', true) %}
          {% set monitor = state_attr(entity, 'nut_monitor') | default('unknown', true) %}
          {% set enabled = state_attr(entity, 'shutdown_enabled') %}
          NUT {{ role | upper }} · monitor {{ monitor }} ·
          shutdown {{ 'разрешён' if enabled else 'не разрешён' }}
        icon: >-
          {% if is_state(entity, 'Enabled') %} mdi:shield-check
          {% elif is_state(entity, 'Commissioning') %} mdi:shield-half-full
          {% else %} mdi:shield-alert-outline
          {% endif %}
        icon_color: >-
          {% if is_state(entity, 'Enabled') %} green
          {% elif is_state(entity, 'Commissioning') %} orange
          {% else %} red
          {% endif %}
        multiline_secondary: true
        fill_container: true
        tap_action:
          action: more-info
        grid_options:
          columns: 12
          rows: 2

      - type: custom:mushroom-template-card
        entity: binary_sensor.dh_pve_ups_on_battery
        primary: >-
          {% if is_state(entity, 'on') %}
            Сеть пропала — питание от батареи
          {% else %}
            Питание от сети
          {% endif %}
        secondary: >-
          {% if is_state(entity, 'on') %}
            Настроено ожидание {{ states('sensor.dh_pve_ups_policy_on_battery_delay') }} мин до FSD.
            Live countdown пока не публикуется.
          {% else %}
            Аварийный таймер не требуется.
          {% endif %}
        icon: >-
          {% if is_state(entity, 'on') %} mdi:timer-alert
          {% else %} mdi:timer-check-outline
          {% endif %}
        icon_color: >-
          {% if is_state(entity, 'on') %} orange
          {% else %} green
          {% endif %}
        multiline_secondary: true
        tap_action:
          action: more-info

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.dh_pve_ups_policy_on_battery_delay
            primary: До FSD
            secondary: >-
              {% set s = states(entity) %}
              {{ 'Нет данных' if s in ['unknown','unavailable','none',''] else s ~ ' мин' }}
            icon: mdi:timer-outline
            icon_color: orange
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.dh_pve_ups_policy_power_restore_delay
            primary: Возврат питания
            secondary: >-
              {% set s = states(entity) %}
              {{ 'Нет данных' if s in ['unknown','unavailable','none',''] else s ~ ' с' }}
            icon: mdi:power-cycle
            icon_color: blue
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.dh_pve_ups_shutdown_policy
            primary: VM/LXC budget
            secondary: >-
              {% set v = state_attr(entity, 'guest_shutdown_budget_seconds') %}
              {{ 'Нет данных' if v is none else v ~ ' с' }}
            icon: mdi:server-network
            icon_color: purple
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.dh_pve_ups_shutdown_policy
            primary: upssched
            secondary: >-
              {% set present = state_attr(entity, 'upssched_present') %}
              {% set rules = state_attr(entity, 'upssched_rules') | int(0) %}
              {% if present %} {{ rules }} правила AT
              {% else %} Не настроен
              {% endif %}
            icon: mdi:calendar-clock
            icon_color: >-
              {% if state_attr(entity, 'upssched_present') %} green
              {% else %} red
              {% endif %}
            tap_action:
              action: more-info

      - type: entities
        title: Фактическая конфигурация NUT
        show_header_toggle: false
        entities:
          - entity: sensor.dh_pve_ups_policy_on_battery_delay
            name: Ожидание после потери сети
          - entity: sensor.dh_pve_ups_policy_power_restore_delay
            name: Задержка возврата питания
          - entity: sensor.dh_pve_ups_shutdown_delay
            name: UPS shutdown delay
          - entity: sensor.dh_pve_ups_start_delay
            name: UPS start delay

      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_ups_shutdown_policy
        primary: NUT / shutdown timing
        secondary: >-
          POLLFREQ {{ state_attr(entity, 'pollfreq_seconds') }} с ·
          ALERT {{ state_attr(entity, 'pollfreqalert_seconds') }} с ·
          DEADTIME {{ state_attr(entity, 'deadtime_seconds') }} с ·
          HOSTSYNC {{ state_attr(entity, 'hostsync_seconds') }} с ·
          FINALDELAY {{ state_attr(entity, 'finaldelay_seconds') }} с
        icon: mdi:timeline-clock-outline
        icon_color: blue
        multiline_secondary: true
        tap_action:
          action: more-info

      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_ups_shutdown_policy
        primary: Поведение после восстановления сети
        secondary: >-
          {{ state_attr(entity, 'power_restore_behavior') or 'Нет данных' }}
        icon: mdi:restart-alert
        icon_color: blue
        multiline_secondary: true
        tap_action:
          action: more-info

      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_ups_shutdown_policy
        primary: Цепочка аварийного отключения
        secondary: >-
          Потеря сети → ожидание {{ states('sensor.dh_pve_ups_policy_on_battery_delay') }} мин →
          FSD → graceful shutdown VM/LXC → shutdown Proxmox → UPS power-off / restore policy.
        icon: mdi:source-branch
        icon_color: purple
        multiline_secondary: true
        tap_action:
          action: more-info

      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_ups_shutdown_policy
        primary: Изменение политики
        secondary: >-
          Параметры выше только для просмотра. Изменение NUT policy выполняется
          только локально на Proxmox через explicit commissioning.
        icon: mdi:lock-outline
        icon_color: grey
        multiline_secondary: true
        tap_action:
          action: more-info

  - type: grid
    cards:
      - type: heading
        heading: Тесты батареи
        heading_style: title
        icon: mdi:battery-heart-variant

      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_ups_test_state
        primary: >-
          {% if is_state(entity, 'Running') %}
            Выполняется тест батареи
          {% else %}
            Battery test: {{ states(entity) }}
          {% endif %}
        secondary: >-
          {{ state_attr(entity, 'last_decision') or 'Нет активного решения scheduler' }}
        icon: >-
          {% if is_state(entity, 'Running') %} mdi:battery-sync
          {% else %} mdi:battery-check-outline
          {% endif %}
        icon_color: >-
          {% if is_state(entity, 'Running') %} orange
          {% else %} green
          {% endif %}
        multiline_secondary: true
        tap_action:
          action: more-info

      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: button.dh_pve_ups_test_quick
            primary: Quick
            secondary: Запустить
            icon: mdi:battery-sync
            icon_color: blue
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.dh_pve_ups_test_quick
              confirmation:
                text: Запустить Quick battery test?
          - type: custom:mushroom-template-card
            entity: button.dh_pve_ups_test_deep
            primary: Deep
            secondary: Запустить
            icon: mdi:battery-heart-variant
            icon_color: purple
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.dh_pve_ups_test_deep
              confirmation:
                text: Запустить Deep battery test?
          - type: custom:mushroom-template-card
            entity: button.dh_pve_ups_test_stop
            primary: Stop
            secondary: Остановить
            icon: mdi:stop-circle-outline
            icon_color: red
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.dh_pve_ups_test_stop
              confirmation:
                text: Остановить текущий battery test?

      - type: heading
        heading: Расписание
        heading_style: subtitle
        icon: mdi:calendar-sync-outline

      - type: entities
        show_header_toggle: false
        entities:
          - entity: number.dh_pve_ups_quick_test_interval_days
            name: Quick — интервал
          - entity: time.dh_pve_ups_quick_test_time
            name: Quick — время
          - entity: sensor.dh_pve_ups_next_quick_test
            name: Quick — следующий
          - entity: sensor.dh_pve_ups_last_quick_test
            name: Quick — последний результат
          - type: divider
          - entity: number.dh_pve_ups_deep_test_interval_days
            name: Deep — интервал
          - entity: time.dh_pve_ups_deep_test_time
            name: Deep — время
          - entity: sensor.dh_pve_ups_next_deep_test
            name: Deep — следующий
          - entity: sensor.dh_pve_ups_last_deep_test
            name: Deep — последний результат

      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_ups_test_history
        primary: История тестов
        secondary: 'Сохранено записей: {{ states(entity) }}'
        icon: mdi:history
        icon_color: blue
        tap_action:
          action: more-info

      - type: heading
        heading: Возможности UPS
        heading_style: subtitle
        icon: mdi:application-cog-outline

      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_ups_capabilities
        primary: '{{ states(entity) }}'
        secondary: >-
          {% set tests = state_attr(entity, 'battery_tests') or [] %}
          {% set beeper = state_attr(entity, 'beeper_control') %}
          {% set load = state_attr(entity, 'load_control') %}
          {% set shutdown = state_attr(entity, 'shutdown_control') %}
          Tests: {{ tests | join(', ') if tests else 'нет' }} ·
          beeper {{ 'yes' if beeper else 'no' }} ·
          load {{ 'yes' if load else 'no' }} ·
          shutdown {{ 'yes' if shutdown else 'no' }}
        icon: mdi:application-cog-outline
        icon_color: blue
        multiline_secondary: true
        tap_action:
          action: more-info

      - type: heading
        heading: Аппаратные пороги
        heading_style: subtitle
        icon: mdi:tune-vertical

      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.dh_pve_ups_battery_charge_warning
            name: Battery charge warning
          - entity: sensor.dh_pve_ups_battery_charge_low
            name: Battery charge low
          - entity: sensor.dh_pve_ups_battery_runtime_low
            name: Battery runtime low
          - entity: sensor.dh_pve_ups_beeper_status
            name: Зуммер
          - entity: sensor.dh_pve_ups_test_result
            name: Последний hardware test

  - type: grid
    cards:
      - type: heading
        heading: История и диагностика
        heading_style: title
        icon: mdi:chart-timeline-variant

      - type: custom:mini-graph-card
        name: Напряжение
        icon: mdi:transmission-tower
        entities:
          - entity: sensor.dh_pve_ups_input_voltage
            name: Вход
          - entity: sensor.dh_pve_ups_output_voltage
            name: Выход
        hours_to_show: 24
        points_per_hour: 6
        line_width: 2
        height: 90
        animate: true
        show:
          labels: true
          points: false
          legend: true
          extrema: true
          fill: fade

      - type: custom:mini-graph-card
        name: Батарея и нагрузка
        icon: mdi:battery-charging
        entities:
          - entity: sensor.dh_pve_ups_battery_charge
            name: Батарея
          - entity: sensor.dh_pve_ups_load
            name: Нагрузка
        hours_to_show: 24
        points_per_hour: 6
        line_width: 2
        height: 90
        animate: true
        show:
          labels: true
          points: false
          legend: true
          extrema: true
          fill: fade

      - type: custom:mini-graph-card
        name: Прогноз работы от батареи
        icon: mdi:timer-sand
        entities:
          - entity: sensor.dh_pve_ups_battery_runtime_minutes
            name: Runtime
        hours_to_show: 24
        points_per_hour: 6
        line_width: 2
        height: 90
        animate: true
        show:
          labels: true
          points: false
          legend: false
          extrema: true
          fill: fade

      - type: heading
        heading: Диагностика
        heading_style: subtitle
        icon: mdi:stethoscope

      - type: entities
        show_header_toggle: false
        entities:
          - entity: binary_sensor.dh_pve_ups_available
            name: NUT data available
          - entity: sensor.dh_pve_ups_status
            name: NUT status
          - entity: sensor.dh_pve_ups_problems
            name: Problems
          - entity: sensor.dh_pve_ups_shutdown_policy
            name: Shutdown policy
          - entity: sensor.dh_pve_ups_policy_on_battery_delay
            name: ONBATT wait
          - entity: sensor.dh_pve_ups_policy_power_restore_delay
            name: Restore delay
