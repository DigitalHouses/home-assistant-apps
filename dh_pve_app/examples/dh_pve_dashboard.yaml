# DH PVE production Lovelace view
# Requires: Mushroom, auto-entities, mini-graph-card
# Dynamic storage/disk/GPU/fan/diagnostic cards are selected by semantic
# proxmox_* attributes published by dh_pve_app.

title: Proxmox
path: proxmox
icon: mdi:server
subview: false
type: sections
max_columns: 4

sections:
  - type: grid
    cards:
      - type: heading
        heading: System
        heading_style: title
        icon: mdi:server

      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_system
        primary: >-
          {{ state_attr(entity, 'manufacturer') }} {{ state_attr(entity, 'model') }}
        secondary: >-
          {{ state_attr(entity, 'cpu_model') }} ·
          {{ state_attr(entity, 'cpu_cores') }}C/{{ state_attr(entity, 'cpu_threads') }}T ·
          {{ state_attr(entity, 'memory_type') }} {{ state_attr(entity, 'memory_form_factor') }}
          {{ state_attr(entity, 'memory_speed_mt_s') }} MT/s ·
          RAM slots {{ state_attr(entity, 'memory_slots_populated') }}/{{ state_attr(entity, 'memory_slots_total') }}
        icon: mdi:server
        multiline_secondary: true
        tap_action:
          action: more-info

      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_system
        primary: >-
          Proxmox {{ state_attr(entity, 'proxmox_version') }} · Kernel {{ state_attr(entity, 'kernel_version') }}
        secondary: >-
          {{ states(entity) }} · {{ state_attr(entity, 'primary_ip') }}
        icon: mdi:server-network
        tap_action:
          action: more-info

      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_last_boot
        primary: Last boot
        secondary: >-
          {% if states(entity) not in ['unknown', 'unavailable'] %}
            {{ as_timestamp(states(entity)) | timestamp_custom('%d.%m.%Y %H:%M:%S', true) }}
          {% else %}
            Unknown
          {% endif %}
        icon: mdi:restart
        tap_action:
          action: more-info

  - type: grid
    cards:
      - type: heading
        heading: Status
        heading_style: title
        icon: mdi:shield-check

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          include:
            - attributes:
                proxmox_integration: dh_pve_app
                proxmox_section: disk
                proxmox_metric: health
              state: WARNING
              options:
                type: custom:mushroom-template-card
                primary: >-
                  {{ state_attr(entity, 'proxmox_display_name') }}
                secondary: >-
                  WARNING · {{ state_attr(entity, 'health_reasons') | join(', ') }}
                icon: mdi:harddisk-alert
                icon_color: orange
                tap_action:
                  action: more-info
            - attributes:
                proxmox_integration: dh_pve_app
                proxmox_section: disk
                proxmox_metric: health
              state: CRITICAL
              options:
                type: custom:mushroom-template-card
                primary: >-
                  {{ state_attr(entity, 'proxmox_display_name') }}
                secondary: >-
                  CRITICAL · {{ state_attr(entity, 'health_reasons') | join(', ') }}
                icon: mdi:harddisk-alert
                icon_color: red
                tap_action:
                  action: more-info
            - entity_id: binary_sensor.dh_pve_cpu_throttling
              state: "on"
              options:
                type: custom:mushroom-template-card
                primary: CPU throttling
                secondary: Active
                icon: mdi:speedometer-slow
                icon_color: red
                tap_action:
                  action: more-info
            - attributes:
                proxmox_integration: dh_pve_app
                proxmox_section: diagnostic
                proxmox_subject: collector
              state: "off"
              options:
                type: custom:mushroom-template-card
                primary: >-
                  {{ state_attr(entity, 'proxmox_display_name') }} collector
                secondary: Collector unavailable
                icon: mdi:alert-circle
                icon_color: red
                tap_action:
                  action: more-info
        sort:
          method: attribute
          attribute: proxmox_sort_key

      - type: custom:mushroom-template-card
        entity: binary_sensor.dh_pve_cpu_throttling
        primary: Overall
        secondary: >-
          {% set critical = states.sensor
             | selectattr('attributes.proxmox_integration', 'eq', 'dh_pve_app')
             | selectattr('attributes.proxmox_metric', 'eq', 'health')
             | selectattr('state', 'eq', 'CRITICAL') | list %}
          {% set warning = states.sensor
             | selectattr('attributes.proxmox_integration', 'eq', 'dh_pve_app')
             | selectattr('attributes.proxmox_metric', 'eq', 'health')
             | selectattr('state', 'eq', 'WARNING') | list %}
          {% set collectors = states.binary_sensor
             | selectattr('attributes.proxmox_integration', 'eq', 'dh_pve_app')
             | selectattr('attributes.proxmox_subject', 'eq', 'collector')
             | selectattr('state', 'eq', 'off') | list %}
          {% if critical or is_state('binary_sensor.dh_pve_cpu_throttling', 'on') %}
            CRITICAL
          {% elif warning or collectors %}
            WARNING
          {% else %}
            HEALTHY
          {% endif %}
        icon: >-
          {% if is_state('binary_sensor.dh_pve_cpu_throttling', 'on') %}
            mdi:alert-circle
          {% else %}
            mdi:shield-check
          {% endif %}
        icon_color: >-
          {% if is_state('binary_sensor.dh_pve_cpu_throttling', 'on') %}red{% else %}green{% endif %}

  - type: grid
    cards:
      - type: heading
        heading: Performance
        heading_style: title
        icon: mdi:chart-line

      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_cpu_usage
        primary: CPU
        secondary: >-
          {{ states(entity) }}% · {{ states('sensor.dh_pve_cpu_temperature') }}°C ·
          {{ states('sensor.dh_pve_cpu_frequency') }} MHz
        icon: mdi:cpu-64-bit
        tap_action:
          action: more-info

      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_memory_usage
        primary: RAM
        secondary: >-
          {{ state_attr(entity, 'used_gib') }} / {{ state_attr(entity, 'total_gib') }} GiB ·
          {{ states(entity) }}%
        icon: mdi:memory
        tap_action:
          action: more-info

      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_swap_usage
        primary: Swap
        secondary: "{{ states(entity) }}%"
        icon: mdi:swap-horizontal
        tap_action:
          action: more-info

  - type: grid
    cards:
      - type: heading
        heading: Storage
        heading_style: title
        icon: mdi:database

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          include:
            - attributes:
                proxmox_integration: dh_pve_app
                proxmox_section: storage
              options:
                type: custom:mushroom-template-card
                primary: >-
                  {{ state_attr(entity, 'proxmox_display_name') }}
                secondary: >-
                  {{ state_attr(entity, 'used_gib') }} / {{ state_attr(entity, 'total_gib') }} GiB ·
                  {{ states(entity) }}% · {{ state_attr(entity, 'storage_type') }}
                icon: mdi:database
                tap_action:
                  action: more-info
        sort:
          method: attribute
          attribute: proxmox_sort_key

  - type: grid
    cards:
      - type: heading
        heading: Physical disks
        heading_style: title
        icon: mdi:harddisk

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          include:
            - attributes:
                proxmox_integration: dh_pve_app
                proxmox_section: disk
                proxmox_metric: health
              options:
                type: custom:mushroom-template-card
                primary: >-
                  {{ state_attr(entity, 'proxmox_display_name') }}
                secondary: >-
                  {% set object_id = state_attr(entity, 'proxmox_object_id') %}
                  {% set slug = object_id | lower | regex_replace('[^a-z0-9]+', '_') | regex_replace('_+', '_') | trim('_') %}
                  {% set temp = 'sensor.dh_pve_disk_' ~ slug ~ '_temperature' %}
                  {% set wear = 'sensor.dh_pve_disk_' ~ slug ~ '_wear' %}
                  {% set smart = 'binary_sensor.dh_pve_disk_' ~ slug ~ '_smart_problem' %}
                  {{ state_attr(entity, 'disk_type') }} ·
                  {% if states(temp) not in ['unknown', 'unavailable'] %}{{ states(temp) }}°C · {% endif %}
                  {% if states(wear) not in ['unknown', 'unavailable'] %}wear {{ states(wear) }}% · {% endif %}
                  {{ states(entity) }} · SMART {{ 'ERROR' if is_state(smart, 'on') else 'OK' }}
                icon: mdi:harddisk
                icon_color: >-
                  {% if is_state(entity, 'CRITICAL') %}red
                  {% elif is_state(entity, 'WARNING') %}orange
                  {% else %}green{% endif %}
                multiline_secondary: true
                tap_action:
                  action: more-info
        sort:
          method: attribute
          attribute: proxmox_sort_key

  - type: grid
    cards:
      - type: heading
        heading: Graphics
        heading_style: title
        icon: mdi:expansion-card

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          include:
            - attributes:
                proxmox_integration: dh_pve_app
                proxmox_section: graphics
                proxmox_metric: owner
              options:
                type: custom:mushroom-template-card
                primary: >-
                  {{ state_attr(entity, 'proxmox_display_name') }}
                secondary: >-
                  {% set base = entity | replace('_owner', '') %}
                  {% set transcode = base ~ '_transcoding' %}
                  {% set temperature = base ~ '_temperature' %}
                  {{ states(entity) }} · {{ state_attr(entity, 'source_name') }} ·
                  {{ state_attr(entity, 'connection') }}
                  {% if states(transcode) not in ['unknown', 'unavailable'] %} · transcoding {{ states(transcode) }}%{% endif %}
                  {% if states(temperature) not in ['unknown', 'unavailable'] %} · {{ states(temperature) }}°C{% endif %}
                icon: mdi:expansion-card
                multiline_secondary: true
                tap_action:
                  action: more-info
        sort:
          method: attribute
          attribute: proxmox_sort_key

      - type: heading
        heading: Cooling
        heading_style: subtitle
        icon: mdi:fan

      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_fans
        primary: Fans
        secondary: >-
          {{ states(entity) }} · count {{ state_attr(entity, 'count') }}
        icon: >-
          {% if is_state_attr(entity, 'detected', true) %}mdi:fan{% else %}mdi:fan-off{% endif %}
        tap_action:
          action: more-info

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          include:
            - attributes:
                proxmox_integration: dh_pve_app
                proxmox_section: cooling
                proxmox_metric: rpm
              options:
                type: custom:mushroom-template-card
                primary: >-
                  {{ state_attr(entity, 'proxmox_display_name') }}
                secondary: "{{ states(entity) }} rpm"
                icon: mdi:fan
                tap_action:
                  action: more-info
        sort:
          method: attribute
          attribute: proxmox_sort_key

  - type: grid
    cards:
      - type: heading
        heading: Control
        heading_style: title
        icon: mdi:tune

      - type: custom:mushroom-template-card
        entity: button.dh_pve_refresh
        primary: Refresh
        secondary: >-
          Last: {% if states('sensor.dh_pve_last_refresh') not in ['unknown', 'unavailable'] %}
            {{ as_timestamp(states('sensor.dh_pve_last_refresh')) | timestamp_custom('%d.%m.%Y %H:%M:%S', true) }}
          {% else %}never{% endif %}
        icon: mdi:refresh
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.dh_pve_refresh

      - type: heading
        heading: Runtime settings
        heading_style: subtitle
        icon: mdi:tune-variant

      - type: custom:auto-entities
        show_empty: false
        card:
          type: entities
          title: Runtime settings
        filter:
          include:
            - attributes:
                proxmox_integration: dh_pve_app
                proxmox_section: settings
                proxmox_subject: setting
        sort:
          method: attribute
          attribute: proxmox_sort_key

  - type: grid
    cards:
      - type: heading
        heading: Diagnostics
        heading_style: title
        icon: mdi:stethoscope

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - attributes:
                proxmox_integration: dh_pve_app
                proxmox_section: diagnostic
                proxmox_subject: collector
              options:
                type: custom:mushroom-template-card
                primary: >-
                  {{ state_attr(entity, 'proxmox_display_name') }}
                secondary: >-
                  {{ 'OK' if is_state(entity, 'on') else 'Unavailable' }}
                icon: >-
                  {{ 'mdi:check-circle' if is_state(entity, 'on') else 'mdi:alert-circle' }}
                icon_color: >-
                  {{ 'green' if is_state(entity, 'on') else 'red' }}
                tap_action:
                  action: more-info
        sort:
          method: attribute
          attribute: proxmox_sort_key

  - type: grid
    cards:
      - type: heading
        heading: History
        heading_style: title
        icon: mdi:chart-timeline-variant

      - type: custom:mini-graph-card
        name: CPU usage
        entities:
          - sensor.dh_pve_cpu_usage
        hours_to_show: 24
        points_per_hour: 4
        line_width: 2
        height: 60
        show:
          extrema: true
          fill: fade

      - type: custom:mini-graph-card
        name: CPU temperature
        entities:
          - sensor.dh_pve_cpu_temperature
        hours_to_show: 24
        points_per_hour: 4
        line_width: 2
        height: 60
        show:
          extrema: true
          fill: fade

      - type: custom:mini-graph-card
        name: RAM usage
        entities:
          - sensor.dh_pve_memory_usage
        hours_to_show: 24
        points_per_hour: 4
        line_width: 2
        height: 60
        show:
          extrema: true
          fill: fade

      - type: custom:mini-graph-card
        name: Swap usage
        entities:
          - sensor.dh_pve_swap_usage
        hours_to_show: 24
        points_per_hour: 4
        line_width: 2
        height: 60
        show:
          extrema: true
          fill: fade
