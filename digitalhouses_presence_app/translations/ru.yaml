configuration:
  presence_mode:
    name: Режим присутствия
    description: Начальный режим GPS / Wi-Fi / Hybrid. Переключение доступно также через select.dh_presence_app_mode.
  wifi_absence_minutes:
    name: Время подтверждения отсутствия Wi-Fi
  gps_poll_interval_seconds:
    name: Период проверки GPS, секунд
  gps_freshness_seconds:
    name: Актуальность GPS, секунд
  events_history_limit:
    name: Количество последних событий
    description: Сколько последних событий DH Presence хранить для карточки (1–20, по умолчанию 5). История отображения не должна записываться в Recorder.
  residents:
    name: Телефоны жильцов
    description: Один GPS device_tracker мобильного телефона на жильца. Имя определяется из Home Assistant.
  resident_names:
    name: Имена жильцов
    description: Один раз укажите соответствие GPS-трекера и имени человека. Используйте только телефоны из списка жильцов.
    fields:
      device_tracker:
        name: GPS-трекер
      user_name:
        name: Имя жильца
  exclude_users:
    name: Исключённые HA User ID (только legacy)
  telemetry_enabled:
    name: Согласие на статистику (неактивно в экспериментальной версии)
  log_level:
    name: Журналирование
