configuration:
  presence_mode:
    name: Presence mode
    description: Sets initial/default mode; change at runtime using select.dh_presence_app_mode. Wi-Fi engine is not available yet.
  wifi_absence_minutes:
    name: Hybrid Wi-Fi absence timeout
  gps_poll_interval_seconds:
    name: GPS poll interval
  gps_freshness_seconds:
    name: GPS source freshness
  residents:
    name: Registered residents
    description: Add one GPS device_tracker entity ID for each tracked phone; names are resolved from Home Assistant.
  exclude_users:
    name: Excluded Home Assistant user IDs (legacy mappings only)
  telemetry_enabled:
    name: Statistics collection consent (inactive in experimental pilot)
  log_level:
    name: Log level
