configuration:
  presence_mode:
    name: Presence mode
    description: Initial GPS / Wi-Fi / Hybrid mode; change live through select.dh_presence_app_mode.
  wifi_absence_minutes:
    name: Hybrid Wi-Fi absence timeout
  gps_poll_interval_seconds:
    name: GPS poll interval
  gps_freshness_seconds:
    name: GPS source freshness
  events_history_limit:
    name: Recent event history size
    description: Number of latest DH Presence events to retain for the read-only card (1–20, default 5). Exclude this display sensor from Recorder.
  residents:
    name: Registered residents
    description: Add one GPS device_tracker entity ID for each tracked phone; names are resolved from Home Assistant.
  resident_names:
    name: Resident names
    description: One-time phone tracker to resident name mapping. Only trackers enrolled in residents are allowed.
    fields:
      device_tracker:
        name: GPS tracker
      user_name:
        name: Resident name
  exclude_users:
    name: Excluded Home Assistant user IDs (legacy mappings only)
  telemetry_enabled:
    name: Statistics collection consent (inactive in experimental pilot)
  log_level:
    name: Log level
