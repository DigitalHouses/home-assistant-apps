# DH Presence · maintained dashboard using same source card
title: Мы дома
path: presence
icon: mdi:home-account
type: sections
max_columns: 4
sections:
  - type: grid
    cards:
      - type: heading
        heading: Присутствие
        heading_style: title
        icon: mdi:home-account
      - type: vertical-stack
        cards:
          - type: custom:button-card
            entity: sensor.dh_presence_app_card
            triggers_update:
              - sensor.dh_presence_app_card
              - sensor.dh_presence_app_version
              - sensor.dh_presence_app_latest_version
              - binary_sensor.dh_presence_app_update_available
              - binary_sensor.dh_presence_app_residents_home
              - select.dh_presence_app_mode
              - update.digitalhouses_presence_app_update
            update_timer: |
              [[[
                const state = states['sensor.dh_presence_app_card']?.state;
                const updating = states['update.digitalhouses_presence_app_update']?.attributes?.in_progress === true;
                return state === 'running' || updating ? 1000 : 5000;
              ]]]
            show_icon: true
            show_name: true
            show_label: true
            icon: |
              [[[
                const status = states['sensor.dh_presence_app_card']?.state;
                const home = states['binary_sensor.dh_presence_app_residents_home']?.state;
                const supervisor = states['update.digitalhouses_presence_app_update'];
                const installable = supervisor?.state === 'on';
                const releaseAvailable = states['binary_sensor.dh_presence_app_update_available']?.state === 'on';
                const updating = supervisor?.attributes?.in_progress === true;
                if (updating || status === 'running') return 'mdi:progress-clock';
                if (status === 'error') return 'mdi:alert-circle';
                if (status === 'success') return 'mdi:check-circle';
                if (installable || releaseAvailable) return 'mdi:package-up';
                if (home === 'on') return 'mdi:home-account';
                if (home === 'off') return 'mdi:home-export-outline';
                return 'mdi:home-question';
              ]]]

            name: |
              [[[
                const supervisor = states['update.digitalhouses_presence_app_update'];
                const releaseAvailable = states['binary_sensor.dh_presence_app_update_available']?.state === 'on';
                const installable = supervisor?.state === 'on';
                const valid = v => typeof v === 'string'
                  && v.trim() !== '' && !['unknown', 'unavailable', 'none'].includes(v.toLowerCase());
                const sensorInstalled = states['sensor.dh_presence_app_version']?.state;
                const installed = valid(sensorInstalled) ? sensorInstalled : supervisor?.attributes?.installed_version;
                const supervisorLatest = supervisor?.attributes?.latest_version;
                const checkedLatest = states['sensor.dh_presence_app_latest_version']?.state;
                const latest = installable && valid(supervisorLatest) ? supervisorLatest
                  : releaseAvailable && valid(checkedLatest) ? checkedLatest : null;
                const upgrade = (installable || releaseAvailable) && valid(installed)
                  && valid(latest) && latest !== installed;
                return 'DH Presence' + (valid(installed)
                  ? ' · v' + installed + (upgrade ? ' → v' + latest : '') : '');
              ]]]

            label: |
              [[[
                const item = states['sensor.dh_presence_app_card'];
                const supervisor = states['update.digitalhouses_presence_app_update'];
                const installable = supervisor?.state === 'on';
                const releaseAvailable = states['binary_sensor.dh_presence_app_update_available']?.state === 'on';
                const newer = installable || releaseAvailable;
                const elapsed = since => {
                  const n = Math.max(0, Math.floor((performance.now() - since) / 1000));
                  return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0');
                };
                const duration = v => typeof v === 'number' && Number.isFinite(v)
                  ? v.toFixed(1).replace('.', ',') + ' сек' : '—';
                if (supervisor?.attributes?.in_progress === true) {
                  if (this._dh_presence_timer?.kind !== 'install')
                    this._dh_presence_timer = {kind: 'install', since: performance.now()};
                  const percent = supervisor.attributes.update_percentage;
                  return 'Установка версии… '
                    + (typeof percent === 'number' && Number.isFinite(percent) ? Math.round(percent) + '% · ' : '')
                    + elapsed(this._dh_presence_timer.since);
                }
                if (!item || ['unknown', 'unavailable'].includes(item.state))
                  return 'Нет связи с приложением';
                const attrs = item.attributes || {};
                if (item.state === 'running') {
                  const key = String(attrs.operation) + '|' + String(attrs.started_at || '');
                  if (this._dh_presence_timer?.key !== key)
                    this._dh_presence_timer = {kind: 'operation', key, since: performance.now()};
                  const name = attrs.operation === 'refresh' ? 'Обновление присутствия'
                    : attrs.operation === 'check' ? 'Проверка версии' : 'Операция';
                  return name + '… ' + elapsed(this._dh_presence_timer.since);
                }
                this._dh_presence_timer = null;
                if (item.state === 'error')
                  return 'Ошибка: ' + (attrs.error || 'операция не выполнена');
                if (item.state === 'success') {
                  const result = attrs.operation === 'refresh' ? 'Последние данные проверены'
                    : attrs.operation === 'check' ? (newer ? 'Доступна новая версия' : 'Версия актуальна')
                    : 'Готово';
                  return result + ' · ' + duration(attrs.duration_seconds);
                }
                // Supervisor is authoritative for install availability, including when
                // the App's own GitHub release check has not refreshed yet.
                if (newer) return 'Доступна новая версия';
                const mode = states['select.dh_presence_app_mode']?.state;
                const overall = states['binary_sensor.dh_presence_app_residents_home']?.state;
                const summary = states['binary_sensor.dh_presence_app_residents_home']?.attributes || {};
                const n = summary.residents_home, total = summary.residents_total;
                const count = Number.isInteger(n) && Number.isInteger(total) ? ' · Дома ' + n + '/' + total : '';
                const sourceUnavailable = Object.keys(summary.residents || {}).some(key => !['on','off'].includes(
                  states['binary_sensor.dh_presence_app_' + key + '_gps_home']?.state
                ));
                const freshness = Number(summary.gps_freshness_seconds) || 300;
                const old = Object.values(summary.residents || {}).some(r => r?.gps_reported_at
                  && Date.now() - Date.parse(r.gps_reported_at) > freshness * 1000);
                const label = mode === 'wifi' ? 'Wi-Fi · трекер роутера'
                  : mode === 'hybrid' ? 'Hybrid · GPS + трекер роутера' : 'GPS';
                const observed = overall === 'on' ? 'Есть дома'
                  : overall === 'off' ? 'Никого дома' : 'Нет свежих данных';
                const home = sourceUnavailable && ['on','off'].includes(overall)
                  ? 'Последнее подтверждение: ' + observed
                  : old && ['on','off'].includes(overall)
                  ? 'По последним GPS-данным: ' + observed : observed;
                return label + ' · ' + home + count + (sourceUnavailable ? ' · GPS недоступен' : '');
              ]]]

            styles:
              card:
                - padding: 12px
                - text-align: left
              grid:
                - grid-template-areas: '"i n" "i l"'
                - grid-template-columns: 48px 1fr
                - grid-template-rows: min-content min-content
              img_cell:
                - width: 40px
                - justify-content: start
              icon:
                - width: 28px
                - color: |
                  [[[
                    const s = states['sensor.dh_presence_app_card']?.state;
                    const supervisor = states['update.digitalhouses_presence_app_update'];
                    const installable = supervisor?.state === 'on';
                    const releaseAvailable = states['binary_sensor.dh_presence_app_update_available']?.state === 'on';
                    if (s === 'error') return 'var(--error-color)';
                    if (s === 'running' || supervisor?.attributes?.in_progress === true)
                      return 'var(--info-color, var(--primary-color))';
                    if (s === 'success') return 'var(--success-color)';
                    if (installable || releaseAvailable) return 'var(--warning-color, orange)';
                    const roster = states['binary_sensor.dh_presence_app_residents_home']?.attributes?.residents || {};
                    const sourceUnavailable = Object.keys(roster).some(key => !['on','off'].includes(
                      states['binary_sensor.dh_presence_app_' + key + '_gps_home']?.state
                    ));
                    const freshness = Number(states['binary_sensor.dh_presence_app_residents_home']?.attributes?.gps_freshness_seconds) || 300;
                    const old = Object.values(roster).some(r => r?.gps_reported_at
                      && Date.now() - Date.parse(r.gps_reported_at) > freshness * 1000);
                    if (sourceUnavailable || old) return 'var(--warning-color, orange)';
                    return states['binary_sensor.dh_presence_app_residents_home']?.state === 'on'
                      ? 'var(--success-color)' : 'var(--secondary-text-color)';
                  ]]]

              name:
                - justify-self: start
                - font-size: 14px
                - font-weight: 600
              label:
                - justify-self: start
                - white-space: normal
                - text-align: left
                - font-size: 13px
                - color: var(--secondary-text-color)
            tap_action:
              action: none
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:refresh
                content: Обновить
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.dh_presence_app_refresh
              - type: template
                icon: mdi:cloud-search
                content: Версия
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.dh_presence_app_check_updates
              - type: conditional
                conditions:
                  - entity: update.digitalhouses_presence_app_update
                    state: "on"
                chip:
                  type: template
                  icon: mdi:package-down
                  icon_color: orange
                  content: Новая версия
                  tap_action:
                    action: perform-action
                    perform_action: update.install
                    target:
                      entity_id: update.digitalhouses_presence_app_update
                    data:
                      backup: true
                    confirmation:
                      text: "Установить новую версию DH Presence? Приложение временно остановится."
              - type: template
                icon: mdi:restart
                content: Перезапуск
                tap_action:
                  action: perform-action
                  perform_action: hassio.app_restart
                  data:
                    app: 8133339d_digitalhouses_presence_app
                  confirmation:
                    text: "Перезапустить DH Presence? Определение присутствия временно прервётся."
          - type: tile
            entity: select.dh_presence_app_mode
            name: Режим присутствия
            icon: mdi:crosshairs-gps
            features:
              - type: select-options
          - type: entities
            title: Уведомления DH Presence
            show_header_toggle: false
            entities:
              - entity: switch.dh_presence_app_notify_presence
                name: Итоговое присутствие
                icon: mdi:home-account
              - entity: switch.dh_presence_app_notify_gps
                name: GPS
                icon: mdi:crosshairs-gps
              - entity: switch.dh_presence_app_notify_wifi
                name: Wi-Fi
                icon: mdi:wifi

          - type: custom:auto-entities
            card:
              type: vertical-stack
            card_param: cards
            show_empty: false
            filter:
              include:
                - entity_id: "binary_sensor.dh_presence_app_*_wifi_home"
                  options:
                    type: custom:mushroom-template-card
                    entity: this.entity_id
                    primary: >-
                      {% set key = entity | replace('binary_sensor.dh_presence_app_', '') | replace('_wifi_home', '') %}
                      {% set roster = state_attr('binary_sensor.dh_presence_app_residents_home', 'residents') or {} %}
                      {% set r = roster.get(key, {}) %}
                      {{ (r.get('user_name') or 'Имя не задано') ~ ' (' ~ (r.get('name') or key) ~ ')' }}
                    secondary: |-
                      {% set key = entity | replace('binary_sensor.dh_presence_app_', '') | replace('_wifi_home', '') %}
                      {% set roster = state_attr('binary_sensor.dh_presence_app_residents_home', 'residents') or {} %}
                      {% set r = roster.get(key, {}) %}
                      {% set presence = r.get('status', 'unavailable') %}
                      {% set gps = r.get('gps', 'unavailable') %}
                      {% set wifi = r.get('wifi', 'unavailable') %}
                      Итог: {{ 'Дома' if presence == 'home' else 'Вне дома' if presence == 'not_home' else 'Не определено' }} · {{ as_local(as_datetime(r['status_changed_at'])).strftime('%d.%m %H:%M') if r.get('status_changed_at') else '—' }}
                      GPS: {{ 'Дома' if gps == 'home' else 'Вне дома' if gps == 'not_home' else 'Недоступно' }} · {{ as_local(as_datetime(r['gps_changed_at'])).strftime('%d.%m %H:%M') if r.get('gps_changed_at') else '—' }}
                      Wi-Fi: {{ 'Обнаружен' if wifi == 'home' else 'Не подключён (роутер)' if wifi == 'not_home' else 'Недоступно' }} · {{ as_local(as_datetime(r['wifi_changed_at'])).strftime('%d.%m %H:%M') if r.get('wifi_changed_at') else '—' }}
                    icon: >-
                      {% set key = entity | replace('binary_sensor.dh_presence_app_', '') | replace('_wifi_home', '') %}
                      {% set r = (state_attr('binary_sensor.dh_presence_app_residents_home', 'residents') or {}).get(key, {}) %}
                      {{ 'mdi:home-account' if r.get('status') == 'home' else 'mdi:home-export-outline' if r.get('status') == 'not_home' else 'mdi:home-question' }}
                    color: >-
                      {% set key = entity | replace('binary_sensor.dh_presence_app_', '') | replace('_wifi_home', '') %}
                      {% set r = (state_attr('binary_sensor.dh_presence_app_residents_home', 'residents') or {}).get(key, {}) %}
                      {{ 'green' if r.get('status') == 'home' else 'blue' if r.get('status') == 'not_home' else 'amber' }}
                    multiline_secondary: true
                    tap_action:
                      action: more-info
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                entity: event.dh_presence_app_event
                icon: mdi:history
                content: События
                tap_action:
                  action: more-info
              - type: template
                entity: sensor.dh_presence_app_last_refresh
                icon: mdi:clock-check-outline
                content: >-
                  {% set s = states('sensor.dh_presence_app_last_refresh') %}
                  {% if s in ['unknown', 'unavailable', 'none'] %}
                    Refresh не выполнялся
                  {% else %}
                    Refresh: {{ as_local(as_datetime(s)).strftime('%d.%m %H:%M') }}
                  {% endif %}
                tap_action:
                  action: more-info
              - type: template
                entity: sensor.dh_presence_app_started_at
                icon: mdi:clock-outline
                content: Запущено
                tap_action:
                  action: more-info
          # Built-in phone registration opens the App's authenticated Supervisor
          # Ingress UI. It is disabled in GPS-only 0.1.10 and needs no extra resources.
          - type: custom:button-card
            entity: sensor.dh_presence_app_version
            triggers_update:
              - sensor.dh_presence_app_version
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            variables:
              registration_ready: |
                [[[
                  const installed = states['sensor.dh_presence_app_version']?.state || '';
                  const match = installed.match(/^(\d+)\.(\d+)\.(\d+)$/);
                  if (!match) return false;
                  const version = match.slice(1).map(Number);
                  return version[0] > 0 || version[1] > 1
                    || (version[1] === 1 && version[2] >= 11);
                ]]]
            icon: |
              [[[
                return variables.registration_ready
                  ? 'mdi:cellphone-link' : 'mdi:cellphone-off';
              ]]]
            name: Регистрация телефона
            label: |
              [[[
                const version = states['sensor.dh_presence_app_version']?.state || 'не определена';
                return variables.registration_ready
                  ? 'Открыть DH Presence · зарегистрировать телефон по домашнему Wi-Fi'
                  : 'Пока недоступно · требуется DH Presence 0.1.11 (установлена ' + version + ')';
              ]]]
            tap_action:
              action: |
                [[[
                  return variables.registration_ready ? 'navigate' : 'none';
                ]]]
              navigation_path: /app/8133339d_digitalhouses_presence_app
            hold_action:
              action: more-info
              entity: sensor.dh_presence_app_version
            styles:
              card:
                - padding: 12px 14px
              grid:
                - grid-template-areas: '"i n" "i l"'
                - grid-template-columns: 40px 1fr
                - grid-template-rows: min-content min-content
              icon:
                - width: 28px
                - color: |
                    [[[
                      return variables.registration_ready
                        ? 'var(--primary-color)'
                        : 'var(--disabled-text-color)';
                    ]]]
              name:
                - justify-self: start
                - font-size: 14px
                - font-weight: 600
              label:
                - justify-self: start
                - white-space: normal
                - text-align: left
                - font-size: 12px
                - color: var(--secondary-text-color)
          # Private network identity diagnostics are available only to HA admins.
          - type: custom:button-card
            entity: sensor.dh_presence_app_version
            hidden: |
              [[[
                return hass.user?.is_admin !== true;
              ]]]
            show_icon: true
            show_name: true
            show_label: true
            show_state: false
            icon: mdi:lan-check
            name: Диагностика регистрации · администратор
            label: |
              [[[
                const v = states['sensor.dh_presence_app_version']?.state || '';
                const m = v.match(/^(\d+)\.(\d+)\.(\d+)$/);
                const installed = m && (
                  Number(m[1]) > 0 || Number(m[2]) > 1 ||
                  (Number(m[2]) === 1 && Number(m[3]) >= 12)
                );
                return installed
                  ? 'IP / MAC · GPS tracker · время GPS · состояние регистрации'
                  : 'Требуется DH Presence 0.1.12 (сейчас ' + (v || 'неизвестно') + ')';
              ]]]
            tap_action:
              action: |
                [[[
                  const v = states['sensor.dh_presence_app_version']?.state || '';
                  const m = v.match(/^(\d+)\.(\d+)\.(\d+)$/);
                  const installed = m && (
                    Number(m[1]) > 0 || Number(m[2]) > 1 ||
                    (Number(m[2]) === 1 && Number(m[3]) >= 12)
                  );
                  return hass.user?.is_admin === true && installed ? 'navigate' : 'none';
                ]]]
              navigation_path: /app/8133339d_digitalhouses_presence_app
            styles:
              card:
                - padding: 12px 14px
                - text-align: left
              icon:
                - width: 28px
                - color: var(--primary-color)
              name:
                - justify-self: start
                - white-space: normal
                - font-weight: 600
                - font-size: 14px
              label:
                - justify-self: start
                - white-space: normal
                - color: var(--secondary-text-color)
                - font-size: 12px
          # Auto-entities lists EVERY currently registered Presence entity, including
          # native Refresh / Check Version buttons and the mode selector.
          # New resident GPS / Wi-Fi / distance entities appear without YAML edits.
          # Phone registration is in the app's native Ingress web UI; no custom
          # resource or YAML is needed for onboarding.
          - type: custom:auto-entities
            card:
              type: entities
              title: DH Presence · все сущности и управление
              show_header_toggle: false
              state_color: true
            filter:
              include:
                - entity_id: "*dh_presence_app_*"
                # Supervisor update entity is optional and appears only if it exists.
                - entity_id: update.digitalhouses_presence_app_update
            sort:
              method: entity_id
            unique: true
            show_empty: false
        grid_options:
          columns: 12
