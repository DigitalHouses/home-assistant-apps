type: markdown
content: >-
  {%- set tree = state_attr('sensor.dh_presence_app_registered_phones', 'tree') -%}
  {%- if tree is string and tree -%}
    <pre style="margin:0; padding:0; line-height:1; font-family:'Courier New',monospace; white-space:pre;">{{ tree | e }}</pre>
  {%- else -%}
    _Реестр телефонов пока недоступен._
  {%- endif %}
grid_options:
  columns: 12
