# DH Presence · administrator-only MQTT phone removal, no iframe/HACS.
# Frontend visibility is convenience, not per-user MQTT authorization.
# The App owns dynamic phone choices, the button action and registry cleanup.
type: custom:button-card
entity: select.dh_presence_app_remove_phone
hidden: |
  [[[
    return hass.user?.is_admin !== true;
  ]]]
show_icon: false
show_name: false
show_label: false
show_state: false
tap_action:
  action: none
hold_action:
  action: none
custom_fields:
  manager:
    card:
      type: entities
      title: "Удаление телефона · администратор"
      show_header_toggle: false
      entities:
        - entity: select.dh_presence_app_remove_phone
          name: Телефон
          icon: mdi:cellphone
        - entity: button.dh_presence_app_delete_registration
          name: Удалить регистрацию
          icon: mdi:cellphone-remove
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.dh_presence_app_delete_registration
            confirmation:
              text: "Удалить выбранный телефон из DH Presence? Повторная регистрация потребуется с самого телефона."
styles:
  card:
    - padding: 0
    - border: none
    - background: transparent
    - box-shadow: none
  grid:
    - grid-template-areas: '"manager"'
    - grid-template-columns: 1fr
    - grid-template-rows: min-content
  custom_fields:
    manager:
      - width: 100%
grid_options:
  columns: 12
