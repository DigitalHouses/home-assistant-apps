# DH Presence App · local HA notifications for !include_dir_merge_named
# File: /config/packages/Global/DH_APP/dh_presence_app_notification.yaml
# Requires: homeassistant: packages: !include_dir_merge_named packages
# Keep dh_presence_app.yaml separate for Recorder. Do not duplicate this automation.
# Events are native MQTT Event entities; script.write2log owns notifications.
# No extra notification helper or standalone app entity.
dh_presence_app_notification:
  automation:
    - id: dh_presence_notifications
      alias: "DH Presence Notifications"
      mode: queued
      max: 30
      triggers:
        - trigger: event.received
          target:
            entity_id: event.dh_presence_app_event
          options:
            event_type: [arrival]
          id: arrival

        - trigger: event.received
          target:
            entity_id: event.dh_presence_app_event
          options:
            event_type: [departure]
          id: departure

        - trigger: event.received
          target:
            entity_id: event.dh_presence_app_event
          options:
            event_type: [gps_in]
          id: gps_in

        - trigger: event.received
          target:
            entity_id: event.dh_presence_app_event
          options:
            event_type: [gps_out]
          id: gps_out

        - trigger: event.received
          target:
            entity_id: event.dh_presence_app_event
          options:
            event_type: [zone_enter]
          id: zone_enter

        - trigger: event.received
          target:
            entity_id: event.dh_presence_app_event
          options:
            event_type: [zone_leave]
          id: zone_leave

        - trigger: event.received
          target:
            entity_id: event.dh_presence_app_event
          options:
            event_type: [wifi_in]
          id: wifi_in

        - trigger: event.received
          target:
            entity_id: event.dh_presence_app_event
          options:
            event_type: [wifi_lost]
          id: wifi_lost

        - trigger: event.received
          target:
            entity_id: event.dh_presence_app_event
          options:
            event_type: [wifi_out]
          id: wifi_out

      variables:
        person_device: >-
          {% set event = trigger.to_state.attributes %}
          {% set person = event.user_name | default('', true) %}
          {% set device = event.device_name | default('', true) %}
          {{ person ~ ' (' ~ device ~ ')' if person and device and person != device else (person or device or 'Неизвестное устройство') }}
        arrival_message: >-
          {% if trigger.to_state.attributes.first_arrival | default(false) %}
            Режим дома: присутствие.
          {% else %}
            Прибыл ещё один жилец. Дома: {{ trigger.to_state.attributes.residents_home_after | default('?', true) }}.
          {% endif %}
        departure_message: >-
          {% if trigger.to_state.attributes.last_departure | default(false) %}
            Режим дома: отсутствие.
          {% else %}
            Жилец покинул дом. Дома: {{ trigger.to_state.attributes.residents_home_after | default('?', true) }}.
          {% endif %}
        wifi_lost_message: >-
          Источник Wi-Fi временно недоступен. Состояние подключения неизвестно.
        wifi_out_message: >-
          По данным Wi-Fi-трекера роутера устройство больше не подключено к домашней Wi-Fi сети.
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id: zone_enter
                - condition: template
                  value_template: "{{ is_state('switch.dh_presence_app_notify_zone_' ~ trigger.to_state.attributes.zone_key, 'on') }}"
              sequence:
                - action: script.write2log
                  data:
                    title: "{{ '🏠' if trigger.to_state.attributes.zone_entity_id == 'zone.home' else '📍' }}✅ Вход в зону «{{ trigger.to_state.attributes.zone_name }}»: {{ person_device }}"
                    message: "Местоположение подтверждено GPS."
            - conditions:
                - condition: trigger
                  id: zone_leave
                - condition: template
                  value_template: "{{ is_state('switch.dh_presence_app_notify_zone_' ~ trigger.to_state.attributes.zone_key, 'on') }}"
              sequence:
                - action: script.write2log
                  data:
                    title: "{{ '🏠' if trigger.to_state.attributes.zone_entity_id == 'zone.home' else '📍' }}🚪 Выход из зоны «{{ trigger.to_state.attributes.zone_name }}»: {{ person_device }}"
                    message: "Местоположение подтверждено GPS."

            - conditions:
                - condition: trigger
                  id: gps_in
                - condition: state
                  entity_id: switch.dh_presence_app_notify_gps
                  state: "on"
                - condition: template
                  value_template: "{{ not is_state('switch.dh_presence_app_notify_zone_620b51c29b479984', 'on') }}"
              sequence:
                - action: script.write2log
                  data:
                    title: "📍 GPS дома: {{ person_device }}"
                    message: "GPS-трекер вошёл в домашнюю зону."
            - conditions:
                - condition: trigger
                  id: gps_out
                - condition: state
                  entity_id: switch.dh_presence_app_notify_gps
                  state: "on"
                - condition: template
                  value_template: "{{ not is_state('switch.dh_presence_app_notify_zone_620b51c29b479984', 'on') }}"
              sequence:
                - action: script.write2log
                  data:
                    title: "📍 GPS вне дома: {{ person_device }}"
                    message: "GPS-трекер вышел из домашней зоны."
            - conditions:
                - condition: trigger
                  id: wifi_in
                - condition: state
                  entity_id: switch.dh_presence_app_notify_wifi
                  state: "on"
              sequence:
                - action: script.write2log
                  data:
                    title: "📶 Wi-Fi обнаружен: {{ person_device }}"
                    message: "Устройство обнаружено выбранным методом проверки локальной сети."
            - conditions:
                - condition: trigger
                  id: wifi_lost
                - condition: state
                  entity_id: switch.dh_presence_app_notify_wifi
                  state: "on"
              sequence:
                - action: script.write2log
                  data:
                    title: "📵 Wi-Fi не подтверждается: {{ person_device }}"
                    message: "{{ wifi_lost_message }}"
            - conditions:
                - condition: trigger
                  id: wifi_out
                - condition: state
                  entity_id: switch.dh_presence_app_notify_wifi
                  state: "on"
              sequence:
                - action: script.write2log
                  data:
                    title: "📵 Wi-Fi не обнаружен: {{ person_device }}"
                    message: "{{ wifi_out_message }}"

  # English alias generates the canonical entity_id; friendly name stays Russian.
  # The renamed automation id retires the legacy transliterated registry identity.
  homeassistant:
    customize:
      automation.dh_presence_notifications:
        friendly_name: "DH Presence · Уведомления"
