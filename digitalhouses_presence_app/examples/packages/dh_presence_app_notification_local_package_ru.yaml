# LOCAL Home Assistant package for DigitalHouses Presence App 0.1.8+
# Install: /config/packages/dh_presence_app_notification_local_package_ru.yaml
# Requires homeassistant: packages: !include_dir_named packages
#
# Direct path: native MQTT Event -> event.received -> trigger.id -> choose ->
# script.write2log(title, message). Each service data is a Jinja-generated
# JSON dictionary (official HA action syntax), avoiding a validation error
# on nested templated YAML dictionaries. No duplicate Logbook entry.
#
# The MQTT Event entity is independently eligible for HA Recorder history
# subject to the installation's recorder include/exclude/retention rules.
# The exact Recorder behavior of script.write2log is owned by that local script.
#
# Names are obtained during Mobile Companion registration and stored in
# Presence App; MQTT events already include user_name and device_name.
# The HA package never keeps a second resident-name table.
#
# "Режим дома" is notification text; NO security/alarm mode is changed.
# wifi_in: confirmed registered MAC reappears after initial observation.
# wifi_lost: 15 minutes without positive ARP proof: NOT verified disconnect.
# wifi_out remains reserved for future independently verified disconnection.
# No notification is generated at App startup from its first baseline probe.
automation:
  - id: dh_presence_app_notifications
    alias: "DH Presence · Уведомления"
    mode: queued
    max: 30
    triggers:
      - trigger: event.received
        target:
          entity_id: event.dh_presence_app_event
        options:
          event_type: [arrival]
        id: arrival

      - trigger: event.received
        target:
          entity_id: event.dh_presence_app_event
        options:
          event_type: [departure]
        id: departure

      - trigger: event.received
        target:
          entity_id: event.dh_presence_app_event
        options:
          event_type: [wifi_in]
        id: wifi_in

      - trigger: event.received
        target:
          entity_id: event.dh_presence_app_event
        options:
          event_type: [wifi_lost]
        id: wifi_lost

      - trigger: event.received
        target:
          entity_id: event.dh_presence_app_event
        options:
          event_type: [wifi_out]
        id: wifi_out

    variables:
      person_device: >-
        {% set event = trigger.to_state.attributes %}
        {% set person = event.user_name %}
        {% set device = event.device_name %}
        {{ person ~ ' (' ~ device ~ ')' if person and person != device else (person if person else device) }}

    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: arrival
            sequence:
              - action: script.write2log
                data: >-
                  {{ {
                    'title': '🏠 Прибытие: ' ~ person_device,
                    'message': (
                      'Режим дома: присутствие.'
                      if trigger.to_state.attributes.first_arrival
                      else 'Прибыл ещё один жилец. Дома: '
                           ~ trigger.to_state.attributes.residents_home_after ~ '.'
                    )
                  } | tojson }}

          - conditions:
              - condition: trigger
                id: departure
            sequence:
              - action: script.write2log
                data: >-
                  {{ {
                    'title': '🚗 Убытие: ' ~ person_device,
                    'message': (
                      'Режим дома: отсутствие.'
                      if trigger.to_state.attributes.last_departure
                      else 'Жилец покинул дом. Дома: '
                           ~ trigger.to_state.attributes.residents_home_after ~ '.'
                    )
                  } | tojson }}

          - conditions:
              - condition: trigger
                id: wifi_in
            sequence:
              - action: script.write2log
                data: >-
                  {{ {
                    'title': '📶 Wi-Fi обнаружен: ' ~ person_device,
                    'message': 'Домашняя Wi-Fi сеть: устройство подтверждено по зарегистрированному MAC.'
                  } | tojson }}

          - conditions:
              - condition: trigger
                id: wifi_lost
            sequence:
              - action: script.write2log
                data: >-
                  {{ {
                    'title': '📵 Wi-Fi не подтверждается: ' ~ person_device,
                    'message': 'В течение '
                      ~ (trigger.to_state.attributes.timeout_minutes | default(15, true))
                      ~ ' минут устройство не подтвердило присутствие в домашней Wi-Fi сети. '
                      ~ 'Это не означает подтверждённое отключение или уход.'
                  } | tojson }}

          - conditions:
              - condition: trigger
                id: wifi_out
            sequence:
              - action: script.write2log
                data: >-
                  {{ {
                    'title': '📵 Wi-Fi отключён: ' ~ person_device,
                    'message': 'Отсутствие устройства в домашней Wi-Fi сети подтверждено.'
                  } | tojson }}
