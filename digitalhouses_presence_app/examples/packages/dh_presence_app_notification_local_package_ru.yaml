# DH Presence · local HA package (RU)
# Install: /config/packages/dh_presence_app_notification_local_package_ru.yaml
# Requires: homeassistant: packages: !include_dir_named packages
# ROOT is automation:, no duplicate package-key wrapper.
# Recorder stores the Logbook entries subject to filters/retention.
# Change persistent_notification.create to a local delivery action if needed.
# Source Wi-Fi event types are not yet emitted by the experimental GPS App.
#
# user_name: a local site can set resident_user_names by stable resident_id.
# Otherwise lookup HA Person whose active 'source' is the event tracker.
# Without a verified name show only device name, not a guessed resident name.
# First/last occupancy text does NOT change alarm or security system modes.

automation:
  - id: dh_presence_app_notifications
    alias: "DH Presence · Recorder и уведомления"
    mode: queued
    max: 30
    triggers:
      - trigger: event.received
        target:
          entity_id: event.dh_presence_app_event
        options:
          event_type: [arrival]
        id: arrival
      - trigger: event.received
        target:
          entity_id: event.dh_presence_app_event
        options:
          event_type: [departure]
        id: departure
      - trigger: event.received
        target:
          entity_id: event.dh_presence_app_event
        options:
          event_type: [wifi_in]
        id: wifi_in
      - trigger: event.received
        target:
          entity_id: event.dh_presence_app_event
        options:
          event_type: [wifi_out]
        id: wifi_out

    variables:
      # Optional LOCAL map, filled on the installed HA only.
      # resident_user_names:
      #   stable_resident_key: "Имя жильца"
      resident_user_names: {}
      person_device: >-
        {% set e = trigger.to_state.attributes %}
        {% set device = e.resident_name %}
        {% set configured = resident_user_names.get(e.resident_id) %}
        {% set matches = states.person | selectattr('attributes.source', 'eq', e.device_tracker) | list %}
        {% set person = configured if configured else (matches[0].name if matches else '') %}
        {{ person ~ ' (' ~ device ~ ')' if person and person != device else (person if person else device) }}

    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: arrival
            sequence:
              - action: logbook.log
                data:
                  name: "DH Presence · Прибытие"
                  entity_id: event.dh_presence_app_event
                  message: >-
                    {{ person_device }}.
                    {% if trigger.to_state.attributes.first_arrival %}
                      Режим дома: присутствие.
                    {% else %}
                      Дома жильцов: {{ trigger.to_state.attributes.residents_home_after }}.
                    {% endif %}
              - action: persistent_notification.create
                data:
                  title: "🏠 Прибытие: {{ person_device }}"
                  message: >-
                    {% if trigger.to_state.attributes.first_arrival %}
                      Режим дома: присутствие.
                    {% else %}
                      Прибыл ещё один жилец.
                      Дома: {{ trigger.to_state.attributes.residents_home_after }}.
                    {% endif %}

          - conditions:
              - condition: trigger
                id: departure
            sequence:
              - action: logbook.log
                data:
                  name: "DH Presence · Убытие"
                  entity_id: event.dh_presence_app_event
                  message: >-
                    {{ person_device }}.
                    {% if trigger.to_state.attributes.last_departure %}
                      Режим дома: отсутствие.
                    {% else %}
                      Дома жильцов: {{ trigger.to_state.attributes.residents_home_after }}.
                    {% endif %}
              - action: persistent_notification.create
                data:
                  title: "🚗 Убытие: {{ person_device }}"
                  message: >-
                    {% if trigger.to_state.attributes.last_departure %}
                      Режим дома: отсутствие.
                    {% else %}
                      Жилец покинул дом.
                      Дома: {{ trigger.to_state.attributes.residents_home_after }}.
                    {% endif %}

          - conditions:
              - condition: trigger
                id: wifi_in
            sequence:
              - action: logbook.log
                data:
                  name: "DH Presence · Wi-Fi"
                  entity_id: event.dh_presence_app_event
                  message: "Подключение устройства: {{ person_device }}."
              - action: persistent_notification.create
                data:
                  title: "📶 Wi-Fi подключён: {{ person_device }}"
                  message: "Устройство обнаружено в домашней Wi-Fi сети."

          - conditions:
              - condition: trigger
                id: wifi_out
            sequence:
              - action: logbook.log
                data:
                  name: "DH Presence · Wi-Fi"
                  entity_id: event.dh_presence_app_event
                  message: "Отключение устройства: {{ person_device }}."
              - action: persistent_notification.create
                data:
                  title: "📵 Wi-Fi отключён: {{ person_device }}"
                  message: "Отсутствие устройства в домашней Wi-Fi сети подтверждено."
