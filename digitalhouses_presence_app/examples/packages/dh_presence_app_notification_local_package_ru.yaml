# LOCAL Home Assistant package for DigitalHouses Presence App 0.1.8+
# Install: /config/packages/dh_presence_app_notification_local_package_ru.yaml
# Requires homeassistant: packages: !include_dir_named packages
#
# Direct path: native MQTT Event -> event.received -> trigger.id -> choose ->
# script.write2log(title, message). Each service data is a Jinja-generated
# JSON dictionary with short Jinja expressions. Longer conditional messages
# are prepared as separate variables; no duplicate Logbook entry.
#
# The MQTT Event entity is independently eligible for HA Recorder history
# subject to the installation's recorder include/exclude/retention rules.
# The exact Recorder behavior of script.write2log is owned by that local script.
#
# Names are obtained during Mobile Companion registration and stored in
# Presence App; MQTT events already include user_name and device_name.
# The HA package never keeps a second resident-name table.
#
# "Статус дома" is notification text; NO security/alarm mode is changed.
# wifi_in: router tracker confirms a real Wi-Fi connection after baseline.
# wifi_lost is a historical event from older versions; no longer emitted since 0.1.25.
# wifi_out now means explicit router device_tracker home -> not_home.
# No notification is generated at App startup from its first baseline probe.
# zone.home gates per-resident home transitions; other zone switches gate informational geofences.
# GPS source events remain machine-readable but cause no duplicate user notices.
# Wi-Fi messages remain opt-in through their independent MQTT switch.
# Device events and Recorder remain unfiltered.
automation:
  - id: dh_presence_notifications
    alias: "DH Presence Notifications"
    mode: queued
    max: 30
    triggers:
      - trigger: event.received
        target:
          entity_id: event.dh_presence_app_event
        options:
          event_type: [arrival]
        id: arrival

      - trigger: event.received
        target:
          entity_id: event.dh_presence_app_event
        options:
          event_type: [departure]
        id: departure

      - trigger: event.received
        target:
          entity_id: event.dh_presence_app_event
        options:
          event_type: [zone_enter]
        id: zone_enter

      - trigger: event.received
        target:
          entity_id: event.dh_presence_app_event
        options:
          event_type: [zone_leave]
        id: zone_leave

      - trigger: event.received
        target:
          entity_id: event.dh_presence_app_event
        options:
          event_type: [wifi_in]
        id: wifi_in

      - trigger: event.received
        target:
          entity_id: event.dh_presence_app_event
        options:
          event_type: [wifi_lost]
        id: wifi_lost

      - trigger: event.received
        target:
          entity_id: event.dh_presence_app_event
        options:
          event_type: [wifi_out]
        id: wifi_out

    variables:
      person_name: >-
        {% set ev = trigger.to_state.attributes %}
        {{ (ev.user_name | default('', true)) or (ev.device_name | default('', true)) or 'Неизвестный жилец' }}
      wifi_person_device: >-
        {% set ev = trigger.to_state.attributes %}
        {% set person = ev.user_name | default('', true) %}
        {% set device = ev.device_name | default('', true) %}
        {{ person ~ ' (' ~ device ~ ')' if person and device and person != device else (person or device or 'Неизвестное устройство') }}
      arrival_message: >-
        {% if trigger.to_state.attributes.first_arrival | default(false) %}
          Статус дома: ПРИСУТСТВИЕ
        {% else %}
          Дома: {{ trigger.to_state.attributes.residents_home_after | default('?', true) }}
        {% endif %}
      departure_message: >-
        {% if trigger.to_state.attributes.last_departure | default(false) %}
          Статус дома: ОТСУТСТВИЕ
        {% else %}
          Дома: {{ trigger.to_state.attributes.residents_home_after | default('?', true) }}
        {% endif %}
      wifi_lost_message: >-
        Источник Wi-Fi временно недоступен. Состояние подключения неизвестно.
      wifi_out_message: >-
        По данным Wi-Fi-трекера роутера устройство больше не подключено к домашней Wi-Fi сети.
    actions:
      # One home notification per logical resident arrival/departure;
      # zone.home acts as its MQTT gate regardless of GPS/Wi-Fi/hybrid mode.
      - choose:
          - conditions:
              - condition: trigger
                id: arrival
              - condition: template
                value_template: "{{ is_state('switch.dh_presence_app_notify_zone_620b51c29b479984', 'on') }}"
            sequence:
              - action: script.write2log
                data:
                  title: "🏠✅ {{ person_name }} прибыл домой"
                  message: "{{ arrival_message }}"
          - conditions:
              - condition: trigger
                id: departure
              - condition: template
                value_template: "{{ is_state('switch.dh_presence_app_notify_zone_620b51c29b479984', 'on') }}"
            sequence:
              - action: script.write2log
                data:
                  title: "🏠🚪 {{ person_name }} покинул дом"
                  message: "{{ departure_message }}"
          # Other zones are informational; suppress zone.home duplicates.
          - conditions:
              - condition: trigger
                id: zone_enter
              - condition: template
                value_template: "{{ trigger.to_state.attributes.zone_entity_id != 'zone.home' and is_state('switch.dh_presence_app_notify_zone_' ~ trigger.to_state.attributes.zone_key, 'on') }}"
            sequence:
              - action: script.write2log
                data:
                  title: "📍✅ {{ person_name }} прибыл в {{ trigger.to_state.attributes.zone_name }}"
                  message: "Местоположение подтверждено GPS."
          - conditions:
              - condition: trigger
                id: zone_leave
              - condition: template
                value_template: "{{ trigger.to_state.attributes.zone_entity_id != 'zone.home' and is_state('switch.dh_presence_app_notify_zone_' ~ trigger.to_state.attributes.zone_key, 'on') }}"
            sequence:
              - action: script.write2log
                data:
                  title: "📍🚪 {{ person_name }} покинул {{ trigger.to_state.attributes.zone_name }}"
                  message: "Местоположение подтверждено GPS."
          # Wi-Fi is the explicitly enabled, independent optional channel.
          - conditions:
              - condition: trigger
                id: wifi_in
              - condition: state
                entity_id: switch.dh_presence_app_notify_wifi
                state: "on"
            sequence:
              - action: script.write2log
                data:
                  title: "📶 Wi-Fi обнаружен: {{ wifi_person_device }}"
                  message: "Устройство обнаружено роутером в домашней Wi-Fi сети."
          - conditions:
              - condition: trigger
                id: wifi_lost
              - condition: state
                entity_id: switch.dh_presence_app_notify_wifi
                state: "on"
            sequence:
              - action: script.write2log
                data:
                  title: "📵 Wi-Fi не подтверждается: {{ wifi_person_device }}"
                  message: "{{ wifi_lost_message }}"
          - conditions:
              - condition: trigger
                id: wifi_out
              - condition: state
                entity_id: switch.dh_presence_app_notify_wifi
                state: "on"
            sequence:
              - action: script.write2log
                data:
                  title: "📵 Wi-Fi не обнаружен: {{ wifi_person_device }}"
                  message: "{{ wifi_out_message }}"

# English alias generates the canonical entity_id; friendly name stays Russian.
# The renamed automation id retires the legacy transliterated registry identity.
homeassistant:
  customize:
    automation.dh_presence_notifications:
      friendly_name: "DH Presence · Уведомления"
