name: DigitalHouses Presence App
version: 0.1.13
slug: digitalhouses_presence_app
description: Experimental safety-first GPS presence with MQTT Discovery; Wi-Fi engine pending validation.
url: https://github.com/DigitalHouses/home-assistant-apps/tree/main/digitalhouses_presence_app
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
stage: experimental
backup: cold
# One install: Supervisor serves the native UI and authenticates HA users.
ingress: true
ingress_port: 8099
panel_title: DH Presence
panel_icon: mdi:home-account
panel_admin: false
homeassistant_api: true
# Only host LAN L2 + packet sockets; no NET_ADMIN or privileged host control.
host_network: true
privileged:
  - NET_RAW
services:
  - mqtt:need
options:
  presence_mode: gps
  wifi_absence_minutes: 15
  gps_poll_interval_seconds: 30
  gps_freshness_seconds: 300
  residents: []
  resident_names: []
  exclude_users: []
  telemetry_enabled: false
  log_level: info
schema:
  presence_mode: list(gps|wifi|hybrid)
  wifi_absence_minutes: int(1,120)
  gps_poll_interval_seconds: int(10,300)
  gps_freshness_seconds: int(30,3600)
  residents:
    - str
  resident_names:
    - device_tracker: str
      user_name: str
  exclude_users:
    - str
  telemetry_enabled: bool
  log_level: list(debug|info|warning|error)
