# App-owned hardware identity/mode diagnostics; HA light state is separate.
type: markdown
content: |-
  {% set e = 'sensor.dh_aqara_switch_app_problems' -%}
  {% set active = state_attr(e,'active') or [] -%}
  {% if states(e) != 'ready' -%}
  ⚪ Нет подтверждённых данных диагностики.
  {% elif (state_attr(e,'count') or 0) == 0 -%}
  ✅ **Проблем не обнаружено** · Проверка соответствия устройств и Mode Keeper.
  {% else -%}
  ⚠️ **Активных проблем: {{ state_attr(e,'count') }}**
  {% for item in active -%}
  - **{{ (item.object_name or 'Устройство') | e }}** · {{ (item.category or 'unknown') | e }}{% if item.reason %} — {{ item.reason | e }}{% endif %}
  {% endfor -%}
  {% endif %}
