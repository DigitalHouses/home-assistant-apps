name: DigitalHouses Aqara Switch App
version: 0.1.16
slug: digitalhouses_aqara_switch_app
description: Aqara Scan/Adopt, Mode Keeper, direct Zigbee2MQTT and verified HA-native light control.
url: https://github.com/DigitalHouses/home-assistant-apps/tree/main/digitalhouses_aqara_switch_app
arch:
  - amd64
  - aarch64
image: ghcr.io/digitalhouses/digitalhouses_aqara_switch_app
startup: application
boot: manual
init: false
stage: experimental
backup: cold
hassio_api: true
hassio_role: default
# Required only by operator-triggered Scan (HA Device/Area Registry WebSocket).
homeassistant_api: true
services:
  - mqtt:need
options:
  log_level: info
  maintenance_mode: false
  restore_delay: 0.6
  switches: |-
    []
schema:
  log_level: list(debug|info|warning|error)
  maintenance_mode: bool
  restore_delay: float(0.1,30)
  switches: str
