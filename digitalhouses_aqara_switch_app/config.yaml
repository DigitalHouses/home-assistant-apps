name: DigitalHouses Aqara Switch App
version: 0.1.5
slug: digitalhouses_aqara_switch_app
description: Aqara Scan/Adopt, physical settings keeper and bound HA light.toggle MVP.
url: https://github.com/DigitalHouses/home-assistant-apps/tree/main/digitalhouses_aqara_switch_app
arch:
  - amd64
  - aarch64
image: ghcr.io/digitalhouses/digitalhouses_aqara_switch_app
startup: application
boot: manual
init: false
stage: experimental
backup: cold
hassio_api: true
hassio_role: default
# Required by Scan (HA Device/Area Registry WebSocket) and bound light.toggle REST.
homeassistant_api: true
services:
  - mqtt:need
options:
  log_level: info
  switches: []
  bindings: []
schema:
  log_level: list(debug|info|warning|error)
  switches:
    - ieee: str
      name: str
      enabled: bool
  bindings:
    - ieee: str
      press: str
      light: str
