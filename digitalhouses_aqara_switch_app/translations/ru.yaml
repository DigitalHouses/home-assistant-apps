configuration:
  log_level:
    name: Уровень журнала
    description: Подробность журнала приложения.
  switches:
    name: Выключатели и назначения (YAML)
    description: "Scan добавляет Aqara с событиями action под ключами switch.*. Для кнопок без сущности switch.* создаётся только логический ключ в YAML, не новая сущность HA. Внутри каждого выключателя настройте enabled и actions с одним или несколькими light.*. Допускаются список для toggle или расширенная команда с service и targets, причём яркость, температура, RGB и transition задаются опционально под каждым light.*. Физические IEEE хранятся в App, не редактируются."
