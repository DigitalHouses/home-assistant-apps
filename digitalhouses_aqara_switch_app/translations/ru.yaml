configuration:
  log_level:
    name: Уровень журнала
    description: Подробность журнала приложения.
  switches:
    name: Выключатели и назначения (YAML)
    description: "Scan добавляет Aqara с событиями action под ключами switch.*. Для кнопок без сущности switch.* создаётся только логический ключ в YAML, не новая сущность HA. Внутри каждого выключателя настройте enabled и actions с одним или несколькими light.*. Допускаются список для toggle или расширенная команда с service, targets, brightness_pct, brightness_step_pct, color_temp_kelvin, rgb_color, transition. Физические IEEE хранятся в App, не редактируются."
