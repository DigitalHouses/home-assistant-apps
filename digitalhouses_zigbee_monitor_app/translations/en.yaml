configuration:
  telemetry_enabled:
    name: DigitalHouses telemetry consent
    description: "DigitalHouses statistics transmit the app name, version and a random installation identifier. The app does not start without consent. Policy: https://github.com/DigitalHouses/home-assistant-apps/blob/main/docs/standards/PRODUCT_TELEMETRY_POLICY.md"
  log_level:
    name: Logging level
    description: Runtime diagnostic log verbosity.
  coordinators:
    name: Coordinators
    description: Autodiscovered IEEE identities with optional per-coordinator metadata.
  repeaters:
    name: Dedicated repeaters
    description: Known dedicated models are autodiscovered; other routers may be configured explicitly by IEEE.
