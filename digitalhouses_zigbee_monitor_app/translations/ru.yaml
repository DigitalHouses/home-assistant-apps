configuration:
  telemetry_enabled:
    name: Согласие на статистику DigitalHouses
    description: "Для статистики DigitalHouses отправляются: название приложения, версия и случайный идентификатор установки. Без согласия приложение не запускается. Полная политика: https://github.com/DigitalHouses/home-assistant-apps/blob/main/docs/standards/PRODUCT_TELEMETRY_POLICY.md"
  log_level:
    name: Уровень журнала
    description: Подробность диагностических записей приложения.
  coordinators:
    name: Координаторы
    description: Автоматически обнаруженные координаторы; разрешено дополнять необязательные поля по IEEE.
  repeaters:
    name: Выделенные репитеры
    description: Отдельный список; обнаруживаются только подтверждённые модели, прочие можно добавить по IEEE.
