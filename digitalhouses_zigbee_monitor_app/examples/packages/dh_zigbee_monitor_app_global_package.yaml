# DigitalHouses Zigbee Monitor · proposed global Recorder policy.
# Install only alongside the actual HAOS App, after reviewing the site's
# existing recorder include/exclude filters and package loading scheme.
# Example path: /config/packages/Global/DH_APP/dh_zigbee_monitor_app_global_package.yaml
# No local write2admins/write2log dependency is embedded in the public App.
#
# IMPORTANT: Recorder captures state attributes as well as state.
# Therefore only scalar metrics go to history. UI details/event/card never do.
dh_zigbee_monitor_app_global_package:
  recorder:
    include:
      entities:
        - sensor.dh_zigbee_monitor_app_networks
        - sensor.dh_zigbee_monitor_app_devices
        - sensor.dh_zigbee_monitor_app_offline
        - sensor.dh_zigbee_monitor_app_spammers
        - sensor.dh_zigbee_monitor_app_incidents
        - sensor.dh_zigbee_monitor_app_messages_rate_5m
    exclude:
      entities:
        - sensor.dh_zigbee_monitor_app_networks_details
        - sensor.dh_zigbee_monitor_app_offline_details
        - sensor.dh_zigbee_monitor_app_top_1h_details
        - sensor.dh_zigbee_monitor_app_top_24h_details
        - sensor.dh_zigbee_monitor_app_top_7d_details
        - sensor.dh_zigbee_monitor_app_incidents_details
        - sensor.dh_zigbee_monitor_app_inventory_details
        - sensor.dh_zigbee_monitor_app_refresh_state
        - sensor.dh_zigbee_monitor_app_card
        - sensor.dh_zigbee_monitor_app_version
        - sensor.dh_zigbee_monitor_app_started_at
        - sensor.dh_zigbee_monitor_app_latest_version
        - sensor.dh_zigbee_monitor_app_last_refresh
        - binary_sensor.dh_zigbee_monitor_app_update_available
        - event.dh_zigbee_monitor_app_event
      entity_globs:
        - sensor.dh_zigbee_monitor_app_*_details
