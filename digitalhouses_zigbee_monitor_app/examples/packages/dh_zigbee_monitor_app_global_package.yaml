# =============================================================================
# DigitalHouses Zigbee Monitor App · minimal Home Assistant Recorder policy.
#
# Install only after reviewing the site's active Recorder include/exclude policy
# and HA packages loading strategy. Do not replace the site's global recorder.
# Example target:
# /config/packages/Global/DH_APP/dh_zigbee_monitor_app_global_package.yaml
#
# Source of truth:
#   Five global scalars + per-network canonical 5-minute RPM, FSM and effective threshold.
#   App SQLite owns per-device minute aggregates and historical MQTT rankings.
#   Machine events are not historical state and are excluded from Recorder.
#
# IMPORTANT: Home Assistant Recorder filters give an explicit include.entities
# priority over exclude.entity_globs (when no conflicting domain/glob includes).
# Dynamic include globs allow ONLY numeric raw RPM, smoothed RPM, and
# effective threshold per network. No JSON attributes in these MQTT sensors.
# These include globs outrank generic exclude globs. With a glob include, Home Assistant Recorder's official
# filter precedence grants that matching scalar priority over a broad glob
# exclude. Other diagnostic JSON/attributes remain excluded. Test the filter
# contract before installing into a site's existing Recorder configuration.
# =============================================================================

dh_zigbee_monitor_app_global_package:
  recorder:
    include:
      entities:
        - sensor.dh_zigbee_monitor_app_networks
        - sensor.dh_zigbee_monitor_app_devices
        - sensor.dh_zigbee_monitor_app_offline
        - sensor.dh_zigbee_monitor_app_messages_rate_5m
        - sensor.dh_zigbee_monitor_app_fsm
      entity_globs:
        - sensor.dh_zigbee_monitor_app_*_rpm
        - sensor.dh_zigbee_monitor_app_*_fsm
        - sensor.dh_zigbee_monitor_app_*_rpm_threshold_effective

    exclude:
      entity_globs:
        # Explicit, independently validated safety net for JSON detail sensors.
        - sensor.dh_zigbee_monitor_app_*_details
        - sensor.dh_zigbee_monitor_app_*
        - binary_sensor.dh_zigbee_monitor_app_*
        - switch.dh_zigbee_monitor_app_*
        - select.dh_zigbee_monitor_app_*
        - text.dh_zigbee_monitor_app_*
        - button.dh_zigbee_monitor_app_*
        - event.dh_zigbee_monitor_app_*
      entities:
        - update.digitalhouses_zigbee_monitor_app_update
