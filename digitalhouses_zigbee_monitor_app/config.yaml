name: DigitalHouses Zigbee Monitor App
version: 0.1.0
slug: digitalhouses_zigbee_monitor_app
description: Read-only Zigbee2MQTT inventory, availability and MQTT activity monitoring for Home Assistant.
url: https://github.com/DigitalHouses/home-assistant-apps/tree/main/digitalhouses_zigbee_monitor_app
arch:
  - amd64
  - aarch64
image: ghcr.io/digitalhouses/digitalhouses_zigbee_monitor_app
startup: application
boot: auto
init: false
stage: experimental
backup: cold
timeout: 45
services:
  - mqtt:need
options:
  zigbee2mqtt: []
  telemetry_enabled: false
  log_level: info
schema:
  zigbee2mqtt:
    - network_id: str
      name: str
      base_topic: str
  telemetry_enabled: bool
  log_level: list(debug|info|warning|error)
