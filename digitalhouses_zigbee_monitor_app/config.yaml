name: DigitalHouses Zigbee Monitor App
version: 0.1.5
slug: digitalhouses_zigbee_monitor_app
description: Automatic Zigbee2MQTT discovery and read-only Zigbee inventory, availability and MQTT activity monitoring.
url: https://github.com/DigitalHouses/home-assistant-apps/tree/main/digitalhouses_zigbee_monitor_app
arch:
  - amd64
  - aarch64
image: ghcr.io/digitalhouses/digitalhouses_zigbee_monitor_app
startup: application
boot: auto
init: false
stage: experimental
backup: cold
hassio_api: true
hassio_role: default
timeout: 45
services:
  - mqtt:need
options:
  telemetry_enabled: false
  log_level: info
schema:
  telemetry_enabled: bool
  log_level: list(debug|info|warning|error)
