name: Integrate validated owner PR

on:
  workflow_run:
    workflows:
      - Validate repository
    types:
      - completed

permissions:
  actions: write
  contents: write
  pull-requests: write
  packages: write

jobs:
  integrate:
    name: Merge or reconcile validated main
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'workflow_dispatch' ||
       github.event.workflow_run.event == 'push') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
      candidates: ${{ steps.candidates.outputs.candidates }}
      matrix: ${{ steps.candidates.outputs.matrix }}
      has_apps: ${{ steps.candidates.outputs.has_apps }}

    steps:
      - name: Resolve exact validated PR or main commit
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN_ID: ${{ github.event.workflow_run.id }}
          VALIDATION_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          VALIDATION_EVENT: ${{ github.event.workflow_run.event }}
          VALIDATED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          VALIDATED_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$VALIDATED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"

          # A human-merged PR triggers normal main push CI. GITHUB_TOKEN merges
          # do not trigger this CI; their successful PR workflow handles release.
          if [ "$VALIDATION_EVENT" = push ] || { [ "$VALIDATION_EVENT" = workflow_dispatch ] && [ "$VALIDATED_HEAD_BRANCH" = main ]; }; then
            if [ "$VALIDATED_HEAD_SHA" != "$current_main" ]; then
              echo "Superseded main validation; a newer push will reconcile releases."
              echo "merged=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            parent="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$current_main" --jq '.parents[0].sha')"
            [[ "$parent" =~ ^[0-9a-f]{40}$ ]]
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "merge_sha=$current_main" >> "$GITHUB_OUTPUT"
            echo "release_base_sha=$parent" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # workflow_run.pull_requests is often empty even for successful PR
          # workflows. Recover the original event's immutable identity artifact.
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          gh run download "$VALIDATION_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name ci-provenance --dir "$workdir"
          provenance="$workdir/ci-provenance.json"
          test -f "$provenance"
          PR_NUMBER="$(jq -er .pr "$provenance")"
          VALIDATED_BASE_SHA="$(jq -er .base "$provenance")"
          artifact_head="$(jq -er .head "$provenance")"
          artifact_run="$(jq -er .run "$provenance")"
          artifact_attempt="$(jq -er .attempt "$provenance")"
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$VALIDATED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$artifact_head" = "$VALIDATED_HEAD_SHA"
          test "$artifact_run" = "$VALIDATION_RUN_ID"
          test "$artifact_attempt" = "$VALIDATION_RUN_ATTEMPT"

          # Do not trust a PR number from an artifact without cross-checking
          # the exact commit-to-PR association against GitHub's API.
          pr_matches="$(gh api "repos/$GITHUB_REPOSITORY/commits/$VALIDATED_HEAD_SHA/pulls")"
          test "$(jq --argjson number "$PR_NUMBER" \
            '[.[] | select(.number == $number)] | length' <<<"$pr_matches")" = 1

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          author="$(jq -r .user.login <<<"$pr_json")"
          state="$(jq -r .state <<<"$pr_json")"
          draft="$(jq -r .draft <<<"$pr_json")"
          base_ref="$(jq -r .base.ref <<<"$pr_json")"
          base_sha="$(jq -r .base.sha <<<"$pr_json")"
          head_repo="$(jq -r .head.repo.full_name <<<"$pr_json")"
          head_ref="$(jq -r .head.ref <<<"$pr_json")"
          head_sha="$(jq -r .head.sha <<<"$pr_json")"
          test "$author" = DigitalHouses
          test "$base_ref" = main
          test "$head_repo" = "$GITHUB_REPOSITORY"
          test "$head_ref" = "$VALIDATED_HEAD_BRANCH"

          if [ "$state" != open ] || [ "$draft" != false ] || [ "$head_sha" != "$VALIDATED_HEAD_SHA" ]; then
            echo "PR closed, draft, or superseded; no merge."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          revalidate_current_base() {
            echo "main advanced since CI; dispatching exact-base validation without editing the PR branch."
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/dispatches" \
              -f "ref=$head_ref" \
              -f "inputs[pr_number]=$PR_NUMBER" \
              -f "inputs[expected_head_sha]=$head_sha" \
              -f "inputs[expected_base_sha]=$current_main"
            echo "merged=false" >> "$GITHUB_OUTPUT"
          }

          if [ "$current_main" != "$VALIDATED_BASE_SHA" ] || [ "$base_sha" != "$VALIDATED_BASE_SHA" ]; then
            revalidate_current_base
            exit 0
          fi

          merge_attempts=12
          merge_delay_seconds=5
          for attempt in $(seq 1 "$merge_attempts"); do
            if merge_output="$(gh pr merge "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" --merge \
              --match-head-commit "$VALIDATED_HEAD_SHA" 2>&1)"; then
              printf '%s\n' "$merge_output"
              break
            else
              merge_rc=$?
            fi
            printf '%s\n' "$merge_output" >&2
            if ! grep -Fq "base branch policy prohibits the merge" <<<"$merge_output"; then
              exit "$merge_rc"
            fi
            if [ "$attempt" -ge "$merge_attempts" ]; then
              echo "Required checks or branch policy still block the exact validated PR." >&2
              exit "$merge_rc"
            fi
            retry_pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
            if [ "$(jq -r .state <<<"$retry_pr_json")" != open ] ||
               [ "$(jq -r .draft <<<"$retry_pr_json")" != false ] ||
               [ "$(jq -r .head.sha <<<"$retry_pr_json")" != "$VALIDATED_HEAD_SHA" ]; then
              echo "PR changed during merge retry; ignoring stale CI."
              echo "merged=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            if [ "$current_main" != "$VALIDATED_BASE_SHA" ] ||
               [ "$(jq -r .base.sha <<<"$retry_pr_json")" != "$VALIDATED_BASE_SHA" ]; then
              revalidate_current_base
              exit 0
            fi
            sleep "$merge_delay_seconds"
          done

          merged_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          merge_sha="$(jq -r .merge_commit_sha <<<"$merged_json")"
          test "$(jq -r .merged <<<"$merged_json")" = true
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]
          release_base_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$merge_sha" --jq '.parents[0].sha')"
          [[ "$release_base_sha" =~ ^[0-9a-f]{40}$ ]]

          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "release_base_sha=$release_base_sha" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact merged main revision
        if: steps.merge.outputs.merged == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.merge.outputs.merge_sha }}
          fetch-depth: 0

      - name: Set up Python
        if: steps.merge.outputs.merged == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Detect and validate releases
        id: candidates
        if: steps.merge.outputs.merged == 'true'
        env:
          BASE_SHA: ${{ steps.merge.outputs.release_base_sha }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          python scripts/release_candidates.py \
            --base "$BASE_SHA" \
            --head "$MERGE_SHA" \
            --include-pending-existing \
            --validate \
            --json-output release-candidates.json

          cat release-candidates.json
          echo "candidates=$(jq -c . release-candidates.json)" >> "$GITHUB_OUTPUT"
          python scripts/release_build_matrix.py release-candidates.json >> "$GITHUB_OUTPUT"

  build-native:
    name: Build ${{ matrix.product }} / ${{ matrix.arch }}
    needs: integrate
    if: needs.integrate.outputs.merged == 'true' && needs.integrate.outputs.has_apps == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.integrate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.integrate.outputs.merge_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Build immutable architecture image
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ needs.integrate.outputs.merge_sha }}
          PRODUCT: ${{ matrix.product }}
          VERSION: ${{ matrix.version }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -Eeuo pipefail
          product="$PRODUCT"
          version="$VERSION"
          arch="$ARCH"
          case "$arch:$(uname -m)" in
            amd64:x86_64|aarch64:aarch64) ;;
            *) echo "Native runner architecture mismatch" >&2; exit 1 ;;
          esac
          image="ghcr.io/digitalhouses/$product"
          release_ref="$image:$version"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # Final immutable tags are never overwritten. A partial prior run
          # may already have created the final manifest; individual architecture
          # digests still must be checked before the release can be resumed.
          case "$arch" in
            amd64)
              platform="linux/amd64"
              ;;
            aarch64)
              platform="linux/arm64"
              ;;
            *)
              echo "Unsupported Home Assistant App architecture: $arch" >&2
              exit 1
              ;;
          esac

          source_sha="$(python scripts/release_source.py "$product" "$version" "$MERGE_SHA")"
          arch_ref="$image:$version-$arch"
          if docker buildx imagetools inspect "$arch_ref" >/dev/null 2>&1; then
            existing="$(docker buildx imagetools inspect --raw "$arch_ref")"
            python scripts/release_source.py "$product" "$version" "$MERGE_SHA" "$source_sha" "$platform" <<<"$existing"
            digest="$(python scripts/registry_manifest.py "$arch_ref" digest)"
            echo "Reusing verified immutable architecture artifact $arch_ref@$digest"
          else
            # Only an authenticated registry 404 permits creation.
            python scripts/registry_manifest.py "$arch_ref" absent
            # Cache is mutable and deliberately separate from release tags.
            cache_ref="$image:buildcache-$arch"
            docker buildx build \
              --cache-from "type=registry,ref=$cache_ref" \
              --cache-to "type=registry,ref=$cache_ref,mode=max,ignore-error=true" \
              --platform "$platform" \
              --build-arg "BUILD_VERSION=$version" \
              --build-arg "BUILD_ARCH=$arch" \
              --label "org.opencontainers.image.revision=$source_sha" \
              --label "org.opencontainers.image.version=$version" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --annotation "manifest:org.opencontainers.image.revision=$source_sha" \
              --annotation "manifest:org.opencontainers.image.version=$version" \
              --annotation "index:org.opencontainers.image.revision=$source_sha" \
              --annotation "index:org.opencontainers.image.version=$version" \
              --tag "$arch_ref" \
              --metadata-file build-metadata.json \
              --push \
              "$product"
            digest="$(jq -er '."containerimage.digest"' build-metadata.json)"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(python scripts/registry_manifest.py "$arch_ref" digest)" = "$digest"
          python scripts/release_source.py "$product" "$version" "$MERGE_SHA" "$source_sha" "$platform" < <(python scripts/registry_manifest.py "$arch_ref" raw)
          mkdir -p image-digests
          printf '%s\n' "$digest" > "image-digests/$product-$arch"
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.product }}-${{ matrix.arch }}
          path: image-digests/
          if-no-files-found: error

  publish:
    name: Publish verified product releases
    needs: [integrate, build-native]
    if: >-
      always() && !cancelled() &&
      needs.integrate.result == 'success' &&
      needs.integrate.outputs.merged == 'true' &&
      ((needs.integrate.outputs.has_apps == 'true' && needs.build-native.result == 'success') ||
       (needs.integrate.outputs.has_apps == 'false' && needs.build-native.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.integrate.outputs.merge_sha }}
          fetch-depth: 0
      - name: Set up release Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Restore validated candidates
        env:
          CANDIDATES: ${{ needs.integrate.outputs.candidates }}
        run: printf '%s\n' "$CANDIDATES" > release-candidates.json
      - name: Set up release Buildx
        if: needs.integrate.outputs.has_apps == 'true'
        uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        if: needs.integrate.outputs.has_apps == 'true'
        with:
          pattern: image-digest-*
          path: image-digests
          merge-multiple: true
      - name: Publish multi-architecture manifests
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ needs.integrate.outputs.merge_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : > app-release-artifacts.tsv
          count="$(jq 'length' release-candidates.json)"
          if [ "$count" -eq 0 ]; then exit 0; fi
          if [ "${{ needs.integrate.outputs.has_apps }}" = "true" ]; then
            echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          fi
          for index in $(seq 0 $((count - 1))); do
            product="$(jq -r ".[${index}].product" release-candidates.json)"
            version="$(jq -r ".[${index}].version" release-candidates.json)"
            product_type="$(jq -r --arg product "$product" '.products[] | select(.id == $product) | .type' digitalhouses-stats/digitalhouses_stats/product_registry.json)"
            if [ "$product_type" != "app" ]; then continue; fi
            config="$product/config.yaml"
            test -f "$config"
            mapfile -t architectures < <(
              awk '
                /^arch:[[:space:]]*$/ { in_arch=1; next }
                in_arch && /^[^[:space:]]/ { exit }
                in_arch && /^[[:space:]]*-[[:space:]]+/ {
                  value=$0
                  sub(/^[[:space:]]*-[[:space:]]+/, "", value)
                  sub(/[[:space:]]+#.*$/, "", value)
                  gsub(/[[:space:]]+$/, "", value)
                  print value
                }
              ' "$config"
            )

            if [ "${#architectures[@]}" -eq 0 ]; then
              echo "No architectures found for $product" >&2
              exit 1
            fi

            image="ghcr.io/digitalhouses/$product"
            release_ref="$image:$version"
            source_sha="$(python scripts/release_source.py "$product" "$version" "$MERGE_SHA")"
            refs=()
            digests=()
            for arch in "${architectures[@]}"; do
              arch_ref="$image:$version-$arch"
              digest="$(cat "image-digests/$product-$arch")"
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              # Resolve OCI manifest index bytes verbatim: digest = sha256(bytes).
              # `imagetools inspect` text output omits Digest under some registries.
              actual="$(python scripts/registry_manifest.py "$arch_ref" digest)"
              case "$arch" in
                amd64) platform=linux/amd64 ;;
                aarch64) platform=linux/arm64 ;;
                *) exit 1 ;;
              esac
              python scripts/release_source.py "$product" "$version" "$MERGE_SHA" "$source_sha" "$platform" < <(python scripts/registry_manifest.py "$arch_ref" raw)
              echo "Expected $arch digest: $digest; manifest body: $actual"
              test "$actual" = "$digest"
              refs+=("$image@$digest")
              digests+=("$digest")
            done
            source_digests="$(IFS=,; echo "${digests[*]}")"
            if docker buildx imagetools inspect "$release_ref" >/dev/null 2>&1; then
              # Resume a partially completed release only if the final tag
              # proves exact source/version and the full ordered digest set.
              existing="$(docker buildx imagetools inspect --raw "$release_ref")"
              jq -e --arg sha "$source_sha" --arg version "$version" \
                --arg digests "$source_digests" \
                '.annotations["org.opencontainers.image.revision"] == $sha and
                 .annotations["org.opencontainers.image.version"] == $version and
                 .annotations["org.digitalhouses.source-digests"] == $digests' \
                <<<"$existing" >/dev/null || {
                  echo "Immutable final tag exists with mismatched provenance: $release_ref" >&2
                  exit 1
                }
              echo "Reusing verified final manifest $release_ref"
            else
              python scripts/registry_manifest.py "$release_ref" absent
              docker buildx imagetools create \
                --annotation "index:org.opencontainers.image.revision=$source_sha" \
                --annotation "index:org.opencontainers.image.version=$version" \
                --annotation "index:org.digitalhouses.source-digests=$source_digests" \
                --tag "$release_ref" \
                "${refs[@]}"
            fi

            digest="$(python scripts/registry_manifest.py "$release_ref" digest)"
            python scripts/registry_manifest.py "$release_ref" raw > final-manifest.json
            python scripts/release_source.py "$product" "$version" "$MERGE_SHA" "$source_sha" final "$source_digests" < final-manifest.json
            printf '%s\t%s\t%s\t%s\t%s\n' "$product" "$version" "$release_ref" "$digest" "$source_sha" >> app-release-artifacts.tsv
          done
      - name: Publish product releases
        env:
          GH_TOKEN: ${{ secrets.DH_RELEASE_TOKEN }}
          MERGE_SHA: ${{ needs.integrate.outputs.merge_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          count="$(jq 'length' release-candidates.json)"
          if [ "$count" -eq 0 ]; then
            echo "No product release required."
            exit 0
          fi

          : "${GH_TOKEN:?DH_RELEASE_TOKEN is required to publish releases}"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          for index in $(seq 0 $((count - 1))); do
            product="$(jq -r ".[$index].product" release-candidates.json)"
            version="$(jq -r ".[$index].version" release-candidates.json)"
            notes_file="$workdir/${product}-${version}.md"
            output_file="$workdir/${product}-${version}.out"

            python scripts/release_contract.py \
              --product "$product" \
              --version "$version" \
              --notes-file "$notes_file" \
              --github-output "$output_file"
            image_ref="$(awk -F '\t' -v product="$product" '$1 == product {print $3; exit}' app-release-artifacts.tsv)"
            image_digest="$(awk -F '\t' -v product="$product" '$1 == product {print $4; exit}' app-release-artifacts.tsv)"
            source_sha="$MERGE_SHA"
            if [ -n "$image_ref" ]; then
              test -n "$image_digest"
              source_sha="$(awk -F '\t' -v product="$product" '$1 == product {print $5; exit}' app-release-artifacts.tsv)"
              [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
              {
                echo
                echo "## Artifact provenance"
                echo
                echo "- Image: \`$image_ref\`"
                echo "- Image digest: \`$image_digest\`"
                echo "- Commit: \`$source_sha\`"
              } >> "$notes_file"
            fi

            tag="$(sed -n 's/^tag=//p' "$output_file")"
            title="$(sed -n 's/^title=//p' "$output_file")"
            prerelease="$(sed -n 's/^prerelease=//p' "$output_file")"

            test -n "$tag"
            test -n "$title"

            args=(
              release create "$tag"
              --repo "$GITHUB_REPOSITORY"
              --target "$source_sha"
              --title "$title"
              --notes-file "$notes_file"
            )

            if [ "$prerelease" = "true" ]; then
              args+=(--prerelease)
            fi

            gh "${args[@]}"
          done

      - name: Verify published releases
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ needs.integrate.outputs.merge_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          count="$(jq 'length' release-candidates.json)"
          if [ "$count" -eq 0 ]; then
            exit 0
          fi

          for index in $(seq 0 $((count - 1))); do
            product="$(jq -r ".[$index].product" release-candidates.json)"
            version="$(jq -r ".[$index].version" release-candidates.json)"
            tag="${product}-v${version}"

            git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
            actual="$(git rev-list -n 1 "$tag")"
            source_sha="$(awk -F '\t' -v product="$product" '$1 == product {print $5; exit}' app-release-artifacts.tsv)"
            test "$actual" = "${source_sha:-$MERGE_SHA}"

            gh release view "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isPrerelease
          done
