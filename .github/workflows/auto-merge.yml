name: Integrate validated owner PR

on:
  workflow_run:
    workflows:
      - Validate repository
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  integrate:
    name: Merge and release validated DigitalHouses PR
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest

    steps:
      - name: Validate exact PR revision and merge
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          VALIDATED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          VALIDATED_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"

          author="$(jq -r '.user.login' <<<"$pr_json")"
          state="$(jq -r '.state' <<<"$pr_json")"
          draft="$(jq -r '.draft' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          base_sha="$(jq -r '.base.sha' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"

          test "$author" = "DigitalHouses"
          test "$state" = "open"
          test "$draft" = "false"
          test "$base_ref" = "main"
          test "$head_repo" = "$GITHUB_REPOSITORY"
          test "$head_sha" = "$VALIDATED_HEAD_SHA"
          test "$base_sha" = "$VALIDATED_BASE_SHA"

          current_base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [ "$current_base_sha" != "$VALIDATED_BASE_SHA" ]; then
            echo "main advanced after this PR revision was validated; updating the PR branch and waiting for fresh validation"
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/update-branch" \
              -f "expected_head_sha=${head_sha}"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          merge_attempts=12
          merge_delay_seconds=5

          for attempt in $(seq 1 "$merge_attempts"); do
            if merge_output="$(gh pr merge "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --merge \
              --delete-branch \
              --match-head-commit "$VALIDATED_HEAD_SHA" 2>&1)"; then
              printf '%s\n' "$merge_output"
              break
            fi

            merge_rc=$?
            printf '%s\n' "$merge_output" >&2

            if ! grep -Fq "base branch policy prohibits the merge" <<<"$merge_output"; then
              exit "$merge_rc"
            fi

            if [ "$attempt" -ge "$merge_attempts" ]; then
              echo "Base branch policy still blocks the exact validated PR after $merge_attempts attempts." >&2
              exit "$merge_rc"
            fi

            retry_pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            test "$(jq -r '.state' <<<"$retry_pr_json")" = "open"
            test "$(jq -r '.draft' <<<"$retry_pr_json")" = "false"
            test "$(jq -r '.base.sha' <<<"$retry_pr_json")" = "$VALIDATED_BASE_SHA"
            test "$(jq -r '.head.sha' <<<"$retry_pr_json")" = "$VALIDATED_HEAD_SHA"

            echo "Base branch policy has not observed all completed checks yet; retrying merge in ${merge_delay_seconds}s (attempt ${attempt}/${merge_attempts})."
            sleep "$merge_delay_seconds"
          done

          merged_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          merged="$(jq -r '.merged' <<<"$merged_json")"
          merge_sha="$(jq -r '.merge_commit_sha' <<<"$merged_json")"

          test "$merged" = "true"
          test -n "$merge_sha"
          test "$merge_sha" != "null"

          release_base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${merge_sha}" --jq '.parents[0].sha')"
          test -n "$release_base_sha"
          test "$release_base_sha" != "null"

          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "release_base_sha=$release_base_sha" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact merged main revision
        if: steps.merge.outputs.merged == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.merge.outputs.merge_sha }}
          fetch-depth: 0

      - name: Set up Python
        if: steps.merge.outputs.merged == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up QEMU
        if: steps.merge.outputs.merged == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.merge.outputs.merged == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Recover orphaned Recorder App 0.1.9 release
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: digitalhouses_recorder_app
          VERSION: 0.1.9
          TARGET_SHA: 774dc82d6e50e052c42bb51394162b6b5f5f4adf
          TAG: digitalhouses_recorder_app-v0.1.9
          IMAGE: ghcr.io/digitalhouses/digitalhouses_recorder_app
        shell: bash
        run: |
          set -Eeuo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Recorder App 0.1.9 release already exists; recovery not required."
            exit 0
          fi

          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists without a GitHub release; refusing automatic recovery." >&2
            exit 1
          fi

          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

          inspect_with_retry() {
            local ref="$1"
            local attempts=12
            local delay_seconds=5
            local output=""
            local rc=0

            for attempt in $(seq 1 "$attempts"); do
              output=""
              rc=0
              output="$(docker buildx imagetools inspect "$ref" 2>&1)" || rc=$?
              if [ "$rc" -eq 0 ]; then
                printf '%s\n' "$output"
                return 0
              fi

              if [ "$attempt" -ge "$attempts" ]; then
                printf '%s\n' "$output" >&2
                echo "Unable to inspect immutable image $ref" >&2
                return 1
              fi

              echo "Immutable image $ref is not readable yet; retrying in ${delay_seconds}s."
              sleep "$delay_seconds"
            done
          }

          inspect_with_retry "$IMAGE:$VERSION-amd64" >/dev/null
          inspect_with_retry "$IMAGE:$VERSION-aarch64" >/dev/null
          release_output="$(inspect_with_retry "$IMAGE:$VERSION")"
          digest="$(awk '/^Digest:/ {print $2; exit}' <<<"$release_output")"

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unable to resolve immutable image digest for $IMAGE:$VERSION" >&2
            exit 1
          fi

          git cat-file -e "$TARGET_SHA^{commit}"

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          notes_file="$workdir/release.md"
          output_file="$workdir/release.out"

          python scripts/release_contract.py \
            --product "$PRODUCT" \
            --version "$VERSION" \
            --notes-file "$notes_file" \
            --github-output "$output_file"

          generated_tag="$(sed -n 's/^tag=//p' "$output_file")"
          title="$(sed -n 's/^title=//p' "$output_file")"
          prerelease="$(sed -n 's/^prerelease=//p' "$output_file")"

          test "$generated_tag" = "$TAG"
          test -n "$title"

          {
            echo
            echo "## Artifact provenance"
            echo
            echo "- Image: `$IMAGE:$VERSION`"
            echo "- Image digest: `$digest`"
            echo "- Commit: `$TARGET_SHA`"
          } >> "$notes_file"

          args=(
            release create "$TAG"
            --repo "$GITHUB_REPOSITORY"
            --target "$TARGET_SHA"
            --title "$title"
            --notes-file "$notes_file"
          )

          if [ "$prerelease" = "true" ]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"

          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force
          actual="$(git rev-list -n 1 "$TAG")"
          test "$actual" = "$TARGET_SHA"

          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease

      - name: Detect and validate releases
        if: steps.merge.outputs.merged == 'true'
        env:
          BASE_SHA: ${{ steps.merge.outputs.release_base_sha }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          python scripts/release_candidates.py \
            --base "$BASE_SHA" \
            --head "$MERGE_SHA" \
            --include-pending-existing \
            --validate \
            --json-output release-candidates.json

          cat release-candidates.json

      - name: Build and publish immutable Home Assistant App images
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          : > app-release-artifacts.tsv

          count="$(jq 'length' release-candidates.json)"
          if [ "$count" -eq 0 ]; then
            exit 0
          fi

          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

          for index in $(seq 0 $((count - 1))); do
            product="$(jq -r ".[${index}].product" release-candidates.json)"
            version="$(jq -r ".[${index}].version" release-candidates.json)"
            product_type="$(jq -r --arg product "$product" '.products[] | select(.id == $product) | .type' digitalhouses-stats/digitalhouses_stats/product_registry.json)"

            if [ "$product_type" != "app" ]; then
              continue
            fi

            config="$product/config.yaml"
            test -f "$config"

            mapfile -t architectures < <(
              awk '
                /^arch:[[:space:]]*$/ { in_arch=1; next }
                in_arch && /^[^[:space:]]/ { exit }
                in_arch && /^[[:space:]]*-[[:space:]]+/ {
                  value=$0
                  sub(/^[[:space:]]*-[[:space:]]+/, "", value)
                  sub(/[[:space:]]+#.*$/, "", value)
                  gsub(/[[:space:]]+$/, "", value)
                  print value
                }
              ' "$config"
            )

            if [ "${#architectures[@]}" -eq 0 ]; then
              echo "No architectures found for $product" >&2
              exit 1
            fi

            image="ghcr.io/digitalhouses/$product"
            release_ref="$image:$version"

            if docker buildx imagetools inspect "$release_ref" >/dev/null 2>&1; then
              echo "Refusing to overwrite existing immutable image: $release_ref" >&2
              exit 1
            fi

            refs=()
            for arch in "${architectures[@]}"; do
              case "$arch" in
                amd64)
                  platform="linux/amd64"
                  ;;
                aarch64)
                  platform="linux/arm64"
                  ;;
                *)
                  echo "Unsupported Home Assistant App architecture: $arch" >&2
                  exit 1
                  ;;
              esac

              arch_ref="$image:$version-$arch"
              if docker buildx imagetools inspect "$arch_ref" >/dev/null 2>&1; then
                echo "Refusing to overwrite existing immutable image: $arch_ref" >&2
                exit 1
              fi

              docker buildx build \
                --platform "$platform" \
                --build-arg "BUILD_VERSION=$version" \
                --build-arg "BUILD_ARCH=$arch" \
                --label "org.opencontainers.image.revision=$MERGE_SHA" \
                --label "org.opencontainers.image.version=$version" \
                --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
                --tag "$arch_ref" \
                --push \
                "$product"

              refs+=("$arch_ref")
            done

            docker buildx imagetools create \
              --tag "$release_ref" \
              "${refs[@]}"

            inspect_attempts=12
            inspect_delay_seconds=5
            digest=""

            for attempt in $(seq 1 "$inspect_attempts"); do
              inspect_output=""
              inspect_rc=0
              inspect_output="$(docker buildx imagetools inspect "$release_ref" 2>&1)" || inspect_rc=$?

              if [ "$inspect_rc" -eq 0 ]; then
                digest="$(awk '/^Digest:/ {print $2; exit}' <<<"$inspect_output")"
                if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  break
                fi
              fi

              if [ "$attempt" -ge "$inspect_attempts" ]; then
                printf '%s\n' "$inspect_output" >&2
                echo "Unable to resolve immutable image digest for $release_ref after $inspect_attempts attempts" >&2
                exit 1
              fi

              echo "Immutable image is not readable yet; retrying digest inspection in ${inspect_delay_seconds}s (attempt ${attempt}/${inspect_attempts})."
              sleep "$inspect_delay_seconds"
            done

            printf '%s\t%s\t%s\t%s\n' "$product" "$version" "$release_ref" "$digest" >> app-release-artifacts.tsv
          done
      - name: Publish product releases
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          count="$(jq 'length' release-candidates.json)"
          if [ "$count" -eq 0 ]; then
            echo "No product release required."
            exit 0
          fi

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          for index in $(seq 0 $((count - 1))); do
            product="$(jq -r ".[$index].product" release-candidates.json)"
            version="$(jq -r ".[$index].version" release-candidates.json)"
            notes_file="$workdir/${product}-${version}.md"
            output_file="$workdir/${product}-${version}.out"

            python scripts/release_contract.py \
              --product "$product" \
              --version "$version" \
              --notes-file "$notes_file" \
              --github-output "$output_file"
            image_ref="$(awk -F '\t' -v product="$product" '$1 == product {print $3; exit}' app-release-artifacts.tsv)"
            image_digest="$(awk -F '\t' -v product="$product" '$1 == product {print $4; exit}' app-release-artifacts.tsv)"
            if [ -n "$image_ref" ]; then
              test -n "$image_digest"
              {
                echo
                echo "## Artifact provenance"
                echo
                echo "- Image: \`$image_ref\`"
                echo "- Image digest: \`$image_digest\`"
                echo "- Commit: \`$MERGE_SHA\`"
              } >> "$notes_file"
            fi

            tag="$(sed -n 's/^tag=//p' "$output_file")"
            title="$(sed -n 's/^title=//p' "$output_file")"
            prerelease="$(sed -n 's/^prerelease=//p' "$output_file")"

            test -n "$tag"
            test -n "$title"

            args=(
              release create "$tag"
              --repo "$GITHUB_REPOSITORY"
              --target "$MERGE_SHA"
              --title "$title"
              --notes-file "$notes_file"
            )

            if [ "$prerelease" = "true" ]; then
              args+=(--prerelease)
            fi

            gh "${args[@]}"
          done

      - name: Verify published releases
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          count="$(jq 'length' release-candidates.json)"
          if [ "$count" -eq 0 ]; then
            exit 0
          fi

          for index in $(seq 0 $((count - 1))); do
            product="$(jq -r ".[$index].product" release-candidates.json)"
            version="$(jq -r ".[$index].version" release-candidates.json)"
            tag="${product}-v${version}"

            git fetch origin "refs/tags/${tag}:refs/tags/${tag}" --force
            actual="$(git rev-list -n 1 "$tag")"
            test "$actual" = "$MERGE_SHA"

            gh release view "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isPrerelease
          done
