name: Release product

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product to release
        required: true
        type: choice
        options:
          - digitalhouses_pve_agent
          - digitalhouses_plex_agent
          - digitalhouses_recorder_app
          - digitalhouses_speedtest_app
          - digitalhouses_internet_app
      version:
        description: Exact semantic version already committed on main
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release product
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install repository validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Verify exact main revision
        shell: bash
        run: |
          git fetch origin main --tags --force
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Validate repository
        run: python scripts/validate_repository.py

      - name: Validate release contract
        id: contract
        env:
          RELEASE_PRODUCT: ${{ inputs.product }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/release_contract.py \
            --product "$RELEASE_PRODUCT" \
            --version "$RELEASE_VERSION" \
            --notes-file release-notes.md \
            --github-output "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.contract.outputs.tag }}
          RELEASE_TITLE: ${{ steps.contract.outputs.title }}
          RELEASE_PRERELEASE: ${{ steps.contract.outputs.prerelease }}
        shell: bash
        run: |
          target="$(git rev-parse HEAD)"

          args=(
            release create "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --target "$target"
            --title "$RELEASE_TITLE"
            --notes-file release-notes.md
          )

          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.contract.outputs.tag }}
        shell: bash
        run: |
          expected="$(git rev-parse HEAD)"
          git fetch origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" \
            --force
          actual="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$actual" = "$expected"
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease
