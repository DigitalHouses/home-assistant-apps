name: Temporary native OCI release smoke

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Isolated smoke mode; never publishes production tags"
        type: choice
        required: true
        default: success
        options:
          - success
          - fail-arm
          - no-apps

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      has_apps: ${{ steps.matrix.outputs.has_apps }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve matrix without changing versions
        id: matrix
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -Eeuo pipefail
          if [ "$MODE" = no-apps ]; then
            printf '[{"product":"digitalhouses_pve_agent","version":"0.5.105"}]\n' > smoke-candidates.json
          else
            version="$(awk '$1 == "version:" {print $2;exit}' digitalhouses_system_globals_app/config.yaml)"
            jq -n --arg version "$version" '[{product:"digitalhouses_system_globals_app",version:$version}]' > smoke-candidates.json
          fi
          python3 scripts/release_build_matrix.py smoke-candidates.json >> "$GITHUB_OUTPUT"

  build-native:
    needs: prepare
    if: needs.prepare.outputs.has_apps == 'true'
    name: Native smoke ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build natively and record cache evidence
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          ARCH: ${{ matrix.arch }}
          PRODUCT: ${{ matrix.product }}
          VERSION: ${{ matrix.version }}
        run: |
          set -Eeuo pipefail
          case "$ARCH:$(uname -m)" in
            amd64:x86_64) platform=linux/amd64 ;;
            aarch64:aarch64) platform=linux/arm64 ;;
            *) echo "Architecture mismatch" >&2; exit 1 ;;
          esac
          if [ "$MODE" = fail-arm ] && [ "$ARCH" = aarch64 ]; then
            echo "EXPECTED ARM FAILURE"; exit 42
          fi
          image="ghcr.io/digitalhouses/dh-native-ci-smoke"
          ref="$image:smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          cache="$image:buildcache-$ARCH"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --progress=plain \
            --cache-from "type=registry,ref=$cache" \
            --cache-to "type=registry,ref=$cache,mode=max,ignore-error=true" \
            --platform "$platform" \
            --build-arg "BUILD_VERSION=$VERSION" \
            --build-arg "BUILD_ARCH=$ARCH" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "manifest:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "manifest:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --tag "$ref" --metadata-file metadata.json \
            --push "$PRODUCT" 2>&1 | tee build.log
          digest="$(jq -er '."containerimage.digest"' metadata.json)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Native %s (%s); digest %s; cached steps %s\n' "$ARCH" "$(uname -m)" "$digest" "$(grep -c ' CACHED' build.log || true)" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p image-digests
          printf '%s\n' "$digest" > "image-digests/$PRODUCT-$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-digest-${{ matrix.arch }}
          path: image-digests/
          if-no-files-found: error

  publish:
    needs: [prepare, build-native]
    if: inputs.mode == 'success' && needs.build-native.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: smoke-digest-*
          path: image-digests
          merge-multiple: true
      - name: Verify digest identities and publish isolated OCI index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          image="ghcr.io/digitalhouses/dh-native-ci-smoke"
          ref="$image:smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          refs=()
          digests=()
          for arch in amd64 aarch64; do
            digest="$(cat "image-digests/digitalhouses_system_globals_app-$arch")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            actual="$(python3 scripts/registry_manifest.py "$image:smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$arch" digest)"
            test "$digest" = "$actual"
            refs+=("$image@$digest")
            digests+=("$digest")
          done
          joined="$(IFS=,; echo "${digests[*]}")"
          python3 scripts/registry_manifest.py "$ref" absent
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.digitalhouses.source-digests=$joined" \
            --tag "$ref" "${refs[@]}"
          raw="$(python3 scripts/registry_manifest.py "$ref" raw)"
          jq -e --arg sha "$GITHUB_SHA" --arg digests "$joined" \
            '.annotations["org.opencontainers.image.revision"] == $sha and
             .annotations["org.digitalhouses.source-digests"] == $digests and
             ([.manifests[].platform.architecture] | index("amd64") != null and index("arm64") != null)' \
            <<<"$raw" >/dev/null
          echo "PASS isolated multi-architecture OCI manifest" >> "$GITHUB_STEP_SUMMARY"

  no-apps:
    needs: [prepare, build-native]
    if: always() && inputs.mode == 'no-apps'
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.prepare.outputs.has_apps }}" = false
          test "${{ needs.build-native.result }}" = skipped
          echo "PASS agent-only matrix skip" >> "$GITHUB_STEP_SUMMARY"

  verify-negative:
    needs: [build-native, publish]
    if: always() && inputs.mode == 'fail-arm'
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.build-native.result }}" = failure
          test "${{ needs.publish.result }}" = skipped
          echo "PASS failed ARM prevents publication" >> "$GITHUB_STEP_SUMMARY"
