name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Run validator unit tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Validate repository contract
        run: python scripts/validate_repository.py

  speedtest-app:
    name: Speedtest App
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile Python
        run: |
          python -m compileall -q \
            digitalhouses_speedtest/rootfs/app \
            digitalhouses_speedtest/tests

      - name: Run unit tests
        run: python -m unittest discover -s digitalhouses_speedtest/tests -v

      - name: Check shell syntax
        run: bash -n digitalhouses_speedtest/rootfs/run.sh

  internet-app:
    name: Internet App
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile Python
        run: |
          python -m compileall -q \
            dh_internet_app/rootfs/app \
            dh_internet_app/tests

      - name: Run unit tests
        run: python -m unittest discover -s dh_internet_app/tests -v

      - name: Check shell syntax
        run: bash -n dh_internet_app/rootfs/run.sh

      - name: Build Internet App image
        run: |
          APP_VERSION="$(awk '$1 == "version:" {print $2; exit}' dh_internet_app/config.yaml)"
          test -n "$APP_VERSION"
          docker build \
            --build-arg BUILD_VERSION="$APP_VERSION" \
            --build-arg BUILD_ARCH=amd64 \
            --tag digitalhouses-internet-ci:"$APP_VERSION" \
            dh_internet_app

  recorder-app:
    name: Recorder App
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile Python
        run: |
          python -m compileall -q \
            digitalhouses_db_monitoring/rootfs/app \
            digitalhouses_db_monitoring/tests

      - name: Run unit tests
        run: python -m unittest discover -s digitalhouses_db_monitoring/tests -v

      - name: Check shell syntax
        run: bash -n digitalhouses_db_monitoring/rootfs/run.sh

  backblaze-app:
    name: Backblaze App
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile Python
        run: |
          python -m compileall -q \
            digitalhouses_backblaze/rootfs/app \
            digitalhouses_backblaze/tests

      - name: Run unit tests
        run: python -m unittest discover -s digitalhouses_backblaze/tests -v

      - name: Check shell syntax
        run: bash -n digitalhouses_backblaze/rootfs/run.sh

  plex-agent:
    name: Plex Agent
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test and runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest \
            -r digitalhouses_plex_monitoring/requirements.txt

      - name: Compile Python
        run: |
          python -m compileall -q \
            digitalhouses_plex_monitoring/app \
            digitalhouses_plex_monitoring/tests

      - name: Run unit tests
        env:
          PYTHONPATH: digitalhouses_plex_monitoring
        run: python -m pytest digitalhouses_plex_monitoring/tests -q

      - name: Check installer syntax
        run: bash -n digitalhouses_plex_monitoring/install.sh

      - name: Prepare systemd verification path
        run: |
          sudo install -d \
            /opt/digitalhouses/digitalhouses_plex_monitoring/.venv/bin
          sudo ln -sf "$(command -v python)" \
            /opt/digitalhouses/digitalhouses_plex_monitoring/.venv/bin/python

      - name: Validate systemd unit
        run: |
          systemd-analyze verify \
            digitalhouses_plex_monitoring/systemd/*.service

  pve-agent:
    name: PVE Agent
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test and runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest \
            -r dh_pve_app/requirements.txt

      - name: Compile Python
        run: |
          python -m compileall -q \
            dh_pve_app/app \
            dh_pve_app/tests

      - name: Run unit tests
        env:
          PYTHONPATH: dh_pve_app
        run: python -m pytest dh_pve_app/tests -q

      - name: Check installer syntax
        run: |
          bash -n dh_pve_app/install.sh
          bash -n dh_pve_app/uninstall.sh
          bash -n dh_pve_app/hardware/beelink/install.sh
          bash -n dh_pve_app/hardware/beelink/uninstall.sh

      - name: Prepare systemd verification path
        run: |
          sudo install -d /opt/digitalhouses/dh_pve_app/.venv/bin
          sudo ln -sf "$(command -v python)" \
            /opt/digitalhouses/dh_pve_app/.venv/bin/python

      - name: Validate systemd unit
        run: systemd-analyze verify dh_pve_app/systemd/*.service


  stats-server:
    name: Stats Server
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: digitalhouses_stats
          POSTGRES_USER: digitalhouses_stats
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digitalhouses_stats -d digitalhouses_stats"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://digitalhouses_stats:test_password@127.0.0.1:5432/digitalhouses_stats

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Stats Server
        working-directory: digitalhouses-stats
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Compile Python
        run: |
          python -m compileall -q \
            digitalhouses-stats/digitalhouses_stats \
            digitalhouses-stats/tests \
            digitalhouses-stats/migrations

      - name: Apply database migration
        working-directory: digitalhouses-stats
        run: alembic upgrade head

      - name: Run tests
        working-directory: digitalhouses-stats
        run: python -m pytest tests -q
