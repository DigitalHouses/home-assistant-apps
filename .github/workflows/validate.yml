name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML paho-mqtt websocket-client Jinja2

      - name: Run validator unit tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Validate repository contract
        run: python scripts/validate_repository.py

  aqara-switch-app:
    name: Aqara Switch App
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile Aqara Switch App
        run: python -m compileall -q digitalhouses_aqara_switch_app/rootfs/app digitalhouses_aqara_switch_app/tests

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Run Aqara Switch App tests
        env:
          PYTHONPATH: digitalhouses_aqara_switch_app/rootfs/app
        run: python -m unittest discover -s digitalhouses_aqara_switch_app/tests -v

      - name: Check launcher
        run: bash -n digitalhouses_aqara_switch_app/rootfs/run.sh

      - name: Smoke build source-only scaffold
        run: docker build --build-arg BUILD_VERSION=0.1.0 --build-arg BUILD_ARCH=amd64 --tag aqara-switch-scaffold:0.1.0 digitalhouses_aqara_switch_app

  zigbee-monitor-app:
    name: Zigbee Monitor App
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML paho-mqtt

      - name: Compile Python
        run: |
          python -m compileall -q digitalhouses_zigbee_monitor_app/rootfs/app digitalhouses_zigbee_monitor_app/tests

      - name: Run unit tests
        env:
          PYTHONPATH: digitalhouses_zigbee_monitor_app/rootfs/app
        run: python -m unittest discover -s digitalhouses_zigbee_monitor_app/tests -v

      - name: Check App launcher syntax
        run: bash -n digitalhouses_zigbee_monitor_app/rootfs/run.sh

      - name: Build Zigbee Monitor App image
        run: |
          APP_VERSION="$(awk '$1 == "version:" {print $2; exit}' digitalhouses_zigbee_monitor_app/config.yaml)"
          test -n "$APP_VERSION"
          docker build --build-arg BUILD_VERSION="$APP_VERSION" --build-arg BUILD_ARCH=amd64 --tag digitalhouses-zigbee-monitor-ci:"$APP_VERSION" digitalhouses_zigbee_monitor_app

      - name: Smoke test installed Alpine MQTT client
        run: |
          APP_VERSION="$(awk '$1 == "version:" {print $2; exit}' digitalhouses_zigbee_monitor_app/config.yaml)"
          docker run --rm --entrypoint python3 "digitalhouses-zigbee-monitor-ci:$APP_VERSION" \
            -c 'import sys; sys.path.insert(0, "/app"); import paho.mqtt.client as mqtt; from zigbee_monitor.mqtt_compat import create_mqtt_client; c = create_mqtt_client(mqtt, client_id="dh-zigbee-image-smoke"); assert c is not None; print("HAOS container MQTT client OK")'

  speedtest-app:
    name: Speedtest App
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile Python
        run: |
          python -m compileall -q \
            digitalhouses_speedtest_app/rootfs/app \
            digitalhouses_speedtest_app/tests

      - name: Run unit tests
        run: python -m unittest discover -s digitalhouses_speedtest_app/tests -v

      - name: Check shell syntax
        run: bash -n digitalhouses_speedtest_app/rootfs/run.sh

  internet-app:
    name: Internet App
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile Python
        run: |
          python -m compileall -q \
            digitalhouses_internet_app/rootfs/app \
            digitalhouses_internet_app/tests

      - name: Run unit tests
        run: python -m unittest discover -s digitalhouses_internet_app/tests -v

      - name: Check shell syntax
        run: bash -n digitalhouses_internet_app/rootfs/run.sh

      - name: Build Internet App image
        run: |
          APP_VERSION="$(awk '$1 == "version:" {print $2; exit}' digitalhouses_internet_app/config.yaml)"
          test -n "$APP_VERSION"
          docker build \
            --build-arg BUILD_VERSION="$APP_VERSION" \
            --build-arg BUILD_ARCH=amd64 \
            --tag digitalhouses-internet-ci:"$APP_VERSION" \
            digitalhouses_internet_app

  presence-app:
    name: Presence App
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install runtime test dependencies
        run: python -m pip install --disable-pip-version-check paho-mqtt

      - name: Compile Python
        run: python -m compileall -q digitalhouses_presence_app/rootfs/app digitalhouses_presence_app/tests

      - name: Run unit tests
        env:
          PYTHONPATH: digitalhouses_presence_app/rootfs/app
        run: python -m unittest discover -s digitalhouses_presence_app/tests -v

      - name: Check shell syntax
        run: bash -n digitalhouses_presence_app/rootfs/run.sh

      - name: Build Presence App image
        run: |
          APP_VERSION="$(awk '$1 == "version:" {print $2; exit}' digitalhouses_presence_app/config.yaml)"
          test -n "$APP_VERSION"
          docker build --build-arg BUILD_VERSION="$APP_VERSION" --build-arg BUILD_ARCH=amd64 --tag digitalhouses-presence-ci:"$APP_VERSION" digitalhouses_presence_app

  recorder-app:
    name: Recorder App
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile Python
        run: |
          python -m compileall -q \
            digitalhouses_recorder_app/rootfs/app \
            digitalhouses_recorder_app/tests

      - name: Run unit tests
        run: python -m unittest discover -s digitalhouses_recorder_app/tests -v

      - name: Check shell syntax
        run: |
          bash -n digitalhouses_recorder_app/rootfs/run.sh
          bash -n digitalhouses_recorder_app/scripts/create_storage_ssh_user.sh

      - name: Build Recorder App image
        run: |
          APP_VERSION="$(awk '$1 == "version:" {print $2; exit}' digitalhouses_recorder_app/config.yaml)"
          test -n "$APP_VERSION"
          docker build \
            --build-arg BUILD_VERSION="$APP_VERSION" \
            --build-arg BUILD_ARCH=amd64 \
            --tag digitalhouses-recorder-ci:"$APP_VERSION" \
            digitalhouses_recorder_app

  backblaze-app:
    name: Backblaze App
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile Python
        run: |
          python -m compileall -q \
            digitalhouses_backblaze_app/rootfs/app \
            digitalhouses_backblaze_app/tests

      - name: Run unit tests
        run: python -m unittest discover -s digitalhouses_backblaze_app/tests -v

      - name: Check shell syntax
        run: bash -n digitalhouses_backblaze_app/rootfs/run.sh

      - name: Build Backblaze App image
        run: |
          APP_VERSION="$(awk '$1 == "version:" {print $2; exit}' digitalhouses_backblaze_app/config.yaml)"
          test -n "$APP_VERSION"
          docker build             --build-arg BUILD_VERSION="$APP_VERSION"             --build-arg BUILD_ARCH=amd64             --tag digitalhouses-backblaze-ci:"$APP_VERSION"             digitalhouses_backblaze_app

  plex-agent:
    name: Plex Agent
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test and runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest \
            -r digitalhouses_plex_agent/requirements.txt

      - name: Compile Python
        run: |
          python -m compileall -q \
            digitalhouses_plex_agent/app \
            digitalhouses_plex_agent/tests

      - name: Run unit tests
        env:
          PYTHONPATH: digitalhouses_plex_agent
        run: python -m pytest digitalhouses_plex_agent/tests -q

      - name: Check installer syntax
        run: bash -n digitalhouses_plex_agent/install.sh

      - name: Prepare systemd verification path
        run: |
          sudo install -d \
            /opt/digitalhouses/digitalhouses_plex_agent/.venv/bin
          sudo ln -sf "$(command -v python)" \
            /opt/digitalhouses/digitalhouses_plex_agent/.venv/bin/python
          sudo install -d /usr/local/libexec
          sudo install -m 0755 \
            digitalhouses_plex_agent/bin/digitalhouses-plex-agent-update-runner \
            /usr/local/libexec/digitalhouses-plex-agent-update-runner

      - name: Validate systemd unit and path watchers
        run: |
          python -m py_compile digitalhouses_plex_agent/bin/digitalhouses-plex-agent-update-runner
          systemd-analyze verify \
            digitalhouses_plex_agent/systemd/*.service \
            digitalhouses_plex_agent/systemd/*.path

  pve-agent:
    name: PVE Agent
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test and runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest \
            -r digitalhouses_pve_agent/requirements.txt

      - name: Compile Python
        run: |
          python -m compileall -q \
            digitalhouses_pve_agent/app \
            digitalhouses_pve_agent/tests

      - name: Run unit tests
        env:
          PYTHONPATH: digitalhouses_pve_agent
        run: python -m pytest digitalhouses_pve_agent/tests -q

      - name: Check installer syntax
        run: |
          bash -n digitalhouses_pve_agent/install.sh
          bash -n digitalhouses_pve_agent/uninstall.sh
          bash -n digitalhouses_pve_agent/hardware/beelink/install.sh
          bash -n digitalhouses_pve_agent/hardware/beelink/uninstall.sh

      - name: Prepare systemd verification path
        run: |
          sudo install -d /opt/digitalhouses/digitalhouses_pve_agent/.venv/bin
          sudo ln -sf "$(command -v python)" \
            /opt/digitalhouses/digitalhouses_pve_agent/.venv/bin/python
          sudo install -d /usr/local/libexec
          sudo install -m 0755 \
            digitalhouses_pve_agent/bin/digitalhouses-pve-agent-update-runner \
            /usr/local/libexec/digitalhouses-pve-agent-update-runner

      - name: Validate systemd unit
        run: systemd-analyze verify digitalhouses_pve_agent/systemd/*.service


  stats-server:
    name: Stats Server
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: digitalhouses_stats
          POSTGRES_USER: digitalhouses_stats
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digitalhouses_stats -d digitalhouses_stats"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://digitalhouses_stats:test_password@127.0.0.1:5432/digitalhouses_stats

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Stats Server
        working-directory: digitalhouses-stats
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Compile Python
        run: |
          python -m compileall -q \
            digitalhouses-stats/digitalhouses_stats \
            digitalhouses-stats/tests \
            digitalhouses-stats/migrations

      - name: Apply database migration
        working-directory: digitalhouses-stats
        run: alembic upgrade head

      - name: Run tests
        working-directory: digitalhouses-stats
        run: python -m pytest tests -q


  release-readiness:
    name: Release readiness
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate automatic release candidates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/release_candidates.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --validate
