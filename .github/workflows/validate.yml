name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Exact same-repository owner PR to revalidate"
        required: true
        type: string
      expected_head_sha:
        description: "Exact PR head SHA"
        required: true
        type: string
      expected_base_sha:
        description: "Current main SHA to validate against"
        required: true
        type: string

concurrency:
  group: validate-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  validation-scope:
    name: Validation scope
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.scope.outputs.jobs }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}
      - name: Validate dispatched PR identity and current main
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "${{ github.sha }}" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD_SHA"
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r .state <<<"$pr")" = open
          test "$(jq -r .draft <<<"$pr")" = false
          test "$(jq -r .user.login <<<"$pr")" = DigitalHouses
          test "$(jq -r .head.repo.full_name <<<"$pr")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .head.sha <<<"$pr")" = "$EXPECTED_HEAD_SHA"
          test "$(jq -r .base.ref <<<"$pr")" = main
          test "$(jq -r .base.sha <<<"$pr")" = "$EXPECTED_BASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_BASE_SHA"

      - name: Determine affected jobs
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.expected_base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_head_sha || github.sha }}
        run: python3 scripts/ci_scope.py

      - name: Record exact validation provenance
        if: github.event_name != 'push'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.expected_base_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          jq -n --argjson pr "$PR_NUMBER" --arg head "$HEAD_SHA" --arg base "$BASE_SHA" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{pr: $pr, head: $head, base: $base, run: $run, attempt: $attempt}' \
            > ci-provenance.json

      - name: Upload validated PR identity
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ci-provenance
          path: ci-provenance.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML paho-mqtt websocket-client Jinja2

      - name: Run validator unit tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Validate repository contract
        run: python scripts/validate_repository.py

  aqara-switch-app:
    name: Aqara Switch App
    needs: validation-scope
    if: ${{ contains(fromJSON(needs.validation-scope.outputs.jobs), 'aqara-switch-app') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile Aqara Switch App
        run: python -m compileall -q digitalhouses_aqara_switch_app/rootfs/app digitalhouses_aqara_switch_app/tests

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Run Aqara Switch App tests
        env:
          PYTHONPATH: digitalhouses_aqara_switch_app/rootfs/app
        run: python -m unittest discover -s digitalhouses_aqara_switch_app/tests -v

      - name: Check launcher
        run: bash -n digitalhouses_aqara_switch_app/rootfs/run.sh

      - name: Build installable Aqara Switch App image
        run: |
          APP_VERSION="$(awk '$1 == "version:" {print $2; exit}' digitalhouses_aqara_switch_app/config.yaml)"
          test -n "$APP_VERSION"
          docker build --build-arg BUILD_VERSION="$APP_VERSION" --build-arg BUILD_ARCH=amd64 --tag digitalhouses-aqara-switch-ci:"$APP_VERSION" digitalhouses_aqara_switch_app
          docker run --rm --entrypoint python3 digitalhouses-aqara-switch-ci:"$APP_VERSION" -c 'import sys; sys.path.insert(0, "/app"); from aqara_switch.runtime import Application; import paho.mqtt.client; print("Aqara App MQTT runtime OK")'

  zigbee-monitor-app:
    name: Zigbee Monitor App
    needs: validation-scope
    if: ${{ contains(fromJSON(needs.validation-scope.outputs.jobs), 'zigbee-monitor-app') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML paho-mqtt

      - name: Compile Python
        run: |
          python -m compileall -q digitalhouses_zigbee_monitor_app/rootfs/app digitalhouses_zigbee_monitor_app/tests

      - name: Run unit tests
        env:
          PYTHONPATH: digitalhouses_zigbee_monitor_app/rootfs/app
        run: python -m unittest discover -s digitalhouses_zigbee_monitor_app/tests -v

      - name: Check App launcher syntax
        run: bash -n digitalhouses_zigbee_monitor_app/rootfs/run.sh

      - name: Build Zigbee Monitor App image
        run: |
          APP_VERSION="$(awk '$1 == "version:" {print $2; exit}' digitalhouses_zigbee_monitor_app/config.yaml)"
          test -n "$APP_VERSION"
          docker build --build-arg BUILD_VERSION="$APP_VERSION" --build-arg BUILD_ARCH=amd64 --tag digitalhouses-zigbee-monitor-ci:"$APP_VERSION" digitalhouses_zigbee_monitor_app

      - name: Smoke test installed Alpine MQTT client
        run: |
          APP_VERSION="$(awk '$1 == "version:" {print $2; exit}' digitalhouses_zigbee_monitor_app/config.yaml)"
          docker run --rm --entrypoint python3 "digitalhouses-zigbee-monitor-ci:$APP_VERSION" \
            -c 'import sys; sys.path.insert(0, "/app"); import paho.mqtt.client as mqtt; from zigbee_monitor.mqtt_compat import create_mqtt_client; c = create_mqtt_client(mqtt, client_id="dh-zigbee-image-smoke"); assert c is not None; print("HAOS container MQTT client OK")'

  speedtest-app:
    name: Speedtest App
    needs: validation-scope
    if: ${{ contains(fromJSON(needs.validation-scope.outputs.jobs), 'speedtest-app') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile Python
        run: |
          python -m compileall -q \
            digitalhouses_speedtest_app/rootfs/app \
            digitalhouses_speedtest_app/tests

      - name: Run unit tests
        run: python -m unittest discover -s digitalhouses_speedtest_app/tests -v

      - name: Check shell syntax
        run: bash -n digitalhouses_speedtest_app/rootfs/run.sh

  network-app:
    name: Network App
    needs: validation-scope
    if: ${{ contains(fromJSON(needs.validation-scope.outputs.jobs), 'network-app') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"
      - name: Install monitoring YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Validate Python source
        run: python -m compileall -q digitalhouses_network_app/rootfs/app digitalhouses_network_app/tests
      - name: Run Python unit tests
        run: python -m unittest discover -s digitalhouses_network_app/tests -v
      - name: Run Go/SQLite unit tests
        working-directory: digitalhouses_network_app
        run: go test ./...
      - name: Test Ingress JavaScript table, sorting, resizing, and Presence
        run: node --test digitalhouses_network_app/tests/ui_sort.test.cjs digitalhouses_network_app/tests/ui_table.test.cjs digitalhouses_network_app/tests/ui_presence.test.cjs digitalhouses_network_app/tests/ui_export.test.cjs digitalhouses_network_app/tests/ui_presence_refresh.test.cjs
      - name: Check launcher
        run: bash -n digitalhouses_network_app/rootfs/run.sh
      - name: Build HAOS App image
        run: |
          APP_VERSION="$(awk '$1 == "version:" {print $2; exit}' digitalhouses_network_app/config.yaml)"
          test -n "$APP_VERSION"
          docker build --build-arg "BUILD_VERSION=$APP_VERSION" --build-arg BUILD_ARCH=amd64 --tag "digitalhouses-network-ci:$APP_VERSION" digitalhouses_network_app

  internet-app:
    name: Internet App
    needs: validation-scope
    if: ${{ contains(fromJSON(needs.validation-scope.outputs.jobs), 'internet-app') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile Python
        run: |
          python -m compileall -q \
            digitalhouses_internet_app/rootfs/app \
            digitalhouses_internet_app/tests

      - name: Run unit tests
        run: python -m unittest discover -s digitalhouses_internet_app/tests -v

      - name: Check shell syntax
        run: bash -n digitalhouses_internet_app/rootfs/run.sh

      - name: Build Internet App image
        run: |
          APP_VERSION="$(awk '$1 == "version:" {print $2; exit}' digitalhouses_internet_app/config.yaml)"
          test -n "$APP_VERSION"
          docker build \
            --build-arg BUILD_VERSION="$APP_VERSION" \
            --build-arg BUILD_ARCH=amd64 \
            --tag digitalhouses-internet-ci:"$APP_VERSION" \
            digitalhouses_internet_app

  presence-app:
    name: Presence App
    needs: validation-scope
    if: ${{ contains(fromJSON(needs.validation-scope.outputs.jobs), 'presence-app') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install runtime test dependencies
        run: python -m pip install --disable-pip-version-check paho-mqtt

      - name: Compile Python
        run: python -m compileall -q digitalhouses_presence_app/rootfs/app digitalhouses_presence_app/tests

      - name: Run unit tests
        env:
          PYTHONPATH: digitalhouses_presence_app/rootfs/app
        run: python -m unittest discover -s digitalhouses_presence_app/tests -v

      - name: Check shell syntax
        run: bash -n digitalhouses_presence_app/rootfs/run.sh

      - name: Build Presence App image
        run: |
          APP_VERSION="$(awk '$1 == "version:" {print $2; exit}' digitalhouses_presence_app/config.yaml)"
          test -n "$APP_VERSION"
          docker build --build-arg BUILD_VERSION="$APP_VERSION" --build-arg BUILD_ARCH=amd64 --tag digitalhouses-presence-ci:"$APP_VERSION" digitalhouses_presence_app

  recorder-app:
    name: Recorder App
    needs: validation-scope
    if: ${{ contains(fromJSON(needs.validation-scope.outputs.jobs), 'recorder-app') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile Python
        run: |
          python -m compileall -q \
            digitalhouses_recorder_app/rootfs/app \
            digitalhouses_recorder_app/tests

      - name: Run unit tests
        run: python -m unittest discover -s digitalhouses_recorder_app/tests -v

      - name: Check shell syntax
        run: |
          bash -n digitalhouses_recorder_app/rootfs/run.sh
          bash -n digitalhouses_recorder_app/scripts/create_storage_ssh_user.sh

      - name: Build Recorder App image
        run: |
          APP_VERSION="$(awk '$1 == "version:" {print $2; exit}' digitalhouses_recorder_app/config.yaml)"
          test -n "$APP_VERSION"
          docker build \
            --build-arg BUILD_VERSION="$APP_VERSION" \
            --build-arg BUILD_ARCH=amd64 \
            --tag digitalhouses-recorder-ci:"$APP_VERSION" \
            digitalhouses_recorder_app

  backblaze-app:
    name: Backblaze App
    needs: validation-scope
    if: ${{ contains(fromJSON(needs.validation-scope.outputs.jobs), 'backblaze-app') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile Python
        run: |
          python -m compileall -q \
            digitalhouses_backblaze_app/rootfs/app \
            digitalhouses_backblaze_app/tests

      - name: Run unit tests
        run: python -m unittest discover -s digitalhouses_backblaze_app/tests -v

      - name: Check shell syntax
        run: bash -n digitalhouses_backblaze_app/rootfs/run.sh

      - name: Build Backblaze App image
        run: |
          APP_VERSION="$(awk '$1 == "version:" {print $2; exit}' digitalhouses_backblaze_app/config.yaml)"
          test -n "$APP_VERSION"
          docker build             --build-arg BUILD_VERSION="$APP_VERSION"             --build-arg BUILD_ARCH=amd64             --tag digitalhouses-backblaze-ci:"$APP_VERSION"             digitalhouses_backblaze_app

  plex-agent:
    name: Plex Agent
    needs: validation-scope
    if: ${{ contains(fromJSON(needs.validation-scope.outputs.jobs), 'plex-agent') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: digitalhouses_plex_agent/requirements.txt

      - name: Install test and runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest \
            -r digitalhouses_plex_agent/requirements.txt

      - name: Compile Python
        run: |
          python -m compileall -q \
            digitalhouses_plex_agent/app \
            digitalhouses_plex_agent/tests

      - name: Run unit tests
        env:
          PYTHONPATH: digitalhouses_plex_agent
        run: python -m pytest digitalhouses_plex_agent/tests -q

      - name: Check installer syntax
        run: bash -n digitalhouses_plex_agent/install.sh

      - name: Prepare systemd verification path
        run: |
          sudo install -d \
            /opt/digitalhouses/digitalhouses_plex_agent/.venv/bin
          sudo ln -sf "$(command -v python)" \
            /opt/digitalhouses/digitalhouses_plex_agent/.venv/bin/python
          sudo install -d /usr/local/libexec
          sudo install -m 0755 \
            digitalhouses_plex_agent/bin/digitalhouses-plex-agent-update-runner \
            /usr/local/libexec/digitalhouses-plex-agent-update-runner

      - name: Validate systemd unit and path watchers
        run: |
          python -m py_compile digitalhouses_plex_agent/bin/digitalhouses-plex-agent-update-runner
          systemd-analyze verify \
            digitalhouses_plex_agent/systemd/*.service \
            digitalhouses_plex_agent/systemd/*.path

  pbs-agent:
    name: PBS Agent
    needs: validation-scope
    if: ${{ contains(fromJSON(needs.validation-scope.outputs.jobs), 'pbs-agent') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: digitalhouses_pbs_agent/requirements.txt
      - name: Install PBS Agent dependencies
        run: python -m pip install --disable-pip-version-check -r digitalhouses_pbs_agent/requirements.txt
      - name: Compile source
        run: python -m compileall -q digitalhouses_pbs_agent/app digitalhouses_pbs_agent/tests
      - name: Run product tests
        env:
          PYTHONPATH: digitalhouses_pbs_agent
        run: python -m unittest discover -s digitalhouses_pbs_agent/tests -v
      - name: Verify release installer shell syntax
        run: bash -n digitalhouses_pbs_agent/install.sh
      - name: Prepare installed service binary path
        run: |
          sudo install -d /opt/digitalhouses/digitalhouses_pbs_agent/.venv/bin
          sudo ln -sf "$(command -v python)" /opt/digitalhouses/digitalhouses_pbs_agent/.venv/bin/python
      - name: Validate native systemd service
        run: systemd-analyze verify digitalhouses_pbs_agent/systemd/*.service

  pve-agent:
    name: PVE Agent
    needs: validation-scope
    if: ${{ contains(fromJSON(needs.validation-scope.outputs.jobs), 'pve-agent') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: digitalhouses_pve_agent/requirements.txt

      - name: Install test and runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest \
            -r digitalhouses_pve_agent/requirements.txt

      - name: Compile Python
        run: |
          python -m compileall -q \
            digitalhouses_pve_agent/app \
            digitalhouses_pve_agent/tests

      - name: Run unit tests
        env:
          PYTHONPATH: digitalhouses_pve_agent
        run: python -m pytest digitalhouses_pve_agent/tests -q

      - name: Check installer syntax
        run: |
          bash -n digitalhouses_pve_agent/install.sh
          bash -n digitalhouses_pve_agent/uninstall.sh
          bash -n digitalhouses_pve_agent/hardware/beelink/install.sh
          bash -n digitalhouses_pve_agent/hardware/beelink/uninstall.sh

      - name: Prepare systemd verification path
        run: |
          sudo install -d /opt/digitalhouses/digitalhouses_pve_agent/.venv/bin
          sudo ln -sf "$(command -v python)" \
            /opt/digitalhouses/digitalhouses_pve_agent/.venv/bin/python
          sudo install -d /usr/local/libexec
          sudo install -m 0755 \
            digitalhouses_pve_agent/bin/digitalhouses-pve-agent-update-runner \
            /usr/local/libexec/digitalhouses-pve-agent-update-runner

      - name: Validate systemd unit
        run: systemd-analyze verify digitalhouses_pve_agent/systemd/*.service


  sync-app:
    name: DH Sync App
    needs: validation-scope
    if: ${{ contains(fromJSON(needs.validation-scope.outputs.jobs), 'sync-app') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m compileall -q digitalhouses_sync_app/rootfs/app digitalhouses_sync_app/tests
      - name: Install test dependency
        run: python -m pip install PyYAML paho-mqtt
      - name: Test MQTT catalog and future YAML transaction engine
        env:
          PYTHONPATH: digitalhouses_sync_app/rootfs/app
        run: python -m unittest discover -s digitalhouses_sync_app/tests -v
      - name: Validate pinned real PVE/Plex YAML source contracts
        env:
          PYTHONPATH: digitalhouses_sync_app/rootfs/app
        run: |
          python - <<'PY'
          from sync_engine import RESOURCES, _source, _validate_source
          for resource in RESOURCES:
              data = _source(resource)
              view = _validate_source(resource, data)
              print(resource.target, resource.sha[:12], len(data), view["path"])
          PY
      - name: Check launcher
        run: bash -n digitalhouses_sync_app/rootfs/run.sh
      - name: Build HAOS App preview
        run: |
          APP_VERSION="$(awk '$1 == "version:" {gsub(/"/,"",$2);print $2;exit}' digitalhouses_sync_app/config.yaml)"
          docker build --build-arg BUILD_VERSION="$APP_VERSION" --build-arg BUILD_ARCH=amd64 --tag dh-sync-preview:"$APP_VERSION" digitalhouses_sync_app
      - name: Smoke-test Alpine Paho compatibility in built HAOS image
        run: |
          APP_VERSION="$(awk '$1 == "version:" {gsub(/"/,"",$2);print $2;exit}' digitalhouses_sync_app/config.yaml)"
          docker run --rm --entrypoint python3 "dh-sync-preview:$APP_VERSION" -c 'import sys; sys.path.insert(0, "/app"); from app import create_mqtt_client, on_connect; from resource_preview import PreviewCatalog; from local_audit import LocalAuditor; c = create_mqtt_client(); assert c is not None; assert PreviewCatalog(); assert LocalAuditor(); print("HAOS MQTT + preview + local audit imports OK")'

  system-globals-app:
    name: System Globals App
    needs: validation-scope
    if: ${{ contains(fromJSON(needs.validation-scope.outputs.jobs), 'system-globals-app') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: digitalhouses_system_globals_app/requirements.txt
      - name: Install isolated test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r digitalhouses_system_globals_app/requirements.txt PyYAML
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mosquitto
      - name: Compile Python and check launcher
        run: |
          python -m compileall -q digitalhouses_system_globals_app/rootfs/app digitalhouses_system_globals_app/tests
          bash -n digitalhouses_system_globals_app/rootfs/run.sh
      - name: Test autonomous runtime and readiness on real isolated MQTT broker
        env:
          PYTHONPATH: digitalhouses_system_globals_app/rootfs/app
          DH_TEST_MOSQUITTO: /usr/sbin/mosquitto
        run: python -m unittest discover -s digitalhouses_system_globals_app/tests -v
      - name: Build and smoke-test HAOS image
        run: |
          APP_VERSION="$(awk '$1 == "version:" {print $2;exit}' digitalhouses_system_globals_app/config.yaml)"
          docker build --build-arg BUILD_VERSION="$APP_VERSION" --build-arg BUILD_ARCH=amd64 --tag "dh-system-globals-ci:$APP_VERSION" digitalhouses_system_globals_app
          docker run --rm --entrypoint python3 "dh-system-globals-ci:$APP_VERSION" -c 'import sys; sys.path.insert(0, "/app"); from runtime import Session; from service import Service; from discovery import discovery; assert Session("127.0.0.1",1883,None,None); assert discovery("0.1.0")'

  stats-server:
    name: Stats Server
    needs: validation-scope
    if: ${{ contains(fromJSON(needs.validation-scope.outputs.jobs), 'stats-server') }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: digitalhouses_stats
          POSTGRES_USER: digitalhouses_stats
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digitalhouses_stats -d digitalhouses_stats"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://digitalhouses_stats:test_password@127.0.0.1:5432/digitalhouses_stats

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: digitalhouses-stats/pyproject.toml

      - name: Install Stats Server
        working-directory: digitalhouses-stats
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Compile Python
        run: |
          python -m compileall -q \
            digitalhouses-stats/digitalhouses_stats \
            digitalhouses-stats/tests \
            digitalhouses-stats/migrations

      - name: Apply database migration
        working-directory: digitalhouses-stats
        run: alembic upgrade head

      - name: Run tests
        working-directory: digitalhouses-stats
        run: python -m pytest tests -q


  release-readiness:
    name: Release readiness
    if: github.event_name != 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate automatic release candidates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.expected_base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/release_candidates.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --validate
