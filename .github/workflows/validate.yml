name: Validate repository

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Run validator unit tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Validate repository contract
        run: python scripts/validate_repository.py

  speedtest:
    name: Speedtest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile Python
        run: |
          python -m compileall -q \
            digitalhouses_speedtest/rootfs/app \
            digitalhouses_speedtest/tests

      - name: Run unit tests
        run: python -m unittest discover -s digitalhouses_speedtest/tests -v

      - name: Check shell syntax
        run: bash -n digitalhouses_speedtest/rootfs/run.sh

  db-monitoring:
    name: DB Monitoring
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile Python
        run: |
          python -m compileall -q \
            digitalhouses_db_monitoring/rootfs/app \
            digitalhouses_db_monitoring/tests

      - name: Run unit tests
        run: python -m unittest discover -s digitalhouses_db_monitoring/tests -v

      - name: Check shell syntax
        run: bash -n digitalhouses_db_monitoring/rootfs/run.sh

  plex-monitoring:
    name: Plex Monitoring
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r digitalhouses_plex_monitoring/requirements.txt

      - name: Compile Python
        run: |
          python -m compileall -q \
            digitalhouses_plex_monitoring/app \
            digitalhouses_plex_monitoring/tests

      - name: Run unit tests
        run: python -m unittest discover -s digitalhouses_plex_monitoring/tests -v

      - name: Check installer syntax
        run: bash -n digitalhouses_plex_monitoring/install.sh

      - name: Prepare systemd verification path
        run: |
          sudo install -d \
            /opt/digitalhouses/digitalhouses_plex_monitoring/.venv/bin
          sudo ln -sf "$(command -v python)" \
            /opt/digitalhouses/digitalhouses_plex_monitoring/.venv/bin/python

      - name: Validate systemd unit
        run: |
          systemd-analyze verify \
            digitalhouses_plex_monitoring/systemd/*.service

  dh-pve-app:
    name: DH PVE App
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test and runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest \
            -r dh_pve_app/requirements.txt

      - name: Compile Python
        run: |
          python -m compileall -q \
            dh_pve_app/app \
            dh_pve_app/tests

      - name: Run unit tests
        run: python -m pytest dh_pve_app/tests -q

      - name: Check installer syntax
        run: bash -n dh_pve_app/install.sh

      - name: Prepare systemd verification path
        run: |
          sudo install -d /opt/digitalhouses/dh_pve_app/.venv/bin
          sudo ln -sf "$(command -v python)" \
            /opt/digitalhouses/dh_pve_app/.venv/bin/python

      - name: Validate systemd unit
        run: systemd-analyze verify dh_pve_app/systemd/*.service
