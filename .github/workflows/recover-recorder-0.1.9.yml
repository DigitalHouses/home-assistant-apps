name: Recover Recorder App 0.1.9 release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: read

jobs:
  recover:
    name: Recover Recorder App 0.1.9 release
    runs-on: ubuntu-latest
    env:
      PRODUCT: digitalhouses_recorder_app
      VERSION: 0.1.9
      TARGET_SHA: 774dc82d6e50e052c42bb51394162b6b5f5f4adf
      TAG: digitalhouses_recorder_app-v0.1.9
      IMAGE: ghcr.io/digitalhouses/digitalhouses_recorder_app

    steps:
      - name: Check whether recovery is required
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Recorder App 0.1.9 release already exists; recovery is not required."
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists without a GitHub release; refusing automatic recovery." >&2
            exit 1
          fi

          echo "required=true" >> "$GITHUB_OUTPUT"

      - name: Check out original Recorder 0.1.9 merge
        if: steps.guard.outputs.required == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Set up Python
        if: steps.guard.outputs.required == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Docker Buildx
        if: steps.guard.outputs.required == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Verify immutable image and publish missing release
        if: steps.guard.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          release_ref="$IMAGE:$VERSION"
          amd64_ref="$IMAGE:$VERSION-amd64"
          aarch64_ref="$IMAGE:$VERSION-aarch64"

          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

          inspect_with_retry() {
            local ref="$1"
            local attempts=12
            local delay_seconds=5
            local output=""
            local rc=0

            for attempt in $(seq 1 "$attempts"); do
              output=""
              rc=0
              output="$(docker buildx imagetools inspect "$ref" 2>&1)" || rc=$?
              if [ "$rc" -eq 0 ]; then
                printf '%s\n' "$output"
                return 0
              fi

              if [ "$attempt" -ge "$attempts" ]; then
                printf '%s\n' "$output" >&2
                echo "Unable to inspect immutable image $ref" >&2
                return 1
              fi

              sleep "$delay_seconds"
            done
          }

          inspect_with_retry "$amd64_ref" >/dev/null
          inspect_with_retry "$aarch64_ref" >/dev/null
          release_output="$(inspect_with_retry "$release_ref")"
          digest="$(awk '/^Digest:/ {print $2; exit}' <<<"$release_output")"

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unable to resolve immutable image digest for $release_ref" >&2
            exit 1
          fi

          actual_target="$(git rev-parse "$TARGET_SHA^{commit}")"
          test "$actual_target" = "$TARGET_SHA"

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          notes_file="$workdir/release.md"
          output_file="$workdir/release.out"

          python scripts/release_contract.py \
            --product "$PRODUCT" \
            --version "$VERSION" \
            --notes-file "$notes_file" \
            --github-output "$output_file"

          generated_tag="$(sed -n 's/^tag=//p' "$output_file")"
          title="$(sed -n 's/^title=//p' "$output_file")"
          prerelease="$(sed -n 's/^prerelease=//p' "$output_file")"

          test "$generated_tag" = "$TAG"
          test -n "$title"

          {
            echo
            echo "## Artifact provenance"
            echo
            echo "- Image: $release_ref"
            echo "- Image digest: $digest"
            echo "- Commit: $TARGET_SHA"
          } >> "$notes_file"

          args=(
            release create "$TAG"
            --repo "$GITHUB_REPOSITORY"
            --target "$TARGET_SHA"
            --title "$title"
            --notes-file "$notes_file"
          )

          if [ "$prerelease" = "true" ]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"

          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force
          actual="$(git rev-list -n 1 "$TAG")"
          test "$actual" = "$TARGET_SHA"

          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease
