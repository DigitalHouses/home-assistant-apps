name: Recover Recorder App 0.1.9 release v2

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: read

jobs:
  recover:
    name: Recover Recorder App 0.1.9
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify image and publish missing tag/release
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: digitalhouses_recorder_app
          VERSION: 0.1.9
          TARGET_SHA: 774dc82d6e50e052c42bb51394162b6b5f5f4adf
          TAG: digitalhouses_recorder_app-v0.1.9
          IMAGE: ghcr.io/digitalhouses/digitalhouses_recorder_app
          EXPECTED_DIGEST: sha256:6f5c5a2d464d148aa0839f4d043e35ec4c44bdd379b8a9a077ca03b548fdc53f
        shell: bash
        run: |
          set -Eeuo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Recorder App 0.1.9 release already exists; recovery complete."
            exit 0
          fi

          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

          inspect_with_retry() {
            local ref="$1"
            local attempts=12
            local delay_seconds=5
            local output=""
            local rc=0

            for attempt in $(seq 1 "$attempts"); do
              output=""
              rc=0
              output="$(docker buildx imagetools inspect "$ref" 2>&1)" || rc=$?
              if [ "$rc" -eq 0 ]; then
                printf '%s\n' "$output"
                return 0
              fi

              if [ "$attempt" -ge "$attempts" ]; then
                printf '%s\n' "$output" >&2
                echo "Unable to inspect immutable image $ref" >&2
                return 1
              fi

              echo "Immutable image $ref is not readable yet; retrying in ${delay_seconds}s."
              sleep "$delay_seconds"
            done
          }

          inspect_with_retry "$IMAGE:$VERSION-amd64" >/dev/null
          inspect_with_retry "$IMAGE:$VERSION-aarch64" >/dev/null
          release_output="$(inspect_with_retry "$IMAGE:$VERSION")"
          digest="$(awk '/^Digest:/ {print $2; exit}' <<<"$release_output")"

          test "$digest" = "$EXPECTED_DIGEST"
          git cat-file -e "$TARGET_SHA^{commit}"

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          notes_file="$workdir/release.md"
          output_file="$workdir/release.out"

          python scripts/release_contract.py \
            --product "$PRODUCT" \
            --version "$VERSION" \
            --notes-file "$notes_file" \
            --github-output "$output_file"

          generated_tag="$(sed -n 's/^tag=//p' "$output_file")"
          title="$(sed -n 's/^title=//p' "$output_file")"
          prerelease="$(sed -n 's/^prerelease=//p' "$output_file")"

          test "$generated_tag" = "$TAG"
          test -n "$title"
          test "$prerelease" = "false"

          {
            echo
            echo "## Artifact provenance"
            echo
            printf -- '- Image: `%s`\n' "$IMAGE:$VERSION"
            printf -- '- Image digest: `%s`\n' "$digest"
            printf -- '- Commit: `%s`\n' "$TARGET_SHA"
          } >> "$notes_file"

          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" \
              -f "sha=$TARGET_SHA" >/dev/null
          fi

          actual_tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$actual_tag_sha" = "$TARGET_SHA"

          payload="$workdir/release.json"
          jq -n \
            --arg tag "$TAG" \
            --arg target "$TARGET_SHA" \
            --arg title "$title" \
            --rawfile body "$notes_file" \
            '{
              tag_name: $tag,
              target_commitish: $target,
              name: $title,
              body: $body,
              draft: false,
              prerelease: false
            }' > "$payload"

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/releases" \
            --input "$payload" >/dev/null

          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,targetCommitish
