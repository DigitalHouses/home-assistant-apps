title: DH Recorder
path: recorder
icon: mdi:database
type: sections
max_columns: 4
sections:
  - type: grid
    cards:
      - type: heading
        heading: Состояние базы данных
        heading_style: title
        icon: mdi:database-check
      - type: vertical-stack
        cards:
          - type: custom:button-card
            entity: sensor.dh_recorder_app_card
            triggers_update:
              - sensor.dh_recorder_app_card
              - sensor.dh_recorder_app_version
              - sensor.dh_recorder_app_latest_version
              - binary_sensor.dh_recorder_app_update_available
              - binary_sensor.dh_recorder_app_db_connected
              - binary_sensor.dh_recorder_app_recorder_writing
              - sensor.dh_recorder_app_db_disk_used_percentage
              - number.dh_recorder_app_db_disk_usage_threshold
              - update.digitalhouses_recorder_app_update
            update_timer: |
              [[[
                const s = states['sensor.dh_recorder_app_card']?.state;
                const updating =
                  states['update.digitalhouses_recorder_app_update']?.attributes?.in_progress === true;
                return s === 'running' || updating ? 1000 : 5000;
              ]]]
            show_icon: true
            show_name: true
            show_label: true
            icon: |
              [[[
                const s = states['sensor.dh_recorder_app_card']?.state;
                const db = states['binary_sensor.dh_recorder_app_db_connected']?.state;
                const writing = states['binary_sensor.dh_recorder_app_recorder_writing']?.state;
                const used = Number(states['sensor.dh_recorder_app_db_disk_used_percentage']?.state);
                const threshold = Number(states['number.dh_recorder_app_db_disk_usage_threshold']?.state);
                const storageHigh =
                  Number.isFinite(used) && Number.isFinite(threshold) && used >= threshold;
                const upgrade =
                  states['binary_sensor.dh_recorder_app_update_available']?.state === 'on';
                const updating =
                  states['update.digitalhouses_recorder_app_update']?.attributes?.in_progress === true;
        
                if (updating || s === 'running') return 'mdi:progress-clock';
                if (s === 'error') return 'mdi:alert-circle';
                if (s === 'success') return 'mdi:check-circle';
                if (db === 'off') return 'mdi:database-off';
                if (writing === 'off') return 'mdi:database-alert';
                if (storageHigh) return 'mdi:harddisk-alert';
                if (upgrade) return 'mdi:package-up';
                return 'mdi:database';
              ]]]
            name: |
              [[[
                const installed = states['sensor.dh_recorder_app_version']?.state;
                const latest = states['sensor.dh_recorder_app_latest_version']?.state;
                const available =
                  states['binary_sensor.dh_recorder_app_update_available']?.state === 'on';
                const valid = (v) =>
                  typeof v === 'string'
                  && !['unknown', 'unavailable', 'none', ''].includes(v);
                const upgrade =
                  available && valid(installed) && valid(latest) && latest !== installed;
        
                return 'Recorder App' + (valid(installed)
                  ? ' · v' + installed + (upgrade ? ' → v' + latest : '')
                  : '');
              ]]]
            label: |
              [[[
                const item = states['sensor.dh_recorder_app_card'];
                const db = states['binary_sensor.dh_recorder_app_db_connected']?.state;
                const writing = states['binary_sensor.dh_recorder_app_recorder_writing']?.state;
                const used = Number(states['sensor.dh_recorder_app_db_disk_used_percentage']?.state);
                const threshold = Number(states['number.dh_recorder_app_db_disk_usage_threshold']?.state);
                const storageHigh =
                  Number.isFinite(used) && Number.isFinite(threshold) && used >= threshold;
                const supervisorUpdate = states['update.digitalhouses_recorder_app_update'];
        
                const elapsedText = (since) => {
                  const seconds = Math.max(
                    0,
                    Math.floor((performance.now() - since) / 1000)
                  );
                  const mm = String(Math.floor(seconds / 60)).padStart(2, '0');
                  const ss = String(seconds % 60).padStart(2, '0');
                  return mm + ':' + ss;
                };
                const duration = (value) => {
                  if (typeof value !== 'number') return '—';
                  const seconds = Math.round(Math.max(0, value));
                  const minutes = Math.floor(seconds / 60);
                  return minutes
                    ? minutes + ' мин ' + String(seconds % 60).padStart(2, '0') + ' сек'
                    : seconds + ' сек';
                };
        
                if (supervisorUpdate?.attributes?.in_progress === true) {
                  if (this._dh_recorder_timer?.operation !== 'install') {
                    this._dh_recorder_timer = {
                      operation: 'install',
                      since: performance.now()
                    };
                  }
                  const pct = supervisorUpdate.attributes.update_percentage;
                  return 'Установка версии… '
                    + (typeof pct === 'number' ? Math.round(pct) + '% · ' : '')
                    + elapsedText(this._dh_recorder_timer.since);
                }
        
                if (!item || ['unknown', 'unavailable'].includes(item.state)) {
                  return 'Нет связи с приложением';
                }
        
                const a = item.attributes || {};
                const operation = a.operation;
                const names = {
                  refresh: 'Обновление данных',
                  check: 'Проверка версии'
                };
        
                if (item.state === 'running') {
                  const key = String(operation) + '|' + String(a.started_at || '');
                  if (this._dh_recorder_timer?.key !== key) {
                    this._dh_recorder_timer = {
                      key: key,
                      operation: operation,
                      since: performance.now()
                    };
                  }
                  return (names[operation] || 'Операция') + '… '
                    + elapsedText(this._dh_recorder_timer.since);
                }
        
                this._dh_recorder_timer = null;
        
                if (item.state === 'error') {
                  return 'Ошибка: ' + (a.error || 'операция не выполнена');
                }
        
                if (item.state === 'success') {
                  let message = operation === 'refresh'
                    ? 'Данные обновлены'
                    : operation === 'check'
                      ? (
                          states['binary_sensor.dh_recorder_app_update_available']?.state === 'on'
                            ? 'Доступна новая версия'
                            : states['binary_sensor.dh_recorder_app_update_available']?.state === 'off'
                              ? 'Версия актуальна'
                              : 'Проверка завершена'
                        )
                      : 'Готово';
                  return message + ' · ' + duration(a.duration_seconds);
                }
        
                if (states['binary_sensor.dh_recorder_app_update_available']?.state === 'on') {
                  return 'Доступна новая версия';
                }
                if (db === 'off') return 'База данных недоступна';
                if (writing === 'off') return 'Recorder не записывает данные';
                if (storageHigh) {
                  return 'Заполнение диска: ' + used.toFixed(1) + '%';
                }
                if (db === 'on' && writing === 'on') return 'Recorder работает штатно';
                return 'Ожидание данных';
              ]]]
            styles:
              card:
                - padding: 12px
                - text-align: left
              grid:
                - grid-template-areas: '"i n" "i l"'
                - grid-template-columns: 48px 1fr
                - grid-template-rows: min-content min-content
              img_cell:
                - width: 40px
                - justify-content: start
              icon:
                - width: 26px
                - color: |
                    [[[
                      const s = states['sensor.dh_recorder_app_card']?.state;
                      const db = states['binary_sensor.dh_recorder_app_db_connected']?.state;
                      const writing = states['binary_sensor.dh_recorder_app_recorder_writing']?.state;
                      const used = Number(states['sensor.dh_recorder_app_db_disk_used_percentage']?.state);
                      const threshold = Number(states['number.dh_recorder_app_db_disk_usage_threshold']?.state);
                      const storageHigh =
                        Number.isFinite(used) && Number.isFinite(threshold) && used >= threshold;
                      const upgrade =
                        states['binary_sensor.dh_recorder_app_update_available']?.state === 'on';
                      const updating =
                        states['update.digitalhouses_recorder_app_update']?.attributes?.in_progress === true;
        
                      return s === 'error' || db === 'off'
                        ? 'var(--error-color)'
                        : s === 'running' || updating
                          ? 'var(--info-color, var(--primary-color))'
                          : s === 'success'
                            ? 'var(--success-color, var(--primary-color))'
                            : writing === 'off' || storageHigh || upgrade
                              ? 'var(--warning-color, orange)'
                              : db === 'on' && writing === 'on'
                                ? 'var(--success-color, var(--primary-color))'
                                : 'var(--secondary-text-color)';
                    ]]]
              name:
                - justify-self: start
                - font-size: 14px
                - font-weight: 600
              label:
                - justify-self: start
                - white-space: normal
                - text-align: left
                - font-size: 13px
                - color: var(--secondary-text-color)
            tap_action:
              action: none
        
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:refresh
                content: Обновить
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.dh_recorder_app_db_refresh
        
              - type: template
                icon: mdi:cloud-search
                content: Версия
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.dh_recorder_app_check_updates
        
              - type: conditional
                conditions:
                  - entity: update.digitalhouses_recorder_app_update
                    state: "on"
                chip:
                  type: template
                  icon: mdi:package-down
                  icon_color: orange
                  content: Новая версия
                  tap_action:
                    action: perform-action
                    perform_action: update.install
                    target:
                      entity_id: update.digitalhouses_recorder_app_update
                    data:
                      backup: true
                    confirmation:
                      text: >-
                        Установить новую версию Recorder App?
                        Перед обновлением Home Assistant создаст резервную копию App.
                        Мониторинг Recorder временно прервется.
        
              - type: template
                icon: mdi:restart
                content: Перезапуск
                tap_action:
                  action: perform-action
                  perform_action: hassio.app_restart
                  data:
                    app: 8133339d_digitalhouses_recorder_app
                  confirmation:
                    text: >-
                      Перезапустить Recorder App?
                      Мониторинг Recorder временно прервется.
        grid_options:
          columns: 12
      - type: heading
        heading: Информация
        heading_style: subtitle
        icon: mdi:information
      - type: custom:mushroom-template-card
        entity: sensor.dh_recorder_app_db_version
        primary: '{{ states(''sensor.dh_recorder_app_db_version'') }}'
        secondary: >-
          БД: {{ states('sensor.dh_recorder_app_db_name') }} {{ '\n'
          }}Пользователь: {{ states('sensor.dh_recorder_app_db_user') }}
        icon: mdi:database-cog
        icon_color: blue
        multiline_secondary: true
        tap_action:
          action: more-info
        grid_options:
          columns: 12
          rows: auto
      - type: custom:mushroom-template-card
        entity: binary_sensor.dh_recorder_app_db_connected
        primary: >-
          {% if not is_state('binary_sensor.dh_recorder_app_db_connected', 'on')
          %}
            База данных недоступна
          {% elif not is_state('binary_sensor.dh_recorder_app_recorder_writing',
          'on') %}
            Recorder не записывает данные
          {% else %}
            База данных работает штатно
          {% endif %}
        secondary: >-
          {% set connected =
          is_state('binary_sensor.dh_recorder_app_db_connected', 'on') %} {% set
          writing = is_state('binary_sensor.dh_recorder_app_recorder_writing',
          'on') %} {% set age = states('sensor.dh_recorder_app_db_last_age') %}

          Подключение: {{ 'OK' if connected else 'ОШИБКА' }} {{ '\n' }}Recorder:
          {{ 'идёт запись' if writing else 'нет записи' }} {{ '\n' }}Последняя
          запись: {{ age }} с назад
        icon: >-
          {% if not is_state('binary_sensor.dh_recorder_app_db_connected', 'on')
          %}
            mdi:database-off
          {% elif not is_state('binary_sensor.dh_recorder_app_recorder_writing',
          'on') %}
            mdi:database-alert
          {% else %}
            mdi:database-check
          {% endif %}
        icon_color: >-
          {% if not is_state('binary_sensor.dh_recorder_app_db_connected', 'on')
          %}
            red
          {% elif not is_state('binary_sensor.dh_recorder_app_recorder_writing',
          'on') %}
            orange
          {% else %}
            green
          {% endif %}
        multiline_secondary: true
        tap_action:
          action: more-info
        grid_options:
          columns: 12
      - type: heading
        heading_style: subtitle
        icon: mdi:refresh
        heading: Обновить данные
      - type: custom:mushroom-template-card
        entity: button.dh_recorder_app_db_refresh
        primary: Обновить Recorder
        secondary: >-
          {% set ts = states('sensor.dh_recorder_app_db_last_refresh') %} {% if
          ts not in ['unknown', 'unavailable', 'none', ''] %}
            Последнее обновление:
            {{ as_timestamp(ts) | timestamp_custom('%d.%m.%Y %H:%M:%S', true) }}
          {% else %}
            Последнее обновление: —
          {% endif %}
        icon: mdi:refresh
        icon_color: purple
        badge_icon: |-
          {% if is_state('binary_sensor.dh_recorder_app_db_connected', 'on') %}
            mdi:check
          {% else %}
            mdi:alert
          {% endif %}
        badge_color: |-
          {% if is_state('binary_sensor.dh_recorder_app_db_connected', 'on') %}
            green
          {% else %}
            red
          {% endif %}
        entity_id:
          - sensor.dh_recorder_app_db_last_refresh
          - binary_sensor.dh_recorder_app_db_connected
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.dh_recorder_app_db_refresh
        hold_action:
          action: more-info
        grid_options:
          columns: 12
          rows: 1
      - type: heading
        heading: База данных
        heading_style: subtitle
        icon: mdi:database-cog
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.dh_recorder_app_db_size
            primary: Размер БД
            secondary: '{{ states(''sensor.dh_recorder_app_db_size'') }} MiB'
            icon: mdi:database
            icon_color: blue
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.dh_recorder_app_db_records
            primary: Записей
            secondary: '{{ states(''sensor.dh_recorder_app_db_records'') }} тыс.'
            icon: mdi:database-marker
            icon_color: cyan
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.dh_recorder_app_db_depth
            primary: Глубина истории
            secondary: '{{ states(''sensor.dh_recorder_app_db_depth'') }} дн.'
            icon: mdi:calendar-range
            icon_color: purple
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.dh_recorder_app_db_today_records
            primary: Записано сегодня
            secondary: '{{ states(''sensor.dh_recorder_app_db_today_records'') }} тыс.'
            icon: mdi:calendar-today
            icon_color: blue
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.dh_recorder_app_db_current_hour_records
            primary: За текущий час
            secondary: '{{ states(''sensor.dh_recorder_app_db_current_hour_records'') }} тыс.'
            icon: mdi:clock-outline
            icon_color: cyan
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.dh_recorder_app_db_last_age
            primary: Последняя запись
            secondary: >-
              {% set age = states('sensor.dh_recorder_app_db_last_age') |
              int(9999) %} {% if age == 1 %}
                1 секунду назад
              {% elif age % 10 in [2, 3, 4] and age % 100 not in [12, 13, 14] %}
                {{ age }} секунды назад
              {% else %}
                {{ age }} секунд назад
              {% endif %}
            icon: mdi:database-clock
            icon_color: >-
              {% set age = states('sensor.dh_recorder_app_db_last_age') |
              int(9999) %} {% if age >= 300 %}
                red
              {% elif age >= 120 %}
                orange
              {% else %}
                green
              {% endif %}
            tap_action:
              action: more-info
      - type: heading
        heading: История
        heading_style: subtitle
        icon: mdi:information-outline
      - type: custom:mushroom-template-card
        entity: sensor.dh_recorder_app_db_start
        primary: Начало истории
        secondary: >-
          {% if states('sensor.dh_recorder_app_db_start') not in ['unknown',
          'unavailable'] %}
            {{ as_timestamp(states('sensor.dh_recorder_app_db_start'))
               | timestamp_custom('%d.%m.%Y %H:%M:%S', true) }}
          {% else %}
            Недоступно
          {% endif %}
        icon: mdi:database-clock-outline
        icon_color: green
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        entity: sensor.dh_recorder_app_db_last
        primary: Последняя запись
        secondary: >-
          {% if states('sensor.dh_recorder_app_db_last') not in ['unknown',
          'unavailable'] %}
            {{ as_timestamp(states('sensor.dh_recorder_app_db_last'))
               | timestamp_custom('%d.%m.%Y %H:%M:%S', true) }}
          {% else %}
            Недоступно
          {% endif %}
        icon: mdi:database-clock
        icon_color: green
        tap_action:
          action: more-info
  - type: grid
    cards:
      - type: heading
        heading: Диск базы данных
        heading_style: title
        icon: mdi:harddisk
      - type: heading
        heading: Дисковое пространство
        heading_style: subtitle
        icon: mdi:harddisk
      - type: custom:entity-progress-card-template
        entity: sensor.dh_recorder_app_db_disk_used_percentage
        name: >-
          {% set pct = states('sensor.dh_recorder_app_db_disk_used_percentage')
          | float(0) %} Диск БД · {{ '%.1f' | format(pct) }}%
        secondary: >-
          {% set used = states('sensor.dh_recorder_app_db_disk_used') | float(0)
          %} {% set total = states('sensor.dh_recorder_app_db_disk_total') |
          float(0) %} Занято {{ '%.1f' | format(used) }} / {{ '%.1f' |
          format(total) }} GB
        percent: >-
          {{ '%.1f' |
          format(states('sensor.dh_recorder_app_db_disk_used_percentage') |
          float(0)) }}
        icon: >-
          {% set used = states('sensor.dh_recorder_app_db_disk_used_percentage')
          | float(0) %} {% set threshold =
          states('number.dh_recorder_app_db_disk_usage_threshold') | float(80)
          %} {{ 'mdi:harddisk-alert' if used >= threshold else
          'mdi:harddisk-check' }}
        color: >-
          {% set used = states('sensor.dh_recorder_app_db_disk_used_percentage')
          | float(0) %} {% set threshold =
          states('number.dh_recorder_app_db_disk_usage_threshold') | float(80)
          %} {{ 'red' if used >= threshold else 'green' }}
        bar_color: >-
          {% set used = states('sensor.dh_recorder_app_db_disk_used_percentage')
          | float(0) %} {% set threshold =
          states('number.dh_recorder_app_db_disk_usage_threshold') | float(80)
          %} {{ 'red' if used >= threshold else 'green' }}
        bar_size: medium
        tap_action:
          action: more-info
        grid_options:
          columns: 12
          rows: 1
      - type: heading
        heading: Порог заполнения диска
        heading_style: subtitle
        icon: mdi:database-alert
      - type: custom:mushroom-number-card
        entity: number.dh_recorder_app_db_disk_usage_threshold
        name: Заполнение диска
        icon: mdi:database-alert
        display_mode: buttons
        fill_container: true
        grid_options:
          columns: 14
          rows: 1
        layout: horizontal
      - type: heading
        heading: Использование диска · 10 дней
        heading_style: subtitle
        icon: mdi:chart-line
      - square: false
        type: grid
        columns: 2
        cards:
          - type: tile
            entity: sensor.dh_recorder_app_db_disk_used_percentage
            name: Disk used, %
            icon: mdi:cpu-64-bit
            vertical: false
            features:
              - type: trend-graph
                hours_to_show: 3
                detail: true
            features_position: bottom
          - type: tile
            entity: sensor.dh_recorder_app_db_disk_used
            name: Disk used, Gb
            icon: mdi:movie-cog
            features_position: bottom
            features:
              - type: trend-graph
                hours_to_show: 3
                detail: true
      - type: heading
        heading: Рост базы данных · 10 дней
        heading_style: subtitle
        icon: mdi:database-arrow-up
  - type: grid
    cards:
      - type: heading
        heading: Активность Recorder
        heading_style: title
        icon: mdi:database-edit
      - type: heading
        heading: Динамика количество записей по дням
        heading_style: subtitle
        icon: mdi:database-marker
      - type: custom:mini-graph-card
        entities:
          - sensor.dh_recorder_app_db_size
        name: Размер БД
        hours_to_show: 240
        aggregate_func: last
        group_by: date
        show:
          graph: bar
          show_points: true
      - type: heading
        heading: Новых записей за день
        heading_style: subtitle
        icon: mdi:calendar-arrow-left
      - type: custom:mini-graph-card
        entities:
          - sensor.dh_recorder_app_db_today_records
        name: Новых записей за день
        hours_to_show: 240
        aggregate_func: delta
        group_by: date
        show:
          graph: bar
          show_points: true
      - type: heading
        heading: Новых записей за час
        heading_style: subtitle
        icon: mdi:database-arrow-down
      - type: custom:mini-graph-card
        entities:
          - sensor.dh_recorder_app_db_current_hour_records
        name: Новых записей за час
        hours_to_show: 24
        aggregate_func: delta
        group_by: hour
        show:
          graph: bar
          show_points: true
  - type: grid
    cards:
      - type: heading
        heading_style: title
        heading: Топ сущностей Recorder
        icon: mdi:record-circle
      - type: markdown
        title: Top Recorder entities · 24 часа
        content: >
          {% set results =
          state_attr('sensor.dh_recorder_app_db_top_entities_24h',
          'top_entities') or [] %}

          {% set generated =
          state_attr('sensor.dh_recorder_app_db_top_entities_24h',
          'generated_at') %}


          Сформировано: {% if generated %}{{
          as_local(as_datetime(generated)).strftime('%d.%m.%Y %H:%M') }}{% else
          %}нет данных{% endif %} - обновляется раз в час


          | % | count | Entity |

          | ---: | ---: | :--- |

          {%- for r in results %}

          | {{ '%.2f' | format(r.share_percent | float(0)) }}% | {{ r.records }}
          | {% if r.share_percent | float(0) >= 10 %}🔴 {% elif r.share_percent
          | float(0) >= 5 %}🟡 {% endif %}{{ r.entity_id | replace('|',
          '&#124;') }} |

          {%- endfor %}
      - type: markdown
        title: Top Recorder entities · вся история
        content: >
          {% set results =
          state_attr('sensor.dh_recorder_app_db_top_entities_all_time',
          'top_entities') or [] %}

          {% set generated =
          state_attr('sensor.dh_recorder_app_db_top_entities_all_time',
