name: DigitalHouses Recorder App
version: 0.2.0
slug: digitalhouses_recorder_app
description: Monitor Home Assistant Recorder database health and key metrics through MQTT Discovery.
url: https://github.com/DigitalHouses/home-assistant-apps/tree/main/digitalhouses_recorder_app
arch:
  - amd64
  - aarch64
image: ghcr.io/digitalhouses/digitalhouses_recorder_app
map:
  - type: homeassistant_config
    read_only: true
startup: application
boot: auto
init: false
stage: stable
backup: hot
hassio_api: true
hassio_role: default
services:
  - mqtt:need
  - mysql:want
options:
  database_type: sqlite
  postgresql: {}
  mariadb: {}
  storage:
    source: automatic
  telemetry_enabled: false
  log_level: info
schema:
  database_type: list(sqlite|postgresql|mariadb)
  postgresql:
    host: str?
    port: port?
    database: str?
    username: str?
    password: password?
  mariadb:
    connection: list(supervisor|manual)?
    host: str?
    port: port?
    database: str?
    username: str?
    password: password?
  storage:
    source: list(automatic|ssh|disabled)
    ssh_host: str?
    ssh_port: port?
    ssh_username: str?
    ssh_password: password?
    path: str?
  publish_interval_minutes: int(1,60)?
  recorder_stale_seconds: int(30,86400)?
  top_entities_limit: int(1,100)?
  telemetry_enabled: bool
  log_level: list(debug|info|warning|error)
