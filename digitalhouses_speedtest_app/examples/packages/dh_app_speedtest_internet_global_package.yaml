  script:
    internet_reboot_ont:
      alias: _[internet_global_package] - recover modem (ONT)
      mode: single
      sequence:
      - variables:
          method: "{{ state_attr('binary_sensor.bs_internet_passport', 'ont_recovery_method') | default('none', true) | string | lower | trim }}"
          entity_id: "{{ state_attr('binary_sensor.bs_internet_passport', 'ont_recovery_entity_id') or '' }}"
          power_off_s: "{{ state_attr('binary_sensor.bs_internet_passport', 'ont_recovery_power_off_s') }}"
          reasons: "{{ state_attr('binary_sensor.internet_passport_valid', 'reasons') }}"
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ not is_state('binary_sensor.internet_passport_valid', 'on') }}"
          sequence:
          - event: digitalhouses_internet
            event_data:
              event: recovery_config_error
              title: ⚠️ ONT recovery недоступен
              message: ⚠️ Internet passport invalid. reasons={{ reasons if reasons is not none else 'N/A' }}
        - conditions:
          - condition: template
            value_template: "{{ method == 'none' }}"
          sequence:
          - event: digitalhouses_internet
            event_data:
              event: recovery_config_error
              title: ⚠️ ONT recovery недоступен
              message: ⚠️ В паспорте ONT recovery method = none.
        - conditions:
          - condition: template
            value_template: >-
              {{ method not in ['switch', 'button', 'script']
                 or not entity_id
                 or not entity_id.startswith(method ~ '.')
                 or entity_name(entity_id) is none
                 or (method == 'switch' and states(entity_id) not in ['on', 'off'])
                 or (method in ['button', 'script'] and states(entity_id) == 'unavailable')
                 or (method == 'script' and entity_id in ['script.internet_reboot_ont', 'script.internet_reboot_router']) }}
          sequence:
          - event: digitalhouses_internet
            event_data:
              event: recovery_config_error
              title: ⚠️ ONT recovery недоступен
              message: 'Некорректный ONT recovery: method={{ method }}, entity={{ entity_id }}'
        - conditions:
          - condition: template
            value_template: "{{ method == 'switch' and (power_off_s is none or not is_number(power_off_s) or power_off_s | int <= 0) }}"
          sequence:
          - event: digitalhouses_internet
            event_data:
              event: recovery_config_error
              title: ⚠️ ONT recovery недоступен
              message: ⚠️ Некорректный ont_recovery_power_off_s.
        default:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ method == 'switch' }}"
            sequence:
            - action: switch.turn_off
              target:
                entity_id: '{{ entity_id }}'
            - delay:
                seconds: '{{ power_off_s | int }}'
            - action: switch.turn_on
              target:
                entity_id: '{{ entity_id }}'
          - conditions:
            - condition: template
              value_template: "{{ method == 'button' }}"
            sequence:
            - action: button.press
              target:
                entity_id: '{{ entity_id }}'
          - conditions:
            - condition: template
              value_template: "{{ method == 'script' }}"
            sequence:
            - action: "{{ entity_id }}"
        - action: counter.increment
          target:
            entity_id: counter.internet_modem_restart_count
        - event: digitalhouses_internet
          event_data:
            event: recovery_ont
            title: 🔄 ONT recovery выполнен
            message: "ONT recovery выполнен. Method: {{ method }}. Счётчик: {{ states('counter.internet_modem_restart_count') }}"

    internet_reboot_router:
      alias: _[internet_global_package] - recover router
      mode: single
      sequence:
      - variables:
          method: "{{ state_attr('binary_sensor.bs_internet_passport', 'router_recovery_method') | default('none', true) | string | lower | trim }}"
          entity_id: "{{ state_attr('binary_sensor.bs_internet_passport', 'router_recovery_entity_id') or '' }}"
          power_off_s: "{{ state_attr('binary_sensor.bs_internet_passport', 'router_recovery_power_off_s') }}"
          reasons: "{{ state_attr('binary_sensor.internet_passport_valid', 'reasons') }}"
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ not is_state('binary_sensor.internet_passport_valid', 'on') }}"
          sequence:
          - event: digitalhouses_internet
            event_data:
              event: recovery_config_error
              title: ⚠️ Router recovery недоступен
              message: ⚠️ Internet passport invalid. reasons={{ reasons if reasons is not none else 'N/A' }}
        - conditions:
          - condition: template
            value_template: "{{ method == 'none' }}"
          sequence:
          - event: digitalhouses_internet
            event_data:
              event: recovery_config_error
              title: ⚠️ Router recovery недоступен
              message: ⚠️ В паспорте Router recovery method = none.
        - conditions:
          - condition: template
            value_template: >-
              {{ method not in ['switch', 'button', 'script']
                 or not entity_id
                 or not entity_id.startswith(method ~ '.')
                 or entity_name(entity_id) is none
                 or (method == 'switch' and states(entity_id) not in ['on', 'off'])
                 or (method in ['button', 'script'] and states(entity_id) == 'unavailable')
                 or (method == 'script' and entity_id in ['script.internet_reboot_ont', 'script.internet_reboot_router']) }}
          sequence:
          - event: digitalhouses_internet
            event_data:
              event: recovery_config_error
              title: ⚠️ Router recovery недоступен
              message: 'Некорректный Router recovery: method={{ method }}, entity={{ entity_id }}'
        - conditions:
          - condition: template
            value_template: "{{ method == 'switch' and (power_off_s is none or not is_number(power_off_s) or power_off_s | int <= 0) }}"
          sequence:
          - event: digitalhouses_internet
            event_data:
              event: recovery_config_error
              title: ⚠️ Router recovery недоступен
              message: ⚠️ Некорректный router_recovery_power_off_s.
        default:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ method == 'switch' }}"
            sequence:
            - action: switch.turn_off
              target:
                entity_id: '{{ entity_id }}'
            - delay:
                seconds: '{{ power_off_s | int }}'
            - action: switch.turn_on
              target:
                entity_id: '{{ entity_id }}'
          - conditions:
            - condition: template
              value_template: "{{ method == 'button' }}"
            sequence:
            - action: button.press
              target:
                entity_id: '{{ entity_id }}'
          - conditions:
            - condition: template
              value_template: "{{ method == 'script' }}"
            sequence:
            - action: "{{ entity_id }}"
        - action: counter.increment
          target:
            entity_id: counter.internet_router_restart_count
        - event: digitalhouses_internet
          event_data:
            event: recovery_router
            title: 🔄 Router recovery выполнен
            message: "Router recovery выполнен. Method: {{ method }}. Счётчик: {{ states('counter.internet_router_restart_count') }}"
  automation:
  - id: internet_global_package__performance_edges
    alias: _[internet_global_package] - internet performance edges
    description: Publishes neutral DigitalHouses Internet events from Speedtest performance edges
    trigger:
    - platform: state
      entity_id: binary_sensor.internet_speed_low_download
      to: 'on'
      from: 'off'
      id: download_low
    - platform: state
      entity_id: binary_sensor.internet_speed_low_download
      to: 'off'
      from: 'on'
      id: download_normal
    - platform: state
      entity_id: binary_sensor.internet_speed_low_upload
      to: 'on'
      from: 'off'
      id: upload_low
    - platform: state
      entity_id: binary_sensor.internet_speed_low_upload
      to: 'off'
      from: 'on'
      id: upload_normal
    - platform: state
      entity_id: binary_sensor.internet_speed_high_ping
      to: 'on'
      from: 'off'
      id: ping_high
    - platform: state
      entity_id: binary_sensor.internet_speed_high_ping
      to: 'off'
      from: 'on'
      id: ping_normal
    condition:
    - condition: state
      entity_id: binary_sensor.internet_package_ready
      state: 'on'
    variables:
      download: "{{ states('sensor.internet_speed_download')\n   if states('sensor.internet_speed_download') not in ['unknown','unavailable','none','']\n   else 'неизвестно' }}"
      upload: "{{ states('sensor.internet_speed_upload')\n   if states('sensor.internet_speed_upload') not in ['unknown','unavailable','none','']\n   else 'неизвестно' }}"
      ping: "{{ states('sensor.internet_speed_ping')\n   if states('sensor.internet_speed_ping') not in ['unknown','unavailable','none','']\n   else 'неизвестно' }}"
      minimum_download: "{{ states('number.internet_speed_minimum_download')\n   if states('number.internet_speed_minimum_download') not in ['unknown','unavailable','none','']\n   else 'неизвестно' }}"
      minimum_upload: "{{ states('number.internet_speed_minimum_upload')\n   if states('number.internet_speed_minimum_upload') not in ['unknown','unavailable','none','']\n   else 'неизвестно' }}"
      maximum_ping: "{{ states('number.internet_speed_maximum_ping')\n   if states('number.internet_speed_maximum_ping') not in ['unknown','unavailable','none','']\n   else 'неизвестно' }}"
      provider: "{{ states('sensor.internet_speed_provider')\n   if states('sensor.internet_speed_provider') not in ['unknown','unavailable','none','']\n   else 'неизвестно' }}"
    action:
    - choose:
      - conditions:
        - condition: trigger
          id: download_low
        sequence:
        - event: digitalhouses_internet
          event_data:
            event: performance_download_low
            title: 📉 Скорость загрузки уменьшилась
            message: '🐌 Скорость загрузки уменьшилась — {{ download }} Mbit/с. Порог: {{ minimum_download }} Mbit/с. Провайдер: {{ provider }}'
      - conditions:
        - condition: trigger
          id: download_normal
        sequence:
        - event: digitalhouses_internet
          event_data:
            event: performance_download_normal
            title: 📈 Скорость загрузки нормализовалась
            message: '🚀 Скорость загрузки нормализовалась — {{ download }} Mbit/с. Провайдер: {{ provider }}'
      - conditions:
        - condition: trigger
          id: upload_low
        sequence:
        - event: digitalhouses_internet
          event_data:
            event: performance_upload_low
            title: 📉 Скорость передачи уменьшилась
            message: '🐌 Скорость передачи уменьшилась — {{ upload }} Mbit/с. Порог: {{ minimum_upload }} Mbit/с. Провайдер: {{ provider }}'
      - conditions:
        - condition: trigger
          id: upload_normal
        sequence:
        - event: digitalhouses_internet
          event_data:
            event: performance_upload_normal
            title: 📈 Скорость передачи нормализовалась
            message: '🚀 Скорость передачи нормализовалась — {{ upload }} Mbit/с. Провайдер: {{ provider }}'
      - conditions:
        - condition: trigger
          id: ping_high
        sequence:
        - event: digitalhouses_internet
          event_data:
            event: performance_ping_high
            title: 📉 Пинг увеличился
            message: '🐌 Пинг увеличился — {{ ping }} мс. Порог: {{ maximum_ping }} мс. Провайдер: {{ provider }}'
      - conditions:
        - condition: trigger
          id: ping_normal
        sequence:
        - event: digitalhouses_internet
          event_data:
            event: performance_ping_normal
            title: 📈 Пинг нормализовался
            message: '🚀 Пинг нормализовался — {{ ping }} мс. Провайдер: {{ provider }}'
    mode: queued
    max: 10
  - id: internet_global_package__statistics_engine
    alias: _[internet_global_package] - internet statistics engine
    description: Datetime accounting with fixed monthly base and confirmed state sequence
    trigger:
    - platform: state
      entity_id: binary_sensor.internet_package_ready
      to: 'on'
      id: initialize
    - platform: time
      at: 00:00:01
      id: month_guard
    - platform: state
      entity_id: binary_sensor.internet_status
      to: 'on'
      from: 'off'
      for: 00:00:05
      id: internet_on
    - platform: state
      entity_id: binary_sensor.internet_status
      to: 'off'
      from: 'on'
      for: 00:00:15
      id: internet_off
    condition:
    - condition: state
      entity_id: binary_sensor.internet_package_ready
      state: 'on'
    variables:
      current_ts: '{{ now().timestamp() | int }}'
      event_ts: "{{\n  (as_timestamp(trigger.to_state.last_changed) | int)\n  if trigger.id in ['internet_on', 'internet_off']\n  else (now().timestamp() | int)\n}}"
      month_start_ts: "{{\n  as_timestamp(\n    now().replace(day=1, hour=0, minute=0, second=0, microsecond=0)\n  ) | int\n}}"
      current_month: '{{ now().strftime(''%Y-%m'') }}'
      online_total_ts_before: '{{ state_attr(''input_datetime.dt_internet_online_total'', ''timestamp'') }}'
      offline_total_ts_before: '{{ state_attr(''input_datetime.dt_internet_offline_total'', ''timestamp'') }}'
      failure_ts_before: '{{ state_attr(''input_datetime.dt_internet_last_failure'', ''timestamp'') }}'
      restore_ts_before: '{{ state_attr(''input_datetime.dt_internet_last_restore'', ''timestamp'') }}'
      initialized_v4_before: '{{ is_state(''input_boolean.ib_internet_statistics_v4_initialized'', ''on'') }}'
      online_total_month_before: "{{\n  as_local(as_datetime(online_total_ts_before)).strftime('%Y-%m')\n  if online_total_ts_before is number\n  else none\n}}"
      offline_total_month_before: "{{\n  as_local(as_datetime(offline_total_ts_before)).strftime('%Y-%m')\n  if offline_total_ts_before is number\n  else none\n}}"
      base_helpers_valid: "{{\n  online_total_ts_before is number\n  and offline_total_ts_before is number\n  and failure_ts_before is number\n  and restore_ts_before is number\n  and online_total_ts_before >= 946684800\n  and offline_total_ts_before >= 946684800\n  and failure_ts_before >= 946684800\n  and restore_ts_before >= 946684800\n  and online_total_ts_before <= current_ts + 60\n  and offline_total_ts_before <= current_ts + 60\n  and failure_ts_before <= current_ts + 60\n  and restore_ts_before <= current_ts + 60\n  and states('binary_sensor.internet_status') in ['on', 'off']\n}}"
      totals_current_month: "{{\n  base_helpers_valid | bool\n  and online_total_month_before == current_month\n  and offline_total_month_before == current_month\n}}"
      accounting_online_before: "{{\n  base_helpers_valid | bool\n  and restore_ts_before > failure_ts_before\n}}"
      accounting_offline_before: "{{\n  base_helpers_valid | bool\n  and failure_ts_before > restore_ts_before\n}}"
      closed_online_before: "{{\n  [online_total_ts_before - month_start_ts, 0] | max\n  if totals_current_month | bool\n  else 0\n}}"
      closed_offline_before: "{{\n  [offline_total_ts_before - month_start_ts, 0] | max\n  if totals_current_month | bool\n  else 0\n}}"
      active_interval_before: "{% if accounting_online_before | bool %}\n  {{ [current_ts - [restore_ts_before, month_start_ts] | max, 0] | max }}\n{% elif accounting_offline_before | bool %}\n  {{ [current_ts - [failure_ts_before, month_start_ts] | max, 0] | max }}\n{% else %}\n  0\n{% endif %}"
      accounted_seconds_before: '{{ closed_online_before + closed_offline_before + active_interval_before }}'
      elapsed_seconds_month: '{{ [current_ts - month_start_ts, 0] | max }}'
      accounting_balance_valid: "{{\n  totals_current_month | bool\n  and (accounting_online_before | bool or accounting_offline_before | bool)\n  and (accounted_seconds_before - elapsed_seconds_month) | abs <= 65\n}}"
    action:
    - if:
      - condition: template
        value_template: '{{ not (initialized_v4_before | bool) or not (base_helpers_valid | bool) }}'
      then:
      - choose:
        - conditions:
          - condition: state
            entity_id: binary_sensor.internet_status
            state: 'on'
          sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.dt_internet_online_total
            data:
              timestamp: '{{ current_ts }}'
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.dt_internet_offline_total
            data:
              timestamp: '{{ month_start_ts }}'
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.dt_internet_last_failure
            data:
              timestamp: '{{ current_ts - 1 }}'
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.dt_internet_last_restore
            data:
              timestamp: '{{ current_ts }}'
        - conditions:
          - condition: state
            entity_id: binary_sensor.internet_status
            state: 'off'
          sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.dt_internet_online_total
            data:
              timestamp: '{{ month_start_ts }}'
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.dt_internet_offline_total
            data:
              timestamp: '{{ current_ts }}'
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.dt_internet_last_restore
            data:
              timestamp: '{{ current_ts - 1 }}'
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.dt_internet_last_failure
            data:
              timestamp: '{{ current_ts }}'
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ib_internet_statistics_v4_initialized
      - action: counter.reset
        target:
          entity_id: counter.internet_failure_count
    - variables:
        online_total_ts_1: '{{ state_attr(''input_datetime.dt_internet_online_total'', ''timestamp'') }}'
        offline_total_ts_1: '{{ state_attr(''input_datetime.dt_internet_offline_total'', ''timestamp'') }}'
        failure_ts_1: '{{ state_attr(''input_datetime.dt_internet_last_failure'', ''timestamp'') }}'
        restore_ts_1: '{{ state_attr(''input_datetime.dt_internet_last_restore'', ''timestamp'') }}'
        online_total_month_1: '{{ as_local(as_datetime(online_total_ts_1)).strftime(''%Y-%m'') if online_total_ts_1 is number else none }}'
        offline_total_month_1: '{{ as_local(as_datetime(offline_total_ts_1)).strftime(''%Y-%m'') if offline_total_ts_1 is number else none }}'
    - if:
      - condition: template
        value_template: "{{\n  online_total_month_1 != current_month\n  or offline_total_month_1 != current_month\n}}"
      then:
      - action: input_datetime.set_datetime
        target:
          entity_id:
          - input_datetime.dt_internet_online_total
          - input_datetime.dt_internet_offline_total
        data:
          timestamp: '{{ month_start_ts }}'
      - action: counter.reset
        target:
          entity_id: counter.internet_failure_count
    - variables:
        online_total_ts: '{{ state_attr(''input_datetime.dt_internet_online_total'', ''timestamp'') }}'
        offline_total_ts: '{{ state_attr(''input_datetime.dt_internet_offline_total'', ''timestamp'') }}'
        failure_ts: '{{ state_attr(''input_datetime.dt_internet_last_failure'', ''timestamp'') }}'
        restore_ts: '{{ state_attr(''input_datetime.dt_internet_last_restore'', ''timestamp'') }}'
        accounting_online: '{{ restore_ts is number and failure_ts is number and restore_ts > failure_ts }}'
        accounting_offline: '{{ restore_ts is number and failure_ts is number and failure_ts > restore_ts }}'
    - choose:
      - conditions:
        - condition: trigger
          id: internet_off
        - condition: template
          value_template: '{{ accounting_online | bool }}'
        sequence:
        - variables:
            online_closed_s: '{{ [online_total_ts - month_start_ts, 0] | max }}'
            online_interval_start_ts: '{{ [restore_ts, month_start_ts] | max }}'
            online_interval_s: '{{ [event_ts - online_interval_start_ts, 0] | max }}'
            online_total_new_ts: '{{ month_start_ts + online_closed_s + online_interval_s }}'
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.dt_internet_online_total
          data:
            timestamp: '{{ online_total_new_ts }}'
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.dt_internet_last_failure
          data:
            timestamp: '{{ event_ts }}'
        - action: counter.increment
          target:
            entity_id: counter.internet_failure_count
        - action: counter.reset
          target:
            entity_id:
            - counter.internet_reboot_attempt_count
            - counter.internet_modem_restart_count
            - counter.internet_router_restart_count
        - event: digitalhouses_internet
          event_data:
            event: connection_lost
            title: 🚫 Интернет соединение потеряно
            message: 🚫 Интернет соединение потеряно в {{ as_local(as_datetime(event_ts)).strftime('%d.%m.%Y %H:%M:%S') }}.
      - conditions:
        - condition: trigger
          id: internet_on
        - condition: template
          value_template: '{{ accounting_offline | bool }}'
        sequence:
        - variables:
            offline_closed_s: '{{ [offline_total_ts - month_start_ts, 0] | max }}'
            offline_interval_start_ts: '{{ [failure_ts, month_start_ts] | max }}'
            offline_interval_s: '{{ [event_ts - offline_interval_start_ts, 0] | max }}'
            offline_total_new_ts: '{{ month_start_ts + offline_closed_s + offline_interval_s }}'
            outage_text: '{% set sec = [event_ts - failure_ts, 0] | max | int %} {% set d = sec // 86400 %} {% set h = (sec % 86400) // 3600 %} {% set m = (sec % 3600) // 60 %} {% set s = sec % 60 %} {{ (d ~ '' д. '' if d > 0 else '''') ~ (''%02d:%02d:%02d'' | format(h,m,s)) }}'
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.dt_internet_offline_total
          data:
            timestamp: '{{ offline_total_new_ts }}'
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.dt_internet_last_restore
          data:
            timestamp: '{{ event_ts }}'
        - event: digitalhouses_internet
          event_data:
            event: connection_restored
            title: 📶 Интернет соединение установлено
            message: '📶 Сбой начался: {{ as_local(as_datetime(failure_ts)).strftime(''%d.%m.%Y %H:%M:%S'') }}. Восстановлен: {{ as_local(as_datetime(event_ts)).strftime(''%d.%m.%Y %H:%M:%S'') }}. Offline: {{ outage_text }}.'
    - if:
      - condition: template
        value_template: "{{\n  initialized_v4_before | bool\n  and trigger.id in ['initialize', 'month_guard']\n  and totals_current_month | bool\n  and not (accounting_balance_valid | bool)\n}}"
      then:
      - choose:
        - conditions:
          - condition: state
            entity_id: binary_sensor.internet_status
            state: 'on'
          sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.dt_internet_online_total
            data:
              timestamp: '{{ current_ts }}'
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.dt_internet_offline_total
            data:
              timestamp: '{{ month_start_ts }}'
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.dt_internet_last_failure
            data:
              timestamp: '{{ current_ts - 1 }}'
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.dt_internet_last_restore
            data:
              timestamp: '{{ current_ts }}'
        - conditions:
          - condition: state
            entity_id: binary_sensor.internet_status
            state: 'off'
          sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.dt_internet_online_total
            data:
              timestamp: '{{ month_start_ts }}'
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.dt_internet_offline_total
            data:
              timestamp: '{{ current_ts }}'
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.dt_internet_last_restore
            data:
              timestamp: '{{ current_ts - 1 }}'
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.dt_internet_last_failure
            data:
              timestamp: '{{ current_ts }}'
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ib_internet_statistics_v4_initialized
      - action: counter.reset
        target:
          entity_id: counter.internet_failure_count
    mode: queued
    max: 50
  - id: internet_global_package__internet_on_off_reaction
    alias: _[internet_global_package] - Internet On/Off Reaction
    description: 'Internet package: optional power-cycle recovery; hardware-gated by passport'
    trigger:
    - platform: state
      entity_id: binary_sensor.internet_status
      to: on
      from: off
      for: 00:00:05
      id: internet_on
    - platform: state
      entity_id: binary_sensor.internet_status
      to: off
      from: on
      for: 00:00:15
      id: internet_off
    condition:
    - condition: state
      entity_id: binary_sensor.internet_package_ready
      state: on
    variables:
      reboot_interval_raw: "{{ states('input_number.internet_reboot_interval_min') }}"
      reboot_interval: >-
        {% if reboot_interval_raw in ['unknown','unavailable','none',''] or not is_number(reboot_interval_raw) %}
          {{ none }}
        {% else %}
          {{ reboot_interval_raw | int }}
        {% endif %}
      timeout_str: >-
        {% if reboot_interval is none %}
          {{ none }}
        {% else %}
          00:{{ '%02d:00' % (reboot_interval | int) }}
        {% endif %}
      modem_cycles_raw: "{{ states('input_number.internet_ont_reboot_every_n_attempts') }}"
      modem_cycles: >-
        {% if modem_cycles_raw in ['unknown','unavailable','none',''] or not is_number(modem_cycles_raw) %}
          {{ none }}
        {% else %}
          {{ modem_cycles_raw | int }}
        {% endif %}
      reboot_mode_simultaneous: "{{ is_state('input_boolean.ib_internet_reboot_mode_simultaneous','on') }}"
      ont_enabled: >-
        {{ is_state('input_boolean.ib_internet_auto_reboot_ont_enabled','on')
           and is_state('binary_sensor.internet_recovery_ont_available','on') }}
      router_enabled: >-
        {{ is_state('input_boolean.ib_internet_auto_reboot_router_enabled','on')
           and is_state('binary_sensor.internet_recovery_router_available','on') }}
      recovery_enabled: '{{ ont_enabled | bool or router_enabled | bool }}'
    action:
    - choose:
      - conditions:
        - condition: trigger
          id: internet_on
        sequence: []
      - conditions:
        - condition: trigger
          id: internet_off
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ reboot_interval is none or timeout_str is none }}'
            sequence:
            - stop: reboot_interval_not_ready
          - conditions:
            - condition: template
              value_template: '{{ not (recovery_enabled | bool) }}'
            sequence:
            - stop: recovery_hardware_not_configured_or_disabled
        - repeat:
            while:
            - condition: state
              entity_id: binary_sensor.internet_status
              state: off
            sequence:
            - wait_template: "{{ is_state('binary_sensor.internet_status', 'on') }}"
              timeout: '{{ timeout_str }}'
              continue_on_timeout: true
            - if:
              - condition: state
                entity_id: binary_sensor.internet_status
                state: off
              then:
              - action: counter.increment
                target:
                  entity_id: counter.internet_reboot_attempt_count
              - if:
                - condition: template
                  value_template: '{{ reboot_mode_simultaneous }}'
                then:
                - if:
                  - condition: template
                    value_template: '{{ ont_enabled | bool }}'
                  then:
                  - action: script.internet_reboot_ont
                - if:
                  - condition: template
                    value_template: '{{ router_enabled | bool }}'
                  then:
                  - action: script.internet_reboot_router
                else:
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ ont_enabled | bool }}'
                    sequence:
                    - action: script.internet_reboot_ont
                    - if:
                      - condition: template
                        value_template: >-
                          {% set n = modem_cycles | int(0) %}
                          {% set m = states('counter.internet_modem_restart_count') | int(0) %}
                          {{ router_enabled | bool and n > 0 and m > 0 and (m % n == 0) }}
                      then:
                      - action: script.internet_reboot_router
                  - conditions:
                    - condition: template
                      value_template: '{{ not (ont_enabled | bool) and router_enabled | bool }}'
                    sequence:
                    - action: script.internet_reboot_router
    mode: restart
    max: 100
  recorder:
    include:
      entities:
      - binary_sensor.internet_status
      - binary_sensor.internet_google_dns_connectivity
      - binary_sensor.internet_cloudflare_dns_connectivity
