      - input_boolean.ib_internet_auto_reboot_ont_enabled
      - input_boolean.ib_internet_auto_reboot_router_enabled
      - input_boolean.ib_internet_reboot_mode_simultaneous
      - input_boolean.ib_internet_statistics_v4_initialized
      - input_datetime.dt_internet_online_total
      - input_datetime.dt_internet_offline_total
      - input_datetime.dt_internet_last_failure
      - input_datetime.dt_internet_last_restore
      - counter.internet_failure_count
      - counter.internet_reboot_attempt_count
      - counter.internet_modem_restart_count
      - counter.internet_router_restart_count
      - sensor.internet_speed_server_id
      - sensor.internet_speed_result_url
      - sensor.internet_speed_available_servers
      - sensor.internet_speed_server_list_updated
      - button.internet_speed_run
      - button.internet_speed_refresh_servers
      - binary_sensor.internet_package_ready
