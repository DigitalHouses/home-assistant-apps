      - binary_sensor.bs_router_ping_effective
      - binary_sensor.router_is_on
      - binary_sensor.bs_router_wan_effective
      - binary_sensor.internet_recovery_ont_available
      - binary_sensor.internet_recovery_router_available
      - binary_sensor.internet_recovery_available
      - sensor.router_wan_status_effective
      - sensor.router_external_ip_effective
      - sensor.router_traffic_download_effective
      - sensor.router_traffic_upload_effective
      - sensor.router_download_speed_effective
      - sensor.router_upload_speed_effective
      - sensor.router_uptime_effective
      - sensor.router_last_boot_effective
      - sensor.router_devices_connected_effective
      - sensor.router_cpu_temperature_effective
      - sensor.router_traffic_download_month
      - sensor.router_traffic_upload_month
  utility_meter:
    router_traffic_download_month:
      source: sensor.router_traffic_download_effective
      name: Router traffic download month
      unique_id: router_traffic_download_month_id
      cycle: monthly
      periodically_resetting: true
    router_traffic_upload_month:
      source: sensor.router_traffic_upload_effective
      name: Router traffic upload month
      unique_id: router_traffic_upload_month_id
      cycle: monthly
      periodically_resetting: true
