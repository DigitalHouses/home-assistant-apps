# ==============================================================================
# DIGITAL HOUSES — SPEEDTEST + INTERNET GLOBAL PACKAGE
# Version: 2.2.0
# Date: 2026-09-08
#
# Description:
# - Global Internet/Speedtest package, identical on every DigitalHouses site.
# - Provides Internet status, availability/outage statistics, Speedtest derived
#   logic, vendor-neutral Router abstraction, monthly traffic accounting and
#   optional fail-safe ONT/Router recovery.
# - Emits neutral `digitalhouses_internet` events; contains no local notification
#   or site-specific notification dependencies.
#
# Dependencies — required:
# - Home Assistant package support.
# - dh_app_speedtest MQTT entities (DNS connectivity, Speedtest sensors, numbers
#   and buttons).
# - binary_sensor.bs_internet_passport from:
#   dh_app_internet_settings_passport_local_package.yaml
# - Home Assistant: Template, Group, Utility Meter and Recorder integrations.
#
# Dependencies — optional:
# - Router/ONT source entities configured in the local passport.
# - Router/ONT recovery configured in the local passport via switch, button or
#   site-local script adapter.
#
# Scope:
# - GLOBAL = common logic for all houses/sites.
# - Must not contain vendor-specific entity IDs or site-specific notifications.
# ==============================================================================
dh_app_speedtest_internet_global_package:
  binary_sensor:
  - platform: group
    name: Internet status
    unique_id: internet_status_id
    device_class: connectivity
    all: false
    entities:
    - binary_sensor.internet_google_dns_connectivity
    - binary_sensor.internet_cloudflare_dns_connectivity
  input_number:
    internet_reboot_interval_min:
      name: Internet reboot interval (min)
      icon: mdi:timer-outline
      min: 1
      max: 60
      step: 1
    internet_ont_reboot_every_n_attempts:
      name: Internet modem cycles before router (N)
      icon: mdi:counter
      min: 1
      max: 20
      step: 1
  input_boolean:
    ib_internet_auto_reboot_ont_enabled:
      name: Internet auto reboot modem (ONT)
      icon: mdi:cellphone-wireless
    ib_internet_auto_reboot_router_enabled:
      name: Internet auto reboot router
      icon: mdi:router-wireless
    ib_internet_reboot_mode_simultaneous:
      name: Internet reboot mode simultaneous
      icon: mdi:shuffle-variant
    ib_internet_statistics_v4_initialized:
      name: Internet statistics v4 initialized
      icon: mdi:database-check-outline
  input_datetime:
    dt_internet_online_total:
      name: Internet online total
      has_date: true
      has_time: true
    dt_internet_offline_total:
      name: Internet offline total
      has_date: true
      has_time: true
    dt_internet_last_failure:
      name: Internet last failure
      has_date: true
      has_time: true
    dt_internet_last_restore:
      name: Internet last restore
      has_date: true
      has_time: true
  counter:
    internet_failure_count:
      name: Internet failures (month)
      icon: mdi:alert-decagram-outline
    internet_reboot_attempt_count:
      name: Internet reboot attempts (current outage)
      icon: mdi:restart-alert
    internet_modem_restart_count:
      name: Internet modem restarts (current outage)
      icon: mdi:cellphone-wireless
    internet_router_restart_count:
      name: Internet router restarts (current outage)
      icon: mdi:router-wireless
  template:
  - sensor:
    - name: Internet last failure
      unique_id: internet_last_failure_sensor_id
      icon: mdi:clock-alert-outline
      device_class: timestamp
      state: '{% set ts = state_attr(''input_datetime.dt_internet_last_failure'', ''timestamp'') %} {{ as_local(as_datetime(ts)).isoformat() if ts is number else none }}'
      availability: '{% set failure = state_attr(''input_datetime.dt_internet_last_failure'', ''timestamp'') %} {% set restore = state_attr(''input_datetime.dt_internet_last_restore'', ''timestamp'') %} {{ failure is number and restore is number and (failure - restore) | abs > 1 }}'
    - name: Internet last restore
      unique_id: internet_last_restore_sensor_id
      icon: mdi:clock-check-outline
      device_class: timestamp
      state: '{% set ts = state_attr(''input_datetime.dt_internet_last_restore'', ''timestamp'') %} {{ as_local(as_datetime(ts)).isoformat() if ts is number else none }}'
      availability: '{% set failure = state_attr(''input_datetime.dt_internet_last_failure'', ''timestamp'') %} {% set restore = state_attr(''input_datetime.dt_internet_last_restore'', ''timestamp'') %} {{ failure is number and restore is number and (failure - restore) | abs > 1 }}'
    - name: Internet statistics period start
      unique_id: internet_statistics_period_start_sensor_id
      icon: mdi:calendar-start
      device_class: timestamp
      state: '{{ now().replace(day=1, hour=0, minute=0, second=0, microsecond=0).isoformat() }}'
    - name: Internet online month
      unique_id: internet_online_month_id
      icon: mdi:timer-check-outline
      state: "{% set month_start = as_timestamp(\n  now().replace(day=1, hour=0, minute=0, second=0, microsecond=0)\n) %} {% set total = state_attr('input_datetime.dt_internet_online_total', 'timestamp') %} {% set failure = state_attr('input_datetime.dt_internet_last_failure', 'timestamp') %} {% set restore = state_attr('input_datetime.dt_internet_last_restore', 'timestamp') %} {% if total is not number or failure is not number or restore is not number %}\n  {{ none }}\n{% else %}\n  {% set online = restore > failure %}\n  {% set closed = [total - month_start, 0] | max %}\n  {% set active = 0 %}\n  {% if online %}\n    {% set active_start = [restore, month_start] | max %}\n    {% set active = [now().timestamp() - active_start, 0] | max %}\n  {% endif %}\n  {% set sec = [closed + active, 0] | max | int %}\n  {% set d = sec // 86400 %}\n  {% set h = (sec % 86400) // 3600 %}\n  {% set m = (sec % 3600) // 60 %}\n  {% set s = sec % 60 %}\n  {{ (d ~ ' д. ' if d > 0 else '') ~ ('%02d:%02d:%02d' | format(h,m,s)) }}\n{% endif %}"
      availability: "{{\n  state_attr('input_datetime.dt_internet_online_total', 'timestamp') is number\n  and state_attr('input_datetime.dt_internet_last_failure', 'timestamp') is number\n  and state_attr('input_datetime.dt_internet_last_restore', 'timestamp') is number\n}}"
      attributes:
        seconds: "{% set month_start = as_timestamp(\n  now().replace(day=1, hour=0, minute=0, second=0, microsecond=0)\n) %} {% set total = state_attr('input_datetime.dt_internet_online_total', 'timestamp') %} {% set failure = state_attr('input_datetime.dt_internet_last_failure', 'timestamp') %} {% set restore = state_attr('input_datetime.dt_internet_last_restore', 'timestamp') %} {% if total is not number or failure is not number or restore is not number %}\n  {{ none }}\n{% else %}\n  {% set closed = [total - month_start, 0] | max %}\n  {% set active = 0 %}\n  {% if restore > failure %}\n    {% set active_start = [restore, month_start] | max %}\n    {% set active = [now().timestamp() - active_start, 0] | max %}\n  {% endif %}\n  {{ [closed + active, 0] | max | round(0) }}\n{% endif %}"
    - name: Internet offline month
      unique_id: internet_offline_month_id
      icon: mdi:timer-alert-outline
      state: "{% set month_start = as_timestamp(\n  now().replace(day=1, hour=0, minute=0, second=0, microsecond=0)\n) %} {% set total = state_attr('input_datetime.dt_internet_offline_total', 'timestamp') %} {% set failure = state_attr('input_datetime.dt_internet_last_failure', 'timestamp') %} {% set restore = state_attr('input_datetime.dt_internet_last_restore', 'timestamp') %} {% if total is not number or failure is not number or restore is not number %}\n  {{ none }}\n{% else %}\n  {% set offline = failure > restore %}\n  {% set closed = [total - month_start, 0] | max %}\n  {% set active = 0 %}\n  {% if offline %}\n    {% set active_start = [failure, month_start] | max %}\n    {% set active = [now().timestamp() - active_start, 0] | max %}\n  {% endif %}\n  {% set sec = [closed + active, 0] | max | int %}\n  {% set d = sec // 86400 %}\n  {% set h = (sec % 86400) // 3600 %}\n  {% set m = (sec % 3600) // 60 %}\n  {% set s = sec % 60 %}\n  {{ (d ~ ' д. ' if d > 0 else '') ~ ('%02d:%02d:%02d' | format(h,m,s)) }}\n{% endif %}"
      availability: "{{\n  state_attr('input_datetime.dt_internet_offline_total', 'timestamp') is number\n  and state_attr('input_datetime.dt_internet_last_failure', 'timestamp') is number\n  and state_attr('input_datetime.dt_internet_last_restore', 'timestamp') is number\n}}"
      attributes:
        seconds: "{% set month_start = as_timestamp(\n  now().replace(day=1, hour=0, minute=0, second=0, microsecond=0)\n) %} {% set total = state_attr('input_datetime.dt_internet_offline_total', 'timestamp') %} {% set failure = state_attr('input_datetime.dt_internet_last_failure', 'timestamp') %} {% set restore = state_attr('input_datetime.dt_internet_last_restore', 'timestamp') %} {% if total is not number or failure is not number or restore is not number %}\n  {{ none }}\n{% else %}\n  {% set closed = [total - month_start, 0] | max %}\n  {% set active = 0 %}\n  {% if failure > restore %}\n    {% set active_start = [failure, month_start] | max %}\n    {% set active = [now().timestamp() - active_start, 0] | max %}\n  {% endif %}\n  {{ [closed + active, 0] | max | round(0) }}\n{% endif %}"
    - name: Internet availability month
      unique_id: internet_availability_month_id
      icon: mdi:percent-circle-outline
      unit_of_measurement: '%'
      state_class: measurement
      state: "{% set online = state_attr('sensor.internet_online_month', 'seconds') %} {% set offline = state_attr('sensor.internet_offline_month', 'seconds') %} {% if online is not number or offline is not number %}\n  {{ none }}\n{% else %}\n  {% set total = online + offline %}\n  {{ ((online / total) * 100) | round(2) if total > 0 else none }}\n{% endif %}"
      availability: "{{\n  state_attr('sensor.internet_online_month', 'seconds') is number\n  and state_attr('sensor.internet_offline_month', 'seconds') is number\n  and (\n    state_attr('sensor.internet_online_month', 'seconds')\n    + state_attr('sensor.internet_offline_month', 'seconds')\n  ) > 0\n}}"
    - name: Internet last outage duration
      unique_id: internet_last_outage_duration_id
      icon: mdi:timer-outline
      state: "{% set failure = state_attr('input_datetime.dt_internet_last_failure', 'timestamp') %} {% set restore = state_attr('input_datetime.dt_internet_last_restore', 'timestamp') %} {% if failure is not number or restore is not number or restore < failure %}\n  {{ none }}\n{% else %}\n  {% set sec = [restore - failure, 0] | max | int %}\n  {% set d = sec // 86400 %}\n  {% set h = (sec % 86400) // 3600 %}\n  {% set m = (sec % 3600) // 60 %}\n  {% set s = sec % 60 %}\n  {{ (d ~ ' д. ' if d > 0 else '') ~ ('%02d:%02d:%02d' | format(h,m,s)) }}\n{% endif %}"
      availability: '{% set failure = state_attr(''input_datetime.dt_internet_last_failure'', ''timestamp'') %} {% set restore = state_attr(''input_datetime.dt_internet_last_restore'', ''timestamp'') %} {{ failure is number and restore is number and restore > failure and (restore - failure) > 1 }}'
    - name: Internet downtime
      unique_id: internet_downtime_sensor_id
      icon: mdi:timer-alert-outline
      state: '{{ states(''sensor.internet_last_outage_duration'') }}'
      availability: '{{ states(''sensor.internet_last_outage_duration'') not in [''unknown'',''unavailable'',''none'',''''] }}'
  - binary_sensor:
    - name: Internet package ready
      unique_id: internet_package_ready_id
      icon: mdi:check-network-outline
      state: '{{ states(''binary_sensor.internet_status'') in [''on'', ''off''] }}'
      delay_on: 00:00:30
  - binary_sensor:
    - name: Internet passport valid
      default_entity_id: binary_sensor.internet_passport_valid
      unique_id: internet_passport_valid_id
      icon: mdi:shield-check-outline
      state: >-
        {% set p = 'binary_sensor.bs_internet_passport' %}
        {% set ns = namespace(valid=true) %}
        {% if states(p) != 'on' %}
          {% set ns.valid = false %}
        {% endif %}
        {% for attr in ['site_name', 'router_model', 'router_ip'] %}
          {% set v = state_attr(p, attr) %}
          {% if v is none or v | string | trim == '' %}
            {% set ns.valid = false %}
          {% endif %}
        {% endfor %}
        {% set required = [('router_ping_entity_id', 'binary_sensor.')] %}
        {% set optional = [
          ('router_wan_status_entity_id', 'binary_sensor.'),
          ('router_wan_state_entity_id', 'sensor.'),
          ('router_external_ip_entity_id', 'sensor.'),
          ('router_traffic_download_total_entity_id', 'sensor.'),
          ('router_traffic_upload_total_entity_id', 'sensor.'),
          ('router_download_speed_entity_id', 'sensor.'),
          ('router_upload_speed_entity_id', 'sensor.'),
          ('router_uptime_entity_id', 'sensor.'),
          ('router_last_boot_entity_id', 'sensor.'),
          ('router_devices_connected_entity_id', 'sensor.'),
          ('router_cpu_temperature_entity_id', 'sensor.'),
          ('ont_ping_entity_id', 'binary_sensor.')
        ] %}
        {% for attr, domain in required %}
          {% set eid = state_attr(p, attr) %}
          {% if eid is none or eid | string | trim == '' or not (eid | string).startswith(domain) or entity_name(eid) is none %}
            {% set ns.valid = false %}
          {% endif %}
        {% endfor %}
        {% for attr, domain in optional %}
          {% set eid = state_attr(p, attr) %}
          {% if eid is not none and eid | string | trim != '' %}
            {% if not (eid | string).startswith(domain) or entity_name(eid) is none %}
              {% set ns.valid = false %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {% for prefix in ['ont', 'router'] %}
          {% set method = state_attr(p, prefix ~ '_recovery_method') | default('none', true) | string | lower | trim %}
          {% set eid = state_attr(p, prefix ~ '_recovery_entity_id') %}
          {% set power_off_s = state_attr(p, prefix ~ '_recovery_power_off_s') %}
          {% if method not in ['none', 'switch', 'button', 'script'] %}
            {% set ns.valid = false %}
          {% elif method == 'none' %}
            {% if eid is not none and eid | string | trim != '' %}
              {% set ns.valid = false %}
            {% endif %}
          {% else %}
            {% if eid is none or eid | string | trim == '' or not (eid | string).startswith(method ~ '.') or entity_name(eid) is none %}
              {% set ns.valid = false %}
            {% elif method == 'switch' and states(eid) not in ['on', 'off'] %}
              {% set ns.valid = false %}
            {% elif method in ['button', 'script'] and states(eid) == 'unavailable' %}
              {% set ns.valid = false %}
            {% endif %}
            {% if method == 'script' and eid in ['script.internet_reboot_ont', 'script.internet_reboot_router'] %}
              {% set ns.valid = false %}
            {% endif %}
            {% if method == 'switch' and (power_off_s is none or not is_number(power_off_s) or power_off_s | int <= 0) %}
              {% set ns.valid = false %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.valid }}
      attributes:
        reasons: >-
          {% set p = 'binary_sensor.bs_internet_passport' %}
          {% set ns = namespace(r=[]) %}
          {% if states(p) != 'on' %}
            {% set ns.r = ns.r + ['passport_entity_missing_or_off'] %}
          {% endif %}
          {% for attr in ['site_name', 'router_model', 'router_ip'] %}
            {% set v = state_attr(p, attr) %}
            {% if v is none or v | string | trim == '' %}
              {% set ns.r = ns.r + [attr ~ '_not_set'] %}
            {% endif %}
          {% endfor %}
          {% set required = [('router_ping_entity_id', 'binary_sensor.')] %}
          {% set optional = [
            ('router_wan_status_entity_id', 'binary_sensor.'),
            ('router_wan_state_entity_id', 'sensor.'),
            ('router_external_ip_entity_id', 'sensor.'),
            ('router_traffic_download_total_entity_id', 'sensor.'),
            ('router_traffic_upload_total_entity_id', 'sensor.'),
            ('router_download_speed_entity_id', 'sensor.'),
            ('router_upload_speed_entity_id', 'sensor.'),
            ('router_uptime_entity_id', 'sensor.'),
            ('router_last_boot_entity_id', 'sensor.'),
            ('router_devices_connected_entity_id', 'sensor.'),
            ('router_cpu_temperature_entity_id', 'sensor.'),
            ('ont_ping_entity_id', 'binary_sensor.')
          ] %}
          {% for attr, domain in required %}
            {% set eid = state_attr(p, attr) %}
            {% if eid is none or eid | string | trim == '' %}
              {% set ns.r = ns.r + [attr ~ '_not_set'] %}
            {% elif not (eid | string).startswith(domain) %}
              {% set ns.r = ns.r + [attr ~ '_wrong_domain'] %}
            {% elif entity_name(eid) is none %}
              {% set ns.r = ns.r + [attr ~ '_missing'] %}
            {% endif %}
          {% endfor %}
          {% for attr, domain in optional %}
            {% set eid = state_attr(p, attr) %}
            {% if eid is not none and eid | string | trim != '' %}
              {% if not (eid | string).startswith(domain) %}
                {% set ns.r = ns.r + [attr ~ '_wrong_domain'] %}
              {% elif entity_name(eid) is none %}
                {% set ns.r = ns.r + [attr ~ '_missing'] %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% for prefix in ['ont', 'router'] %}
            {% set method = state_attr(p, prefix ~ '_recovery_method') | default('none', true) | string | lower | trim %}
            {% set eid = state_attr(p, prefix ~ '_recovery_entity_id') %}
            {% set power_off_s = state_attr(p, prefix ~ '_recovery_power_off_s') %}
            {% if method not in ['none', 'switch', 'button', 'script'] %}
              {% set ns.r = ns.r + [prefix ~ '_recovery_method_invalid'] %}
            {% elif method == 'none' %}
              {% if eid is not none and eid | string | trim != '' %}
                {% set ns.r = ns.r + [prefix ~ '_recovery_entity_set_with_none_method'] %}
              {% endif %}
            {% else %}
              {% if eid is none or eid | string | trim == '' %}
                {% set ns.r = ns.r + [prefix ~ '_recovery_entity_not_set'] %}
              {% elif not (eid | string).startswith(method ~ '.') %}
                {% set ns.r = ns.r + [prefix ~ '_recovery_entity_wrong_domain'] %}
              {% elif entity_name(eid) is none %}
                {% set ns.r = ns.r + [prefix ~ '_recovery_entity_missing'] %}
              {% elif method == 'switch' and states(eid) not in ['on', 'off'] %}
                {% set ns.r = ns.r + [prefix ~ '_recovery_entity_unavailable'] %}
              {% elif method in ['button', 'script'] and states(eid) == 'unavailable' %}
                {% set ns.r = ns.r + [prefix ~ '_recovery_entity_unavailable'] %}
              {% endif %}
              {% if method == 'script' and eid in ['script.internet_reboot_ont', 'script.internet_reboot_router'] %}
                {% set ns.r = ns.r + [prefix ~ '_recovery_script_recursive'] %}
              {% endif %}
              {% if method == 'switch' and (power_off_s is none or not is_number(power_off_s) or power_off_s | int <= 0) %}
                {% set ns.r = ns.r + [prefix ~ '_recovery_power_off_s_invalid'] %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.r }}

    - name: bs_router_ping_effective
      default_entity_id: binary_sensor.bs_router_ping_effective
      unique_id: bs_router_ping_effective_id
      device_class: connectivity
      state: >-
        {% set eid = state_attr('binary_sensor.bs_internet_passport', 'router_ping_entity_id') %}
        {{ is_state(eid, 'on') if eid else false }}
      availability: >-
        {% set eid = state_attr('binary_sensor.bs_internet_passport', 'router_ping_entity_id') %}
        {{ is_state('binary_sensor.internet_passport_valid', 'on') and eid and states(eid) in ['on', 'off'] }}

    - name: Router is on
      default_entity_id: binary_sensor.router_is_on
      unique_id: router_is_on_id
      device_class: connectivity
      state: "{{ is_state('binary_sensor.bs_router_ping_effective', 'on') }}"
      availability: "{{ states('binary_sensor.bs_router_ping_effective') in ['on', 'off'] }}"

    - name: bs_router_wan_effective
      default_entity_id: binary_sensor.bs_router_wan_effective
      unique_id: bs_router_wan_effective_id
      device_class: connectivity
      state: >-
        {% set eid = state_attr('binary_sensor.bs_internet_passport', 'router_wan_status_entity_id') %}
        {{ is_state(eid, 'on') if eid else false }}
      availability: >-
        {% set eid = state_attr('binary_sensor.bs_internet_passport', 'router_wan_status_entity_id') %}
        {{ is_state('binary_sensor.internet_passport_valid', 'on') and eid and states(eid) in ['on', 'off'] }}

    - name: Internet ONT recovery available
      default_entity_id: binary_sensor.internet_recovery_ont_available
      unique_id: internet_recovery_ont_available_id
      device_class: connectivity
      state: >-
        {% set method = state_attr('binary_sensor.bs_internet_passport', 'ont_recovery_method') | default('none', true) | string | lower | trim %}
        {% set entity_id = state_attr('binary_sensor.bs_internet_passport', 'ont_recovery_entity_id') %}
        {% set exists = entity_id and entity_name(entity_id) is not none %}
        {% set usable =
          (method == 'switch' and exists and states(entity_id) in ['on', 'off'])
          or (method in ['button', 'script'] and exists and states(entity_id) != 'unavailable')
        %}
        {{ is_state('binary_sensor.internet_passport_valid', 'on') and method != 'none' and usable }}
      attributes:
        recovery_method: "{{ state_attr('binary_sensor.bs_internet_passport', 'ont_recovery_method') or 'none' }}"
        recovery_entity_id: "{{ state_attr('binary_sensor.bs_internet_passport', 'ont_recovery_entity_id') or '' }}"
        power_off_s: "{{ state_attr('binary_sensor.bs_internet_passport', 'ont_recovery_power_off_s') or '' }}"

    - name: Internet router recovery available
      default_entity_id: binary_sensor.internet_recovery_router_available
      unique_id: internet_recovery_router_available_id
      device_class: connectivity
      state: >-
        {% set method = state_attr('binary_sensor.bs_internet_passport', 'router_recovery_method') | default('none', true) | string | lower | trim %}
        {% set entity_id = state_attr('binary_sensor.bs_internet_passport', 'router_recovery_entity_id') %}
        {% set exists = entity_id and entity_name(entity_id) is not none %}
        {% set usable =
          (method == 'switch' and exists and states(entity_id) in ['on', 'off'])
          or (method in ['button', 'script'] and exists and states(entity_id) != 'unavailable')
        %}
        {{ is_state('binary_sensor.internet_passport_valid', 'on') and method != 'none' and usable }}
      attributes:
        recovery_method: "{{ state_attr('binary_sensor.bs_internet_passport', 'router_recovery_method') or 'none' }}"
        recovery_entity_id: "{{ state_attr('binary_sensor.bs_internet_passport', 'router_recovery_entity_id') or '' }}"
        power_off_s: "{{ state_attr('binary_sensor.bs_internet_passport', 'router_recovery_power_off_s') or '' }}"

    - name: Internet recovery available
      default_entity_id: binary_sensor.internet_recovery_available
      unique_id: internet_recovery_available_id
      device_class: connectivity
      state: >-
        {{ is_state('binary_sensor.internet_recovery_ont_available', 'on') or is_state('binary_sensor.internet_recovery_router_available', 'on') }}

    sensor:
    - name: Router WAN status effective
      default_entity_id: sensor.router_wan_status_effective
      unique_id: router_wan_status_effective_id
      state: >-
        {% set eid = state_attr('binary_sensor.bs_internet_passport', 'router_wan_state_entity_id') %}
        {{ states(eid) if eid and states(eid) not in ['unknown', 'unavailable'] else none }}
      availability: >-
        {% set eid = state_attr('binary_sensor.bs_internet_passport', 'router_wan_state_entity_id') %}
        {{ is_state('binary_sensor.internet_passport_valid', 'on') and eid and has_value(eid) }}

    - name: Router external IP effective
      default_entity_id: sensor.router_external_ip_effective
      unique_id: router_external_ip_effective_id
      icon: mdi:ip-network-outline
      state: >-
        {% set eid = state_attr('binary_sensor.bs_internet_passport', 'router_external_ip_entity_id') %}
        {{ states(eid) if eid and has_value(eid) else none }}
      availability: >-
        {% set eid = state_attr('binary_sensor.bs_internet_passport', 'router_external_ip_entity_id') %}
        {{ is_state('binary_sensor.internet_passport_valid', 'on') and eid and has_value(eid) }}

    - name: router_traffic_download_effective
