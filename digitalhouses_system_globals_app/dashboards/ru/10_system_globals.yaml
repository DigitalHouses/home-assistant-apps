# Canonical owner View. Placement belongs to DH Sync.
title: System Globals
path: system-globals
icon: mdi:state-machine
type: sections
max_columns: 3
dense_section_placement: false
sections:
- type: grid
  cards:
  - type: heading
    heading_style: title
    heading: Система
  - type: vertical-stack
    cards:
    - type: custom:button-card
      entity: sensor.dh_system_globals_app_card
      triggers_update:
      - sensor.dh_system_globals_app_card
      - sensor.dh_system_globals_app_version
      - sensor.dh_system_globals_app_latest_version
      - binary_sensor.dh_system_globals_app_update_available
      - binary_sensor.dh_system_globals_app_system_ready
      - update.digitalhouses_system_globals_app_update
      update_timer: |
        [[[
          const s = states['sensor.dh_system_globals_app_card']?.state;
          const updating =
            states['update.digitalhouses_system_globals_app_update']?.attributes?.in_progress === true;
          return s === 'running' || updating ? 1000 : 5000;
        ]]]
      show_icon: true
      show_name: true
      show_label: true
      icon: |
        [[[
          const s = states['sensor.dh_system_globals_app_card']?.state;
          const ready = states['binary_sensor.dh_system_globals_app_system_ready']?.state;
          const upgrade =
            states['binary_sensor.dh_system_globals_app_update_available']?.state === 'on';
          const updating =
            states['update.digitalhouses_system_globals_app_update']?.attributes?.in_progress === true;

          if (updating || s === 'running') return 'mdi:progress-clock';
          if (s === 'error') return 'mdi:alert-circle';
          if (s === 'success') return 'mdi:check-circle';
          if (!s || ['unknown','unavailable'].includes(s)) return 'mdi:alert-circle';
          if (ready !== 'on') return 'mdi:shield-alert';
          if (upgrade) return 'mdi:package-up';
          return 'mdi:state-machine';
        ]]]
      name: |
        [[[
          const installed = states['sensor.dh_system_globals_app_version']?.state;
          const latest = states['sensor.dh_system_globals_app_latest_version']?.state;
          const available =
            states['binary_sensor.dh_system_globals_app_update_available']?.state === 'on';
          const valid = (v) =>
            typeof v === 'string'
            && !['unknown', 'unavailable', 'none', ''].includes(v);
          const upgrade =
            available && valid(installed) && valid(latest) && latest !== installed;

          return 'System Globals' + (valid(installed)
            ? ' · v' + installed + (upgrade ? ' → v' + latest : '')
            : '');
        ]]]
      label: |
        [[[
          const item = states['sensor.dh_system_globals_app_card'];
          const ready = states['binary_sensor.dh_system_globals_app_system_ready']?.state;
          const supervisorUpdate = states['update.digitalhouses_system_globals_app_update'];

          const elapsedText = (since) => {
            const seconds = Math.max(
              0,
              Math.floor((performance.now() - since) / 1000)
            );
            const mm = String(Math.floor(seconds / 60)).padStart(2, '0');
            const ss = String(seconds % 60).padStart(2, '0');
            return mm + ':' + ss;
          };
          const duration = (value) => {
            if (typeof value !== 'number') return '—';
            const seconds = Math.round(Math.max(0, value));
            const minutes = Math.floor(seconds / 60);
            return minutes
              ? minutes + ' мин ' + String(seconds % 60).padStart(2, '0') + ' сек'
              : seconds + ' сек';
          };

          if (supervisorUpdate?.attributes?.in_progress === true) {
            if (this._dh_system_globals_timer?.operation !== 'install') {
              this._dh_system_globals_timer = {
                operation: 'install',
                since: performance.now()
              };
            }
            const pct = supervisorUpdate.attributes.update_percentage;
            return 'Установка версии… '
              + (typeof pct === 'number' ? Math.round(pct) + '% · ' : '')
              + elapsedText(this._dh_system_globals_timer.since);
          }

          if (!item || ['unknown', 'unavailable'].includes(item.state)) {
            return 'Нет связи с приложением';
          }

          const a = item.attributes || {};
          const operation = a.operation;
          const names = {
            refresh: 'Обновление данных',
            check: 'Проверка версии'
          };

          if (item.state === 'running') {
            const key = String(operation) + '|' + String(a.started_at || '');
            if (this._dh_system_globals_timer?.key !== key) {
              this._dh_system_globals_timer = {
                key: key,
                operation: operation,
                since: performance.now()
              };
            }
            return (names[operation] || 'Операция') + '… '
              + elapsedText(this._dh_system_globals_timer.since);
          }

          this._dh_system_globals_timer = null;

          if (item.state === 'error') {
            return 'Ошибка: ' + (a.error || 'операция не выполнена');
          }

          if (item.state === 'success') {
            let message = operation === 'refresh'
              ? 'Данные обновлены'
              : operation === 'check'
                ? (
                    states['binary_sensor.dh_system_globals_app_update_available']?.state === 'on'
                      ? 'Доступна новая версия'
                      : states['binary_sensor.dh_system_globals_app_update_available']?.state === 'off'
                        ? 'Версия актуальна'
                        : 'Проверка завершена'
                  )
                : 'Готово';
            return message + ' · ' + duration(a.duration_seconds);
          }

          if (states['binary_sensor.dh_system_globals_app_update_available']?.state === 'on') {
            return 'Доступна новая версия';
          }
          if (ready === 'off') return 'Gate закрыт';
          if (ready === 'on') return 'Система готова';
          return 'Ожидание данных';
        ]]]
      styles:
        card:
        - padding: 12px
        - text-align: left
        grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 48px 1fr
        - grid-template-rows: min-content min-content
        img_cell:
        - width: 40px
        - justify-content: start
        icon:
        - width: 26px
        - color: |
            [[[
              const s = states['sensor.dh_system_globals_app_card']?.state;
              const ready = states['binary_sensor.dh_system_globals_app_system_ready']?.state;
              const upgrade =
                states['binary_sensor.dh_system_globals_app_update_available']?.state === 'on';
              const updating =
                states['update.digitalhouses_system_globals_app_update']?.attributes?.in_progress === true;

              return s === 'error' || !s || ['unknown','unavailable'].includes(s)
                ? 'var(--error-color)'
                : s === 'running' || updating
                  ? 'var(--info-color, var(--primary-color))'
                  : s === 'success'
                    ? 'var(--success-color, var(--primary-color))'
                    : ready === 'off' || upgrade
                      ? 'var(--warning-color, orange)'
                      : ready === 'on'
                        ? 'var(--success-color, var(--primary-color))'
                        : 'var(--secondary-text-color)';
            ]]]
        name:
        - justify-self: start
        - font-size: 14px
        - font-weight: 600
        label:
        - justify-self: start
        - white-space: normal
        - text-align: left
        - font-size: 13px
        - color: var(--secondary-text-color)
      tap_action:
        action: none
    - type: custom:mushroom-chips-card
      alignment: center
      chips:
      - type: template
        icon: mdi:refresh
        content: Обновить
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.dh_system_globals_app_refresh
      - type: template
        icon: mdi:cloud-search
        content: Версия
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.dh_system_globals_app_check_updates
      - type: conditional
        conditions:
        - entity: update.digitalhouses_system_globals_app_update
          state: 'on'
        chip:
          type: template
          icon: mdi:package-down
          icon_color: orange
          content: Новая версия
          tap_action:
            action: perform-action
            perform_action: update.install
            target:
              entity_id: update.digitalhouses_system_globals_app_update
            data:
              backup: true
            confirmation:
              text: Установить новую версию System Globals? Перед обновлением Home Assistant создаст резервную копию
                App. Глобальное расписание и контроль готовности временно прервутся.
      - type: template
        icon: mdi:restart
        content: Перезапуск
        tap_action:
          action: perform-action
          perform_action: hassio.app_restart
          data:
            app: 8133339d_digitalhouses_system_globals_app
          confirmation:
            text: Перезапустить System Globals? Глобальное расписание и контроль готовности временно прервутся.
    grid_options:
      columns: 12
  - type: custom:mushroom-template-card
    entity: binary_sensor.dh_system_globals_app_system_ready
    primary: >-
      {{ 'Система готова' if is_state(entity, 'on')
         else 'Система не готова' if is_state(entity, 'off')
         else 'Готовность неизвестна' }}
    secondary: >-
      {{ 'Gate открыт' if is_state(entity, 'on')
         else 'Gate закрыт' if is_state(entity, 'off')
         else 'Нет данных' }}
    icon: mdi:shield-check-outline
    color: >-
      {{ 'green' if is_state(entity, 'on') else 'red' if is_state(entity, 'off') else 'disabled' }}
    tap_action:
      action: more-info
    grid_options:
      columns: full
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
    - type: template
      entity: binary_sensor.dh_system_globals_app_mqtt_ready
      icon: mdi:check-network-outline
      icon_color: >-
        {{ 'green' if is_state(entity, 'on') else 'red' if is_state(entity, 'off') else 'grey' }}
      content: >-
        MQTT · {{ 'OK' if is_state(entity, 'on') else 'Нет' if is_state(entity, 'off') else '?' }}
      tap_action:
        action: more-info
    - type: template
      entity: binary_sensor.dh_system_globals_app_ha_ready
      icon: mdi:home-assistant
      icon_color: >-
        {{ 'green' if is_state(entity, 'on') else 'red' if is_state(entity, 'off') else 'grey' }}
      content: >-
        HA · {{ 'OK' if is_state(entity, 'on') else 'Нет' if is_state(entity, 'off') else '?' }}
      tap_action:
        action: more-info
    - type: template
      entity: binary_sensor.dh_system_globals_app_zigbee_ready
      icon: mdi:zigbee
      icon_color: >-
        {{ 'green' if is_state(entity, 'on') else 'red' if is_state(entity, 'off') else 'grey' }}
      content: >-
        Zigbee · {{ 'OK' if is_state(entity, 'on') else 'Нет' if is_state(entity, 'off') else '?' }}
      tap_action:
        action: more-info
    grid_options:
      columns: full
  - type: grid
    grid_options:
      columns: full
      rows: auto
    columns: 1
    square: false
    cards:
    - type: custom:mushroom-entity-card
      entity: switch.dh_system_globals_app_night_mode
      name: Ночной режим
      icon: mdi:weather-night
      layout: horizontal
      fill_container: true
      tap_action:
        action: toggle
    - type: custom:mushroom-entity-card
      entity: switch.dh_system_globals_app_auto_switch
      name: Автопереключение
      icon: mdi:calendar-clock
      layout: horizontal
      fill_container: true
      tap_action:
        action: toggle
    - type: custom:mushroom-entity-card
      entity: text.dh_system_globals_app_night_start
      name: Начало ночи
      icon: mdi:weather-sunset-down
      layout: horizontal
      fill_container: true
      tap_action:
        action: more-info
    - type: custom:mushroom-entity-card
      entity: text.dh_system_globals_app_night_end
      name: Конец ночи
      icon: mdi:weather-sunset-up
      layout: horizontal
      fill_container: true
      tap_action:
        action: more-info
    - type: custom:mushroom-entity-card
      entity: sensor.dh_system_globals_app_timezone
      name: Часовой пояс
      icon: mdi:earth
      layout: horizontal
      fill_container: true
      tap_action:
        action: more-info
  - type: history-graph
    title: История ночного режима
    hours_to_show: 24
    grid_options:
      columns: full
      rows: auto
    entities:
    - entity: switch.dh_system_globals_app_night_mode
      name: Ночной режим
  - type: custom:mushroom-title-card
    title: Активные параметры
    grid_options:
      columns: full
  - type: grid
    grid_options:
      columns: full
      rows: auto
    columns: 1
    square: false
    cards:
    - type: custom:mushroom-entity-card
      entity: sensor.dh_system_globals_app_active_brightness
      name: Яркость
      icon: mdi:brightness-6
      layout: horizontal
      fill_container: true
      tap_action:
        action: more-info
    - type: custom:mushroom-entity-card
      entity: sensor.dh_system_globals_app_active_color_temp_kelvin
      name: Температура, K
      icon: mdi:thermometer
      layout: horizontal
      fill_container: true
      tap_action:
        action: more-info
    - type: custom:mushroom-template-card
      entity: sensor.dh_system_globals_app_active_rgb_color
      color: >-
        {% set rgb = states(entity) | from_json(default=none) %}
        {{ '#%02X%02X%02X' | format(rgb[0], rgb[1], rgb[2])
           if rgb is sequence and rgb is not string and rgb is not mapping and rgb | count == 3
           and rgb[0] is integer and rgb[1] is integer and rgb[2] is integer else 'disabled' }}
      primary: Цвет RGB
      icon: mdi:palette
      secondary: >-
        {% set rgb = states(entity) | from_json(default=none) %}
        {{ 'Задан' if rgb is sequence and rgb is not string and rgb | count == 3 else 'Не задан / недоступен' }}
      tap_action:
        action: none
    - type: custom:mushroom-entity-card
      entity: sensor.dh_system_globals_app_active_volume
      name: Громкость
      icon: mdi:volume-high
      layout: horizontal
      fill_container: true
      tap_action:
        action: more-info
- type: grid
