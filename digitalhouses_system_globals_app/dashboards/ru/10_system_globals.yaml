# Canonical owner View. Placement belongs to DH Sync.
title: System Globals
path: system-globals
icon: mdi:state-machine
type: sections
max_columns: 2
sections:
- type: grid
  cards:
  - type: heading
    heading_style: title
    heading: System Globals
  - type: vertical-stack
    cards:
    - type: custom:button-card
      entity: sensor.dh_system_globals_app_card
      triggers_update:
      - sensor.dh_system_globals_app_card
      - sensor.dh_system_globals_app_version
      - sensor.dh_system_globals_app_latest_version
      - binary_sensor.dh_system_globals_app_update_available
      - binary_sensor.dh_system_globals_app_system_ready
      - update.digitalhouses_system_globals_app_update
      update_timer: |
        [[[
          const s = states['sensor.dh_system_globals_app_card']?.state;
          const updating =
            states['update.digitalhouses_system_globals_app_update']?.attributes?.in_progress === true;
          return s === 'running' || updating ? 1000 : 5000;
        ]]]
      show_icon: true
      show_name: true
      show_label: true
      icon: |
        [[[
          const s = states['sensor.dh_system_globals_app_card']?.state;
          const ready = states['binary_sensor.dh_system_globals_app_system_ready']?.state;
          const upgrade =
            states['binary_sensor.dh_system_globals_app_update_available']?.state === 'on';
          const updating =
            states['update.digitalhouses_system_globals_app_update']?.attributes?.in_progress === true;

          if (updating || s === 'running') return 'mdi:progress-clock';
          if (s === 'error') return 'mdi:alert-circle';
          if (s === 'success') return 'mdi:check-circle';
          if (!s || ['unknown','unavailable'].includes(s)) return 'mdi:alert-circle';
          if (ready !== 'on') return 'mdi:shield-alert';
          if (upgrade) return 'mdi:package-up';
          return 'mdi:state-machine';
        ]]]
      name: |
        [[[
          const installed = states['sensor.dh_system_globals_app_version']?.state;
          const latest = states['sensor.dh_system_globals_app_latest_version']?.state;
          const available =
            states['binary_sensor.dh_system_globals_app_update_available']?.state === 'on';
          const valid = (v) =>
            typeof v === 'string'
            && !['unknown', 'unavailable', 'none', ''].includes(v);
          const upgrade =
            available && valid(installed) && valid(latest) && latest !== installed;

          return 'System Globals' + (valid(installed)
            ? ' · v' + installed + (upgrade ? ' → v' + latest : '')
            : '');
        ]]]
      label: |
        [[[
          const item = states['sensor.dh_system_globals_app_card'];
          const ready = states['binary_sensor.dh_system_globals_app_system_ready']?.state;
          const supervisorUpdate = states['update.digitalhouses_system_globals_app_update'];

          const elapsedText = (since) => {
            const seconds = Math.max(
              0,
              Math.floor((performance.now() - since) / 1000)
            );
            const mm = String(Math.floor(seconds / 60)).padStart(2, '0');
            const ss = String(seconds % 60).padStart(2, '0');
            return mm + ':' + ss;
          };
          const duration = (value) => {
            if (typeof value !== 'number') return '—';
            const seconds = Math.round(Math.max(0, value));
            const minutes = Math.floor(seconds / 60);
            return minutes
              ? minutes + ' мин ' + String(seconds % 60).padStart(2, '0') + ' сек'
              : seconds + ' сек';
          };

          if (supervisorUpdate?.attributes?.in_progress === true) {
            if (this._dh_system_globals_timer?.operation !== 'install') {
              this._dh_system_globals_timer = {
                operation: 'install',
                since: performance.now()
              };
            }
            const pct = supervisorUpdate.attributes.update_percentage;
            return 'Установка версии… '
              + (typeof pct === 'number' ? Math.round(pct) + '% · ' : '')
              + elapsedText(this._dh_system_globals_timer.since);
          }

          if (!item || ['unknown', 'unavailable'].includes(item.state)) {
            return 'Нет связи с приложением';
          }

          const a = item.attributes || {};
          const operation = a.operation;
          const names = {
            refresh: 'Обновление данных',
            check: 'Проверка версии'
          };

          if (item.state === 'running') {
            const key = String(operation) + '|' + String(a.started_at || '');
            if (this._dh_system_globals_timer?.key !== key) {
              this._dh_system_globals_timer = {
                key: key,
                operation: operation,
                since: performance.now()
              };
            }
            return (names[operation] || 'Операция') + '… '
              + elapsedText(this._dh_system_globals_timer.since);
          }

          this._dh_system_globals_timer = null;

          if (item.state === 'error') {
            return 'Ошибка: ' + (a.error || 'операция не выполнена');
          }

          if (item.state === 'success') {
            let message = operation === 'refresh'
              ? 'Данные обновлены'
              : operation === 'check'
                ? (
                    states['binary_sensor.dh_system_globals_app_update_available']?.state === 'on'
                      ? 'Доступна новая версия'
                      : states['binary_sensor.dh_system_globals_app_update_available']?.state === 'off'
                        ? 'Версия актуальна'
                        : 'Проверка завершена'
                  )
                : 'Готово';
            return message + ' · ' + duration(a.duration_seconds);
          }

          if (states['binary_sensor.dh_system_globals_app_update_available']?.state === 'on') {
            return 'Доступна новая версия';
          }
          if (ready === 'off') return 'Gate закрыт';
          if (ready === 'on') return 'Система готова';
          return 'Ожидание данных';
        ]]]
      styles:
        card:
        - padding: 12px
        - text-align: left
        grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 48px 1fr
        - grid-template-rows: min-content min-content
        img_cell:
        - width: 40px
        - justify-content: start
        icon:
        - width: 26px
        - color: |
            [[[
              const s = states['sensor.dh_system_globals_app_card']?.state;
              const ready = states['binary_sensor.dh_system_globals_app_system_ready']?.state;
              const upgrade =
                states['binary_sensor.dh_system_globals_app_update_available']?.state === 'on';
              const updating =
                states['update.digitalhouses_system_globals_app_update']?.attributes?.in_progress === true;

              return s === 'error' || !s || ['unknown','unavailable'].includes(s)
                ? 'var(--error-color)'
                : s === 'running' || updating
                  ? 'var(--info-color, var(--primary-color))'
                  : s === 'success'
                    ? 'var(--success-color, var(--primary-color))'
                    : ready === 'off' || upgrade
                      ? 'var(--warning-color, orange)'
                      : ready === 'on'
                        ? 'var(--success-color, var(--primary-color))'
                        : 'var(--secondary-text-color)';
            ]]]
        name:
        - justify-self: start
        - font-size: 14px
        - font-weight: 600
        label:
        - justify-self: start
        - white-space: normal
        - text-align: left
        - font-size: 13px
        - color: var(--secondary-text-color)
      tap_action:
        action: none
    - type: custom:mushroom-chips-card
      alignment: center
      chips:
      - type: template
        icon: mdi:refresh
        content: Обновить
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.dh_system_globals_app_refresh
      - type: template
        icon: mdi:cloud-search
        content: Версия
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.dh_system_globals_app_check_updates
      - type: conditional
        conditions:
        - entity: update.digitalhouses_system_globals_app_update
          state: 'on'
        chip:
          type: template
          icon: mdi:package-down
          icon_color: orange
          content: Новая версия
          tap_action:
            action: perform-action
            perform_action: update.install
            target:
              entity_id: update.digitalhouses_system_globals_app_update
            data:
              backup: true
            confirmation:
              text: Установить новую версию System Globals? Перед обновлением Home Assistant создаст резервную копию
                App. Глобальное расписание и контроль готовности временно прервутся.
      - type: template
        icon: mdi:restart
        content: Перезапуск
        tap_action:
          action: perform-action
          perform_action: hassio.app_restart
          data:
            app: 8133339d_digitalhouses_system_globals_app
          confirmation:
            text: Перезапустить System Globals? Глобальное расписание и контроль готовности временно прервутся.
    grid_options:
      columns: 12
  - type: entities
    show_header_toggle: false
    title: День / Ночь
    entities:
    - entity: switch.dh_system_globals_app_night_mode
      name: Ночной режим
    - entity: switch.dh_system_globals_app_auto_switch
      name: Автоматическое переключение
    - entity: text.dh_system_globals_app_night_start
      name: Начало ночи
    - entity: text.dh_system_globals_app_night_end
      name: Конец ночи
    - entity: sensor.dh_system_globals_app_timezone
      name: Часовой пояс
  - type: history-graph
    title: История ночного режима
    hours_to_show: 24
    entities:
    - entity: switch.dh_system_globals_app_night_mode
      name: Ночной режим
  - type: entities
    show_header_toggle: false
    title: Активные параметры
    entities:
    - entity: sensor.dh_system_globals_app_active_brightness
      name: Яркость
    - entity: sensor.dh_system_globals_app_active_color_temp_kelvin
      name: Цветовая температура
    - entity: sensor.dh_system_globals_app_active_rgb_color
      name: Цвет RGB
    - entity: sensor.dh_system_globals_app_active_volume
      name: Громкость
- type: grid
  cards:
  - type: heading
    heading_style: title
    heading: Глобальные профили
  - type: vertical-stack
    cards:
    - type: entities
      show_header_toggle: false
      title: День
      entities:
      - entity: number.dh_system_globals_app_day_brightness
        name: Яркость
      - entity: number.dh_system_globals_app_day_volume
        name: Громкость
      - entity: number.dh_system_globals_app_day_transition_seconds
        name: Плавный переход
      - entity: text.dh_system_globals_app_day_color_temp_kelvin
        name: Цветовая температура, K
      - entity: switch.dh_system_globals_app_day_voice_notifications_enabled
        name: Голосовые уведомления
      - entity: switch.dh_system_globals_app_day_noncritical_sound_notifications_enabled
        name: Некритические звуки
    - type: custom:button-card
      entity: text.dh_system_globals_app_day_rgb_color
      show_icon: false
      show_name: false
      show_state: false
      tap_action:
        action: none
      hold_action:
        action: none
      double_tap_action:
        action: none
      styles:
        card:
        - padding: 4px 16px
        grid:
        - grid-template-areas: '"picker"'
        - grid-template-columns: 1fr
        custom_fields:
          picker:
          - width: 100%
      custom_fields:
        picker: |
          [[[
            const id = 'text.dh_system_globals_app_day_rgb_color';
            const state = states[id]?.state;
            const configured = typeof state === 'string' && /^#[0-9a-f]{6}$/i.test(state);
            const available = configured || state === '';
            const value = configured ? state.toLowerCase() : '#ffffff';
            const save = (next) => {
              const current = hass.states[id]?.state;
              if (current !== '' && !/^#[0-9a-f]{6}$/i.test(current || '')) return;
              if (next !== '' && !/^#[0-9a-f]{6}$/i.test(next)) return;
              if (current.toLowerCase() === next.toLowerCase()) return;
              return hass.callService('text', 'set_value', {entity_id: id, value: next});
            };
            const stop = (event) => event.stopPropagation();
            const change = (event) => {
              stop(event);
              const control = event.currentTarget;
              save(control.value)?.catch(() => { control.value = value; });
            };
            const reset = (event) => {
              stop(event);
              save(configured ? '' : value)?.catch(() => {});
            };
            return html`
              <div style="display:flex;align-items:center;gap:10px;min-height:40px">
                <span style="flex:1;text-align:left;white-space:normal">Цвет RGB</span>
                <span style="color:var(--secondary-text-color);font-size:12px">${available ? (configured ? '' : 'Не задан') : 'Недоступно'}</span>
                <input type="color" aria-label="Цвет RGB" title="Цвет RGB"
                  style="width:44px;height:36px;padding:2px;border:1px solid var(--divider-color);border-radius:6px;background:transparent;cursor:pointer"
                  .value=${value} ?disabled=${!available} @click=${stop} @change=${change}>
                <button type="button" ?disabled=${!available} @click=${reset}
                  style="min-height:36px;padding:0 8px;border:1px solid var(--divider-color);border-radius:6px;background:transparent;color:var(--primary-text-color);font:inherit;cursor:pointer">
                  ${configured ? 'Сбросить' : 'Установить'}
                </button>
              </div>`;
          ]]]
  - type: vertical-stack
    cards:
    - type: entities
      show_header_toggle: false
      title: Ночь
      entities:
      - entity: number.dh_system_globals_app_night_brightness
        name: Яркость
      - entity: number.dh_system_globals_app_night_volume
        name: Громкость
      - entity: number.dh_system_globals_app_night_transition_seconds
        name: Плавный переход
      - entity: text.dh_system_globals_app_night_color_temp_kelvin
        name: Цветовая температура, K
      - entity: switch.dh_system_globals_app_night_voice_notifications_enabled
        name: Голосовые уведомления
      - entity: switch.dh_system_globals_app_night_noncritical_sound_notifications_enabled
        name: Некритические звуки
    - type: custom:button-card
      entity: text.dh_system_globals_app_night_rgb_color
      show_icon: false
      show_name: false
      show_state: false
      tap_action:
        action: none
      hold_action:
        action: none
      double_tap_action:
        action: none
      styles:
        card:
        - padding: 4px 16px
        grid:
        - grid-template-areas: '"picker"'
        - grid-template-columns: 1fr
        custom_fields:
          picker:
          - width: 100%
      custom_fields:
        picker: |
          [[[
            const id = 'text.dh_system_globals_app_night_rgb_color';
            const state = states[id]?.state;
            const configured = typeof state === 'string' && /^#[0-9a-f]{6}$/i.test(state);
            const available = configured || state === '';
            const value = configured ? state.toLowerCase() : '#ffffff';
            const save = (next) => {
              const current = hass.states[id]?.state;
              if (current !== '' && !/^#[0-9a-f]{6}$/i.test(current || '')) return;
              if (next !== '' && !/^#[0-9a-f]{6}$/i.test(next)) return;
              if (current.toLowerCase() === next.toLowerCase()) return;
              return hass.callService('text', 'set_value', {entity_id: id, value: next});
            };
            const stop = (event) => event.stopPropagation();
            const change = (event) => {
              stop(event);
              const control = event.currentTarget;
              save(control.value)?.catch(() => { control.value = value; });
            };
            const reset = (event) => {
              stop(event);
              save(configured ? '' : value)?.catch(() => {});
            };
            return html`
              <div style="display:flex;align-items:center;gap:10px;min-height:40px">
                <span style="flex:1;text-align:left;white-space:normal">Цвет RGB</span>
                <span style="color:var(--secondary-text-color);font-size:12px">${available ? (configured ? '' : 'Не задан') : 'Недоступно'}</span>
                <input type="color" aria-label="Цвет RGB" title="Цвет RGB"
                  style="width:44px;height:36px;padding:2px;border:1px solid var(--divider-color);border-radius:6px;background:transparent;cursor:pointer"
                  .value=${value} ?disabled=${!available} @click=${stop} @change=${change}>
                <button type="button" ?disabled=${!available} @click=${reset}
                  style="min-height:36px;padding:0 8px;border:1px solid var(--divider-color);border-radius:6px;background:transparent;color:var(--primary-text-color);font:inherit;cursor:pointer">
                  ${configured ? 'Сбросить' : 'Установить'}
                </button>
              </div>`;
          ]]]
  - type: entities
    show_header_toggle: false
    title: Готовность системы
    entities:
    - entity: binary_sensor.dh_system_globals_app_mqtt_ready
      name: MQTT готов
    - entity: binary_sensor.dh_system_globals_app_ha_ready
      name: Home Assistant готов
    - entity: binary_sensor.dh_system_globals_app_zigbee_ready
      name: Zigbee готов
    - entity: binary_sensor.dh_system_globals_app_system_ready
      name: Система готова
