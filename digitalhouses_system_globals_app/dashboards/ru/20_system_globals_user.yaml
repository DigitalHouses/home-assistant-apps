# Owner controls; no administrative operations.
title: System Globals
path: system-globals-user
icon: mdi:theme-light-dark
type: sections
max_columns: 2
sections:
- type: grid
  cards:
  - type: heading
    heading_style: title
    heading: День / Ночь
  - type: entities
    show_header_toggle: false
    title: День / Ночь
    entities:
    - entity: switch.dh_system_globals_app_night_mode
      name: Ночной режим
    - entity: switch.dh_system_globals_app_auto_switch
      name: Автоматическое переключение
    - entity: text.dh_system_globals_app_night_start
      name: Начало ночи
    - entity: text.dh_system_globals_app_night_end
      name: Конец ночи
    - entity: sensor.dh_system_globals_app_timezone
      name: Часовой пояс
  - type: history-graph
    title: История ночного режима
    hours_to_show: 24
    entities:
    - entity: switch.dh_system_globals_app_night_mode
      name: Ночной режим
  - type: entities
    show_header_toggle: false
    title: Активные параметры
    entities:
    - entity: sensor.dh_system_globals_app_active_brightness
      name: Яркость
    - entity: sensor.dh_system_globals_app_active_color_temp_kelvin
      name: Цветовая температура
    - entity: sensor.dh_system_globals_app_active_rgb_color
      name: Цвет RGB
    - entity: sensor.dh_system_globals_app_active_volume
      name: Громкость
- type: grid
  cards:
  - type: heading
    heading_style: title
    heading: Глобальные профили
  - type: vertical-stack
    cards:
    - type: entities
      show_header_toggle: false
      title: День
      entities:
      - entity: number.dh_system_globals_app_day_brightness
        name: Яркость
      - entity: number.dh_system_globals_app_day_volume
        name: Громкость
      - entity: number.dh_system_globals_app_day_transition_seconds
        name: Плавный переход
      - entity: text.dh_system_globals_app_day_color_temp_kelvin
        name: Цветовая температура, K
      - entity: switch.dh_system_globals_app_day_voice_notifications_enabled
        name: Голосовые уведомления
      - entity: switch.dh_system_globals_app_day_noncritical_sound_notifications_enabled
        name: Некритические звуки
    - type: custom:button-card
      entity: text.dh_system_globals_app_day_rgb_color
      show_icon: false
      show_name: false
      show_state: false
      tap_action:
        action: none
      hold_action:
        action: none
      double_tap_action:
        action: none
      styles:
        card:
        - padding: 4px 16px
        grid:
        - grid-template-areas: '"picker"'
        - grid-template-columns: 1fr
        custom_fields:
          picker:
          - width: 100%
      custom_fields:
        picker: |
          [[[
            const id = 'text.dh_system_globals_app_day_rgb_color';
            const state = states[id]?.state;
            const configured = typeof state === 'string' && /^#[0-9a-f]{6}$/i.test(state);
            const available = configured || state === '';
            const value = configured ? state.toLowerCase() : '#ffffff';
            const save = (next) => {
              const current = hass.states[id]?.state;
              if (current !== '' && !/^#[0-9a-f]{6}$/i.test(current || '')) return;
              if (next !== '' && !/^#[0-9a-f]{6}$/i.test(next)) return;
              if (current.toLowerCase() === next.toLowerCase()) return;
              return hass.callService('text', 'set_value', {entity_id: id, value: next});
            };
            const stop = (event) => event.stopPropagation();
            const change = (event) => {
              stop(event);
              const control = event.currentTarget;
              save(control.value)?.catch(() => { control.value = value; });
            };
            const reset = (event) => {
              stop(event);
              save(configured ? '' : value)?.catch(() => {});
            };
            return html`
              <div style="display:flex;align-items:center;gap:10px;min-height:40px">
                <span style="flex:1;text-align:left;white-space:normal">Цвет RGB</span>
                <span style="color:var(--secondary-text-color);font-size:12px">${available ? (configured ? '' : 'Не задан') : 'Недоступно'}</span>
                <input type="color" aria-label="Цвет RGB" title="Цвет RGB"
                  style="width:44px;height:36px;padding:2px;border:1px solid var(--divider-color);border-radius:6px;background:transparent;cursor:pointer"
                  .value=${value} ?disabled=${!available} @click=${stop} @change=${change}>
                <button type="button" ?disabled=${!available} @click=${reset}
                  style="min-height:36px;padding:0 8px;border:1px solid var(--divider-color);border-radius:6px;background:transparent;color:var(--primary-text-color);font:inherit;cursor:pointer">
                  ${configured ? 'Сбросить' : 'Установить'}
                </button>
              </div>`;
          ]]]
  - type: vertical-stack
    cards:
    - type: entities
      show_header_toggle: false
      title: Ночь
      entities:
      - entity: number.dh_system_globals_app_night_brightness
        name: Яркость
      - entity: number.dh_system_globals_app_night_volume
        name: Громкость
      - entity: number.dh_system_globals_app_night_transition_seconds
        name: Плавный переход
      - entity: text.dh_system_globals_app_night_color_temp_kelvin
        name: Цветовая температура, K
      - entity: switch.dh_system_globals_app_night_voice_notifications_enabled
        name: Голосовые уведомления
      - entity: switch.dh_system_globals_app_night_noncritical_sound_notifications_enabled
        name: Некритические звуки
    - type: custom:button-card
      entity: text.dh_system_globals_app_night_rgb_color
      show_icon: false
      show_name: false
      show_state: false
      tap_action:
        action: none
      hold_action:
        action: none
      double_tap_action:
        action: none
      styles:
        card:
        - padding: 4px 16px
        grid:
        - grid-template-areas: '"picker"'
        - grid-template-columns: 1fr
        custom_fields:
          picker:
          - width: 100%
      custom_fields:
        picker: |
          [[[
            const id = 'text.dh_system_globals_app_night_rgb_color';
            const state = states[id]?.state;
            const configured = typeof state === 'string' && /^#[0-9a-f]{6}$/i.test(state);
            const available = configured || state === '';
            const value = configured ? state.toLowerCase() : '#ffffff';
            const save = (next) => {
              const current = hass.states[id]?.state;
              if (current !== '' && !/^#[0-9a-f]{6}$/i.test(current || '')) return;
              if (next !== '' && !/^#[0-9a-f]{6}$/i.test(next)) return;
              if (current.toLowerCase() === next.toLowerCase()) return;
              return hass.callService('text', 'set_value', {entity_id: id, value: next});
            };
            const stop = (event) => event.stopPropagation();
            const change = (event) => {
              stop(event);
              const control = event.currentTarget;
              save(control.value)?.catch(() => { control.value = value; });
            };
            const reset = (event) => {
              stop(event);
              save(configured ? '' : value)?.catch(() => {});
            };
            return html`
              <div style="display:flex;align-items:center;gap:10px;min-height:40px">
                <span style="flex:1;text-align:left;white-space:normal">Цвет RGB</span>
                <span style="color:var(--secondary-text-color);font-size:12px">${available ? (configured ? '' : 'Не задан') : 'Недоступно'}</span>
                <input type="color" aria-label="Цвет RGB" title="Цвет RGB"
                  style="width:44px;height:36px;padding:2px;border:1px solid var(--divider-color);border-radius:6px;background:transparent;cursor:pointer"
                  .value=${value} ?disabled=${!available} @click=${stop} @change=${change}>
                <button type="button" ?disabled=${!available} @click=${reset}
                  style="min-height:36px;padding:0 8px;border:1px solid var(--divider-color);border-radius:6px;background:transparent;color:var(--primary-text-color);font:inherit;cursor:pointer">
                  ${configured ? 'Сбросить' : 'Установить'}
                </button>
              </div>`;
          ]]]
