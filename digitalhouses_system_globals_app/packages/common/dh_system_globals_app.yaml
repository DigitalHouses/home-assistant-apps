dh_system_globals_app_package:
  recorder:
    include:
      entities:
      # Authoritative Day/Night state: off = day, on = night.
      - switch.dh_system_globals_app_night_mode
      - switch.dh_system_globals_app_auto_switch
      - binary_sensor.dh_system_globals_app_mqtt_ready
      - binary_sensor.dh_system_globals_app_ha_ready
      - binary_sensor.dh_system_globals_app_zigbee_ready
      - binary_sensor.dh_system_globals_app_system_ready
      - sensor.dh_system_globals_app_active_brightness
      - sensor.dh_system_globals_app_active_color_temp_kelvin
      - sensor.dh_system_globals_app_active_rgb_color
      - sensor.dh_system_globals_app_active_volume
  template:
  - light:
    - name: System Globals Day RGB Picker
      default_entity_id: light.dh_system_globals_app_day_rgb_picker
      unique_id: dh_system_globals_app_day_rgb_picker
      icon: mdi:palette
      availability: >-
        {{ states('text.dh_system_globals_app_day_rgb_color') == '' or states('text.dh_system_globals_app_day_rgb_color') | regex_match('^#[0-9a-fA-F]{6}$') }}
      # This is a configuration control, not a physical light. Generic on/off commands do nothing.
      state: "{{ true }}"
      rgb: >-
        {% set s = states('text.dh_system_globals_app_day_rgb_color') %}
        {{ [s[1:3] | int(base=16), s[3:5] | int(base=16), s[5:7] | int(base=16)]
           if s | regex_match('^#[0-9a-fA-F]{6}$') else [255, 255, 255] }}
      turn_on:
      - stop: RGB profile picker ignores generic on/off commands
      turn_off:
      - stop: RGB profile picker ignores generic on/off commands
      set_rgb:
      - condition: template
        value_template: >-
          {{ states('text.dh_system_globals_app_day_rgb_color') == '' or states('text.dh_system_globals_app_day_rgb_color') | regex_match('^#[0-9a-fA-F]{6}$') }}
      - action: text.set_value
        target:
          entity_id: text.dh_system_globals_app_day_rgb_color
        data:
          value: "{{ '#%02X%02X%02X' | format(r, g, b) }}"
    - name: System Globals Night RGB Picker
      default_entity_id: light.dh_system_globals_app_night_rgb_picker
      unique_id: dh_system_globals_app_night_rgb_picker
      icon: mdi:palette
      availability: >-
        {{ states('text.dh_system_globals_app_night_rgb_color') == '' or states('text.dh_system_globals_app_night_rgb_color') | regex_match('^#[0-9a-fA-F]{6}$') }}
      # This is a configuration control, not a physical light. Generic on/off commands do nothing.
      state: "{{ true }}"
      rgb: >-
        {% set s = states('text.dh_system_globals_app_night_rgb_color') %}
        {{ [s[1:3] | int(base=16), s[3:5] | int(base=16), s[5:7] | int(base=16)]
           if s | regex_match('^#[0-9a-fA-F]{6}$') else [255, 255, 255] }}
      turn_on:
      - stop: RGB profile picker ignores generic on/off commands
      turn_off:
      - stop: RGB profile picker ignores generic on/off commands
      set_rgb:
      - condition: template
        value_template: >-
          {{ states('text.dh_system_globals_app_night_rgb_color') == '' or states('text.dh_system_globals_app_night_rgb_color') | regex_match('^#[0-9a-fA-F]{6}$') }}
      - action: text.set_value
        target:
          entity_id: text.dh_system_globals_app_night_rgb_color
        data:
          value: "{{ '#%02X%02X%02X' | format(r, g, b) }}"
