<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DH System Globals</title>
<style>
:root{color-scheme:light dark}body{font:15px system-ui;margin:0;background:#15191f;color:#eef1f4}main{max-width:1100px;margin:auto;padding:20px}header,section{background:#20262e;border:1px solid #3c4652;border-radius:10px;padding:16px;margin-bottom:14px}h1{font-size:22px;margin:0 0 12px}h2{font-size:18px;margin:0 0 12px}h3{font-size:16px}button,input,select{font:inherit;border-radius:6px;padding:8px;border:1px solid #596673;background:#2b343e;color:#fff}button{cursor:pointer}button:disabled{opacity:.5}button.primary{background:#276c80}label{display:grid;grid-template-columns:1fr minmax(100px,150px);gap:8px;align-items:center;margin:8px 0}input[type=color]{width:100%;height:38px;padding:2px}input[type=checkbox]{justify-self:end}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.good{color:#7ddca5}.bad{color:#ffb3a9}small{color:#b4c0ca}pre{white-space:pre-wrap;overflow-wrap:anywhere}output{display:block;margin:12px 0;min-height:20px}.hidden{display:none}
</style><main>
<header><h1>DigitalHouses System Globals <small id="version"></small></h1><div class="row"><button id="refresh">Обновить</button><button id="check">Версия</button><button id="export">Экспорт JSON</button><button id="import">Импорт JSON</button><input id="file" type="file" accept=".json,application/json" hidden></div><output id="result" role="status"></output><small id="card"></small></header>
<section><h2>System Modes · День / Ночь</h2><p id="mode"></p><div class="row"><button id="day">День</button><button id="night">Ночь</button></div><form id="config"><label>Автоматическое переключение<select name="auto_switch"><option value="">Не задано</option><option value="true">Вкл.</option><option value="false">Выкл.</option></select></label><label>Начало ночи<input name="night_start" type="time"></label><label>Конец ночи<input name="night_end" type="time"></label><label>Часовой пояс<input name="timezone" placeholder="Asia/Almaty"></label><button class="primary">Сохранить расписание</button></form></section>
<section><h2>System Profiles</h2><div class="grid" id="profiles"></div></section>
<section><h2>System Gates</h2><div id="gates"></div></section>
<section><h2>System Lifecycle</h2><pre id="lifecycle"></pre></section>
</main><script>
"use strict";
const PRODUCT="DigitalHouses/digitalhouses_system_globals_app", GLOBAL="DigitalHouses/Global/night_mode";
const $=id=>document.getElementById(id);
let latest, baseline={}, pending=false;
const dirty=new Set();
const numeric={brightness:"Яркость света, %",volume:"Громкость, %",transition_seconds:"Плавный переход, с"};
const flags={voice_notifications_enabled:"Голосовые уведомления",noncritical_sound_notifications_enabled:"Некритические звуки"};
const esc=s=>String(s);
function option(v,t){const o=document.createElement("option");o.value=v;o.textContent=t;return o}
function field(form,label,name,type,attrs={}){const l=document.createElement("label");l.textContent=label;const i=document.createElement(type==="select"?"select":"input");i.name=name;if(type!=="select")i.type=type;for(const[k,v]of Object.entries(attrs))i.setAttribute(k,v);l.append(i);form.append(l);return i}
function bool(form,name,label){const el=field(form,label,name,"select");for(const [v,t] of [["","Не задано"],["true","Вкл."],["false","Выкл."]])el.append(option(v,t))}
function makeProfile(mode){const f=document.createElement("form");f.id=mode+"Form";const h=document.createElement("h3");h.textContent=mode==="day"?"Дневной профиль":"Ночной профиль";f.append(h);
for(const[k,l]of Object.entries(numeric))field(f,l,k,"number",{min:"0",step:k==="transition_seconds"?"any":"1",...(k==="transition_seconds"?{}:{max:"100"})});
const c=field(f,"Температура, K","color_temp_kelvin","number",{min:"2000",max:"6000",step:"1"});const picker=field(f,"RGB — выбрать цвет","picker","color");
const rgb=document.createElement("input");rgb.type="hidden";rgb.name="rgb_color";f.append(rgb);
const clear=document.createElement("button");clear.type="button";clear.textContent="Сбросить RGB";clear.setAttribute("aria-label","Очистить RGB профиля");const colorLabel=picker.parentElement;const colorRow=document.createElement("div");colorRow.style.cssText="display:grid;grid-template-columns:1fr minmax(100px,150px);gap:8px;align-items:center;margin:8px 0";colorLabel.replaceWith(colorRow);colorLabel.textContent="RGB — выбрать цвет";colorLabel.style.display="block";colorLabel.htmlFor=picker.id=f.id+"Rgb";const colorControls=document.createElement("div");colorControls.style.cssText="display:flex;align-items:center;gap:6px;min-width:0";picker.style.minWidth="0";clear.style.flexShrink="0";colorControls.append(picker,clear);colorRow.append(colorLabel,colorControls);
function colorStatus(){picker.setAttribute("aria-label",rgb.value?"Выбрать цвет RGB":"RGB не задан");clear.disabled=!rgb.value;picker.style.opacity=rgb.value?"1":".5";clear.textContent=rgb.value?"×":"—";clear.title=rgb.value?"Сбросить RGB":"RGB не задан"}
function chooseColor(){rgb.value=picker.value;dirty.add(f.id);colorStatus()}
picker.addEventListener("input",chooseColor);picker.addEventListener("change",chooseColor);
clear.addEventListener("click",()=>{rgb.value="";picker.value="#000000";dirty.add(f.id);colorStatus()});
f.colorStatus=colorStatus;colorStatus();
for(const[k,l]of Object.entries(flags))bool(f,k,l);const b=document.createElement("button");b.className="primary";b.textContent="Сохранить";f.append(b);$("profiles").append(f);
f.addEventListener("input",()=>dirty.add(f.id));f.addEventListener("submit",e=>{e.preventDefault();const value={};for(const k of Object.keys(numeric))value[k]=f.elements[k].value===""?null:Number(f.elements[k].value);for(const k of Object.keys(flags))value[k]=f.elements[k].value===""?null:f.elements[k].value==="true";value.color_temp_kelvin=c.value===""?null:Number(c.value);value.rgb_color=rgb.value===""?null:[1,3,5].map(i=>parseInt(rgb.value.slice(i,i+2),16));
const patch={};for(const k of [...Object.keys(numeric),...Object.keys(flags),"color_temp_kelvin","rgb_color"])if(JSON.stringify(value[k])!==JSON.stringify(baseline[f.id]?.[k]))patch[k]=value[k];send(PRODUCT+"/profiles/set",{[mode]:patch},f.id)});
}
makeProfile("day");makeProfile("night");
function populate(f,values){if(dirty.has(f.id))return;baseline[f.id]=structuredClone(values);for(const[k,v]of Object.entries(values)){const e=f.elements[k];if(!e)continue;e.value=k==="rgb_color"&&v?"#"+v.map(n=>n.toString(16).padStart(2,"0")).join(""):v===null?"":String(v)}if(f.elements.picker){f.elements.picker.value=f.elements.rgb_color.value||"#000000";f.colorStatus()}}
function render(v){latest=v;$("version").textContent="v"+v.version+(v.latest_version?" → v"+v.latest_version:"");$("mode").textContent=({on:"Ночь",off:"День"})[v.state.night_mode]||"Не задано";$("card").textContent=v.card.state+(v.card.operation?" · "+v.card.operation:"")+(v.card.error?" · "+v.card.error:"");populate($("config"),v.state.config);for(const m of ["day","night"])populate($(m+"Form"),v.state.profiles[m]);$("gates").replaceChildren();for(const[k,ready]of Object.entries(v.gates)){const p=document.createElement("p");p.className=ready?"good":"bad";const d=v.diagnostics[k];p.textContent=k+": "+(ready?"ON":"OFF")+(d?" · "+d.reason+(d.required?"":" (необязательный)"):"");$("gates").append(p)}for(const[base,b]of Object.entries(v.zigbee_bridges||{})){const p=document.createElement("p");p.className=b.ready?"good":"bad";p.textContent="Z2M · "+base+": "+(b.ready?"ON":"OFF");$("gates").append(p)}$("lifecycle").textContent=JSON.stringify(v.lifecycle,null,2)}
async function poll(){try{const r=await fetch("./api/state",{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);render(await r.json())}catch(e){$("card").textContent="Связь с App потеряна"}}
async function send(topic,payload,form){if(pending)return;pending=true;try{const r=await fetch("./api/command",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({topic,payload})});const v=await r.json();if(!r.ok)throw Error(v.error||"HTTP "+r.status);if(form)dirty.delete(form);render(v);$("result").textContent="Команда принята"}catch(e){$("result").textContent=e.message}finally{pending=false}}
$("config").addEventListener("input",()=>dirty.add("config"));
$("config").addEventListener("submit",e=>{e.preventDefault();const v={};for(const k of ["night_start","night_end","timezone"])v[k]=e.target.elements[k].value||null;const a=e.target.elements.auto_switch.value;v.auto_switch=a===""?null:a==="true";const p={};for(const k in v)if(v[k]!==baseline.config?.[k])p[k]=v[k];send(PRODUCT+"/config/set",p,"config")});
$("day").onclick=()=>send(GLOBAL+"/set","off");$("night").onclick=()=>send(GLOBAL+"/set","on");$("refresh").onclick=()=>send(PRODUCT+"/control/refresh","PRESS");$("check").onclick=()=>send(PRODUCT+"/control/check_updates","PRESS");
$("export").onclick=()=>{if(!latest)return;const blob=new Blob([JSON.stringify(latest.state,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="dh-system-globals.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("import").onclick=()=>$("file").click();
$("file").onchange=async()=>{try{const f=$("file").files[0];if(!f)return;if(f.size>65536)throw Error("Файл слишком большой");const v=JSON.parse(await f.text());if(!v.profiles||!v.config)throw Error("Некорректный файл");await send("internal/import",{night_mode:v.night_mode,config:v.config,profiles:v.profiles})}catch(e){$("result").textContent=e.message}finally{$("file").value=""}};
poll();setInterval(poll,3000);
</script></html>
