<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DH System Globals</title>
<link rel="stylesheet" href="./dh-lib-ui.css">
<link rel="stylesheet" href="./dh-lib-journal-toast.css">
<link rel="stylesheet" href="./globals-ui.css">
</head><body><div class="dh-lib-ui"><div id="chrome"></div>
<main class="dh-lib-ui-main" id="workspace">
<div id="feedback" role="status"><output id="result"></output><small id="card"></small></div>
<div id="overview">
<section class="dh-lib-ui-panel"><h2>День / Ночь</h2><p id="mode"></p><div class="row"><button id="day">День</button><button id="night">Ночь</button></div><form id="config"><label>Автоматическое переключение<select name="auto_switch"><option value="">Не задано</option><option value="true">Вкл.</option><option value="false">Выкл.</option></select></label><label>Начало ночи<input name="night_start" type="time"></label><label>Конец ночи<input name="night_end" type="time"></label><label>Часовой пояс расписания<input name="timezone" placeholder="Asia/Almaty"></label><button class="primary">Сохранить расписание</button></form></section>
<section class="dh-lib-ui-panel"><h2>Профили</h2><div class="grid" id="profiles"></div></section>
<section class="dh-lib-ui-panel"><h2>Готовность системы</h2><div id="gates"></div></section>
<section class="dh-lib-ui-panel"><h2>Жизненный цикл HA</h2><pre id="lifecycle"></pre></section>

</div><div id="status-page" hidden></div><div id="settings-page" hidden><div id="app-settings"></div></div>
<div id="toast-settings" hidden></div><input id="file" type="file" accept=".json,application/json" hidden>
</main></div>
<script src="./dh-lib-ui.js"></script><script src="./dh-lib-journal-toast.js"></script><script src="./globals-ui.js"></script>
</body></html>
