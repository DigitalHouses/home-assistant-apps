name: DigitalHouses System Globals App
version: 0.1.3
slug: digitalhouses_system_globals_app
description: Global day/night modes, shared profiles, and dynamic system readiness.
url: https://github.com/DigitalHouses/home-assistant-apps/tree/main/digitalhouses_system_globals_app
arch:
  - amd64
  - aarch64
image: ghcr.io/digitalhouses/digitalhouses_system_globals_app
