# =============================================================================
# DigitalHouses Internet App notification contract — Russian presentation
# Install this instead of the English notification package.
# =============================================================================

dh_internet_app_notification_package_ru:

  automation:
    - id: dh_internet_app_notifications_ru
      alias: DH Internet · Уведомления
      mode: queued
      max: 20
      triggers:
        - trigger: event.received
          target:
            entity_id: event.dh_internet_app_event
          options:
            event_type:
              - connection_lost
              - connection_restored
              - recovery_action
              - recovery_stopped
              - recovery_exhausted
              - recovery_error
              - speedtest_failed
              - performance_problem_started
              - performance_problem_recovered
              - performance_problem_updated
      actions:
        - event: dh_internet_app_notification
          event_data:
            source: dh_internet_app
            source_entity: event.dh_internet_app_event
            schema_version: "{{ trigger.to_state.attributes.schema_version | int(2) }}"
            kind: "{{ trigger.to_state.attributes.event_type }}"
            severity: >-
              {% set kind = trigger.to_state.attributes.event_type %}
              {{ 'warning' if kind in [
                'connection_lost',
                'recovery_exhausted',
                'recovery_error',
                'speedtest_failed',
                'performance_problem_started',
                'performance_problem_updated'
              ] else 'info' }}
            title: >-
              {% set kind = trigger.to_state.attributes.event_type %}
              {% set target = trigger.to_state.attributes.target | default('', true) %}
              {% if kind == 'connection_lost' %}
                🌐⚠️ Интернет недоступен
              {% elif kind == 'connection_restored' %}
                🌐✅ Интернет восстановлен
              {% elif kind == 'recovery_action' %}
                🔄 Восстановление Internet:
                {{ 'ONT' if target == 'ont' else ('Router' if target == 'router' else target) }}
              {% elif kind == 'recovery_stopped' %}
                ⏹️ Восстановление Internet остановлено
              {% elif kind == 'recovery_exhausted' %}
                🌐⚠️ Попытки восстановления исчерпаны
              {% elif kind == 'recovery_error' %}
                🌐❌ Ошибка восстановления
              {% elif kind == 'speedtest_failed' %}
                📶⚠️ Ошибка Speedtest
              {% elif kind == 'performance_problem_started' %}
                📉⚠️ Проблема качества Internet
              {% elif kind == 'performance_problem_recovered' %}
                📈✅ Качество Internet восстановлено
              {% elif kind == 'performance_problem_updated' %}
                📉⚠️ Параметры проблемы Internet изменились
              {% else %}
                🌐 Событие Internet
              {% endif %}
            message: >-
              {% set a = trigger.to_state.attributes %}
              {% set kind = a.event_type %}
              {% if kind == 'connection_lost' %}
                Интернет недоступен. Роутер отвечает:
                {{ 'да' if a.router_up | default(false) else 'нет' }}.
              {% elif kind == 'connection_restored' %}
                {% set s = a.duration_seconds | int(0) %}
                {% set h = s // 3600 %}
                {% set m = (s % 3600) // 60 %}
                {% set sec = s % 60 %}
                Связь восстановлена через
                {{ ('%d:%02d:%02d' | format(h,m,sec)) if h else ('%02d:%02d' | format(m,sec)) }}.
              {% elif kind == 'recovery_action' %}
                Цикл {{ a.cycle | default('—') }}:
                {{ a.target | default('устройство') }} ·
                {{ a.action | default('action') }}.
              {% elif kind == 'recovery_stopped' %}
                Дальнейшие попытки восстановления в текущем инциденте остановлены.
              {% elif kind == 'recovery_exhausted' %}
                Выполнено циклов: {{ a.cycles | default('—') }}.
                Cooldown: {{ a.cooldown_seconds | default('—') }} с.
              {% elif kind == 'recovery_error' %}
                {{ a.error | default('Неизвестная ошибка восстановления', true) }}
              {% elif kind == 'speedtest_failed' %}
                {{ a.reason | default('Ошибка Ookla Speedtest', true) }}
              {% elif kind == 'performance_problem_started' %}
                Проблемы: {{ (a.reasons | default([], true)) | join(', ') }}.
                Download {{ a.download_mbps | default('—') }} Mbit/s ·
                Upload {{ a.upload_mbps | default('—') }} Mbit/s ·
                Ping {{ a.ping_ms | default('—') }} ms.
              {% elif kind == 'performance_problem_recovered' %}
                Предыдущие проблемы:
                {{ (a.previous_reasons | default([], true)) | join(', ') }}.
                Текущие значения находятся в заданных пределах.
              {% elif kind == 'performance_problem_updated' %}
                Проблемы:
                {{ (a.previous_reasons | default([], true)) | join(', ') }}
                →
                {{ (a.reasons | default([], true)) | join(', ') }}.
              {% else %}
                Событие Internet App: {{ kind }}.
              {% endif %}
            raw: "{{ trigger.to_state.attributes }}"
