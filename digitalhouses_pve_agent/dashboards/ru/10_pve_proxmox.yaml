          %}
          {% set model =
            model
            | replace('Intel(R)', 'Intel')
            | replace('Intel Core(TM)', 'Intel Core')
            | replace('(R)', '')
            | replace('(TM)', '')
            | replace('  ', ' ')
            | trim
          %}
          {% if states(entity) not in ['unknown', 'unavailable', 'none', ''] %}
            CPU ({{ model }}) · {{ '%.1f' | format(states(entity) | float) }}°C
          {% else %}
            CPU ({{ model }})
          {% endif %}
        secondary: |-
          {% set threshold =
            states('number.dh_pve_agent_cpu_temperature_threshold')
          %}
