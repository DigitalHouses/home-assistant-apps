# DH-View: dh_pve_agent
# DH-View-Version: 1.0.0
# DH-View-Date: 2026-11-14
# DH-Compatible-Agent: >=0.5.88,<0.5.89

title: Proxmox
path: dh_pve_agent
icon: mdi:server
show_icon_and_title: false
type: sections
max_columns: 4
sections:
  - type: grid
    cards:
      - type: heading
        heading: Состояние Proxmox
        heading_style: title
        icon: phu:proxmox
      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_agent_problems
        primary: |-
          {% set active = state_attr(entity, 'active') or [] %}
          {% if states(entity) in ['unknown', 'unavailable', 'none', ''] %}
            Нет данных о проблемах
          {% elif active | count == 0 %}
            Проблем не обнаружено
          {% else %}
            Обнаружено проблем: {{ active | count }}
          {% endif %}
        secondary: |-
          {% set active = state_attr(entity, 'active') or [] %}

          {% if states(entity) in ['unknown', 'unavailable', 'none', ''] %}
            Состояние проблем недоступно.
          {% elif active | count == 0 %}
            Система работает штатно.
          {% else %}
            {% for item in active %}
              {% set id = item.get('problem_id', '') %}
              {% set name = item.get('object_name', 'Объект') %}
              {% set value = item.get('value') %}
              {% set average = item.get('average') %}
              {% set threshold = item.get('threshold') %}

              {% if id == 'cpu_temperature' %}
                • {{ name }} — высокая температура{% if average is number and threshold is number %}: {{ average | round(1) }} °C · порог {{ threshold | round(0) }} °C{% endif %}
              {% elif id == 'cpu_throttling' %}
                • {{ name }} — троттлинг процессора
              {% elif id == 'agent_cpu_overload' %}
                • PVE Agent — высокая загрузка CPU агента
              {% elif id.startswith('storage_') and id.endswith('_percent_used') %}
                • {{ name }} — заполнение хранилища{% if average is number and threshold is number %}: {{ average | round(1) }}% · порог {{ threshold | round(0) }}%{% endif %}
              {% elif id.startswith('disk_') and id.endswith('_temperature') %}
                • {{ name }} — высокая температура{% if average is number and threshold is number %}: {{ average | round(1) }} °C · порог {{ threshold | round(0) }} °C{% endif %}
              {% elif id.startswith('disk_') and id.endswith('_smart') %}
                • {{ name }} — ошибка SMART
              {% elif id.startswith('gpu_') and id.endswith('_temperature') %}
                • {{ name }} — высокая температура GPU{% if average is number and threshold is number %}: {{ average | round(1) }} °C · порог {{ threshold | round(0) }} °C{% endif %}
              {% elif id.startswith('fan_') and id.endswith('_control_restore') %}
                • {{ name }} — не восстановлено управление вентилятором
              {% else %}
                • {{ name }} — {{ id or 'неизвестная проблема' }}
              {% endif %}
            {% endfor %}
          {% endif %}
        icon: |-
          {% set active = state_attr(entity, 'active') or [] %}
          {% if states(entity) in ['unknown', 'unavailable', 'none', ''] %}
            mdi:help-circle-outline
          {% elif active | count > 0 %}
            mdi:alert-circle
          {% else %}
            mdi:check-circle
          {% endif %}
        icon_color: |-
          {% if states(entity) in ['unknown', 'unavailable', 'none', ''] %}
            grey
          {% elif (state_attr(entity, 'active') or []) | count > 0 %}
            red
          {% else %}
            green
          {% endif %}
        multiline_secondary: true
        tap_action:
          action: more-info
        grid_options:
          columns: 12
      - type: vertical-stack
        cards:
          - type: custom:button-card
            update_timer: |
              [[[
                return states['sensor.dh_pve_agent_card']?.state === 'running'
                  ? 100 : 5000;
              ]]]
            show_icon: true
            show_name: true
            show_label: true
            icon: |
              [[[
                const s = states['sensor.dh_pve_agent_card']?.state;
                const upgrade = states['binary_sensor.dh_pve_agent_update_available']?.state === 'on';
                return s === 'running' ? 'mdi:progress-clock'
                  : s === 'error' ? 'mdi:alert-circle'
                  : s === 'success' ? 'mdi:check-circle'
                  : upgrade ? 'mdi:package-up'
                  : 'mdi:robot-outline';
              ]]]    
            name: |
              [[[
                const installed = states['sensor.dh_pve_agent_version']?.state;
                const latest = states['sensor.dh_pve_agent_latest_version']?.state;
                const available = states['binary_sensor.dh_pve_agent_update_available']?.state === 'on';
                const valid = (v) =>
                  typeof v === 'string' && !['unknown', 'unavailable', 'none', ''].includes(v);
                const upgrade = available && valid(installed) && valid(latest) && latest !== installed;
                return 'PVE Agent' + (valid(installed)
                  ? ' · v' + installed + (upgrade ? ' → v' + latest : '')
                  : '');
              ]]]
            label: |
              [[[
                const item = states['sensor.dh_pve_agent_card'];
                if (!item || ['unknown','unavailable'].includes(item.state)) {
                  return 'Нет связи с агентом';
                }
                const a = item.attributes || {};
                const operation = a.operation;
                const names = {
                  refresh: 'Обновление данных',
                  check: 'Проверка версии',
                  install: 'Установка версии',
                  restart: 'Перезапуск агента'
                };
                const duration = (value) =>
                  typeof value === 'number'
                  ? value.toFixed(1).replace('.', ',') + ' сек'
                  : '—';
                if (item.state === 'running') {
                  const start = Date.parse(a.started_at || '');
                  if (!Number.isFinite(start)) return (names[operation] || 'Операция') + '…';
                  const tenths = Math.max(0, Math.floor((Date.now() - start) / 100));
                  const mm = String(Math.floor(tenths / 600)).padStart(2, '0');
                  const ss = String(Math.floor((tenths % 600) / 10)).padStart(2, '0');
                  return (names[operation] || 'Операция') + '… ' + mm + ':' + ss + ',' + tenths % 10;
                }
                if (item.state === 'error') {
                  return 'Ошибка: ' + (a.error || 'операция не выполнена');
                }
                if (item.state === 'success') {
                  let message = {
                    refresh: 'Обновлено',
                    check: 'Версия проверена',
                    install: 'Версия установлена',
                    restart: 'Агент перезапущен'
                  }[operation] || 'Готово';
                  if (operation === 'check') {
                    const available = states['binary_sensor.dh_pve_agent_update_available']?.state;
                    message = available === 'on' ? 'Доступна новая версия'
                      : available === 'off' ? 'Версия актуальна' : 'Проверка завершена';
                  }
                  return message + ' · ' + duration(a.duration_seconds);
                }
                // A verified new release stays visible after the five-second result.
                if (states['binary_sensor.dh_pve_agent_update_available']?.state === 'on') {
                  return 'Доступна новая версия';
                }
                const ts = Date.parse(a.last_collection_at || '');
                if (!Number.isFinite(ts)) return 'Ожидание данных';
                const sec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
                if (sec < 60) return 'Обновлено ' + sec + ' сек назад';
                const min = Math.floor(sec / 60);
                if (min < 60) return 'Обновлено ' + min + ' мин назад';
                const hr = Math.floor(min / 60);
                if (hr < 24) return 'Обновлено ' + hr + ' ч назад';
                return 'Обновлено ' + Math.floor(hr / 24) + ' д назад';
              ]]]
            styles:
              card:
                - padding: 12px
                - text-align: left
              grid:
                - grid-template-areas: '"i n" "i l"'
                - grid-template-columns: 48px 1fr
                - grid-template-rows: min-content min-content
              img_cell:
                - width: 40px
                - justify-content: start
              icon:
                - width: 26px
                - color: |
                    [[[
                      const s = states['sensor.dh_pve_agent_card']?.state;
                      const upgrade = states['binary_sensor.dh_pve_agent_update_available']?.state === 'on';
                      return s === 'error' ? 'var(--error-color)'
                        : s === 'running' ? 'var(--info-color, var(--primary-color))'
                        : s === 'success' ? 'var(--success-color, var(--primary-color))'
                        : upgrade ? 'var(--warning-color, orange)'
                        : 'var(--success-color, var(--primary-color))';
                    ]]]
              name:
                - justify-self: start
                - font-size: 14px
                - font-weight: 600
              label:
                - justify-self: start
                - white-space: normal
                - text-align: left
                - font-size: 13px
                - color: var(--secondary-text-color)
            tap_action:
              action: none
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:refresh
                content: Обновить
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.dh_pve_agent_refresh
              - type: template
                icon: mdi:cloud-search
                content: Версия
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.dh_pve_agent_check_updates
              - type: conditional
                conditions:
                  - entity: binary_sensor.dh_pve_agent_update_available
                    state: 'on'
                chip:
                  type: template
                  icon: mdi:package-down
                  icon_color: orange
                  content: Новая версия
                  tap_action:
                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.dh_pve_agent_update
                    confirmation:
                      text: >-
                        Установить новую версию PVE Agent? Мониторинг и логика
                        UPS временно прервутся.
              - type: template
                icon: mdi:restart
                content: Перезапуск
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.dh_pve_agent_restart_agent
                  confirmation:
                    text: >-
                      Перезапустить PVE Agent? Мониторинг и логика UPS временно
                      прервутся. Сам Proxmox и его гости не перезапускаются.
        grid_options:
          columns: 12
      - type: heading
        heading: Аппаратная конфигурация
        heading_style: title
        icon: mdi:server
      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_agent_system
        primary: ''
        secondary: |-
          {% if states(entity) in ['unknown', 'unavailable', 'none', ''] %}
            Нет данных от Proxmox
          {% else %}
            {% set manufacturer = state_attr(entity, 'manufacturer') or '' %}
            {% set model = state_attr(entity, 'model') or '' %}
            {% set board_vendor = state_attr(entity, 'board_vendor') or '' %}
            {% set board_model = state_attr(entity, 'board_model') or '' %}

            {% set cpu_model = state_attr(entity, 'cpu_model') or '' %}
            {% set cpu_cores = state_attr(entity, 'cpu_cores') %}
            {% set cpu_threads = state_attr(entity, 'cpu_threads') %}

            {% set memory_type = state_attr(entity, 'memory_type') or '' %}
            {% set memory_form_factor = state_attr(entity, 'memory_form_factor') or '' %}
            {% set slots_populated = state_attr(entity, 'memory_slots_populated') %}
            {% set slots_total = state_attr(entity, 'memory_slots_total') %}
            {% set memory_speed = state_attr(entity, 'memory_speed_mt_s') %}
            {% set memory_total = state_attr(entity, 'memory_installed_gib') %}

            {% set kernel = state_attr(entity, 'kernel_version') or '' %}
            {% set pve_raw = state_attr(entity, 'proxmox_version') or '' %}
            {% set ip = state_attr(entity, 'primary_ip') or '' %}

            {% set lines = namespace(items=[]) %}

            {# MANUFACTURER #}
            {% if manufacturer %}
              {% set lines.items = lines.items + [
                'Manufacturer: ' ~ manufacturer
              ] %}
            {% endif %}

            {# MODEL #}
            {% if model %}
              {% set lines.items = lines.items + [
                'Model: ' ~ model
              ] %}
            {% endif %}

            {# CPU #}
            {% if cpu_model %}
              {% set cpu = cpu_model
                | replace('Intel(R)', 'Intel')
                | replace('Core(TM)', 'Core')
                | replace('(R)', '')
                | replace('(TM)', '')
                | replace('CPU ', '')
                | replace('  ', ' ')
                | trim
              %}

              {% if cpu_cores is not none and cpu_threads is not none %}
                {% set cpu = cpu ~ ' · ' ~
                  cpu_cores ~ 'C/' ~ cpu_threads ~ 'T'
                %}
              {% endif %}

              {% set lines.items = lines.items + [
                'CPU: ' ~ cpu
              ] %}
            {% endif %}

            {# MOTHERBOARD #}
            {% if board_model or board_vendor %}
              {% set board = (board_vendor ~ ' ' ~ board_model) | trim %}
              {% set lines.items = lines.items + [
                'MB: ' ~ board
              ] %}
            {% endif %}

            {# RAM #}
            {% set ram = namespace(parts=[]) %}

            {% if memory_total is number %}
              {% set memory_value = memory_total | float %}
              {% if memory_value == memory_value | int %}
                {% set memory_label = memory_value | int %}
              {% else %}
                {% set memory_label = '%.1f' | format(memory_value) %}
              {% endif %}

              {% set ram.parts = ram.parts + [
                memory_label ~ ' GiB'
              ] %}
            {% endif %}

            {% if memory_type %}
              {% set ram.parts = ram.parts + [memory_type] %}
            {% endif %}

            {% if memory_form_factor %}
              {% set ram.parts = ram.parts + [memory_form_factor] %}
            {% endif %}

            {% if slots_populated is not none and slots_total is not none %}
              {% set ram.parts = ram.parts + [
                'слоты ' ~ slots_populated ~ '/' ~ slots_total
              ] %}
            {% endif %}

            {% if memory_speed is number %}
              {% set ram.parts = ram.parts + [
                (memory_speed | int) ~ ' MT/s'
              ] %}
            {% endif %}

            {% if ram.parts | count > 0 %}
              {% set lines.items = lines.items + [
                'RAM: ' ~ (ram.parts | join(' · '))
              ] %}
            {% endif %}

            {# FAN · DYNAMIC INVENTORY #}
            {% set fans = namespace(items=[]) %}

            {% for fan in states.sensor | sort(attribute='entity_id') %}
              {% if
                state_attr(fan.entity_id, 'proxmox_integration') == 'digitalhouses_pve_agent'
                and state_attr(fan.entity_id, 'proxmox_section') == 'cooling'
                and state_attr(fan.entity_id, 'proxmox_metric') == 'rpm'
                and fan.state | is_number
              %}
                {% set fan_name =
                  state_attr(fan.entity_id, 'proxmox_display_name')
                  or state_attr(fan.entity_id, 'label')
                  or 'Fan'
                %}

                {% set fans.items = fans.items + [
                  fan_name ~ ': ' ~ (fan.state | int) ~ ' RPM'
                ] %}
              {% endif %}
            {% endfor %}

            {% if fans.items | count > 0 %}
              {% set lines.items = lines.items + [
                'FAN: ' ~ (fans.items | join(' · '))
              ] %}
            {% else %}
              {% set lines.items = lines.items + [
                'FAN: Not detected'
              ] %}
            {% endif %}

            {# PROXMOX · KERNEL · IP #}
            {% set software = namespace(parts=[]) %}

            {% set pve_version =
              pve_raw.split('/')[1]
              if '/' in pve_raw
              else pve_raw
            %}

            {% set kernel_short = kernel | replace('-pve', '') %}

            {% if pve_version %}
              {% set software.parts = software.parts + [
                pve_version
              ] %}
            {% endif %}

            {% if kernel_short %}
              {% set software.parts = software.parts + [
                'Kernel ' ~ kernel_short
              ] %}
            {% endif %}

            {% if ip %}
              {% set software.parts = software.parts + [
                'IP: ' ~ ip
              ] %}
            {% endif %}

            {% if software.parts | count > 0 %}
              {% set lines.items = lines.items + [
                'Proxmox ver: ' ~ (software.parts | join(' · '))
              ] %}
            {% endif %}

            {{ lines.items | join('\n') }}
          {% endif %}
        icon: mdi:server
        icon_color: >-
          {% if is_state('binary_sensor.dh_pve_agent_host_collector', 'on') %}
            green
          {% elif is_state('binary_sensor.dh_pve_agent_host_collector', 'off')
          %}
            red
          {% else %}
            grey
          {% endif %}
        multiline_secondary: true
        tap_action:
          action: more-info
        grid_options:
          columns: 12
      - type: heading
        heading: VM / LXC
        heading_style: subtitle
        icon: mdi:server-network
      - type: markdown
        content: >-
          {%- set ns = namespace(vms=[], lxcs=[], host_usb=[], lines=[]) -%}

          {# ------------------------------------------------------------------
          #} {# VM /
          LXC                                                           #} {#
          ------------------------------------------------------------------ #}

          {%- for e in states.sensor -%}
            {%- if state_attr(e.entity_id, 'proxmox_integration') == 'digitalhouses_pve_agent'
                  and state_attr(e.entity_id, 'proxmox_section') == 'guests'
                  and state_attr(e.entity_id, 'proxmox_subject') in ['vm', 'lxc']
                  and state_attr(e.entity_id, 'proxmox_metric') == 'status' -%}

              {%- set item = {
                'id':
                  state_attr(e.entity_id, 'guest_id')
                  or state_attr(e.entity_id, 'proxmox_object_id'),
                'name':
                  state_attr(e.entity_id, 'proxmox_display_name')
                  or e.name,
                'state': e.state | lower,
                'sort':
                  state_attr(e.entity_id, 'proxmox_sort_key')
                  or e.entity_id
              } -%}

              {%- if state_attr(e.entity_id, 'proxmox_subject') == 'vm' -%}
                {%- set ns.vms = ns.vms + [item] -%}
              {%- else -%}
                {%- set ns.lxcs = ns.lxcs + [item] -%}
              {%- endif -%}

            {# ---------------------------------------------------------------- #}
            {# USB devices owned by PVE                                         #}
            {# ---------------------------------------------------------------- #}

            {%- elif state_attr(e.entity_id, 'proxmox_integration') == 'digitalhouses_pve_agent'
                  and state_attr(e.entity_id, 'proxmox_section') == 'guests'
                  and state_attr(e.entity_id, 'proxmox_subject') == 'host_usb'
                  and state_attr(e.entity_id, 'proxmox_metric') == 'owner' -%}

              {%- set ns.host_usb = ns.host_usb + [{
                'id':
                  state_attr(e.entity_id, 'usb_id')
                  or state_attr(e.entity_id, 'physical_port')
                  or state_attr(e.entity_id, 'proxmox_object_id'),
                'name':
                  state_attr(e.entity_id, 'proxmox_display_name')
                  or state_attr(e.entity_id, 'model')
                  or e.name,
                'sort':
                  state_attr(e.entity_id, 'proxmox_sort_key')
                  or e.entity_id
              }] -%}

            {%- endif -%}
          {%- endfor -%}


          {# ------------------------------------------------------------------
          #} {#
          COUNTERS                                                           #}
          {# ------------------------------------------------------------------
          #}

          {%- set vm_running =
            state_attr('sensor.dh_pve_agent_vms', 'running') | int(0)
          -%}

          {%- set vm_total =
            state_attr('sensor.dh_pve_agent_vms', 'total') | int(0)
          -%}

          {%- set lxc_running =
            state_attr('sensor.dh_pve_agent_lxcs', 'running') | int(0)
          -%}

          {%- set lxc_total =
            state_attr('sensor.dh_pve_agent_lxcs', 'total') | int(0)
          -%}


          {# ------------------------------------------------------------------
          #} {# ROOT ·
          PVE                                                         #} {#
          ------------------------------------------------------------------ #}

          {%- set ns.lines = ns.lines + ['PVE'] -%}


          {# ------------------------------------------------------------------
          #} {# HOST
          USB                                                           #} {#
          ------------------------------------------------------------------ #}

          {%- for usb in ns.host_usb | sort(attribute='sort') -%}

            {%- set ns.lines = ns.lines + [
              '├─ USB ' ~ usb.id,
              '│  └─ ' ~ usb.name
            ] -%}

          {%- endfor -%}


          {# ------------------------------------------------------------------
          #} {#
          VM                                                                 #}
          {# ------------------------------------------------------------------
          #}

          {%- set ns.lines = ns.lines + [
            '├─ VM ' ~ vm_running ~ '/' ~ vm_total
          ] -%}

          {%- for vm in ns.vms | sort(attribute='sort') -%}

            {%- set vm_last = loop.last -%}

            {%- set marker =
              '🟢' if vm.state == 'running'
              else '🟠' if vm.state == 'paused'
              else '⚪' if vm.state == 'stopped'
              else '🔴'
            -%}

            {%- set branch =
              '└─' if vm_last
              else '├─'
            -%}

            {%- set ns.lines = ns.lines + [
              '│  ' ~ branch ~ ' ' ~ marker ~ ' '
                ~ vm.id ~ ' · ' ~ vm.name
            ] -%}


            {# -------------------------------------------------------------- #}
            {# VM passthrough                                                 #}
            {# -------------------------------------------------------------- #}

            {%- set pt = namespace(items=[]) -%}

            {%- for p in states.sensor -%}
              {%- if state_attr(p.entity_id, 'proxmox_integration') == 'digitalhouses_pve_agent'
                    and state_attr(p.entity_id, 'proxmox_section') == 'guests'
                    and state_attr(p.entity_id, 'proxmox_subject') == 'passthrough'
                    and state_attr(p.entity_id, 'proxmox_metric') == 'owner'
                    and (state_attr(p.entity_id, 'owner_id') | string)
                        == (vm.id | string) -%}

                {%- set connection =
                  state_attr(p.entity_id, 'connection')
                  or ''
                -%}

                {%- if connection == 'passthrough_usb' -%}

                  {%- set kind = 'USB' -%}

                  {%- set technical =
                    state_attr(p.entity_id, 'usb_id')
                    or state_attr(p.entity_id, 'usb_host')
                    or state_attr(p.entity_id, 'physical_port')
                    or state_attr(p.entity_id, 'proxmox_object_id')
                  -%}

                {%- else -%}

                  {%- set kind = 'PCI' -%}

                  {%- set technical =
                    state_attr(p.entity_id, 'pci_address')
                    or state_attr(p.entity_id, 'proxmox_object_id')
                  -%}

                {%- endif -%}

                {%- set pt.items = pt.items + [{
                  'kind': kind,
                  'id': technical,
                  'name':
                    state_attr(p.entity_id, 'model')
                    or state_attr(p.entity_id, 'class_name')
                    or state_attr(p.entity_id, 'proxmox_display_name')
                    or p.name,
                  'sort':
                    state_attr(p.entity_id, 'proxmox_sort_key')
                    or p.entity_id
                }] -%}

              {%- endif -%}
            {%- endfor -%}


            {%- for p in pt.items | sort(attribute='sort') -%}

              {%- set p_last = loop.last -%}

              {%- set child =
                '└─' if p_last
                else '├─'
              -%}

              {%- set base =
                '│     ' if vm_last
                else '│  │  '
              -%}

              {%- set continuation =
                base ~ ('   ' if p_last else '│  ')
              -%}

              {%- set model =
                p.name | string | wordwrap(34, false)
              -%}

              {%- set model =
                model | replace(
                  '\n',
                  '\n' ~ continuation ~ '   '
                )
              -%}

              {%- set ns.lines = ns.lines + [
                base ~ child ~ ' ' ~ p.kind ~ ' ' ~ p.id,
                continuation ~ '└─ ' ~ model
              ] -%}

            {%- endfor -%}

          {%- endfor -%}


          {# ------------------------------------------------------------------
          #} {#
          LXC                                                                #}
          {# ------------------------------------------------------------------
          #}

          {%- set ns.lines = ns.lines + [
            '└─ LXC ' ~ lxc_running ~ '/' ~ lxc_total
          ] -%}

          {%- for lxc in ns.lxcs | sort(attribute='sort') -%}

            {%- set lxc_last = loop.last -%}

            {%- set marker =
              '🟢' if lxc.state == 'running'
              else '🟠' if lxc.state == 'paused'
              else '⚪' if lxc.state == 'stopped'
              else '🔴'
            -%}

            {%- set branch =
              '└─' if lxc_last
              else '├─'
            -%}

            {%- set ns.lines = ns.lines + [
              '   ' ~ branch ~ ' ' ~ marker ~ ' '
                ~ lxc.id ~ ' · ' ~ lxc.name
            ] -%}


            {# -------------------------------------------------------------- #}
            {# LXC passthrough                                                #}
            {# -------------------------------------------------------------- #}

            {%- set pt = namespace(items=[]) -%}

            {%- for p in states.sensor -%}
              {%- if state_attr(p.entity_id, 'proxmox_integration') == 'digitalhouses_pve_agent'
                    and state_attr(p.entity_id, 'proxmox_section') == 'guests'
                    and state_attr(p.entity_id, 'proxmox_subject') == 'passthrough'
                    and state_attr(p.entity_id, 'proxmox_metric') == 'owner'
                    and (state_attr(p.entity_id, 'owner_id') | string)
                        == (lxc.id | string) -%}

                {%- set connection =
                  state_attr(p.entity_id, 'connection')
                  or ''
                -%}

                {%- if connection == 'passthrough_usb' -%}

                  {%- set kind = 'USB' -%}

                  {%- set technical =
                    state_attr(p.entity_id, 'usb_id')
                    or state_attr(p.entity_id, 'usb_host')
                    or state_attr(p.entity_id, 'physical_port')
                    or state_attr(p.entity_id, 'proxmox_object_id')
                  -%}

                {%- else -%}

                  {%- set kind = 'PCI' -%}

                  {%- set technical =
                    state_attr(p.entity_id, 'pci_address')
                    or state_attr(p.entity_id, 'proxmox_object_id')
                  -%}

                {%- endif -%}

                {%- set pt.items = pt.items + [{
                  'kind': kind,
                  'id': technical,
                  'name':
                    state_attr(p.entity_id, 'model')
                    or state_attr(p.entity_id, 'class_name')
                    or state_attr(p.entity_id, 'proxmox_display_name')
                    or p.name,
                  'sort':
                    state_attr(p.entity_id, 'proxmox_sort_key')
                    or p.entity_id
                }] -%}

              {%- endif -%}
            {%- endfor -%}


            {%- for p in pt.items | sort(attribute='sort') -%}

              {%- set p_last = loop.last -%}

              {%- set child =
                '└─' if p_last
                else '├─'
              -%}

              {%- set base =
                '      ' if lxc_last
                else '   │  '
              -%}

              {%- set continuation =
                base ~ ('   ' if p_last else '│  ')
              -%}

              {%- set model =
                p.name | string | wordwrap(34, false)
              -%}

              {%- set model =
                model | replace(
                  '\n',
                  '\n' ~ continuation ~ '   '
                )
              -%}

              {%- set ns.lines = ns.lines + [
                base ~ child ~ ' ' ~ p.kind ~ ' ' ~ p.id,
                continuation ~ '└─ ' ~ model
              ] -%}

            {%- endfor -%}

          {%- endfor -%}


          <pre style="margin:0; padding:0; line-height:1; font-family:'Courier
          New',monospace; white-space:pre;">{{ ns.lines | join('\n') }}</pre>
        grid_options:
          columns: 12
      - type: markdown
        title: PVE · События памяти
        content: |-
          {% set src = 'sensor.dh_pve_agent_memory_history' -%}
          {% set events = state_attr(src, 'events') or [] -%}
          {% set count = states(src) | int(0) -%}
          {% set journal = state_attr(src, 'journal_status') -%}
          {% set psi = state_attr(src, 'pressure_status') -%}
          {% set ns = namespace(lines=[]) -%}

          {% if journal != 'ok' or psi != 'ok' -%}
            {% set ns.lines = ns.lines + [
              '⚪ **Диагностика неполная** · Журнал: ' ~
              (journal or '?') ~ ' · PSI: ' ~ (psi or '?'),
              ''
            ] -%}
          {% endif -%}

          {% if events -%}
            {% set ns.lines = ns.lines + [
              '| № | Время | PVE / LXC | Событие |',
              '|:--:|:--|:--|:--|'
            ] -%}

            {% for e in events -%}
              {% set color =
                '🔴' if e.level == 'red'
                else '🟠' if e.level == 'orange'
                else '🟡'
              -%}
              {% set dt = as_timestamp(e.at)
                | timestamp_custom('%d.%m %H:%M', true)
              -%}
              {% set desc = e.description
                | replace('|', '/')
                | replace('\n', ' ')
              -%}
              {% set ns.lines = ns.lines + [
                '| ' ~ loop.index ~
                ' | ' ~ dt ~
                ' | ' ~ e.guest ~
                ' | ' ~ color ~ ' ' ~ desc ~ ' |'
              ] -%}
            {% endfor -%}

            {% if state_attr(src, 'truncated') -%}
              {% set ns.lines = ns.lines + [
                '',
                'Показано ' ~ (events | count) ~
                ' из ' ~ count ~ ' событий.'
              ] -%}
            {% endif -%}

          {% elif journal == 'ok' and psi == 'ok' -%}
            {% set ns.lines = ns.lines + [
              '🟢 Подозрительных событий нет.'
            ] -%}
          {% else -%}
            {% set ns.lines = ns.lines + [
              '⚪ Нет подтверждённых данных.'
            ] -%}
          {% endif -%}

          {{ ns.lines | join('\n') }}
