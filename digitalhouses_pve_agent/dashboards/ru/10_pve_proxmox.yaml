      - type: heading
        heading: Охлаждение
        heading_style: subtitle
        icon: mdi:fan
      - type: custom:auto-entities
        show_empty: false
        unique: true
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          template: |-
            {% set ns = namespace(items=[]) %}

            {% for fan in states.sensor | sort(attribute='entity_id') %}
              {% if
                state_attr(fan.entity_id, 'proxmox_integration') == 'digitalhouses_pve_agent'
                and state_attr(fan.entity_id, 'proxmox_section') == 'cooling'
                and state_attr(fan.entity_id, 'proxmox_metric') == 'rpm'
              %}

                {% set rpm_id = fan.entity_id %}
                {% set speed_id = rpm_id | replace('_rpm', '_speed') %}
                {% set max_id =
                  rpm_id
                  | replace('sensor.', 'number.')
                  | replace('_rpm', '_max_rpm')
                %}

                {% set raw_name =
                  state_attr(speed_id, 'friendly_name')
                  or state_attr(rpm_id, 'proxmox_display_name')
                  or 'Fan'
                %}
                {% set fan_numbers = raw_name | regex_findall('(?i)fan\s*(\d+)') %}
                {% set name = 'FAN ' ~ fan_numbers[0] if fan_numbers else raw_name %}

                {% set rpm_raw = states(rpm_id) %}
                {% set speed_raw = states(speed_id) %}
                {% set max_raw = states(max_id) %}

                {% set rpm =
                  rpm_raw | int if rpm_raw | is_number else none
                %}
                {% set speed =
                  speed_raw | int if speed_raw | is_number else none
                %}

                {% if rpm is none %}
                  {% set color = 'grey' %}
                  {% set icon = 'mdi:fan-alert' %}
                  {% set secondary = 'RPM недоступен' %}
                {% elif rpm == 0 %}
                  {% set color = 'red' %}
                  {% set icon = 'mdi:fan-off' %}
                  {% set secondary =
                    ('0% · ' if speed is not none else '') ~ '0 RPM'
                  %}
                {% else %}
                  {% set color = 'blue' %}
                  {% set icon = 'mdi:fan' %}
                  {% set secondary =
                    ((speed ~ '% · ') if speed is not none else '')
                    ~ rpm ~ ' RPM'
                  %}
                {% endif %}

                {% set max_text =
                  (max_raw | int | string) ~ ' RPM'
                  if max_raw | is_number
                  else 'Не задано'
                %}

                {% set ns.items = ns.items + [{
                  'type': 'horizontal-stack',
                  'cards': [
                    {
                      'type': 'custom:mushroom-template-card',
                      'entity': rpm_id,
                      'primary': name,
                      'secondary': secondary,
                      'icon': icon,
                      'icon_color': color,
                      'layout': 'horizontal',
                      'fill_container': true,
                      'tap_action': {
                        'action': 'more-info'
                      }
                    },
                    {
                      'type': 'custom:mushroom-template-card',
                      'entity': max_id,
                      'primary': 'Max RPM',
                      'secondary': max_text,
                      'icon': 'mdi:speedometer',
                      'icon_color': 'grey',
                      'layout': 'horizontal',
                      'fill_container': true,
                      'tap_action': {
                        'action': 'more-info'
                      }
                    }
                  ]
                }] %}

              {% endif %}
            {% endfor %}

            {% if ns.items | count == 0 %}
              {% set ns.items = [{
                'type': 'custom:mushroom-template-card',
                'primary': 'Fan: Not detected',
                'secondary': 'Вентиляторы не обнаружены',
                'icon': 'mdi:fan-alert',
                'icon_color': 'red'
              }] %}
            {% endif %}

            {{ ns.items }}
        grid_options:
          columns: 12
          rows: auto
      - type: heading
        heading: Графика
        heading_style: subtitle
        icon: mdi:expansion-card
      - type: custom:auto-entities
        show_empty: false
        unique: true
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          template: |-
            {% set ns = namespace(items=[]) %}
            {% for e in states.sensor | sort(attribute='entity_id') %}
              {% if
                state_attr(e.entity_id, 'proxmox_integration') == 'digitalhouses_pve_agent'
                and state_attr(e.entity_id, 'proxmox_section') == 'graphics'
                and state_attr(e.entity_id, 'proxmox_metric') != 'transcoding'
              %}

                {% set metric = state_attr(e.entity_id, 'proxmox_metric') %}

                {% set name =
                  state_attr(e.entity_id, 'proxmox_display_name')
                  or state_attr(e.entity_id, 'model')
                  or e.name
                %}

                {% if metric == 'temperature' %}

                  {% set problem =
                    e.entity_id
                    | replace('sensor.', 'binary_sensor.')
                    | replace('_temperature', '_temperature_problem')
                  %}

                  {% if is_state(problem, 'on') %}
                    {% set color = 'red' %}
                    {% set icon = 'mdi:thermometer-alert' %}
                  {% elif is_state(problem, 'off') %}
                    {% set color = 'blue' %}
                    {% set icon = 'mdi:thermometer' %}
                  {% else %}
                    {% set color = 'grey' %}
                    {% set icon = 'mdi:thermometer' %}
                  {% endif %}

                  {% set threshold =
                    states('number.dh_pve_agent_gpu_temperature_threshold')
                  %}

                  {% if e.state | is_number %}
                    {% set secondary =
                      ('%.1f' | format(e.state | float))
                      ~ '°C'
                      ~ (
                        ' · порог ' ~ threshold ~ '°C'
                        if threshold not in ['unknown', 'unavailable', 'none', '']
                        else ''
                      )
                    %}
                  {% else %}
                    {% set secondary = 'Температура недоступна' %}
                  {% endif %}

                  {% set ns.items = ns.items + [{
                    'type': 'custom:mushroom-template-card',
                    'entity': e.entity_id,
                    'primary': 'GPU · ' ~ name,
                    'secondary': secondary,
                    'icon': icon,
                    'icon_color': color,
                    'tap_action': {
                      'action': 'more-info'
                    }
                  }] %}

                {% else %}

                  {% set available =
                    e.state not in ['unknown', 'unavailable', 'none', '']
                  %}

                  {% set ns.items = ns.items + [{
                    'type': 'custom:mushroom-template-card',
                    'entity': e.entity_id,
                    'primary': name,
                    'secondary': e.state if available else 'Нет данных',
                    'icon': state_attr(e.entity_id, 'icon') or 'mdi:expansion-card',
                    'icon_color': 'blue' if available else 'grey',
                    'layout': 'horizontal',
                    'fill_container': true,
                    'tap_action': {
                      'action': 'more-info'
                    }
                  }] %}

                {% endif %}

              {% endif %}
            {% endfor %}
            {{- ns.items -}}
        sort:
          method: entity_id
        grid_options:
          columns: 12
