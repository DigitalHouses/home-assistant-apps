                  'name': card_name,
                  'secondary': secondary,
                  'percent': percent,
                  'icon': icon,
                  'color': color,
                  'bar_color': color,
                  'bar_size': 'medium',
                  'tap_action': {
                    'action': 'more-info'
                  }
                }] %}

              {% endif %}
            {% endfor %}

            {{- ns.items -}}
