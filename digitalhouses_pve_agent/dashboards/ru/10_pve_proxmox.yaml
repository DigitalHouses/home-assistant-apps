          %} {% set smart = states('binary_sensor.dh_pve_agent_smart_collector')
          %}

          {% if not problems_available or smart in ['unknown', 'unavailable',
          'none', ''] %}
            Состояние дисков недоступно
          {% elif disk | count > 0 %}
            Обнаружена проблема с дисками
          {% elif smart == 'off' %}
            Не удалось проверить диски
          {% else %}
            Диски в норме
          {% endif %}
        secondary: >-
          {% set problems_available =
            states(entity) not in ['unknown', 'unavailable', 'none', '']
          %} {% set active = state_attr(entity, 'active') or [] %} {% set disk =
            active
            | selectattr('category', 'equalto', 'disk')
            | list
          %} {% set smart = states('binary_sensor.dh_pve_agent_smart_collector')
          %} {% set ns = namespace(items=[]) %}

          {% if not problems_available %}
            Список проблем недоступен.
