                  {% else %}
                    {% set secondary =
                      'Занято ' ~ ('%.1f' | format(used_percent)) ~ '%'
                    %}
                  {% endif %}

                  {% set card_name =
                    name ~ ' · занято ' ~ ('%.1f' | format(used_percent)) ~ '%'
                  %}

                  {% set percent = '%.2f' | format(used_percent) %}

                  {% if is_state(problem_entity, 'on') %}
                    {% set color = 'red' %}
                    {% set icon = 'mdi:database-alert' %}
                  {% elif is_state(problem_entity, 'off') %}
                    {% set color = 'green' %}
                    {% set icon = 'mdi:database-check' %}
                  {% else %}
                    {% set color = 'grey' %}
                    {% set icon = 'mdi:database' %}
                  {% endif %}

                {% else %}
                  {% set card_name = name %}
                  {% set secondary = 'Данные недоступны' %}
                  {% set percent = '0' %}
                  {% set color = 'grey' %}
                  {% set icon = 'mdi:database' %}
                {% endif %}

                {% set ns.items = ns.items + [{
                  'type': 'custom:entity-progress-card-template',
