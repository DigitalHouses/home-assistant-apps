# DH-View: dh_pve_agent
# DH-View-Version: 1.0.0
# DH-View-Date: 2026-11-14
# DH-Compatible-Agent: >=0.5.88,<0.5.90

title: Электропитание
path: dh_pve_agent_ups
icon: mdi:power-plug-battery
show_icon_and_title: false
type: sections
max_columns: 4
badges: []
sections:
  - type: grid
    cards:
      - type: heading
        heading: Состояние ИБП
        heading_style: title
        icon: mdi:power-plug-battery
      - type: custom:mushroom-template-card
        entity: binary_sensor.dh_pve_agent_ups_configured
        primary: ИБП не настроен
        secondary: >-
          Мониторинг UPS на этом сервере не настроен. Основной мониторинг
          Proxmox продолжает работать.
        icon: mdi:power-plug-off-outline
        icon_color: grey
        multiline_secondary: true
        tap_action:
          action: more-info
        visibility:
          - condition: state
            entity: binary_sensor.dh_pve_agent_ups_configured
            state: 'off'
        grid_options:
          columns: 12
          rows: auto
      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_agent_ups_problems
        primary: |-
          {% set available =
            is_state('binary_sensor.dh_pve_agent_ups_available', 'on')
          %} {% set problems = states(entity) %}
          {% if not available %}
            ИБП недоступен
          {% elif problems in ['unknown', 'unavailable', 'none', ''] %}
            Состояние ИБП неизвестно
          {% elif problems | is_number and problems | int(0) == 0 %}
            ИБП работает нормально
          {% else %}
            ИБП требует внимания
          {% endif %}
        secondary: >-
          {% set available =
            states('binary_sensor.dh_pve_agent_ups_available')
          %} {% set status = states('sensor.dh_pve_agent_ups_status') %} {% set
          problems = states(entity) %}

          {% if available != 'on' %}
            NUT не получает достоверные данные от UPS
          {% elif problems in ['unknown', 'unavailable', 'none', ''] %}
            Статус: {{ status }} · диагностика недоступна
          {% elif problems | is_number and problems | int(0) == 0 %}
            Статус: {{ status }}
          {% else %}
            Статус: {{ status }} · Проблемы: {{ problems }}
          {% endif %}
        icon: |-
          {% set available =
            states('binary_sensor.dh_pve_agent_ups_available')
          %} {% set problems = states(entity) %}
          {% if available != 'on' %}
            mdi:power-plug-off
          {% elif problems in ['unknown', 'unavailable', 'none', ''] %}
            mdi:shield-question
          {% elif problems | is_number and problems | int(0) == 0 %}
            mdi:shield-check
          {% else %}
            mdi:shield-alert
          {% endif %}
        icon_color: |-
          {% set available =
            states('binary_sensor.dh_pve_agent_ups_available')
          %} {% set problems = states(entity) %}
          {% if available != 'on' %}
            red
          {% elif problems in ['unknown', 'unavailable', 'none', ''] %}
            grey
          {% elif problems | is_number and problems | int(0) == 0 %}
            green
          {% else %}
            orange
          {% endif %}
        multiline_secondary: true
        tap_action:
          action: more-info
        visibility:
          - condition: state
            entity: binary_sensor.dh_pve_agent_ups_configured
            state: 'on'
        grid_options:
          columns: 12
          rows: auto
      - type: heading
        heading_style: title
        icon: mdi:chart-timeline-variant
        visibility:
          - condition: state
            entity: binary_sensor.dh_pve_agent_ups_configured
            state: 'on'
        heading: Текущий статус
      - type: grid
        columns: 2
        square: false
        visibility:
          - condition: state
            entity: binary_sensor.dh_pve_agent_ups_configured
            state: 'on'
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.dh_pve_agent_ups_status
            primary: |-
              {% set s = states('sensor.dh_pve_agent_ups_status') %}
              {% set labels = {
                'online': 'UPS в норме',
                'on_battery': 'Работа от батареи',
                'low_battery': 'Низкий заряд',
                'high_battery': 'Высокий заряд',
                'replace_battery': 'Требуется замена батареи',
                'bypass': 'Bypass',
                'calibration': 'Калибровка',
                'output_off': 'Выход UPS выключен',
                'overload': 'Перегрузка',
                'trim': 'AVR Trim',
                'boost': 'AVR Boost',
                'forced_shutdown': 'Forced Shutdown',
                'alarm': 'Авария UPS',
                'unknown': 'Состояние неизвестно',
                'unavailable': 'UPS недоступен'
              } %}
              {{ labels.get(s, s) }}
            secondary: Статус UPS
            icon: |-
              {% set s = states('sensor.dh_pve_agent_ups_status') %}
              {% set icons = {
                'online': 'mdi:power-plug-battery',
                'on_battery': 'mdi:battery-arrow-down',
                'low_battery': 'mdi:battery-alert',
                'high_battery': 'mdi:battery-high',
                'replace_battery': 'mdi:battery-sync-outline',
                'bypass': 'mdi:transit-connection-variant',
                'calibration': 'mdi:battery-sync',
                'output_off': 'mdi:power-plug-off',
                'overload': 'mdi:alert-octagon',
                'trim': 'mdi:arrow-down-bold',
                'boost': 'mdi:arrow-up-bold',
                'forced_shutdown': 'mdi:power',
                'alarm': 'mdi:alarm-light',
                'unknown': 'mdi:help-circle-outline',
                'unavailable': 'mdi:connection'
              } %}
              {{ icons.get(s, 'mdi:power-plug-battery') }}
            icon_color: |-
              {% set s = states('sensor.dh_pve_agent_ups_status') %}
              {% set colors = {
                'online': 'green',
                'on_battery': 'orange',
                'low_battery': 'red',
                'high_battery': 'green',
                'replace_battery': 'red',
                'bypass': 'orange',
                'calibration': 'blue',
                'output_off': 'red',
                'overload': 'red',
                'trim': 'orange',
                'boost': 'orange',
                'forced_shutdown': 'red',
                'alarm': 'red',
                'unknown': 'grey',
                'unavailable': 'grey'
              } %}
              {{ colors.get(s, 'grey') }}
            tap_action:
              action: more-info
            fill_container: true
          - type: custom:mushroom-template-card
            entity: sensor.dh_pve_agent_ups_battery_charger_status
            primary: |-
              {% set replace =
                is_state(
                  'binary_sensor.dh_pve_agent_ups_replace_battery_problem',
                  'on'
                )
              %}
              {% set charge =
                states('sensor.dh_pve_agent_ups_battery_charge')
              %}

              {% if replace %}
                Требуется замена батареи
              {% elif charge | is_number %}
                Батарея {{ charge | float | round(0) | int }} %
              {% else %}
                Батарея
              {% endif %}
            secondary: |-
              {% set replace =
                is_state(
                  'binary_sensor.dh_pve_agent_ups_replace_battery_problem',
                  'on'
                )
              %}
              {% set s =
                states('sensor.dh_pve_agent_ups_battery_charger_status')
              %}
              {% set labels = {
                'charging': 'Заряжается',
                'floating': 'Поддержание заряда',
                'resting': 'Заряжена',
                'idle': 'Ожидание',
                'discharging': 'Разряжается',
                'unknown': 'Состояние неизвестно',
                'unavailable': 'Данные недоступны'
              } %}

              {% if replace %}
                ⚠️ NUT сообщает Replace Battery
              {% else %}
                {{ labels.get(s, s) }}
              {% endif %}
            icon: |-
              {% set replace =
                is_state(
                  'binary_sensor.dh_pve_agent_ups_replace_battery_problem',
                  'on'
                )
              %}
              {% set s =
                states('sensor.dh_pve_agent_ups_battery_charger_status')
              %}

              {% if replace %}
                mdi:battery-alert
              {% else %}
                {% set icons = {
                  'charging': 'mdi:battery-charging',
                  'floating': 'mdi:battery-sync',
                  'resting': 'mdi:battery-check',
                  'idle': 'mdi:battery-clock-outline',
                  'discharging': 'mdi:battery-arrow-down',
                  'unknown': 'mdi:battery-unknown',
                  'unavailable': 'mdi:battery-off-outline'
                } %}
                {{ icons.get(s, 'mdi:battery-unknown') }}
              {% endif %}
            icon_color: |-
              {% set replace =
                is_state(
                  'binary_sensor.dh_pve_agent_ups_replace_battery_problem',
                  'on'
                )
              %}
              {% set s =
                states('sensor.dh_pve_agent_ups_battery_charger_status')
              %}

              {% if replace %}
                red
              {% else %}
                {% set colors = {
                  'charging': 'green',
                  'floating': 'green',
                  'resting': 'green',
                  'idle': 'blue',
                  'discharging': 'orange',
                  'unknown': 'grey',
                  'unavailable': 'grey'
                } %}
                {{ colors.get(s, 'grey') }}
              {% endif %}
            tap_action:
              action: more-info
            fill_container: true
        grid_options:
          columns: 12
      - type: heading
        heading: История и диагностика
        heading_style: title
        icon: mdi:chart-timeline-variant
        visibility:
          - condition: state
            entity: binary_sensor.dh_pve_agent_ups_configured
            state: 'on'
      - type: vertical-stack
        cards:
          - square: false
            type: grid
            columns: 2
            cards:
              - type: tile
                entity: sensor.dh_pve_agent_ups_input_voltage
                vertical: false
                features:
                  - type: trend-graph
                    hours_to_show: 24
                    detail: true
                features_position: bottom
                name: Вход
              - type: tile
                entity: sensor.dh_pve_agent_ups_output_voltage
                vertical: false
                features:
                  - type: trend-graph
                    hours_to_show: 24
                    detail: true
                features_position: bottom
                name: Выход
              - type: tile
                entity: sensor.dh_pve_agent_ups_battery_charge
                name: Батарея
                vertical: false
                features:
                  - type: trend-graph
                    hours_to_show: 24
                    detail: true
                features_position: bottom
              - type: tile
                entity: sensor.dh_pve_agent_ups_battery_runtime_minutes
                name: Прогноз работы
                show_entity_picture: false
                vertical: false
                features:
                  - type: trend-graph
                    hours_to_show: 24
                    detail: true
                features_position: bottom
          - type: tile
            entity: sensor.dh_pve_agent_ups_load
            vertical: false
            features:
              - type: trend-graph
                hours_to_show: 24
                detail: true
            features_position: bottom
            name: Нагрузка
        grid_options:
          rows: auto
        visibility:
          - condition: state
            entity: binary_sensor.dh_pve_agent_ups_configured
            state: 'on'
      - type: heading
        heading: Управление
        heading_style: subtitle
        icon: mdi:refresh
        visibility:
          - condition: state
            entity: binary_sensor.dh_pve_agent_ups_configured
            state: 'on'
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: button.dh_pve_agent_ups_refresh
            name: Обновить UPS
            icon: mdi:refresh
            color: purple
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.dh_pve_agent_ups_refresh
              confirmation:
                text: Обновить данные UPS?
          - type: tile
            entity: button.dh_pve_agent_scan_ups
            name: Сканировать UPS
            icon: mdi:magnify-scan
            color: purple
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.dh_pve_agent_scan_ups
              confirmation:
                text: Выполнить поиск подключённых UPS?
        grid_options:
          columns: 12
        visibility:
          - condition: state
            entity: binary_sensor.dh_pve_agent_ups_configured
            state: 'on'
      - type: heading
        heading: События месяца
        heading_style: subtitle
        icon: mdi:transmission-tower-export
        visibility:
          - condition: state
            entity: binary_sensor.dh_pve_agent_ups_configured
            state: 'on'
      - type: markdown
        content: >-
          {%- set entity = 'sensor.dh_pve_agent_ups_line_power_outages_month'
          -%}

          {%- set events = state_attr(entity, 'events') or [] -%}

          {%- set month = state_attr(entity, 'month') or '' -%}

          {%- set since = state_attr(entity, 'history_since') -%}

          {%- set quality_since = state_attr(entity, 'quality_history_since')
          -%}

          {%- set omitted = state_attr(entity, 'events_omitted_count') | int(0)
          -%}

          {%- set names = {
            'outage':'🔴 Нет сети', 'boost':'🔼 Boost',
            'trim':'🔽 Trim', 'bypass':'🔀 Bypass',
            'overload':'⚠️ Перегрузка'
          } -%}

          {%- set months = {
            '01':'январь', '02':'февраль', '03':'март', '04':'апрель',
            '05':'май', '06':'июнь', '07':'июль', '08':'август',
            '09':'сентябрь', '10':'октябрь', '11':'ноябрь', '12':'декабрь'
          } -%}

          {%- set ns = namespace(rows=[]) -%}

          {%- for r in events | reverse -%}
            {%- set kind = r['event'] | default('outage', true) -%}
            {%- set started = as_local(as_datetime(r['from'])).strftime('%d.%m %H:%M:%S') if r['from'] else '—' -%}
            {%- set ended = as_local(as_datetime(r['to'])).strftime('%d.%m %H:%M:%S') if r['to'] else 'сейчас' -%}
            {%- set seconds = r['duration_seconds'] | int(0) -%}
            {%- set duration = ('%02d:%02d:%02d' | format(seconds // 3600, (seconds % 3600) // 60, seconds % 60)) if seconds >= 3600 else ('%02d:%02d' | format(seconds // 60, seconds % 60)) -%}
            {%- set duration = ('≈ ' if r['estimated'] else '') ~ duration -%}
            {%- set ns.rows = ns.rows + [
              '| ' ~ loop.index ~ ' | ' ~ names.get(kind, kind) ~
              ' | ' ~ started ~ ' | ' ~ ended ~ ' | **' ~ duration ~ '** |'
            ] -%}
          {%- endfor -%}

          {%- set count = states(entity) -%}

          {%- set secs =
          states('sensor.dh_pve_agent_ups_line_power_offline_month') | int(0)
          -%}

          {%- set total_time = '%02d:%02d:%02d' | format(secs // 3600, (secs %
          3600) // 60, secs % 60) -%}

          {%- set caption = '## События питания — ' ~ months.get(month[5:7],
          'текущий месяц') -%}

          {%- set header = '| № | Событие | С | До | Длительность
          |\n|:---:|:---|:---|:---|---:|\n' -%}

          {%- if events | count > 0 -%}
            {{ caption ~ '\n\n' ~ header ~ (ns.rows | join('\n')) }}
          {%- else -%}
            {{ caption ~ '\n\n' ~ 'Событий пока нет.' }}
          {%- endif -%}

          {{ '\n\n**Отключений:** ' ~ (count if count not in
          ['unknown','unavailable','none',''] else '—') ~ ' · **Без питания:** '
          ~ total_time }}

          {%- if omitted > 0 -%}
            {{ '\n\n_Показаны последние 10 событий, ещё ' ~ omitted ~ ' хранятся на PVE._' }}
          {%- endif -%}

          {%- if since -%}
            {{ '\n\n_Отключения записываются с ' ~ as_local(as_datetime(since)).strftime('%d.%m.%Y %H:%M') ~ '._' }}
          {%- endif -%}

          {%- if quality_since -%}
            {{ '\n_События качества питания записываются с ' ~ as_local(as_datetime(quality_since)).strftime('%d.%m.%Y %H:%M') ~ '._' }}
          {%- endif -%}

          {%- if events | selectattr('estimated') | list | count > 0 -%}
            {{ '\n\n_≈ Время ориентировочное: начало до запуска наблюдения, перезапуск агента или перерыв связи с NUT._' }}
          {%- endif -%}
        visibility:
          - condition: state
            entity: binary_sensor.dh_pve_agent_ups_configured
            state: 'on'
        grid_options:
          columns: 12
          rows: auto
      - type: heading
        heading: Диагностика UPS
        heading_style: subtitle
        icon: mdi:stethoscope
        visibility:
          - condition: state
            entity: binary_sensor.dh_pve_agent_ups_configured
            state: 'on'
      - type: grid
        columns: 2
        square: false
        visibility:
          - condition: state
            entity: binary_sensor.dh_pve_agent_ups_configured
            state: 'on'
        cards:
          - type: custom:mushroom-template-card
            entity: binary_sensor.dh_pve_agent_ups_nut_unavailable_problem
            primary: NUT
            secondary: |-
              {% if is_state(entity, 'on') %}
                Недоступен
              {% elif is_state(entity, 'off') %}
                OK
              {% else %}
                Нет данных
              {% endif %}
            icon: mdi:server-network
            icon_color: |-
              {% if is_state(entity, 'on') %}
                red
              {% elif is_state(entity, 'off') %}
                green
              {% else %}
                grey
              {% endif %}
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: binary_sensor.dh_pve_agent_ups_on_battery_problem
            primary: Питание
            secondary: |-
              {% if is_state(entity, 'on') %}
                От батареи
              {% elif is_state(entity, 'off') %}
                Сеть
              {% else %}
                Нет данных
              {% endif %}
            icon: mdi:power-plug-battery
            icon_color: |-
              {% if is_state(entity, 'on') %}
                orange
              {% elif is_state(entity, 'off') %}
                green
              {% else %}
                grey
              {% endif %}
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: binary_sensor.dh_pve_agent_ups_low_battery_problem
            primary: Батарея
            secondary: |-
              {% if is_state(entity, 'on') %}
                Низкий заряд
              {% elif is_state(entity, 'off') %}
                OK
              {% else %}
                Нет данных
              {% endif %}
            icon: mdi:battery-alert
            icon_color: |-
              {% if is_state(entity, 'on') %}
                red
              {% elif is_state(entity, 'off') %}
                green
              {% else %}
                grey
              {% endif %}
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: binary_sensor.dh_pve_agent_ups_overload_problem
            primary: Нагрузка
            secondary: |-
              {% if is_state(entity, 'on') %}
                Перегрузка
              {% elif is_state(entity, 'off') %}
                OK
              {% else %}
                Нет данных
              {% endif %}
            icon: mdi:gauge-full
            icon_color: |-
              {% if is_state(entity, 'on') %}
                red
              {% elif is_state(entity, 'off') %}
                green
              {% else %}
                grey
              {% endif %}
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: binary_sensor.dh_pve_agent_ups_replace_battery_problem
            primary: Замена батареи
            secondary: |-
              {% if is_state(entity, 'on') %}
                Требуется
              {% elif is_state(entity, 'off') %}
                Не требуется
              {% else %}
                Нет данных
              {% endif %}
            icon: mdi:battery-sync
            icon_color: |-
              {% if is_state(entity, 'on') %}
                red
              {% elif is_state(entity, 'off') %}
                green
              {% else %}
                grey
              {% endif %}
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: binary_sensor.dh_pve_agent_ups_bypass_problem
            primary: Bypass
            secondary: |-
              {% if is_state(entity, 'on') %}
                Активен
              {% elif is_state(entity, 'off') %}
                Нет
              {% else %}
                Нет данных
              {% endif %}
            icon: mdi:transit-connection-variant
            icon_color: |-
              {% if is_state(entity, 'on') %}
                orange
              {% elif is_state(entity, 'off') %}
                green
              {% else %}
                grey
              {% endif %}
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: binary_sensor.dh_pve_agent_ups_power_state_unknown_problem
            primary: Состояние питания
            secondary: |-
              {% if is_state(entity, 'on') %}
                Неизвестно
              {% elif is_state(entity, 'off') %}
                OK
              {% else %}
                Нет данных
              {% endif %}
            icon: mdi:help-circle-outline
            icon_color: |-
              {% if is_state(entity, 'on') %}
                red
              {% elif is_state(entity, 'off') %}
                green
              {% else %}
                grey
              {% endif %}
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.dh_pve_agent_ups_app_profile
            primary: Профиль UPS
            secondary: >-
              {% set s = states(entity) %} {{ 'Нет данных' if s in ['unknown',
              'unavailable', 'none', ''] else s }}
            icon: mdi:tune-variant
            icon_color: blue
            tap_action:
              action: more-info
        grid_options:
          columns: 12
          rows: auto
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.dh_pve_agent_ups_beeper_control_supported
            state: 'on'
        card:
          type: heading
          heading: Звуковой сигнал UPS
          heading_style: subtitle
          icon: mdi:volume-high
      - type: conditional
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity: switch.dh_pve_agent_ups_beeper
                state: 'on'
              - condition: state
                entity: switch.dh_pve_agent_ups_beeper
                state: 'off'
        card:
          type: tile
          entity: switch.dh_pve_agent_ups_beeper
          name: Управление зуммером
          icon: mdi:volume-high
          hide_state: false
          vertical: true
          tap_action:
            action: more-info
          features:
            - type: toggle
          features_position: bottom
        grid_options:
          columns: 12
          rows: auto
  - type: grid
    visibility:
      - condition: state
        entity: binary_sensor.dh_pve_agent_ups_configured
        state: 'on'
    cards:
      - type: heading
        heading_style: subtitle
        icon: mdi:timer-check-outline
        heading: Параметры shutdown в PVE
      - type: markdown
        content: >-
          {% set readiness = 'sensor.dh_pve_agent_ups_shutdown_readiness' %}

          {% set guest = 'sensor.dh_pve_agent_ups_guest_shutdown_budget' %}

          {% set shutdown = 'sensor.dh_pve_agent_ups_shutdown_budget' %}


          {% set guest_budget = states(guest) | int(0) %}

          {% set total_budget = states(shutdown) | int(0) %}


          {% set pve_budget =
              (state_attr(shutdown, 'hostsync_budget_seconds') | int(0)) +
              (state_attr(shutdown, 'host_tail_budget_seconds') | int(0)) +
              (state_attr(shutdown, 'finaldelay_seconds') | int(0))
          %}


          {% set running = state_attr(guest, 'running_guests') or [] %}

          {% set sequence = state_attr(guest, 'shutdown_sequence') or [] %}


          {% set state = states(readiness) %}

          {% set issues = state_attr(readiness, 'issues') or [] %}


          {% set ns = namespace(sequence_parts=[]) %}


          {% for group in sequence %}
            {% if group | count > 1 %}
              {% set ns.sequence_parts =
                ns.sequence_parts + ['[' ~ group | join(', ') ~ ']']
              %}
            {% elif group | count == 1 %}
              {% set ns.sequence_parts = ns.sequence_parts + [group[0]] %}
            {% endif %}
          {% endfor %}


          ### ⚙️ Конфигурация shutdown в PVE


          ▶️ Гости ({{ running | count }}): {{ '%d:%02d' |

          format(guest_budget // 60, guest_budget % 60) }}


          🖥️ PVE: {{ '%d:%02d' |

          format(pve_budget // 60, pve_budget % 60) }}


          ⏱️ **ИТОГО: {{ '%d:%02d' |

          format(total_budget // 60, total_budget % 60) }}**


          ---


          {% if state in ['ok', 'ready'] %}


          🟢 **Готовность shutdown: Готово**


          {% elif state in ['unknown', 'unavailable', 'skip'] %}


          ⚪ **Готовность shutdown: Нет данных**


          {% else %}


          🟠 **Готовность shutdown: {{ issues | count }}**


          {% for issue in issues %}
            {% if issue == 'nut_unavailable' %}
          {{ loop.index }}. 🔴 UPS · нет связи через NUT
            {% elif issue == 'shutdown_policy_unavailable' %}
          {{ loop.index }}. ⚠️ NUT · настройки автоматического выключения
          недоступны
            {% elif issue == 'shutdown_policy_not_enabled' %}
          {{ loop.index }}. ⚠️ PVE · автоматическое выключение от UPS не готово
            {% elif issue == 'nut_role_not_primary' %}
          {{ loop.index }}. ⚠️ PVE · не назначен главным сервером UPS (NUT
          PRIMARY)
            {% elif issue == 'nut_monitor_not_active' %}
          {{ loop.index }}. ⚠️ NUT · служба monitor не запущена
            {% elif issue == 'shutdown_disabled' %}
          {{ loop.index }}. ⚠️ PVE · команда выключения от UPS не активирована
            {% elif issue == 'power_restore_delay_unreadable' %}
          {{ loop.index }}. ⚠️ UPS · не удалось определить задержку включения
          после возврата питания
            {% elif issue == 'shutdown_budget_unavailable' %}
          {{ loop.index }}. ⚠️ PVE · не удалось рассчитать время выключения
          VM/LXC
            {% elif issue == 'previous_host_shutdown_unclean' %}
          {{ loop.index }}. 🔴 PVE · предыдущий shutdown завершился некорректно
            {% elif issue == 'previous_host_shutdown_unknown' %}
          {{ loop.index }}. ⚪ PVE · результат предыдущего shutdown не
          подтверждён
            {% elif issue.startswith('vm:') and issue.endswith(':near_timeout') %}
          {{ loop.index }}. 🟠 VM {{ issue.split(':')[1] }} · shutdown близко к
          timeout
            {% elif issue.startswith('lxc:') and issue.endswith(':near_timeout') %}
          {{ loop.index }}. 🟠 LXC {{ issue.split(':')[1] }} · shutdown близко к
          timeout
            {% elif issue.startswith('vm:') and issue.endswith(':timeout') %}
          {{ loop.index }}. 🔴 VM {{ issue.split(':')[1] }} · превышен shutdown
          timeout
            {% elif issue.startswith('lxc:') and issue.endswith(':timeout') %}
          {{ loop.index }}. 🔴 LXC {{ issue.split(':')[1] }} · превышен shutdown
          timeout
            {% elif issue.startswith('vm:') and issue.endswith(':forced') %}
          {{ loop.index }}. 🔴 VM {{ issue.split(':')[1] }} · потребовалось
          принудительное выключение
            {% elif issue.startswith('lxc:') and issue.endswith(':forced') %}
          {{ loop.index }}. 🔴 LXC {{ issue.split(':')[1] }} · потребовалось
          принудительное выключение
            {% elif issue.startswith('vm:') %}
          {{ loop.index }}. ⚠️ VM {{ issue.split(':')[1] }} · требуется
          проверить shutdown
            {% elif issue.startswith('lxc:') %}
          {{ loop.index }}. ⚠️ LXC {{ issue.split(':')[1] }} · требуется
          проверить shutdown
            {% else %}
          {{ loop.index }}. ⚠️ Требуется дополнительная проверка shutdown
            {% endif %}
          {% endfor %}


          {% endif %}


          ---


          🔌 **Цепочка выключения**


          {{ ns.sequence_parts | join(' → ') }}




          ---

          📖 [Инструкция по настройке UPS/NUT и безопасного shutdown
          PVE](https://github.com/DigitalHouses/home-assistant-apps/blob/main/digitalhouses_pve_agent/docs/UPS_SHUTDOWN_SETUP.md)
      - type: heading
        heading: VM / LXC
        heading_style: subtitle
        icon: mdi:server-network
      - type: markdown
        title: История остановок PVE
        content: >-
          {%- macro mmss(v) -%}
            {%- if v is none -%}
              —
            {%- else -%}
              {{ '%d:%02d' | format((v | int) // 60, (v | int) % 60) }}
            {%- endif -%}
          {%- endmacro -%}


          {%- set history =
            state_attr(
              'sensor.dh_pve_agent_shutdown_history',
              'history'
            ) or []
          -%}


          {%- set ns = namespace(
            lines=['PVE · факт / настроено']
          ) -%}


          {%- for h in history | reverse -%}

            {%- set host_last = loop.last -%}

            {%- set host_branch =
              '└─' if host_last else '├─'
            -%}

            {%- set child_indent =
              '   ' if host_last else '│  '
            -%}


            {%- set status =
              h.get('shutdown_status', 'unknown')
            -%}

            {%- set shutdown_class =
              h.get('shutdown_class', 'unknown')
            -%}

            {%- set shutdown_reason =
              h.get('shutdown_reason', 'unknown')
            -%}

            {%- set ts =
              h.get('shutdown_at')
              or h.get('last_journal_at')
            -%}

            {%- set actual =
              h.get('actual_shutdown_seconds')
            -%}

            {%- set planned =
              h.get('planned_shutdown_seconds')
            -%}


            {%- set host_icon = {
              'correct': '🟢',
              'incorrect': '🔴',
              'unknown': '⚪'
            }.get(status, '⚪') -%}


            {%- set reason = {
              'ups_power': 'Отключение питания',
              'normal': 'Штатная остановка',
              'unclean': 'Некорректная остановка',
              'unknown': 'Причина неизвестна'
            }.get(shutdown_class, shutdown_class) -%}


            {%- if ts -%}

              {%- set dt =
                as_datetime(ts) | as_local
              -%}

              {%- set when =
                dt.strftime('%d.%m · %H:%M')
              -%}

            {%- else -%}

              {%- set when = '—' -%}

            {%- endif -%}


            {%- if planned is none -%}

              {%- set plan_text =
                'план неизвестен'
              -%}

            {%- else -%}

              {%- set plan_text =
                mmss(planned)
              -%}

            {%- endif -%}


            {%- if status == 'incorrect' -%}

              {%- set host_text =
                '⚠️ Завершение PVE не подтверждено'
                ~ ' · '
                ~ mmss(actual)
                ~ ' / '
                ~ plan_text
              -%}

            {%- else -%}

              {%- set host_text =
                reason
                ~ ' · '
                ~ mmss(actual)
                ~ ' / '
                ~ plan_text
              -%}

            {%- endif -%}


            {%- set ns.lines = ns.lines + [
              host_branch
              ~ ' '
              ~ host_icon
              ~ ' '
              ~ when
              ~ ' · '
              ~ host_text
            ] -%}


            {%- set guests =
              h.get('guests') or {}
            -%}

            {%- set children =
              namespace(items=[])
            -%}


            {%- for kind in ['vm', 'lxc'] -%}

              {%- for gid, g
                in (guests.get(kind) or {}).items()
              -%}

                {%- set children.items =
                  children.items
                  + [[kind, gid, g]]
                -%}

              {%- endfor -%}

            {%- endfor -%}


            {# ---------- UPS ---------- #}

            {%- if shutdown_class == 'ups_power' -%}

              {%- set held =
                h.get('outage_to_fsd_seconds')
              -%}

              {%- set charge =
                h.get('battery_charge_at_fsd')
              -%}

              {%- set charge_threshold =
                h.get('trigger_charge_threshold_percent')
              -%}

              {%- set runtime_threshold =
                h.get('trigger_runtime_threshold_seconds')
              -%}


              {%- set ns.lines = ns.lines + [
                child_indent
                ~ '├─ 🔋 UPS удерживал: '
                ~ mmss(held)
              ] -%}


              {%- if shutdown_reason == 'charge_guard' -%}

                {%- if charge_threshold is number -%}

                  {%- set trigger_text =
                    'Причина: порог заряда '
                    ~ (charge_threshold | round(0) | int)
                    ~ '%'
                  -%}

                {%- else -%}

                  {%- set trigger_text =
                    'Причина: порог заряда ??%'
                  -%}

                {%- endif -%}


              {%- elif shutdown_reason == 'runtime_guard' -%}

                {%- if runtime_threshold is number -%}

                  {%- set trigger_text =
                    'Причина: порог остатка '
                    ~ mmss(runtime_threshold)
                  -%}

                {%- else -%}

                  {%- set trigger_text =
                    'Причина: порог остатка ??:??'
                  -%}

                {%- endif -%}


              {%- elif shutdown_reason in
                ['low_battery_fsd', 'native_lb']
              -%}

                {%- if charge is number -%}

                  {%- set trigger_text =
                    'Причина: UPS Low Battery · заряд '
                    ~ (charge | round(0) | int)
                    ~ '%'
                  -%}

                {%- else -%}

                  {%- set trigger_text =
                    'Причина: UPS Low Battery'
                  -%}

                {%- endif -%}


              {%- elif shutdown_reason == 'on_battery_fsd' -%}

                {%- set trigger_text =
                  'Причина: FSD при работе от батареи'
                -%}


              {%- else -%}

                {%- set trigger_text =
                  'Причина: '
                  ~ shutdown_reason
                -%}

              {%- endif -%}


              {%- set ns.lines = ns.lines + [
                child_indent
                ~ '│  └─ '
                ~ trigger_text
              ] -%}

            {%- endif -%}


            {# ---------- VM / LXC ---------- #}

            {%- for item in children.items -%}

              {%- set child_last =
                loop.last
              -%}

              {%- set child_branch =
                '└─' if child_last else '├─'
              -%}

              {%- set kind =
                item[0]
              -%}

              {%- set gid =
                item[1]
              -%}

              {%- set g =
                item[2]
              -%}


              {%- set name =
                g.get('name')
              -%}


              {%- if not name -%}

                {%- set entity =
                  'sensor.dh_pve_agent_'
                  ~ kind
                  ~ '_'
                  ~ gid
                  ~ '_status'
                -%}

                {%- set name =
                  state_attr(
                    entity,
                    'proxmox_display_name'
                  )
                -%}

              {%- endif -%}


              {%- if not name -%}

                {%- set name =
                  ('VM ' if kind == 'vm' else 'LXC ')
                  ~ gid
                -%}

              {%- endif -%}


              {%- set assessment =
                g.get(
                  'assessment',
                  'unknown'
                )
              -%}


              {%- set guest_icon = {
                'ok': '🟢',
                'warning': '🟠',
                'critical': '🔴',
                'unknown': '⚪'
              }.get(
                assessment,
                '⚪'
              ) -%}


              {%- set ns.lines = ns.lines + [
                child_indent
                ~ child_branch
                ~ ' '
                ~ guest_icon
                ~ ' '
                ~ gid
                ~ '·'
                ~ name
                ~ ' · '
                ~ mmss(
                  g.get(
                    'duration_seconds'
                  )
                )
                ~ '/'
                ~ mmss(
                  g.get(
                    'timeout_seconds'
                  )
                )
              ] -%}

            {%- endfor -%}

          {%- endfor -%}


          <pre style="margin:0; padding:0; line-height:1.05;
          font-family:'Courier New',monospace; white-space:pre;">{{ ns.lines |
          join('\n') }}</pre>
        grid_options:
          columns: 12
          rows: auto
      - type: markdown
        content: >-
          {%- set guest_budget =
          states('sensor.dh_pve_agent_ups_guest_shutdown_budget') | int(0) -%}

          {%- set shutdown_budget =
          states('sensor.dh_pve_agent_ups_shutdown_budget') | int(0) -%}

          {%- set pve_budget = shutdown_budget - guest_budget -%}


          {%- set ns = namespace(items=[], rows='') -%}


          {%- for s in states.sensor -%}
            {%- if (s.entity_id.startswith('sensor.dh_pve_agent_vm_')
                    or s.entity_id.startswith('sensor.dh_pve_agent_lxc_'))
                  and s.entity_id.endswith('_shutdown')
                  and state_attr(s.entity_id, 'onboot') == true -%}

              {%- set kind = state_attr(s.entity_id, 'guest_kind') | upper -%}
              {%- set id = state_attr(s.entity_id, 'guest_id') -%}
              {%- set name = state_attr(s.entity_id, 'proxmox_display_name') -%}

              {%- set duration = state_attr(s.entity_id, 'last_shutdown_duration_seconds') -%}
              {%- set last_timeout = state_attr(s.entity_id, 'last_shutdown_timeout_seconds') -%}
              {%- set last_assessment = state_attr(s.entity_id, 'last_shutdown_assessment') -%}

              {%- set configured_timeout = state_attr(s.entity_id, 'shutdown_timeout_seconds') -%}
              {%- set next_timeout = state_attr(s.entity_id, 'next_shutdown_timeout_seconds') -%}
              {%- set next_ratio = state_attr(s.entity_id, 'next_shutdown_timeout_ratio') -%}
              {%- set next_assessment = state_attr(s.entity_id, 'next_shutdown_assessment') -%}

              {%- set order = state_attr(s.entity_id, 'shutdown_order') | int(0) -%}

              {%- if last_assessment == 'ok' -%}
                {%- set last_icon = '🟢' -%}
              {%- elif last_assessment == 'warning' -%}
                {%- set last_icon = '🟠' -%}
              {%- elif last_assessment == 'critical' -%}
                {%- set last_icon = '🔴' -%}
              {%- else -%}
                {%- set last_icon = '⚪' -%}
              {%- endif -%}

              {%- if next_assessment == 'ok' -%}
                {%- set next_icon = '🟢' -%}
              {%- elif next_assessment == 'warning' -%}
                {%- set next_icon = '🟠' -%}
              {%- elif next_assessment == 'critical' -%}
                {%- set next_icon = '🔴' -%}
              {%- else -%}
                {%- set next_icon = '⚪' -%}
              {%- endif -%}

              {%- if duration is not none -%}
                {%- set last_text =
                  last_icon ~ ' ' ~ duration ~ ' сек · лимит ' ~
                  (last_timeout if last_timeout is not none else '?') ~ ' сек'
                -%}
              {%- else -%}
                {%- set last_text = '⚪ нет данных' -%}
              {%- endif -%}

              {%- if duration is not none and next_timeout is not none -%}
                {%- set next_text =
                  next_icon ~ ' ' ~ duration ~ ' сек · лимит ' ~ next_timeout ~ ' сек'
                -%}

                {%- if next_ratio is not none -%}
                  {%- set next_text =
                    next_text ~ ' · ' ~
                    ((next_ratio | float * 100) | round(0) | int) ~ '%'
                  -%}
                {%- endif -%}
              {%- else -%}
                {%- set next_text =
                  '⚪ нет истории · лимит ' ~
                  (configured_timeout if configured_timeout is not none else '?') ~ ' сек'
                -%}
              {%- endif -%}

              {%- set ns.items = ns.items + [{
                'order': order,
                'guest': kind ~ ' ' ~ id ~ ' · ' ~ name,
                'last': last_text,
                'next': next_text
              }] -%}
            {%- endif -%}
          {%- endfor -%}


          {%- for item in ns.items | sort(attribute='order', reverse=true) -%}
            {%- set ns.rows = ns.rows
              ~ '\n| ' ~ item.guest
              ~ ' | ' ~ item.last
              ~ ' | ' ~ item.next
              ~ ' |'
            -%}
          {%- endfor -%}


          {{ '### ⚙️ Текущее состояние shutdown'
             ~ '\n\n'
             ~ '| Гость | Последний shutdown | При следующем shutdown |'
             ~ '\n'
             ~ '|:--|:--|:--|'
             ~ ns.rows
             ~ '\n'
             ~ '| **ИТОГО** | **Гости: '
             ~ ('%d:%02d' | format(guest_budget // 60, guest_budget % 60))
             ~ '** | **PVE: '
             ~ ('%d:%02d' | format(pve_budget // 60, pve_budget % 60))
             ~ ' · ВСЕГО: '
             ~ ('%d:%02d' | format(shutdown_budget // 60, shutdown_budget % 60))
             ~ '** |'
          }}
        grid_options:
          columns: 12
          rows: auto
  - type: grid
    visibility:
      - condition: state
