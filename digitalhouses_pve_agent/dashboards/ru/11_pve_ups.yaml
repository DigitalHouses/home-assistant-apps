              - condition: state
                entity: binary_sensor.dh_pve_agent_ups_quick_test_supported
                state: 'on'
              - condition: state
                entity: binary_sensor.dh_pve_agent_ups_deep_test_supported
                state: 'on'
        card:
          type: heading
          heading: Расписание тестов UPS
          heading_style: subtitle
          icon: mdi:calendar-sync-outline
      - type: conditional
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity: binary_sensor.dh_pve_agent_ups_quick_test_supported
                state: 'on'
              - condition: state
                entity: binary_sensor.dh_pve_agent_ups_deep_test_supported
                state: 'on'
        card:
          type: horizontal-stack
          cards:
            - type: conditional
              conditions:
                - condition: state
                  entity: binary_sensor.dh_pve_agent_ups_quick_test_supported
                  state: 'on'
              card:
                type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    subtitle: Быстрый тест батареи
                  - type: custom:mushroom-number-card
                    entity: number.dh_pve_agent_ups_quick_test_interval_days
                    name: Интервал
                    icon: mdi:calendar-range
                    display_mode: buttons
                  - type: custom:mushroom-entity-card
                    entity: time.dh_pve_agent_ups_quick_test_time
                    name: Время
                    icon: mdi:clock-outline
                    fill_container: true
                    tap_action:
                      action: more-info
                  - type: custom:mushroom-entity-card
                    entity: sensor.dh_pve_agent_ups_next_quick_test
                    name: Следующий тест
                    icon: mdi:calendar-clock
                    tap_action:
                      action: more-info
                  - type: custom:mushroom-entity-card
                    entity: sensor.dh_pve_agent_ups_last_quick_test
                    name: Последний результат
                    icon: mdi:battery-check
                    tap_action:
                      action: more-info
            - type: conditional
              conditions:
                - condition: state
                  entity: binary_sensor.dh_pve_agent_ups_deep_test_supported
                  state: 'on'
              card:
                type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    subtitle: Глубокий тест батареи
                  - type: custom:mushroom-number-card
                    entity: number.dh_pve_agent_ups_deep_test_interval_days
                    name: Интервал
                    icon: mdi:calendar-range
                    display_mode: buttons
                  - type: custom:mushroom-entity-card
                    entity: time.dh_pve_agent_ups_deep_test_time
                    name: Время
                    icon: mdi:clock-outline
                    fill_container: true
                    tap_action:
                      action: more-info
                  - type: custom:mushroom-entity-card
                    entity: sensor.dh_pve_agent_ups_next_deep_test
                    name: Следующий тест
                    icon: mdi:calendar-clock
                    tap_action:
                      action: more-info
                  - type: custom:mushroom-entity-card
                    entity: sensor.dh_pve_agent_ups_last_deep_test
                    name: Последний результат
                    icon: mdi:battery-check
                    tap_action:
                      action: more-info
      - type: markdown
        title: 🧪 История тестов батареи
        content: >
          {%- set history = state_attr('sensor.dh_pve_agent_ups_test_history',
          'history') or [] -%}

          {%- set ns = namespace(rows=[]) -%}


          {%- for r in history | reverse -%}

            {%- if r.type == 'Standard' -%}
              {%- set test_type = 'Стандартный' -%}
            {%- elif r.type == 'Quick' -%}
              {%- set test_type = 'Быстрый' -%}
            {%- elif r.type == 'Deep' -%}
              {%- set test_type = 'Глубокий' -%}
            {%- else -%}
              {%- set test_type = r.type | default('—', true) -%}
            {%- endif -%}

            {%- if r.source == 'Manual' -%}
              {%- set source_text = 'Вручную' -%}
            {%- elif r.source == 'Scheduled' -%}
              {%- set source_text = 'По расписанию' -%}
            {%- else -%}
              {%- set source_text = r.source | default('—', true) -%}
            {%- endif -%}

            {%- if r.result == 'Passed' -%}
              {%- set result_text = '✅ Пройден' -%}
            {%- elif r.result == 'Failed' -%}
              {%- set result_text = '❌ Ошибка' -%}
            {%- elif r.result == 'Stopped' -%}
              {%- set result_text = '⏹️ Остановлен' -%}
            {%- elif r.result == 'Running' -%}
              {%- set result_text = '⏳ Выполняется' -%}
            {%- elif r.result == 'Started' -%}
              {%- set result_text = '⏳ Ожидается результат' -%}
            {%- else -%}
              {%- set result_text = r.result | default('—', true) -%}
            {%- endif -%}

            {%- if r.duration_seconds is not none -%}
              {%- set duration = '%02d:%02d' | format(
                (r.duration_seconds | int) // 60,
                (r.duration_seconds | int) % 60
              ) -%}
            {%- else -%}
              {%- set duration = '—' -%}
            {%- endif -%}

            {%- if r.battery_charge_before is not none -%}
              {%- set battery =
                (r.battery_charge_before | round(0) | int | string) ~ '%'
              -%}
              {%- if r.battery_charge_after is not none -%}
                {%- set battery = battery ~ ' → ' ~
                  (r.battery_charge_after | round(0) | int | string) ~ '%'
                -%}
              {%- endif -%}
            {%- else -%}
              {%- set battery = '—' -%}
            {%- endif -%}

            {%- set started =
              as_datetime(r.started_at).strftime('%d.%m %H:%M')
              if r.started_at is not none else '—'
            -%}

            {%- set ns.rows = ns.rows + [
              '| ' ~ started ~
              ' | ' ~ test_type ~
              ' | ' ~ source_text ~
              ' | ' ~ result_text ~
              ' | ' ~ duration ~
              ' | ' ~ battery ~ ' |'
            ] -%}

          {%- endfor -%}


          {% if history | count == 0 -%}

          История тестов пока пуста.

          {%- else %}

          {{ '| Дата | Тест | Запуск | Результат | Длительность | Батарея
          |\n|:---|:---|:---|:---|---:|:---:|\n' ~ (ns.rows | join('\n')) }}


          **Всего записей: {{ history | count }}**

          {% endif %}
        grid_options:
          columns: 12
          rows: auto
  - type: grid
    visibility:
      - condition: state
        entity: binary_sensor.dh_pve_agent_ups_configured
        state: 'on'
    cards:
      - type: heading
        heading: Параметры аварийного отключения
        heading_style: title
        icon: mdi:shield-power
      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_agent_ups_trigger_policy
        primary: Действующая Trigger Policy
        secondary: |-
          {% set charge =
            state_attr(entity, 'active_charge_threshold_percent')
          %} {% set reserve =
            state_attr(entity, 'active_runtime_reserve_seconds')
          %} {% set budget =
            states('sensor.dh_pve_agent_ups_shutdown_budget')
          %}
          {% if charge is number %}
            Заряд ≤ {{ charge | round(0) | int }} %
          {% else %}
            Заряд: нет данных
          {% endif %}
          {% if reserve is number and budget | is_number %}
            · остаток ≤ {{
              ((budget | float + reserve | float) / 60) | round(1)
            }} мин
          {% endif %}
        icon: mdi:shield-check
        icon_color: |-
          {% set s = states(entity) %} {% if s == 'Active' %}
            green
          {% elif s == 'Pending changes' %}
            orange
          {% elif s in ['unknown', 'unavailable', 'none', ''] %}
            grey
          {% else %}
            red
          {% endif %}
        multiline_secondary: true
        tap_action:
          action: more-info
        grid_options:
          columns: 12
          rows: auto
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            subtitle: Настройка · черновик
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-number-card
                entity: number.dh_pve_agent_ups_shutdown_battery_charge_threshold
                name: Черновик · порог заряда
                icon: mdi:battery-alert
                display_mode: buttons
                fill_container: true
              - type: custom:mushroom-number-card
                entity: number.dh_pve_agent_ups_shutdown_runtime_reserve
                name: Черновик · резерв времени
                icon: mdi:timer-plus-outline
                display_mode: buttons
                fill_container: true
          - type: custom:mushroom-title-card
            subtitle: Действующие условия shutdown
          - type: custom:mushroom-template-card
            entity: sensor.dh_pve_agent_ups_trigger_policy
            primary: Заряд батареи
            secondary: |-
              {% set value =
                state_attr(entity, 'active_charge_threshold_percent')
              %} {% if value is number %}
                ≤ {{ value | round(0) | int }} %
              {% else %}
                Нет данных
              {% endif %}
            icon: mdi:battery-alert
            icon_color: orange
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.dh_pve_agent_ups_shutdown_budget
            primary: Остаток времени
            secondary: |-
              {% set budget = states(entity) %} {% set reserve =
                state_attr(
                  'sensor.dh_pve_agent_ups_trigger_policy',
                  'active_runtime_reserve_seconds'
                )
              %}
              {% if budget | is_number and reserve is number %}
                ≤ {{ ((budget | float + reserve | float) / 60) | round(1) }} мин
                · shutdown {{ (budget | float / 60) | round(1) }} мин
                + резерв {{ (reserve | float / 60) | round(1) }} мин
              {% else %}
                Расчёт сейчас недоступен
              {% endif %}
            icon: mdi:timer-alert-outline
            icon_color: orange
            multiline_secondary: true
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: Low Battery
            secondary: Нативный аварийный сигнал UPS
            icon: mdi:battery-alert-variant-outline
            icon_color: red
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.dh_pve_agent_ups_trigger_policy
                state: Pending changes
            card:
              type: custom:mushroom-template-card
              entity: button.dh_pve_agent_ups_apply_trigger_policy
              primary: Применить изменения
              secondary: >-
                {% set policy = 'sensor.dh_pve_agent_ups_trigger_policy' %} {%
                set charge =
                  state_attr(policy, 'draft_charge_threshold_percent')
                %} {% set reserve =
                  state_attr(policy, 'draft_runtime_reserve_seconds')
                %}

                {% if charge is number and reserve is number %}
                  Черновик: заряд {{ charge | round(0) | int }} %
                  · резерв {{ (reserve | float / 60) | round(1) }} мин
                {% else %}
                  Есть изменения, ожидающие применения
                {% endif %}
              icon: mdi:check-decagram-outline
              icon_color: orange
              multiline_secondary: true
              tap_action:
                action: perform-action
                perform_action: button.press
                target:
                  entity_id: button.dh_pve_agent_ups_apply_trigger_policy
                confirmation:
                  text: Применить новые параметры аварийного отключения?
        grid_options:
          columns: 12
          rows: auto
      - type: heading
        icon: mdi:shield-check
        heading: Логика аварийного отключения
        heading_style: title
      - type: markdown
        content: >
          {% set policy_entity = 'sensor.dh_pve_agent_ups_trigger_policy' %}

          {% set budget_entity = 'sensor.dh_pve_agent_ups_shutdown_budget' %}


          {% set battery = states('sensor.dh_pve_agent_ups_battery_charge') %}

          {% set load = states('sensor.dh_pve_agent_ups_load') %}

          {% set runtime =
          states('sensor.dh_pve_agent_ups_battery_runtime_minutes') %}


          {% set charge_limit = state_attr(policy_entity,
          'active_charge_threshold_percent') %}

          {% set reserve = state_attr(policy_entity,
          'active_runtime_reserve_seconds') %}


          {% set budget = states(budget_entity) %}

          {% set guest = states('sensor.dh_pve_agent_ups_guest_shutdown_budget')
          %}


          {% set hostsync = state_attr(budget_entity, 'hostsync_budget_seconds')
          %}

          {% set finaldelay = state_attr(budget_entity, 'finaldelay_seconds') %}

          {% set host_tail = state_attr(budget_entity,
          'host_tail_budget_seconds') %}


          {% set shutdown_delay =
          states('sensor.dh_pve_agent_ups_shutdown_delay') %}

          {% set start_delay = states('sensor.dh_pve_agent_ups_start_delay') %}


          {% set battery_ok = battery | is_number %}

          {% set load_ok = load | is_number %}

          {% set runtime_ok = runtime | is_number %}

          {% set charge_limit_ok = charge_limit | is_number %}

          {% set reserve_ok = reserve | is_number %}

          {% set budget_ok = budget | is_number %}

          {% set guest_ok = guest | is_number %}

          {% set hostsync_ok = hostsync | is_number %}

          {% set finaldelay_ok = finaldelay | is_number %}

          {% set host_tail_ok = host_tail | is_number %}

          {% set shutdown_delay_ok = shutdown_delay | is_number %}

          {% set start_delay_ok = start_delay | is_number %}


          {% if budget_ok and reserve_ok %}
            {% set shutdown_threshold = budget | float + reserve | float %}
            {% set shutdown_threshold_min = shutdown_threshold / 60 %}
          {% else %}
            {% set shutdown_threshold = none %}
            {% set shutdown_threshold_min = none %}
          {% endif %}


          ## 🔋 Состояние UPS сейчас


          | | |

          |---|---:|

          | Заряд батареи | {% if battery_ok %}**{{ battery | float | round(0) |
          int }} %**{% else %}нет данных{% endif %} |

          | Нагрузка | {% if load_ok %}**{{ load | float | round(1) }} %**{%
          else %}нет данных{% endif %} |

          | Оценка времени работы от батареи | {% if runtime_ok %}около **{{
          runtime | float | round(1) }} мин**{% else %}нет данных{% endif %} |


          Оценка времени работы показывает, сколько UPS сможет питать текущую
          нагрузку, если внешнее питание пропадёт сейчас.


          ---


          ## ⚙️ Вы настроили


          | Параметр | Текущее значение |

          |---|---:|

          | Порог заряда батареи | {% if charge_limit_ok %}**{{ charge_limit |
          float | round(0) | int }} %**{% else %}нет данных{% endif %} |

          | Дополнительный резерв времени | {% if reserve_ok %}**{{ (reserve |
          float / 60) | round(1) }} мин**{% else %}нет данных{% endif %} |


          Эти параметры **не являются фиксированными требованиями системы**. Это
          текущие настройки вашей Trigger Policy.


          ---


          ## 🧮 Что рассчитала система


          {% if budget_ok %}

          Для корректного выключения текущей конфигурации Proxmox требуется до
          **{{ (budget | float / 60) | round(1) }} мин**.

          {% else %}

          Время, необходимое на корректное выключение, сейчас определить нельзя.

          {% endif %}


          {% if guest_ok %}

          Из них на остановку VM / LXC зарезервировано до **{{ (guest | float /
          60) | round(1) }} мин**.

          {% endif %}


          {% if budget_ok and reserve_ok %}


          При ваших текущих настройках:


          **{{ (budget | float / 60) | round(1) }} мин на выключение  

          + {{ (reserve | float / 60) | round(1) }} мин дополнительного
          резерва  

          = {{ shutdown_threshold_min | round(1) }} мин**


          Поэтому система должна начать выключение, когда UPS прогнозирует около
          **{{ shutdown_threshold_min | round(1) }} мин оставшейся работы**.


          {% if runtime_ok %}
            {% set runtime_left = runtime | float %}
            {% if runtime_left > shutdown_threshold_min %}
          Сейчас UPS прогнозирует **{{ runtime_left | round(1) }} мин**, то есть
          примерно на **{{ (runtime_left - shutdown_threshold_min) | round(1) }}
          мин больше текущего порога выключения**.
            {% else %}
          Сейчас UPS прогнозирует **{{ runtime_left | round(1) }} мин** — это
          уже не больше текущего порога **{{ shutdown_threshold_min | round(1)
          }} мин**.
            {% endif %}
          {% endif %}


          {% endif %}


          ---


          ## ⚡ Когда начнётся аварийное выключение


          Выключение начинается, если произошло **любое одно** из следующих
          событий:


          - 🚨 UPS сообщил **Low Battery**

          {% if charge_limit_ok %}

          - 🔋 заряд батареи снизился до **{{ charge_limit | float | round(0) |
          int }} %**

          {% else %}

          - 🔋 порог заряда батареи сейчас недоступен

          {% endif %}

          {% if shutdown_threshold_min is not none %}

          - ⏱️ прогноз оставшегося времени работы снизился до **{{
          shutdown_threshold_min | round(1) }} мин**

          {% else %}

          - ⏱️ порог по оставшемуся времени сейчас недоступен

          {% endif %}


          Пока ни одно из этих условий не выполнено, Proxmox продолжает работать
          от батареи.


          ---


          ## 🛑 Что происходит после сигнала выключения


          После сигнала решение о shutdown уже принято. Возврат внешнего питания
          **не отменяет** начатое выключение.


          {% if hostsync_ok and finaldelay_ok and guest_ok and host_tail_ok %}

            {% set prep = hostsync | float + finaldelay | float %}
            {% set guests = guest | float %}
            {% set tail = host_tail | float %}

            {% set after_prep = prep %}
            {% set after_guests = prep + guests %}
            {% set after_host = prep + guests + tail %}

          | Этап | Время этапа | Всего после сигнала |

          |---|---:|---:|

          | 🚨 Сигнал выключения | сразу | **0:00** |

          | 🔗 Подготовка NUT | до **{{ prep | round(0) | int }} с** | **{{
          (after_prep / 60) | round(1) }} мин** |

          | 📦 Остановка VM / LXC | до **{{ guests | round(0) | int }} с · {{
          (guests / 60) | round(1) }} мин** | **{{ (after_guests / 60) |
          round(1) }} мин** |

          | 🖥️ Завершение работы Proxmox | до **{{ tail | round(0) | int }} с**
          | **{{ (after_host / 60) | round(1) }} мин** |

          | ✅ Proxmox выключен |  | **до {{ (budget | float / 60) | round(1) }}
          мин** |


          {% else %}


          Детальная разбивка этапов сейчас недоступна.


          {% endif %}


          ---


          ## 🔄 После выключения Proxmox


          | | |

          |---|---:|

          | Отключение выхода UPS | {% if shutdown_delay_ok %}через **{{
          shutdown_delay | float | round(0) | int }} с**{% else %}нет данных{%
          endif %} |

          | Включение выхода после возврата сети | {% if start_delay_ok %}через
          **{{ start_delay | float | round(0) | int }} с**{% else %}нет данных{%
          endif %} |

          | Запуск Proxmox | автоматически после восстановления питания |

          | Запуск VM / LXC | согласно настройкам запуска Proxmox |


          Время отключения и повторного включения выхода UPS **не входит** во
          время, необходимое Proxmox для корректного shutdown.
        grid_options:
          columns: 12
          rows: auto
      - type: heading
        heading: Диагностика
        heading_style: subtitle
        icon: mdi:stethoscope
cards: []
