type: markdown
content: |
  {% set readiness = 'sensor.dh_pve_agent_ups_shutdown_readiness' %}
  {% set guest = 'sensor.dh_pve_agent_ups_guest_shutdown_budget' %}
  {% set shutdown = 'sensor.dh_pve_agent_ups_shutdown_budget' %}

  {% set guest_budget = states(guest) | int(0) %}
  {% set total_budget = states(shutdown) | int(0) %}

  {% set pve_budget =
      (state_attr(shutdown, 'hostsync_budget_seconds') | int(0)) +
      (state_attr(shutdown, 'host_tail_budget_seconds') | int(0)) +
      (state_attr(shutdown, 'finaldelay_seconds') | int(0))
  %}

  {% set running = state_attr(guest, 'running_guests') or [] %}
  {% set sequence = state_attr(guest, 'shutdown_sequence') or [] %}

  {% set state = states(readiness) %}
  {% set issues = state_attr(readiness, 'issues') or [] %}

  {% set ns = namespace(sequence_parts=[]) %}

  {% for group in sequence %}
    {% if group | count > 1 %}
      {% set ns.sequence_parts =
        ns.sequence_parts + ['[' ~ group | join(', ') ~ ']']
      %}
    {% elif group | count == 1 %}
      {% set ns.sequence_parts = ns.sequence_parts + [group[0]] %}
    {% endif %}
  {% endfor %}

  ### ⚙️ Конфигурация shutdown в PVE

  ▶️ Гости ({{ running | count }}): {{ '%d:%02d' |
  format(guest_budget // 60, guest_budget % 60) }}

  🖥️ PVE: {{ '%d:%02d' |
  format(pve_budget // 60, pve_budget % 60) }}

  ⏱️ **ИТОГО: {{ '%d:%02d' |
  format(total_budget // 60, total_budget % 60) }}**

  <hr>

  {% if state in ['ok', 'ready'] %}

  🟢 **Готовность shutdown: Готово**

  {% elif state in ['unknown', 'unavailable', 'skip'] %}

  ⚪ **Готовность shutdown: Нет данных**

  {% else %}

  🟠 **Готовность shutdown: {{ issues | count }}**
  {% for issue in issues %}
    {% if issue == 'nut_unavailable' %}
  {{ loop.index }}. 🔴 UPS · нет связи через NUT
    {% elif issue == 'shutdown_policy_unavailable' %}
  {{ loop.index }}. ⚠️ NUT · настройки автоматического выключения недоступны
    {% elif issue == 'shutdown_policy_not_enabled' %}
  {{ loop.index }}. ⚠️ PVE · автоматическое выключение от UPS не готово
    {% elif issue == 'nut_role_not_primary' %}
  {{ loop.index }}. ⚠️ PVE · не назначен главным сервером UPS (NUT PRIMARY)
    {% elif issue == 'nut_monitor_not_active' %}
  {{ loop.index }}. ⚠️ NUT · служба monitor не запущена
    {% elif issue == 'shutdown_disabled' %}
  {{ loop.index }}. ⚠️ PVE · команда выключения от UPS не активирована
    {% elif issue == 'power_restore_delay_unreadable' %}
  {{ loop.index }}. ⚠️ UPS · не удалось определить задержку включения после возврата питания
    {% elif issue == 'shutdown_budget_unavailable' %}
  {{ loop.index }}. ⚠️ PVE · не удалось рассчитать время выключения VM/LXC
    {% elif issue == 'previous_host_shutdown_unclean' %}
  {{ loop.index }}. 🔴 PVE · предыдущий shutdown завершился некорректно
    {% elif issue == 'previous_host_shutdown_unknown' %}
  {{ loop.index }}. ⚪ PVE · результат предыдущего shutdown не подтверждён
    {% elif issue.startswith('vm:') and issue.endswith(':near_timeout') %}
  {{ loop.index }}. 🟠 VM {{ issue.split(':')[1] }} · shutdown близко к timeout
    {% elif issue.startswith('lxc:') and issue.endswith(':near_timeout') %}
  {{ loop.index }}. 🟠 LXC {{ issue.split(':')[1] }} · shutdown близко к timeout
    {% elif issue.startswith('vm:') and issue.endswith(':timeout') %}
  {{ loop.index }}. 🔴 VM {{ issue.split(':')[1] }} · превышен shutdown timeout
    {% elif issue.startswith('lxc:') and issue.endswith(':timeout') %}
  {{ loop.index }}. 🔴 LXC {{ issue.split(':')[1] }} · превышен shutdown timeout
    {% elif issue.startswith('vm:') and issue.endswith(':forced') %}
  {{ loop.index }}. 🔴 VM {{ issue.split(':')[1] }} · потребовалось принудительное выключение
    {% elif issue.startswith('lxc:') and issue.endswith(':forced') %}
  {{ loop.index }}. 🔴 LXC {{ issue.split(':')[1] }} · потребовалось принудительное выключение
    {% elif issue.startswith('vm:') %}
  {{ loop.index }}. ⚠️ VM {{ issue.split(':')[1] }} · требуется проверить shutdown
    {% elif issue.startswith('lxc:') %}
  {{ loop.index }}. ⚠️ LXC {{ issue.split(':')[1] }} · требуется проверить shutdown
    {% else %}
  {{ loop.index }}. ⚠️ Требуется дополнительная проверка shutdown
    {% endif %}
  {% endfor %}

  {% endif %}

  <hr>

  🔌 **Цепочка выключения**

  {{ ns.sequence_parts | join(' → ') }}

  📖 [Инструкция по настройке UPS/NUT и безопасного shutdown PVE](https://github.com/DigitalHouses/home-assistant-apps/blob/main/digitalhouses_pve_agent/docs/UPS_SHUTDOWN_SETUP.md)

