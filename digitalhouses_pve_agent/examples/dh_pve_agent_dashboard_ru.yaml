title: Proxmox
path: dh_pve_agent_agent
icon: mdi:server
type: sections
max_columns: 4
sections:
  - type: grid
    cards:
      - type: heading
        heading: Хост
        heading_style: title
        icon: mdi:server
      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_agent_system
        primary: PVE
        secondary: |-
          {% if states(entity) in ['unknown', 'unavailable', 'none', ''] %}
            Нет данных от Proxmox
          {% else %}
            {% set manufacturer = state_attr(entity, 'manufacturer') or '' %}
            {% set model = state_attr(entity, 'model') or '' %}
            {% set board_vendor = state_attr(entity, 'board_vendor') or '' %}
            {% set board_model = state_attr(entity, 'board_model') or '' %}

            {% set cpu_model = state_attr(entity, 'cpu_model') or '' %}
            {% set cpu_cores = state_attr(entity, 'cpu_cores') %}
            {% set cpu_threads = state_attr(entity, 'cpu_threads') %}

            {% set memory_type = state_attr(entity, 'memory_type') or '' %}
            {% set memory_form_factor = state_attr(entity, 'memory_form_factor') or '' %}
            {% set slots_populated = state_attr(entity, 'memory_slots_populated') %}
            {% set slots_total = state_attr(entity, 'memory_slots_total') %}
            {% set memory_speed = state_attr(entity, 'memory_speed_mt_s') %}
            {% set memory_total =
              state_attr('sensor.dh_pve_agent_memory_usage', 'total_gib')
            %}

            {% set kernel = state_attr(entity, 'kernel_version') or '' %}
            {% set pve_raw = state_attr(entity, 'proxmox_version') or '' %}
            {% set ip = state_attr(entity, 'primary_ip') or '' %}
            {% set app_version =
              states('sensor.dh_pve_agent_app_version')
            %}

            {% set lines = namespace(items=[]) %}

            {% if manufacturer %}
              {% set lines.items =
                lines.items + ['Manufacturer: ' ~ manufacturer]
              %}
            {% endif %}

            {% if model %}
              {% set lines.items =
                lines.items + ['Model: ' ~ model]
              %}
            {% endif %}

            {% if cpu_model %}
              {% set cpu =
                cpu_model
                | replace('Intel(R)', 'Intel')
                | replace('Core(TM)', 'Core')
                | replace('(R)', '')
                | replace('(TM)', '')
                | replace('CPU ', '')
                | replace('  ', ' ')
                | trim
              %}

              {% if cpu_cores is not none and cpu_threads is not none %}
                {% set cpu =
                  cpu ~ ' · ' ~ cpu_cores ~ 'C/' ~ cpu_threads ~ 'T'
                %}
              {% endif %}

              {% set lines.items =
                lines.items + ['CPU: ' ~ cpu]
              %}
            {% endif %}

            {% if board_model or board_vendor %}
              {% set board = (board_vendor ~ ' ' ~ board_model) | trim %}
              {% set lines.items =
                lines.items + ['MB: ' ~ board]
              %}
            {% endif %}

            {% set ram = namespace(parts=[]) %}

            {% if memory_total is number %}
              {% set ram.parts = ram.parts + [
                ('%.1f' | format(memory_total | float)) ~ ' GiB'
              ] %}
            {% endif %}

            {% if memory_type %}
              {% set ram.parts = ram.parts + [memory_type] %}
            {% endif %}

            {% if memory_form_factor %}
              {% set ram.parts = ram.parts + [memory_form_factor] %}
            {% endif %}

            {% if slots_populated is not none and slots_total is not none %}
              {% set ram.parts = ram.parts + [
                'слоты ' ~ slots_populated ~ '/' ~ slots_total
              ] %}
            {% endif %}

            {% if memory_speed is number %}
              {% set ram.parts = ram.parts + [
                (memory_speed | int) ~ ' MT/s'
              ] %}
            {% endif %}

            {% if ram.parts | count > 0 %}
              {% set lines.items =
                lines.items + ['RAM: ' ~ (ram.parts | join(' · '))]
              %}
            {% endif %}

            {% set pve_version =
              pve_raw.split('/')[1]
              if '/' in pve_raw
              else pve_raw
            %}

            {% set kernel_short =
              kernel | replace('-pve', '')
            %}

            {% set software = namespace(parts=[]) %}

            {% if pve_version %}
              {% set software.parts =
                software.parts + [pve_version]
              %}
            {% endif %}

            {% if kernel_short %}
              {% set software.parts =
                software.parts + ['Kernel ' ~ kernel_short]
              %}
            {% endif %}

            {% if software.parts | count > 0 %}
              {% set lines.items =
                lines.items + [
                  'Proxmox ver: ' ~ (software.parts | join(' · '))
                ]
              %}
            {% endif %}

            {# Dynamic cooling inventory. Percent is primary; RPM is fallback. #}
            {% set fans = namespace(items=[]) %}

            {% for fan in states.sensor | sort(attribute='entity_id') %}
              {% if
                state_attr(fan.entity_id, 'proxmox_integration') == 'digitalhouses_pve_agent'
                and state_attr(fan.entity_id, 'proxmox_section') == 'cooling'
                and state_attr(fan.entity_id, 'proxmox_metric') == 'rpm'
                and fan.state | is_number
              %}
                {% set fan_name =
                  state_attr(fan.entity_id, 'proxmox_display_name')
                  or state_attr(fan.entity_id, 'label')
                  or 'Fan'
                %}
                {% set speed_id =
                  fan.entity_id | replace('_rpm', '_speed')
                %}
                {% set speed = states(speed_id) %}

                {% if speed | is_number %}
                  {% set fan_value = (speed | int) ~ '%' %}
                {% else %}
                  {% set fan_value = (fan.state | int) ~ ' RPM' %}
                {% endif %}

                {% set fans.items = fans.items + [
                  fan_name ~ ': ' ~ fan_value
                ] %}
              {% endif %}
            {% endfor %}

            {% if fans.items | count > 0 %}
              {% set lines.items =
                lines.items + ['FAN: ' ~ (fans.items | join(' · '))]
              %}
            {% else %}
              {% set lines.items =
                lines.items + ['FAN: Not detected']
              %}
            {% endif %}

            {% if ip %}
              {% set lines.items =
                lines.items + ['IP: ' ~ ip]
              %}
            {% endif %}

            {% if app_version not in ['unknown', 'unavailable', 'none', ''] %}
              {% set lines.items =
                lines.items + ['App ver: ' ~ app_version]
              %}
            {% endif %}

            {{ lines.items | join('\n') }}
          {% endif %}
        icon: mdi:server
        icon_color: |-
          {% if is_state('binary_sensor.dh_pve_agent_host_collector', 'on') %}
            green
          {% elif is_state('binary_sensor.dh_pve_agent_host_collector', 'off') %}
            red
          {% else %}
            grey
          {% endif %}
        multiline_secondary: true
        tap_action:
          action: more-info
        grid_options:
          columns: 12
      - type: heading
        heading: Состояние Proxmox
        heading_style: title
        icon: phu:proxmox
      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_agent_problems
        primary: |-
          {% set active = state_attr(entity, 'active') or [] %}
          {% if states(entity) in ['unknown', 'unavailable', 'none', ''] %}
            Нет данных о проблемах
          {% elif active | count == 0 %}
            Проблем не обнаружено
          {% else %}
            Обнаружено проблем: {{ active | count }}
          {% endif %}
        secondary: |-
          {% set active = state_attr(entity, 'active') or [] %}
          {% if states(entity) in ['unknown', 'unavailable', 'none', ''] %}
            Состояние проблем недоступно.
          {% elif active | count == 0 %}
            Система работает штатно.
          {% else %}
            {% for item in active %}
              {% set object_name = item.get('object_name', 'Объект') %}
              {% set summary = item.get('summary', 'Проблема') %}
              {% set details = item.get('details', '') %}
              • {{ object_name }} — {{ summary }}{% if details %} · {{ details }}{% endif %}
              {% if not loop.last %}

              {% endif %}
            {% endfor %}
          {% endif %}
        icon: |-
          {% set active = state_attr(entity, 'active') or [] %}
          {% if states(entity) in ['unknown', 'unavailable', 'none', ''] %}
            mdi:help-circle-outline
          {% elif active | count > 0 %}
            mdi:alert-circle
          {% else %}
            mdi:check-circle
          {% endif %}
        icon_color: |-
          {% if states(entity) in ['unknown', 'unavailable', 'none', ''] %}
            grey
          {% elif (state_attr(entity, 'active') or []) | count > 0 %}
            red
          {% else %}
            green
          {% endif %}
        multiline_secondary: true
        tap_action:
          action: more-info
        grid_options:
          columns: 12
      - type: heading
        heading: Производительность
        heading_style: subtitle
        icon: mdi:speedometer
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mini-graph-card
            entity: sensor.dh_pve_agent_cpu_usage
            name: CPU
            icon: mdi:cpu-64-bit
            entities:
              - sensor.dh_pve_agent_cpu_usage
            hours_to_show: 12
            points_per_hour: 4
            line_width: 2
            height: 100
            decimals: 1
            lower_bound: 0
            upper_bound: 100
            show:
              name: true
              icon: true
              state: true
              graph: line
              fill: true
              points: false
              labels: false
              extrema: true
          - type: custom:mini-graph-card
            entity: sensor.dh_pve_agent_memory_usage
            name: Память
            icon: mdi:memory
            entities:
              - sensor.dh_pve_agent_memory_usage
            hours_to_show: 12
            points_per_hour: 4
            line_width: 2
            height: 100
            decimals: 1
            lower_bound: 0
            upper_bound: 100
            show:
              name: true
              icon: true
              state: true
              graph: line
              fill: true
              points: false
              labels: false
              extrema: true
        grid_options:
          columns: 12
      - type: heading
        heading_style: subtitle
        icon: mdi:server
        heading: Приложение
      - type: custom:mushroom-template-card
        entity: button.dh_pve_agent_refresh
        primary: Обновить сейчас
        secondary: >-
          {% set last = states('sensor.dh_pve_agent_last_refresh') %} {% if last
          not in ['unknown', 'unavailable', 'none', ''] %}
            Последнее: {{ as_timestamp(last)
              | timestamp_custom('%d.%m.%Y %H:%M:%S', true) }}
          {% else %}
            Ручное обновление ещё не выполнялось
          {% endif %}
        icon: mdi:refresh
        icon_color: blue
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.dh_pve_agent_refresh
          confirmation:
            text: Обновить данные DH PVE Agent?
        grid_options:
          columns: 12
      - type: vertical-stack
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.dh_pve_agent_last_refresh
            primary: Последнее ручное обновление
            secondary: >-
              {% set ts = states(entity) %} {% if ts not in ['unknown',
              'unavailable', 'none', ''] %}
                {{ as_timestamp(ts)
                  | timestamp_custom('%d.%m.%Y %H:%M:%S', true) }}
              {% else %}
                Нет данных
              {% endif %}
            icon: mdi:clock-check-outline
            icon_color: >-
              {% if states(entity) not in ['unknown', 'unavailable', 'none', '']
              %}
                green
              {% else %}
                grey
              {% endif %}
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: sensor.dh_pve_agent_agent_started
            name: Агент запущен
            icon: mdi:clock-start
            tap_action:
              action: more-info
        grid_options:
          columns: 12
      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_agent_last_boot
        primary: Время работы PVE сервера
        secondary: >-
          {% set boot = states(entity) %} {% if boot not in ['unknown',
          'unavailable', 'none', ''] %}
            {% set sec = (as_timestamp(now()) - as_timestamp(boot)) | int %}
            {% set days = sec // 86400 %}
            {% set hours = (sec % 86400) // 3600 %}
            {% set minutes = (sec % 3600) // 60 %}

            {% if days > 0 %}
              {{ days }} д. {{ '%02d:%02d' | format(hours, minutes) }}
            {% else %}
              {{ '%02d:%02d' | format(hours, minutes) }}
            {% endif %}
          {% else %}
            Нет данных
          {% endif %}
        icon: mdi:timer-outline
        tap_action:
          action: more-info
        grid_options:
          columns: 12
        color: |-
          {% if states(entity) not in ['unknown', 'unavailable', 'none', ''] %}
            green
          {% else %}
            grey
          {% endif %}
        features_position: bottom
  - type: grid
    cards:
      - type: heading
        heading: Диски и хранилища
        heading_style: title
        icon: mdi:harddisk
      - type: heading
        heading: Диагностика дисков
        heading_style: subtitle
        icon: mdi:harddisk-check
      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_agent_problems
        primary: >-
          {% set problems_available =
            states(entity) not in ['unknown', 'unavailable', 'none', '']
          %} {% set active = state_attr(entity, 'active') or [] %} {% set disk =
            active
            | selectattr('category', 'equalto', 'disk')
            | list
          %} {% set smart = states('binary_sensor.dh_pve_agent_smart_collector')
          %}

          {% if not problems_available or smart in ['unknown', 'unavailable',
          'none', ''] %}
            Состояние дисков недоступно
          {% elif disk | count > 0 %}
            Обнаружена проблема с дисками
          {% elif smart == 'off' %}
            Не удалось проверить диски
          {% else %}
            Диски в норме
          {% endif %}
        secondary: >-
          {% set problems_available =
            states(entity) not in ['unknown', 'unavailable', 'none', '']
          %} {% set active = state_attr(entity, 'active') or [] %} {% set disk =
            active
            | selectattr('category', 'equalto', 'disk')
            | list
          %} {% set smart = states('binary_sensor.dh_pve_agent_smart_collector')
          %} {% set ns = namespace(items=[]) %}

          {% if not problems_available %}
            Список проблем недоступен.
          {% else %}

            {% for item in disk %}
              {% set object_name = item.get('object_name', 'Диск') %}
              {% set summary = item.get('summary', 'Проблема') %}
              {% set details = item.get('details', '') %}

              {% set ns.items = ns.items + [
                object_name
                ~ ': '
                ~ summary
                ~ ((' · ' ~ details) if details else '')
              ] %}
            {% endfor %}

            {% if smart == 'off' %}
              {% set ns.items =
                ns.items + ['SMART не удалось прочитать']
              %}
            {% elif smart in ['unknown', 'unavailable', 'none', ''] %}
              {% set ns.items =
                ns.items + ['Состояние SMART недоступно']
              %}
            {% endif %}

            {{ ns.items | join('\n')
               if ns.items
               else 'Перегрева и ошибок SMART не обнаружено.' }}

          {% endif %}
        icon: >-
          {% set problems_available =
            states(entity) not in ['unknown', 'unavailable', 'none', '']
          %} {% set active = state_attr(entity, 'active') or [] %} {% set disk =
            active
            | selectattr('category', 'equalto', 'disk')
            | list
          %} {% set smart = states('binary_sensor.dh_pve_agent_smart_collector')
          %}

          {% if not problems_available or smart in ['unknown', 'unavailable',
          'none', ''] %}
            mdi:harddisk-question
          {% elif disk | count > 0 or smart == 'off' %}
            mdi:harddisk-alert
          {% else %}
            mdi:harddisk-check
          {% endif %}
        icon_color: >-
          {% set problems_available =
            states(entity) not in ['unknown', 'unavailable', 'none', '']
          %} {% set active = state_attr(entity, 'active') or [] %} {% set disk =
            active
            | selectattr('category', 'equalto', 'disk')
            | list
          %} {% set smart = states('binary_sensor.dh_pve_agent_smart_collector')
          %}

          {% if not problems_available or smart in ['unknown', 'unavailable',
          'none', ''] %}
            grey
          {% elif disk | count > 0 or smart == 'off' %}
            red
          {% else %}
            green
          {% endif %}
        multiline_secondary: true
        tap_action:
          action: more-info
        grid_options:
          columns: 12
      - type: heading
        heading: Физические диски
        heading_style: subtitle
        icon: mdi:harddisk
      - type: custom:auto-entities
        show_empty: false
        unique: true
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          template: |-
            {% set ns = namespace(items=[]) %}
            {% for disk in states.sensor | sort(attribute='entity_id') %}
              {% if state_attr(disk.entity_id, 'proxmox_integration') == 'digitalhouses_pve_agent'
                    and state_attr(disk.entity_id, 'proxmox_section') == 'disk'
                    and state_attr(disk.entity_id, 'proxmox_subject') == 'disk'
                    and state_attr(disk.entity_id, 'proxmox_metric') == 'health'
                    and disk.entity_id.endswith('_health') %}

                {% set health = disk.entity_id %}
                {% set temp = health | replace('_health', '_temperature') %}
                {% set wear = health | replace('_health', '_wear') %}

                {% set smart_problem =
                  health
                  | replace('sensor.', 'binary_sensor.')
                  | replace('_health', '_smart_problem')
                %}

                {% set temp_problem =
                  health
                  | replace('sensor.', 'binary_sensor.')
                  | replace('_health', '_temperature_problem')
                %}

                {% set name =
                  state_attr(health, 'proxmox_display_name')
                  or state_attr(health, 'model')
                  or state_attr(health, 'friendly_name')
                  or health
                %}

                {% set disk_type = state_attr(health, 'disk_type') or 'Disk' %}
                {% set parts = namespace(items=[disk_type]) %}

                {% if states(temp) not in ['unknown', 'unavailable', 'none', ''] %}
                  {% set parts.items = parts.items + [
                    states(temp)
                    ~ ' '
                    ~ (state_attr(temp, 'unit_of_measurement') or '°C')
                  ] %}
                {% else %}
                  {% set parts.items = parts.items + ['Температура недоступна'] %}
                {% endif %}

                {% if states(wear) not in ['unknown', 'unavailable', 'none', ''] %}
                  {% set parts.items = parts.items + [
                    'wear ' ~ states(wear) ~ '%'
                  ] %}
                {% endif %}

                {% if is_state(smart_problem, 'on') %}
                  {% set parts.items = parts.items + ['SMART: ERROR'] %}
                {% elif is_state(smart_problem, 'off') %}
                  {% set parts.items = parts.items + ['SMART: OK'] %}
                {% else %}
                  {% set parts.items = parts.items + ['SMART: нет данных'] %}
                {% endif %}

                {% if is_state(temp_problem, 'on') %}
                  {% set parts.items = parts.items + ['ПЕРЕГРЕВ'] %}
                {% endif %}

                {% set disk_type_upper = disk_type | upper %}

                {% if disk_type_upper == 'NVME' %}
                  {% set icon = 'mdi:expansion-card' %}
                {% elif disk_type_upper == 'SSD' %}
                  {% set icon = 'mdi:chip' %}
                {% else %}
                  {% set icon = 'mdi:harddisk' %}
                {% endif %}

                {% if is_state(smart_problem, 'on')
                      or is_state(temp_problem, 'on') %}
                  {% set icon_color = 'red' %}
                {% elif states(temp) not in ['unknown', 'unavailable', 'none', ''] %}
                  {% set icon_color = 'blue' %}
                {% elif states(health) == 'HEALTHY' %}
                  {% set icon_color = 'green' %}
                {% else %}
                  {% set icon_color = 'grey' %}
                {% endif %}

                {% set ns.items = ns.items + [{
                  'type': 'custom:mushroom-template-card',

                  'entity': temp,

                  'primary': name,
                  'secondary': parts.items | join(' · '),

                  'icon': icon,
                  'icon_color': icon_color,

                  'multiline_secondary': true,

                  'tap_action': {
                    'action': 'more-info'
                  }
                }] %}

              {% endif %}
            {% endfor %}
            {{- ns.items -}}
        sort:
          method: entity_id
        grid_options:
          columns: 12
      - type: heading
        heading: Хранилища Proxmox
        heading_style: subtitle
        icon: mdi:database
      - type: custom:auto-entities
        show_empty: false
        unique: true
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          template: |-
            {% set ns = namespace(items=[]) %}

            {% for storage in states.sensor | sort(attribute='entity_id') %}
              {% if state_attr(storage.entity_id, 'proxmox_integration') == 'digitalhouses_pve_agent'
                    and state_attr(storage.entity_id, 'proxmox_section') == 'storage'
                    and state_attr(storage.entity_id, 'proxmox_subject') == 'storage'
                    and state_attr(storage.entity_id, 'proxmox_metric') == 'usage'
                    and storage.entity_id.endswith('_percent_used') %}

                {% set problem_entity =
                  storage.entity_id
                  | replace('sensor.', 'binary_sensor.')
                  | replace('_percent_used', '_percent_used_problem')
                %}

                {% set available = storage.state | is_number %}
                {% set total = state_attr(storage.entity_id, 'total_gib') %}

                {% set name =
                  state_attr(storage.entity_id, 'proxmox_display_name')
                  or storage.name
                %}

                {% if available %}
                  {% set used_percent = storage.state | float %}

                  {% if total is number %}
                    {% set used = total | float * used_percent / 100 %}
                    {% set secondary =
                      'Занято '
                      ~ ('%.2f' | format(used))
                      ~ ' / '
                      ~ ('%.2f' | format(total | float))
                      ~ ' GiB'
                    %}
                  {% else %}
                    {% set secondary =
                      'Занято ' ~ ('%.1f' | format(used_percent)) ~ '%'
                    %}
                  {% endif %}

                  {% set card_name =
                    name ~ ' · занято ' ~ ('%.1f' | format(used_percent)) ~ '%'
                  %}

                  {% set percent = '%.2f' | format(used_percent) %}

                  {% if is_state(problem_entity, 'on') %}
                    {% set color = 'red' %}
                    {% set icon = 'mdi:database-alert' %}
                  {% elif is_state(problem_entity, 'off') %}
                    {% set color = 'green' %}
                    {% set icon = 'mdi:database-check' %}
                  {% else %}
                    {% set color = 'grey' %}
                    {% set icon = 'mdi:database' %}
                  {% endif %}

                {% else %}
                  {% set card_name = name %}
                  {% set secondary = 'Данные недоступны' %}
                  {% set percent = '0' %}
                  {% set color = 'grey' %}
                  {% set icon = 'mdi:database' %}
                {% endif %}

                {% set ns.items = ns.items + [{
                  'type': 'custom:entity-progress-card-template',
                  'entity': storage.entity_id,
                  'name': card_name,
                  'secondary': secondary,
                  'percent': percent,
                  'icon': icon,
                  'color': color,
                  'bar_color': color,
                  'bar_size': 'medium',
                  'tap_action': {
                    'action': 'more-info'
                  }
                }] %}

              {% endif %}
            {% endfor %}

            {{- ns.items -}}
        sort:
          method: entity_id
        grid_options:
          columns: 12
      - type: heading
        heading: Пороги уведомлений
        heading_style: subtitle
        icon: mdi:tune-variant
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-number-card
            entity: number.dh_pve_agent_storage_percent_used_threshold
            name: Заполнение хранилища
            icon: mdi:database-alert
            display_mode: buttons
            fill_container: true
          - type: custom:mushroom-number-card
            entity: number.dh_pve_agent_cpu_temperature_threshold
            name: Температура CPU
            icon: mdi:cpu-64-bit
            display_mode: buttons
            fill_container: true
          - type: custom:mushroom-number-card
            entity: number.dh_pve_agent_hdd_temperature_threshold
            name: Температура HDD
            icon: mdi:harddisk
            display_mode: buttons
            fill_container: true
          - type: custom:mushroom-number-card
            entity: number.dh_pve_agent_ssd_temperature_threshold
            name: Температура SSD
            icon: mdi:chip
            display_mode: buttons
