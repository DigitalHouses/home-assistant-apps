      - type: heading
        heading: Графика
        heading_style: subtitle
        icon: mdi:expansion-card
      - type: custom:auto-entities
        show_empty: false
        unique: true
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          template: |-
            {% set ns = namespace(items=[]) %}
            {% for e in states.sensor | sort(attribute='entity_id') %}
              {% if
                state_attr(e.entity_id, 'proxmox_integration') == 'digitalhouses_pve_agent'
                and state_attr(e.entity_id, 'proxmox_section') == 'graphics'
              %}

                {% set metric = state_attr(e.entity_id, 'proxmox_metric') %}

                {% set name =
                  state_attr(e.entity_id, 'proxmox_display_name')
                  or state_attr(e.entity_id, 'model')
                  or e.name
                %}

                {% if metric == 'temperature' %}

                  {% set problem =
                    e.entity_id
                    | replace('sensor.', 'binary_sensor.')
                    | replace('_temperature', '_temperature_problem')
                  %}

                  {% if is_state(problem, 'on') %}
                    {% set color = 'red' %}
                    {% set icon = 'mdi:thermometer-alert' %}
                  {% elif is_state(problem, 'off') %}
                    {% set color = 'blue' %}
                    {% set icon = 'mdi:thermometer' %}
                  {% else %}
                    {% set color = 'grey' %}
                    {% set icon = 'mdi:thermometer' %}
                  {% endif %}

                  {% set threshold =
                    states('number.dh_pve_agent_gpu_temperature_threshold')
                  %}

                  {% if e.state | is_number %}
                    {% set secondary =
                      ('%.1f' | format(e.state | float))
                      ~ '°C'
                      ~ (
                        ' · порог ' ~ threshold ~ '°C'
                        if threshold not in ['unknown', 'unavailable', 'none', '']
                        else ''
                      )
                    %}
                  {% else %}
                    {% set secondary = 'Температура недоступна' %}
                  {% endif %}

                  {% set ns.items = ns.items + [{
                    'type': 'custom:mushroom-template-card',
                    'entity': e.entity_id,
                    'primary': 'GPU · ' ~ name,
                    'secondary': secondary,
                    'icon': icon,
                    'icon_color': color,
                    'tap_action': {
                      'action': 'more-info'
                    }
                  }] %}

                {% elif metric == 'transcoding' %}

                  {% if e.state | is_number %}
                    {% set load = e.state | float %}
                    {% set color = 'blue' %}
                    {% set secondary = ('%.1f' | format(load)) ~ '%' %}
                    {% set percent = '%.1f' | format(load) %}
                  {% else %}
                    {% set load = 0 %}
                    {% set color = 'grey' %}
                    {% set secondary = 'Нагрузка недоступна' %}
                    {% set percent = '0' %}
                  {% endif %}

                  {% set ns.items = ns.items + [{
                    'type': 'custom:entity-progress-card-template',
                    'entity': e.entity_id,
                    'name': 'Transcoding · ' ~ name,
                    'secondary': secondary,
                    'percent': percent,
                    'icon': 'mdi:video',
                    'color': color,
                    'bar_color': color,
                    'bar_size': 'small',
                    'tap_action': {
                      'action': 'more-info'
                    }
                  }] %}

                {% else %}

                  {% set available =
                    e.state not in ['unknown', 'unavailable', 'none', '']
                  %}

                  {% set ns.items = ns.items + [{
                    'type': 'custom:mushroom-template-card',
                    'entity': e.entity_id,
                    'primary': name,
                    'secondary': e.state if available else 'Нет данных',
                    'icon': state_attr(e.entity_id, 'icon') or 'mdi:expansion-card',
                    'icon_color': 'blue' if available else 'grey',
                    'layout': 'horizontal',
                    'fill_container': true,
                    'tap_action': {
                      'action': 'more-info'
                    }
                  }] %}

                {% endif %}

              {% endif %}
            {% endfor %}
            {{- ns.items -}}
        sort:
          method: entity_id
        grid_options:
          columns: 12
      - type: heading
        heading: VM / LXC
        heading_style: subtitle
        icon: mdi:server-network
      - type: markdown
        content: >-
          {%- set ns = namespace(vms=[], lxcs=[], lines=[]) -%} {%- for e in
          states.sensor -%}
            {%- if state_attr(e.entity_id, 'proxmox_integration') == 'digitalhouses_pve_agent'
                  and state_attr(e.entity_id, 'proxmox_section') == 'guests'
                  and state_attr(e.entity_id, 'proxmox_subject') in ['vm', 'lxc']
                  and state_attr(e.entity_id, 'proxmox_metric') == 'status' -%}
              {%- set item = {
                'id': state_attr(e.entity_id, 'guest_id') or state_attr(e.entity_id, 'proxmox_object_id'),
                'name': state_attr(e.entity_id, 'proxmox_display_name') or e.name,
                'state': e.state | lower,
                'sort': state_attr(e.entity_id, 'proxmox_sort_key') or e.entity_id
              } -%}
              {%- if state_attr(e.entity_id, 'proxmox_subject') == 'vm' -%}
                {%- set ns.vms = ns.vms + [item] -%}
              {%- else -%}
                {%- set ns.lxcs = ns.lxcs + [item] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}

          {%- set vm_running = state_attr('sensor.dh_pve_agent_vms', 'running') |
          int(0) -%} {%- set vm_total = state_attr('sensor.dh_pve_agent_vms',
          'total') | int(0) -%} {%- set lxc_running =
          state_attr('sensor.dh_pve_agent_lxcs', 'running') | int(0) -%} {%- set
          lxc_total = state_attr('sensor.dh_pve_agent_lxcs', 'total') | int(0) -%}

          {%- set ns.lines = ns.lines + [
            'VM ' ~ vm_running ~ '/' ~ vm_total ~ ' · LXC ' ~ lxc_running ~ '/' ~ lxc_total,
            '├─ VM'
          ] -%}

          {%- for vm in ns.vms | sort(attribute='sort') -%}
            {%- set vm_last = loop.last -%}
            {%- set marker = '🟢' if vm.state == 'running'
                else '🟠' if vm.state == 'paused'
                else '⚪' if vm.state == 'stopped'
                else '🔴' -%}
            {%- set branch = '└─' if vm_last else '├─' -%}
            {%- set ns.lines = ns.lines + [
              '│  ' ~ branch ~ ' ' ~ marker ~ ' ' ~ vm.id ~ ' · ' ~ vm.name
            ] -%}

            {%- set pt = namespace(items=[]) -%}
            {%- for p in states.sensor -%}
              {%- if state_attr(p.entity_id, 'proxmox_integration') == 'digitalhouses_pve_agent'
                    and state_attr(p.entity_id, 'proxmox_section') == 'guests'
                    and state_attr(p.entity_id, 'proxmox_subject') == 'passthrough'
                    and state_attr(p.entity_id, 'proxmox_metric') == 'owner'
                    and (state_attr(p.entity_id, 'owner_id') | string) == (vm.id | string) -%}
                {%- set pt.items = pt.items + [{
                  'address': state_attr(p.entity_id, 'pci_address') or state_attr(p.entity_id, 'proxmox_object_id'),
                  'model': state_attr(p.entity_id, 'model')
                    or state_attr(p.entity_id, 'class_name')
                    or state_attr(p.entity_id, 'proxmox_display_name')
                    or p.name,
                  'sort': state_attr(p.entity_id, 'proxmox_sort_key') or p.entity_id
                }] -%}
              {%- endif -%}
            {%- endfor -%}

            {%- for p in pt.items | sort(attribute='sort') -%}
              {%- set child = '└─' if loop.last else '├─' -%}
              {%- set indent = '│     ' if vm_last else '│  │  ' -%}
              {%- set ns.lines = ns.lines + [
                indent ~ child ~ ' PCI ' ~ p.address ~ ' · ' ~ p.model
              ] -%}
            {%- endfor -%}
          {%- endfor -%}

          {%- set ns.lines = ns.lines + ['└─ LXC'] -%} {%- for lxc in ns.lxcs |
          sort(attribute='sort') -%}
            {%- set marker = '🟢' if lxc.state == 'running'
                else '🟠' if lxc.state == 'paused'
                else '⚪' if lxc.state == 'stopped'
                else '🔴' -%}
            {%- set branch = '└─' if loop.last else '├─' -%}
            {%- set ns.lines = ns.lines + [
              '   ' ~ branch ~ ' ' ~ marker ~ ' ' ~ lxc.id ~ ' · ' ~ lxc.name
            ] -%}
          {%- endfor -%}

          {{ '```text\n' ~ (ns.lines | join('\n')) ~ '\n```' }}
        grid_options:
          columns: 12
