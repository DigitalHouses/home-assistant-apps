                  'icon': icon,
                  'icon_color': color,
                  'layout': 'horizontal',
                  'fill_container': true,
                  'tap_action': {
                    'action': 'more-info'
                  }
                }] %}

              {% endif %}
            {% endfor %}
            {% if ns.count == 0 %}
              {% set ns.items = ns.items + [{
                'type': 'custom:mushroom-template-card',
                'primary': 'Fan: Not detected',
                'secondary': 'Вентиляторы не обнаружены',
