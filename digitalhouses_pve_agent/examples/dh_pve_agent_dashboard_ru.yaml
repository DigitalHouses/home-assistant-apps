                and state_attr(fan.entity_id, 'proxmox_metric') == 'rpm'
              %}

                {% set ns.count = ns.count + 1 %}

                {% set name =
                  state_attr(fan.entity_id, 'proxmox_display_name')
                  or state_attr(fan.entity_id, 'label')
                  or state_attr(fan.entity_id, 'friendly_name')
                  or 'Fan'
                %}

                {% set rpm =
                  fan.state | int(0)
                  if fan.state not in ['unknown', 'unavailable', 'none', '']
                  else none
                %}
                {% set speed_id =
                  fan.entity_id | replace('_rpm', '_speed')
                %}
                {% set speed_raw = states(speed_id) %}
                {% set speed =
                  speed_raw | int
                  if speed_raw | is_number
                  else none
                %}

                {% if rpm is none %}
                  {% set color = 'grey' %}
                  {% set secondary = 'RPM недоступен' %}
                  {% set icon = 'mdi:fan-alert' %}
                {% elif rpm == 0 %}
                  {% set color = 'red' %}
                  {% set secondary =
                    ('0% · ' if speed is not none else '') ~ '0 RPM'
                  %}
                  {% set icon = 'mdi:fan-off' %}
                {% else %}
                  {% set color = 'blue' %}
                  {% set secondary =
                    ((speed ~ '% · ') if speed is not none else '')
                    ~ rpm ~ ' RPM'
                  %}
                  {% set icon = 'mdi:fan' %}
                {% endif %}

                {% set ns.items = ns.items + [{
                  'type': 'custom:mushroom-template-card',
