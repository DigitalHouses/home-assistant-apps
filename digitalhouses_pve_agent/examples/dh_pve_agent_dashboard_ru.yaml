                    and e.entity_id is match('sensor\.dh_pve_agent_storage_.*_percent_used')
                    and e.state not in ['unknown', 'unavailable'] %}
                {% set label = state_attr(e.entity_id, 'proxmox_display_name') or e.name %}
                {% set ns.entities = ns.entities + [{'entity': e.entity_id, 'name': label}] %}
              {% endif %}
            {% endfor %} {% if ns.entities | count > 0 %}
              {{ [{
