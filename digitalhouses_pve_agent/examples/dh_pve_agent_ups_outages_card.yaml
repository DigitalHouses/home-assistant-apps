type: markdown
content: |-
  {%- set entity = 'sensor.dh_pve_agent_ups_line_power_outages_month' -%}
  {%- set events = state_attr(entity, 'events') or [] -%}
  {%- set month = state_attr(entity, 'month') or '' -%}
  {%- set since = state_attr(entity, 'history_since') -%}
  {%- set quality_since = state_attr(entity, 'quality_history_since') -%}
  {%- set omitted = state_attr(entity, 'events_omitted_count') | int(0) -%}
  {%- set names = {
    'outage':'🔴 Нет сети', 'boost':'🔼 Boost',
    'trim':'🔽 Trim', 'bypass':'🔀 Bypass',
    'overload':'⚠️ Перегрузка'
  } -%}
  {%- set months = {
    '01':'январь', '02':'февраль', '03':'март', '04':'апрель',
    '05':'май', '06':'июнь', '07':'июль', '08':'август',
    '09':'сентябрь', '10':'октябрь', '11':'ноябрь', '12':'декабрь'
  } -%}
  {%- set ns = namespace(rows=[]) -%}
  {%- for r in events | reverse -%}
    {%- set kind = r['event'] | default('outage', true) -%}
    {%- set started = as_local(as_datetime(r['from'])).strftime('%d.%m %H:%M:%S') if r['from'] else '—' -%}
    {%- set ended = as_local(as_datetime(r['to'])).strftime('%d.%m %H:%M:%S') if r['to'] else 'сейчас' -%}
    {%- set seconds = r['duration_seconds'] | int(0) -%}
    {%- set duration = ('%02d:%02d:%02d' | format(seconds // 3600, (seconds % 3600) // 60, seconds % 60)) if seconds >= 3600 else ('%02d:%02d' | format(seconds // 60, seconds % 60)) -%}
    {%- set duration = ('≈ ' if r['estimated'] else '') ~ duration -%}
    {%- set ns.rows = ns.rows + [
      '| ' ~ loop.index ~ ' | ' ~ names.get(kind, kind) ~
      ' | ' ~ started ~ ' | ' ~ ended ~ ' | **' ~ duration ~ '** |'
    ] -%}
  {%- endfor -%}
  {%- set count = states(entity) -%}
  {%- set secs = states('sensor.dh_pve_agent_ups_line_power_offline_month') | int(0) -%}
  {%- set total_time = '%02d:%02d:%02d' | format(secs // 3600, (secs % 3600) // 60, secs % 60) -%}
  {%- set caption = '## События питания — ' ~ months.get(month[5:7], 'текущий месяц') -%}
  {%- set header = '| № | Событие | С | До | Длительность |\n|:---:|:---|:---|:---|---:|\n' -%}
  {%- if events | count > 0 -%}
    {{ caption ~ '\n\n' ~ header ~ (ns.rows | join('\n')) }}
  {%- else -%}
    {{ caption ~ '\n\n' ~ 'Событий пока нет.' }}
  {%- endif -%}
  {{ '\n\n**Отключений:** ' ~ (count if count not in ['unknown','unavailable','none',''] else '—') ~ ' · **Без питания:** ' ~ total_time }}
  {%- if omitted > 0 -%}
    {{ '\n\n_Показаны последние 10 событий, ещё ' ~ omitted ~ ' хранятся на PVE._' }}
  {%- endif -%}
  {%- if since -%}
    {{ '\n\n_Отключения записываются с ' ~ as_local(as_datetime(since)).strftime('%d.%m.%Y %H:%M') ~ '._' }}
  {%- endif -%}
  {%- if quality_since -%}
    {{ '\n_События качества питания записываются с ' ~ as_local(as_datetime(quality_since)).strftime('%d.%m.%Y %H:%M') ~ '._' }}
  {%- endif -%}
  {%- if events | selectattr('estimated') | list | count > 0 -%}
    {{ '\n\n_≈ Время ориентировочное: начало до запуска наблюдения, перезапуск агента или перерыв связи с NUT._' }}
  {%- endif -%}
grid_options:
  columns: 12
  rows: auto
