# Optional, site-owned PVE backup-failure notification for script.write2admins.
# Install only in a site-specific HA package; DH Sync does not publish examples.
# Does not replace or modify the existing script.write2admins implementation.
dh_pve_agent_backup_admin_notification:
  automation:
    - id: dh_pve_agent_backup_failed_write2admins
      alias: DH PVE Agent · Backup errors → write2admins
      mode: queued
      max: 20

      triggers:
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_backup
          options:
            event_type:
              - backup_job_failed
          id: backup_job_failed

      variables:
        backup_title: "🚨💾 PVE: ошибка резервного копирования"
        backup_message: >-
          {%- set a = trigger.to_state.attributes -%}
          {%- set guests = a.guests | default([], true) -%}
          {%- set ns = namespace(parts=['Задание: ' ~ (a.job_name | default('vzdump', true))], missing=[], skipped=[], unknown=[]) -%}
          {%- for g in guests -%}
            {%- if g.status == 'failed' -%}
              {%- set label = g.kind ~ ' ' ~ g.id -%}
              {%- if g.name | default('') -%}{%- set label = label ~ ' (' ~ g.name ~ ')' -%}{%- endif -%}
              {%- if g.error | default('') -%}{%- set label = label ~ ' — ' ~ g.error -%}{%- endif -%}
              {%- set ns.missing = ns.missing + [label] -%}
            {%- elif g.status == 'skipped' -%}
              {%- set ns.skipped = ns.skipped + [g.kind ~ ' ' ~ g.id] -%}
            {%- elif g.status == 'unknown' -%}
              {%- set ns.unknown = ns.unknown + [g.kind ~ ' ' ~ g.id] -%}
            {%- endif -%}
          {%- endfor -%}
          {%- if ns.missing -%}
            {%- set ns.parts = ns.parts + ['Не скопировано: ' ~ (ns.missing | join('; '))] -%}
          {%- elif a.error | default('') -%}
            {%- set ns.parts = ns.parts + ['Ошибка: ' ~ a.error] -%}
          {%- else -%}
            {%- set ns.parts = ns.parts + ['Нет подтверждения успешного копирования'] -%}
          {%- endif -%}
          {%- if ns.skipped -%}
            {%- set ns.parts = ns.parts + ['Пропущено: ' ~ (ns.skipped | join(', '))] -%}
          {%- endif -%}
          {%- if ns.unknown -%}
            {%- set ns.parts = ns.parts + ['Без подтверждения: ' ~ (ns.unknown | join(', '))] -%}
          {%- endif -%}
          {%- if guests -%}
            {%- set success_count = (guests | selectattr('status', 'eq', 'success') | list | length) -%}
            {%- set ns.parts = ns.parts + ['Успешно: ' ~ success_count ~ ' из ' ~ (guests | length) ~ ' обработанных гостей'] -%}
          {%- endif -%}
          {{- ns.parts | join(' · ') -}}

      actions:
        - action: script.write2admins
          data:
            title: "{{ backup_title }}"
            message: "{{ backup_message }}"
