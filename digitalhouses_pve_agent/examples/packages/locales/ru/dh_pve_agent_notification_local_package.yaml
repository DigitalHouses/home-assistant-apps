# =============================================================================
# DigitalHouses PVE local notifications — Russian site package
# =============================================================================
# Machine events come from digitalhouses_pve_agent.
# Find the trigger.id you need and edit only title/message below it.
# Event payload already contains the measurements captured for that event.
# Flow: machine event -> trigger.id -> choose -> direct action.
# =============================================================================

dh_pve_agent_notification_local_package:

  automation:
    - id: dh_pve_agent_notifications
      alias: DH PVE · Notifications
      mode: queued
      max: 60

      triggers:
        # PVE semantic events
        # Высокая температура CPU
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - cpu_temperature_high
          id: cpu_temperature_high

        # Температура CPU вернулась в норму
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - cpu_temperature_normal
          id: cpu_temperature_normal

        # CPU throttling обнаружен
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - cpu_throttling_started
          id: cpu_throttling_started

        # CPU throttling прекратился
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - cpu_throttling_cleared
          id: cpu_throttling_cleared

        # Хранилище превысило порог заполнения
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - storage_usage_high
          id: storage_usage_high

        # Заполнение хранилища вернулось в норму
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - storage_usage_normal
          id: storage_usage_normal

        # Высокая температура диска
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - disk_temperature_high
          id: disk_temperature_high

        # Температура диска вернулась в норму
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - disk_temperature_normal
          id: disk_temperature_normal

        # Высокая температура GPU
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - gpu_temperature_high
          id: gpu_temperature_high

        # Температура GPU вернулась в норму
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - gpu_temperature_normal
          id: gpu_temperature_normal

        # Не удалось восстановить управление вентилятором
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - fan_control_restore_failed
          id: fan_control_restore_failed

        # Управление вентилятором восстановлено
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - fan_control_restored
          id: fan_control_restored

        # SMART диска сообщил проблему
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - disk_smart_failed
          id: disk_smart_failed

        # SMART диска вернулся в норму
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - disk_smart_restored
          id: disk_smart_restored

        # UPS semantic events
        # NUT недоступен
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - nut_unavailable
          id: nut_unavailable

        # NUT снова доступен
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - nut_restored
          id: nut_restored

        # Состояние питания неизвестно
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - power_state_unknown
          id: power_state_unknown

        # Состояние питания снова известно
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - power_state_restored
          id: power_state_restored

        # Пропало городское питание
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - line_power_lost
          id: line_power_lost

        # Городское питание восстановлено
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - line_power_restored
          id: line_power_restored

        # Низкий заряд батареи
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - low_battery_started
          id: low_battery_started

        # Низкий заряд снят
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - low_battery_cleared
          id: low_battery_cleared

        # Высокий уровень батареи
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - high_battery_started
          id: high_battery_started

        # HIGH BATTERY снят
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - high_battery_cleared
          id: high_battery_cleared

        # Требуется замена батареи
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - replace_battery_started
          id: replace_battery_started

        # Предупреждение о замене снято
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - replace_battery_cleared
          id: replace_battery_cleared

        # Включён bypass
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - bypass_started
          id: bypass_started

        # Bypass отключён
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - bypass_ended
          id: bypass_ended

        # Начата калибровка UPS
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - calibration_started
          id: calibration_started

        # Калибровка завершена
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - calibration_ended
          id: calibration_ended

        # Выход UPS отключён
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - output_off
          id: output_off

        # Выход UPS восстановлен
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - output_restored
          id: output_restored

        # Перегрузка UPS
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - overload_started
          id: overload_started

        # Перегрузка устранена
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - overload_cleared
          id: overload_cleared

        # Включён AVR Trim
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - trim_started
          id: trim_started

        # AVR Trim отключён
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - trim_ended
          id: trim_ended

        # Включён AVR Boost
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - boost_started
          id: boost_started

        # AVR Boost отключён
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - boost_ended
          id: boost_ended

        # NUT FSD активирован
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - forced_shutdown_started
          id: forced_shutdown_started

        # NUT FSD снят
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - forced_shutdown_cleared
          id: forced_shutdown_cleared

        # Аварийная сигнализация UPS
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - alarm_started
          id: alarm_started

        # Аварийная сигнализация снята
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - alarm_cleared
          id: alarm_cleared

        # Батарея пересекла очередной уровень разряда
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - battery_discharge_level_crossed
          id: battery_discharge_level_crossed

        # Батарея полностью заряжена
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - battery_fully_charged
          id: battery_fully_charged

        # PVE Agent начал аварийное выключение
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - shutdown_committed
          id: shutdown_committed

        # Изменены параметры UPS Trigger
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - config_changed
          id: config_changed

      conditions: []

      actions:
        - choose:
            # Высокая температура CPU
            - conditions:
                - condition: trigger
                  id:
                    - cpu_temperature_high
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🌡️⚠️ PVE: высокая температура CPU"
                    message: >-
                      Температура: {{ trigger.to_state.attributes.temperature_c | default('—', true) }} °C · среднее: {{ trigger.to_state.attributes.average_temperature_c | default('—', true) }} °C · порог: {{ trigger.to_state.attributes.threshold_c | default('—', true) }} °C · частота: {{ trigger.to_state.attributes.cpu_frequency_mhz | default('—', true) }} MHz · загрузка: {{ trigger.to_state.attributes.cpu_usage_percent | default('—', true) }}%.

            # Температура CPU вернулась в норму
            - conditions:
                - condition: trigger
                  id:
                    - cpu_temperature_normal
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🌡️✅ PVE: температура CPU в норме"
                    message: >-
                      Температура: {{ trigger.to_state.attributes.temperature_c | default('—', true) }} °C · среднее: {{ trigger.to_state.attributes.average_temperature_c | default('—', true) }} °C · порог: {{ trigger.to_state.attributes.threshold_c | default('—', true) }} °C.

            # CPU throttling обнаружен
            - conditions:
                - condition: trigger
                  id:
                    - cpu_throttling_started
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "⚙️⚠️ PVE: CPU throttling"
                    message: >-
                      Обнаружен CPU throttling. Температура: {{ trigger.to_state.attributes.temperature_c | default('—', true) }} °C · частота: {{ trigger.to_state.attributes.cpu_frequency_mhz | default('—', true) }} MHz · загрузка: {{ trigger.to_state.attributes.cpu_usage_percent | default('—', true) }}%.

            # CPU throttling прекратился
            - conditions:
                - condition: trigger
                  id:
                    - cpu_throttling_cleared
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "⚙️✅ PVE: CPU throttling прекратился"
                    message: >-
                      Температура: {{ trigger.to_state.attributes.temperature_c | default('—', true) }} °C · частота: {{ trigger.to_state.attributes.cpu_frequency_mhz | default('—', true) }} MHz · загрузка: {{ trigger.to_state.attributes.cpu_usage_percent | default('—', true) }}%.

            # Хранилище превысило порог заполнения
            - conditions:
                - condition: trigger
                  id:
                    - storage_usage_high
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "💾⚠️ PVE: заполнение хранилища {{ trigger.to_state.attributes.object_name }}"
                    message: >-
                      Заполнено: {{ trigger.to_state.attributes.used_percent | default('—', true) }}% · среднее: {{ trigger.to_state.attributes.average_used_percent | default('—', true) }}% · порог: {{ trigger.to_state.attributes.threshold_percent | default('—', true) }}% · свободно: {{ trigger.to_state.attributes.available_gib | default('—', true) }} GiB из {{ trigger.to_state.attributes.total_gib | default('—', true) }} GiB.

            # Заполнение хранилища вернулось в норму
            - conditions:
                - condition: trigger
                  id:
                    - storage_usage_normal
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "💾✅ PVE: хранилище {{ trigger.to_state.attributes.object_name }} в норме"
                    message: >-
                      Заполнено: {{ trigger.to_state.attributes.used_percent | default('—', true) }}% · порог: {{ trigger.to_state.attributes.threshold_percent | default('—', true) }}% · свободно: {{ trigger.to_state.attributes.available_gib | default('—', true) }} GiB.

            # Высокая температура диска
            - conditions:
                - condition: trigger
                  id:
                    - disk_temperature_high
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🌡️⚠️ PVE: высокая температура {{ trigger.to_state.attributes.object_name }}"
                    message: >-
                      Температура: {{ trigger.to_state.attributes.temperature_c | default('—', true) }} °C · среднее: {{ trigger.to_state.attributes.average_temperature_c | default('—', true) }} °C · порог: {{ trigger.to_state.attributes.threshold_c | default('—', true) }} °C · тип: {{ trigger.to_state.attributes.disk_type | default('—', true) }} · устройство: {{ trigger.to_state.attributes.device_path | default('—', true) }}.

            # Температура диска вернулась в норму
            - conditions:
                - condition: trigger
                  id:
                    - disk_temperature_normal
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🌡️✅ PVE: температура {{ trigger.to_state.attributes.object_name }} в норме"
                    message: >-
                      Температура: {{ trigger.to_state.attributes.temperature_c | default('—', true) }} °C · порог: {{ trigger.to_state.attributes.threshold_c | default('—', true) }} °C.

            # Высокая температура GPU
            - conditions:
                - condition: trigger
                  id:
                    - gpu_temperature_high
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🎮🌡️⚠️ PVE: высокая температура {{ trigger.to_state.attributes.object_name }}"
                    message: >-
                      Температура: {{ trigger.to_state.attributes.temperature_c | default('—', true) }} °C · среднее: {{ trigger.to_state.attributes.average_temperature_c | default('—', true) }} °C · порог: {{ trigger.to_state.attributes.threshold_c | default('—', true) }} °C · владелец: {{ trigger.to_state.attributes.owner | default('—', true) }}.

            # Температура GPU вернулась в норму
            - conditions:
                - condition: trigger
                  id:
                    - gpu_temperature_normal
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🎮🌡️✅ PVE: температура {{ trigger.to_state.attributes.object_name }} в норме"
                    message: >-
                      Температура: {{ trigger.to_state.attributes.temperature_c | default('—', true) }} °C · порог: {{ trigger.to_state.attributes.threshold_c | default('—', true) }} °C.

            # Не удалось восстановить управление вентилятором
            - conditions:
                - condition: trigger
                  id:
                    - fan_control_restore_failed
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🌀❌ PVE: не восстановлено управление {{ trigger.to_state.attributes.object_name }}"
                    message: >-
                      Статус: {{ trigger.to_state.attributes.calibration_status | default('—', true) }} · скорость: {{ trigger.to_state.attributes.rpm | default('—', true) }} RPM.

            # Управление вентилятором восстановлено
            - conditions:
                - condition: trigger
                  id:
                    - fan_control_restored
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🌀✅ PVE: управление {{ trigger.to_state.attributes.object_name }} восстановлено"
                    message: >-
                      Статус: {{ trigger.to_state.attributes.calibration_status | default('—', true) }} · скорость: {{ trigger.to_state.attributes.rpm | default('—', true) }} RPM.

            # SMART диска сообщил проблему
            - conditions:
                - condition: trigger
                  id:
                    - disk_smart_failed
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "💾🔴 PVE: SMART CRITICAL {{ trigger.to_state.attributes.object_name }}"
                    message: >-
                      {% set reasons = trigger.to_state.attributes.health_reasons | default([], true) %}SMART: FAILED{% if reasons %} · причина: {{ reasons | join(', ') }}{% endif %} · температура: {{ trigger.to_state.attributes.temperature_c | default('—', true) }} °C · износ: {{ trigger.to_state.attributes.wear_used_percent | default('—', true) }}% · media errors: {{ trigger.to_state.attributes.media_errors | default('—', true) }} · unsafe shutdowns: {{ trigger.to_state.attributes.unsafe_shutdowns | default('—', true) }} · CRC errors: {{ trigger.to_state.attributes.crc_errors | default('—', true) }}.

            # SMART диска вернулся в норму
            - conditions:
                - condition: trigger
                  id:
                    - disk_smart_restored
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "💾✅ PVE: SMART {{ trigger.to_state.attributes.object_name }} в норме"
                    message: >-
                      SMART снова в нормальном состоянии · температура: {{ trigger.to_state.attributes.temperature_c | default('—', true) }} °C · износ: {{ trigger.to_state.attributes.wear_used_percent | default('—', true) }}%.

            # NUT недоступен
            - conditions:
                - condition: trigger
                  id:
                    - nut_unavailable
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋❌ UPS: NUT недоступен"
                    message: >-
                      Нет связи с UPS через NUT.

            # NUT снова доступен
            - conditions:
                - condition: trigger
                  id:
                    - nut_restored
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: связь с NUT восстановлена"
                    message: >-
                      Мониторинг UPS снова доступен · заряд: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · нагрузка: {{ trigger.to_state.attributes.load_percent | default('—', true) }}% · вход: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} В.

            # Состояние питания неизвестно
            - conditions:
                - condition: trigger
                  id:
                    - power_state_unknown
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋⚠️ UPS: состояние питания неизвестно"
                    message: >-
                      Нельзя определить источник питания · вход: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} В · выход: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} В · заряд: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}%.

            # Состояние питания снова известно
            - conditions:
                - condition: trigger
                  id:
                    - power_state_restored
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: состояние питания определено"
                    message: >-
                      UPS снова сообщает корректное состояние питания · вход: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} В · заряд: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}%.

            # Пропало городское питание
            - conditions:
                - condition: trigger
                  id:
                    - line_power_lost
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔌⚠️ Электричество отключено"
                    message: >-
                      {% set r = trigger.to_state.attributes.battery_runtime_seconds | default(none) %}{% if r is number %}{% set rs = r | int %}{% set rh = rs // 3600 %}{% set rm = (rs % 3600) // 60 %}{% endif %}UPS перешёл на батарею · заряд: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}%{% if r is number %} · оставшееся время: {{ '%d:%02d' | format(rh, rm) }}{% endif %} · нагрузка: {{ trigger.to_state.attributes.load_percent | default('—', true) }}%.

            # Городское питание восстановлено
            - conditions:
                - condition: trigger
                  id:
                    - line_power_restored
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔌✅ Электричество восстановлено"
                    message: >-
                      {% set d = trigger.to_state.attributes.outage_duration_seconds | default(none) %}{% if d is number %}{% set ds = d | int %}{% set dh = ds // 3600 %}{% set dm = (ds % 3600) // 60 %}{% set dsec = ds % 60 %}{% endif %}UPS вернулся к работе от сети{% if d is number %} · перерыв: {{ '%02d:%02d:%02d' | format(dh, dm, dsec) }}{% endif %} · заряд: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · вход: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} В · нагрузка: {{ trigger.to_state.attributes.load_percent | default('—', true) }}%.

            # Низкий заряд батареи
            - conditions:
                - condition: trigger
                  id:
                    - low_battery_started
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋❗ UPS: низкий заряд батареи"
                    message: >-
                      {% set r = trigger.to_state.attributes.battery_runtime_seconds | default(none) %}{% if r is number %}{% set rs = r | int %}{% set rh = rs // 3600 %}{% set rm = (rs % 3600) // 60 %}{% endif %}Заряд: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}%{% if r is number %} · оставшееся время: {{ '%d:%02d' | format(rh, rm) }}{% endif %} · нагрузка: {{ trigger.to_state.attributes.load_percent | default('—', true) }}% · порог NUT: {{ trigger.to_state.attributes.low_charge_percent | default('—', true) }}%.

            # Низкий заряд снят
            - conditions:
                - condition: trigger
                  id:
                    - low_battery_cleared
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: низкий заряд батареи снят"
                    message: >-
                      Заряд: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · оставшееся время: {{ trigger.to_state.attributes.battery_runtime_seconds | default('—', true) }} с · нагрузка: {{ trigger.to_state.attributes.load_percent | default('—', true) }}%.

            # Высокий уровень батареи
            - conditions:
                - condition: trigger
                  id:
                    - high_battery_started
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋⚠️ UPS: HIGH BATTERY"
                    message: >-
                      Заряд: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · напряжение батареи: {{ trigger.to_state.attributes.battery_voltage_v | default('—', true) }} В.

            # HIGH BATTERY снят
            - conditions:
                - condition: trigger
                  id:
                    - high_battery_cleared
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: HIGH BATTERY снят"
                    message: >-
                      Заряд: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · напряжение батареи: {{ trigger.to_state.attributes.battery_voltage_v | default('—', true) }} В.

            # Требуется замена батареи
            - conditions:
                - condition: trigger
                  id:
                    - replace_battery_started
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋⚠️ UPS: требуется замена батареи"
                    message: >-
                      UPS сообщил REPLACE BATTERY · заряд: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · напряжение батареи: {{ trigger.to_state.attributes.battery_voltage_v | default('—', true) }} В.

            # Предупреждение о замене снято
            - conditions:
                - condition: trigger
                  id:
                    - replace_battery_cleared
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: предупреждение о замене батареи снято"
                    message: >-
                      Заряд: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · напряжение батареи: {{ trigger.to_state.attributes.battery_voltage_v | default('—', true) }} В.

            # Включён bypass
            - conditions:
                - condition: trigger
                  id:
                    - bypass_started
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋⚠️ UPS: включён Bypass"
                    message: >-
                      Нагрузка: {{ trigger.to_state.attributes.load_percent | default('—', true) }}% · вход: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} В · выход: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} В.

            # Bypass отключён
            - conditions:
                - condition: trigger
                  id:
                    - bypass_ended
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: Bypass отключён"
                    message: >-
                      Нагрузка: {{ trigger.to_state.attributes.load_percent | default('—', true) }}% · вход: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} В · выход: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} В.

            # Начата калибровка UPS
            - conditions:
                - condition: trigger
                  id:
                    - calibration_started
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋🧪 UPS: начата калибровка"
                    message: >-
                      Заряд: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · нагрузка: {{ trigger.to_state.attributes.load_percent | default('—', true) }}%.

            # Калибровка завершена
            - conditions:
                - condition: trigger
                  id:
                    - calibration_ended
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: калибровка завершена"
                    message: >-
                      Заряд: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · нагрузка: {{ trigger.to_state.attributes.load_percent | default('—', true) }}%.

            # Выход UPS отключён
            - conditions:
                - condition: trigger
                  id:
                    - output_off
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋⏹️ UPS: выход отключён"
                    message: >-
                      Вход: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} В · выход: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} В · нагрузка: {{ trigger.to_state.attributes.load_percent | default('—', true) }}%.

            # Выход UPS восстановлен
            - conditions:
                - condition: trigger
                  id:
                    - output_restored
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: выход восстановлен"
                    message: >-
                      Вход: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} В · выход: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} В · нагрузка: {{ trigger.to_state.attributes.load_percent | default('—', true) }}%.

            # Перегрузка UPS
            - conditions:
                - condition: trigger
                  id:
                    - overload_started
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋❌ UPS: перегрузка"
                    message: >-
                      Нагрузка: {{ trigger.to_state.attributes.load_percent | default('—', true) }}% · номинальная мощность UPS: {{ trigger.to_state.attributes.nominal_real_power_w | default('—', true) }} Вт · выход: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} В.

            # Перегрузка устранена
            - conditions:
                - condition: trigger
                  id:
                    - overload_cleared
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: перегрузка устранена"
                    message: >-
                      Нагрузка: {{ trigger.to_state.attributes.load_percent | default('—', true) }}% · выход: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} В.

            # Включён AVR Trim
            - conditions:
                - condition: trigger
                  id:
                    - trim_started
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "⚡⚠️ UPS: включён AVR Trim"
                    message: >-
                      Высокое входное напряжение: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} В · выход: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} В · верхний порог: {{ trigger.to_state.attributes.input_transfer_high_v | default('—', true) }} В.

            # AVR Trim отключён
            - conditions:
                - condition: trigger
                  id:
                    - trim_ended
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "⚡✅ UPS: AVR Trim отключён"
                    message: >-
                      Входное напряжение нормализовалось: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} В · выход: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} В.

            # Включён AVR Boost
            - conditions:
                - condition: trigger
                  id:
                    - boost_started
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "⚡⚠️ UPS: включён AVR Boost"
                    message: >-
                      Низкое входное напряжение: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} В · выход: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} В · нижний порог: {{ trigger.to_state.attributes.input_transfer_low_v | default('—', true) }} В.

            # AVR Boost отключён
            - conditions:
                - condition: trigger
                  id:
                    - boost_ended
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "⚡✅ UPS: AVR Boost отключён"
                    message: >-
                      Входное напряжение нормализовалось: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} В · выход: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} В.

            # NUT FSD активирован
            - conditions:
                - condition: trigger
                  id:
                    - forced_shutdown_started
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋🛑 UPS: начат Forced Shutdown"
                    message: >-
                      NUT активировал FSD · заряд: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · оставшееся время: {{ trigger.to_state.attributes.battery_runtime_seconds | default('—', true) }} с · нагрузка: {{ trigger.to_state.attributes.load_percent | default('—', true) }}%.

            # NUT FSD снят
            - conditions:
                - condition: trigger
                  id:
                    - forced_shutdown_cleared
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: Forced Shutdown завершён"
                    message: >-
                      Заряд: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · вход: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} В.

            # Аварийная сигнализация UPS
            - conditions:
                - condition: trigger
                  id:
                    - alarm_started
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋🚨 UPS: активна аварийная сигнализация"
                    message: >-
                      Заряд: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · нагрузка: {{ trigger.to_state.attributes.load_percent | default('—', true) }}% · вход: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} В · выход: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} В.

            # Аварийная сигнализация снята
            - conditions:
                - condition: trigger
                  id:
                    - alarm_cleared
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: аварийная сигнализация снята"
                    message: >-
                      Заряд: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · нагрузка: {{ trigger.to_state.attributes.load_percent | default('—', true) }}%.

            # Батарея пересекла очередной уровень разряда
            - conditions:
                - condition: trigger
                  id:
                    - battery_discharge_level_crossed
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋⚠️ UPS: заряд {{ trigger.to_state.attributes.current_charge_percent }}%"
                    message: >-
                      {% set r = trigger.to_state.attributes.battery_runtime_seconds | default(none) %}{% if r is number %}{% set rs = r | int %}{% set rh = rs // 3600 %}{% set rm = (rs % 3600) // 60 %}{% endif %}Оставшееся время: {% if r is number %}{{ '%d:%02d' | format(rh, rm) }}{% else %}—{% endif %} · нагрузка: {{ trigger.to_state.attributes.load_percent | default('—', true) }}% · пересечён уровень: {{ trigger.to_state.attributes.crossed_thresholds | join(', ') }}%.

            # Батарея полностью заряжена
            - conditions:
                - condition: trigger
                  id:
                    - battery_fully_charged
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: батарея заряжена"
                    message: >-
                      Заряд: {{ trigger.to_state.attributes.current_charge_percent | default(trigger.to_state.attributes.battery_charge_percent, true) }}% · нагрузка: {{ trigger.to_state.attributes.load_percent | default('—', true) }}% · вход: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} В.

            # PVE Agent начал аварийное выключение
            - conditions:
                - condition: trigger
                  id:
                    - shutdown_committed
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋🛑 PVE: начато аварийное выключение"
                    message: >-
                      {% set r = trigger.to_state.attributes.battery_runtime_seconds | default(none) %}{% if r is number %}{% set rs = r | int %}{% set rh = rs // 3600 %}{% set rm = (rs % 3600) // 60 %}{% endif %}Причина: {{ trigger.to_state.attributes.reason }} · заряд: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}%{% if r is number %} · оставшееся время: {{ '%d:%02d' | format(rh, rm) }}{% endif %} · нагрузка: {{ trigger.to_state.attributes.load_percent | default('—', true) }}% · бюджет shutdown: {{ trigger.to_state.attributes.shutdown_budget_seconds | default('—', true) }} с · дополнительный запас: {{ trigger.to_state.attributes.runtime_reserve_seconds | default('—', true) }} с.

            # Изменены параметры UPS Trigger
            - conditions:
                - condition: trigger
                  id:
                    - config_changed
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋⚙️ Конфигурация UPS Trigger изменена"
                    message: >-
                      Заряд: {{ trigger.to_state.attributes.old_values.shutdown_battery_charge_threshold_percent }}% → {{ trigger.to_state.attributes.new_values.shutdown_battery_charge_threshold_percent }}% · дополнительный запас: {{ trigger.to_state.attributes.old_values.runtime_reserve_seconds }} с → {{ trigger.to_state.attributes.new_values.runtime_reserve_seconds }} с.
