# =============================================================================
# DigitalHouses PVE local notifications — English example
# =============================================================================
# Machine events come from digitalhouses_pve_agent.
# Find the trigger.id you need and edit only title/message below it.
# Event payload already contains the measurements captured for that event.
# Flow: machine event -> trigger.id -> choose -> direct action.
# =============================================================================

dh_pve_agent_notification_local_package:

  automation:
    - id: dh_pve_agent_notifications
      alias: DH PVE · Notifications
      mode: queued
      max: 60

      triggers:
        # PVE semantic events
        # High CPU temperature
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - cpu_temperature_high
          id: cpu_temperature_high

        # CPU temperature normal
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - cpu_temperature_normal
          id: cpu_temperature_normal

        # CPU throttling started
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - cpu_throttling_started
          id: cpu_throttling_started

        # CPU throttling cleared
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - cpu_throttling_cleared
          id: cpu_throttling_cleared

        # Storage usage high
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - storage_usage_high
          id: storage_usage_high

        # Storage usage normal
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - storage_usage_normal
          id: storage_usage_normal

        # High disk temperature
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - disk_temperature_high
          id: disk_temperature_high

        # Disk temperature normal
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - disk_temperature_normal
          id: disk_temperature_normal

        # High GPU temperature
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - gpu_temperature_high
          id: gpu_temperature_high

        # GPU temperature normal
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - gpu_temperature_normal
          id: gpu_temperature_normal

        # Fan control restore failed
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - fan_control_restore_failed
          id: fan_control_restore_failed

        # Fan control restored
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - fan_control_restored
          id: fan_control_restored

        # Disk SMART failed
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - disk_smart_failed
          id: disk_smart_failed

        # Disk SMART restored
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_diagnostic
          options:
            event_type:
              - disk_smart_restored
          id: disk_smart_restored

        # UPS semantic events
        # NUT unavailable
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - nut_unavailable
          id: nut_unavailable

        # NUT restored
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - nut_restored
          id: nut_restored

        # Power state unknown
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - power_state_unknown
          id: power_state_unknown

        # Power state restored
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - power_state_restored
          id: power_state_restored

        # Line power lost
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - line_power_lost
          id: line_power_lost

        # Line power restored
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - line_power_restored
          id: line_power_restored

        # Low battery started
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - low_battery_started
          id: low_battery_started

        # Low battery cleared
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - low_battery_cleared
          id: low_battery_cleared

        # High battery started
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - high_battery_started
          id: high_battery_started

        # High battery cleared
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - high_battery_cleared
          id: high_battery_cleared

        # Replace battery started
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - replace_battery_started
          id: replace_battery_started

        # Replace battery cleared
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - replace_battery_cleared
          id: replace_battery_cleared

        # Bypass started
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - bypass_started
          id: bypass_started

        # Bypass ended
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - bypass_ended
          id: bypass_ended

        # Calibration started
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - calibration_started
          id: calibration_started

        # Calibration ended
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - calibration_ended
          id: calibration_ended

        # Output off
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - output_off
          id: output_off

        # Output restored
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - output_restored
          id: output_restored

        # Overload started
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - overload_started
          id: overload_started

        # Overload cleared
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - overload_cleared
          id: overload_cleared

        # AVR Trim started
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - trim_started
          id: trim_started

        # AVR Trim ended
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - trim_ended
          id: trim_ended

        # AVR Boost started
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - boost_started
          id: boost_started

        # AVR Boost ended
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - boost_ended
          id: boost_ended

        # NUT FSD started
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - forced_shutdown_started
          id: forced_shutdown_started

        # NUT FSD cleared
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - forced_shutdown_cleared
          id: forced_shutdown_cleared

        # Alarm started
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - alarm_started
          id: alarm_started

        # Alarm cleared
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - alarm_cleared
          id: alarm_cleared

        # Battery discharge milestone
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - battery_discharge_level_crossed
          id: battery_discharge_level_crossed

        # Battery fully charged
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - battery_fully_charged
          id: battery_fully_charged

        # Emergency shutdown committed
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - shutdown_committed
          id: shutdown_committed

        # UPS Trigger configuration changed
        - trigger: event.received
          target:
            entity_id: event.dh_pve_agent_ups_diagnostic
          options:
            event_type:
              - config_changed
          id: config_changed

      conditions: []

      actions:
        - choose:
            # High CPU temperature
            - conditions:
                - condition: trigger
                  id:
                    - cpu_temperature_high
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🌡️⚠️ PVE: high CPU temperature"
                    message: >-
                      Temperature: {{ trigger.to_state.attributes.temperature_c | default('—', true) }} °C · average: {{ trigger.to_state.attributes.average_temperature_c | default('—', true) }} °C · threshold: {{ trigger.to_state.attributes.threshold_c | default('—', true) }} °C · frequency: {{ trigger.to_state.attributes.cpu_frequency_mhz | default('—', true) }} MHz · load: {{ trigger.to_state.attributes.cpu_usage_percent | default('—', true) }}%.

            # CPU temperature normal
            - conditions:
                - condition: trigger
                  id:
                    - cpu_temperature_normal
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🌡️✅ PVE: CPU temperature normal"
                    message: >-
                      Temperature: {{ trigger.to_state.attributes.temperature_c | default('—', true) }} °C · average: {{ trigger.to_state.attributes.average_temperature_c | default('—', true) }} °C · threshold: {{ trigger.to_state.attributes.threshold_c | default('—', true) }} °C.

            # CPU throttling started
            - conditions:
                - condition: trigger
                  id:
                    - cpu_throttling_started
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "⚙️⚠️ PVE: CPU throttling"
                    message: >-
                      CPU throttling detected. Temperature: {{ trigger.to_state.attributes.temperature_c | default('—', true) }} °C · frequency: {{ trigger.to_state.attributes.cpu_frequency_mhz | default('—', true) }} MHz · load: {{ trigger.to_state.attributes.cpu_usage_percent | default('—', true) }}%.

            # CPU throttling cleared
            - conditions:
                - condition: trigger
                  id:
                    - cpu_throttling_cleared
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "⚙️✅ PVE: CPU throttling cleared"
                    message: >-
                      Temperature: {{ trigger.to_state.attributes.temperature_c | default('—', true) }} °C · frequency: {{ trigger.to_state.attributes.cpu_frequency_mhz | default('—', true) }} MHz · load: {{ trigger.to_state.attributes.cpu_usage_percent | default('—', true) }}%.

            # Storage usage high
            - conditions:
                - condition: trigger
                  id:
                    - storage_usage_high
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "💾⚠️ PVE: storage {{ trigger.to_state.attributes.object_name }} usage high"
                    message: >-
                      Used: {{ trigger.to_state.attributes.used_percent | default('—', true) }}% · average: {{ trigger.to_state.attributes.average_used_percent | default('—', true) }}% · threshold: {{ trigger.to_state.attributes.threshold_percent | default('—', true) }}% · free: {{ trigger.to_state.attributes.available_gib | default('—', true) }} GiB of {{ trigger.to_state.attributes.total_gib | default('—', true) }} GiB.

            # Storage usage normal
            - conditions:
                - condition: trigger
                  id:
                    - storage_usage_normal
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "💾✅ PVE: storage {{ trigger.to_state.attributes.object_name }} normal"
                    message: >-
                      Used: {{ trigger.to_state.attributes.used_percent | default('—', true) }}% · threshold: {{ trigger.to_state.attributes.threshold_percent | default('—', true) }}% · free: {{ trigger.to_state.attributes.available_gib | default('—', true) }} GiB.

            # High disk temperature
            - conditions:
                - condition: trigger
                  id:
                    - disk_temperature_high
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🌡️⚠️ PVE: high temperature {{ trigger.to_state.attributes.object_name }}"
                    message: >-
                      Temperature: {{ trigger.to_state.attributes.temperature_c | default('—', true) }} °C · average: {{ trigger.to_state.attributes.average_temperature_c | default('—', true) }} °C · threshold: {{ trigger.to_state.attributes.threshold_c | default('—', true) }} °C · type: {{ trigger.to_state.attributes.disk_type | default('—', true) }} · device: {{ trigger.to_state.attributes.device_path | default('—', true) }}.

            # Disk temperature normal
            - conditions:
                - condition: trigger
                  id:
                    - disk_temperature_normal
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🌡️✅ PVE: temperature {{ trigger.to_state.attributes.object_name }} normal"
                    message: >-
                      Temperature: {{ trigger.to_state.attributes.temperature_c | default('—', true) }} °C · threshold: {{ trigger.to_state.attributes.threshold_c | default('—', true) }} °C.

            # High GPU temperature
            - conditions:
                - condition: trigger
                  id:
                    - gpu_temperature_high
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🎮🌡️⚠️ PVE: high temperature {{ trigger.to_state.attributes.object_name }}"
                    message: >-
                      Temperature: {{ trigger.to_state.attributes.temperature_c | default('—', true) }} °C · average: {{ trigger.to_state.attributes.average_temperature_c | default('—', true) }} °C · threshold: {{ trigger.to_state.attributes.threshold_c | default('—', true) }} °C · owner: {{ trigger.to_state.attributes.owner | default('—', true) }}.

            # GPU temperature normal
            - conditions:
                - condition: trigger
                  id:
                    - gpu_temperature_normal
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🎮🌡️✅ PVE: temperature {{ trigger.to_state.attributes.object_name }} normal"
                    message: >-
                      Temperature: {{ trigger.to_state.attributes.temperature_c | default('—', true) }} °C · threshold: {{ trigger.to_state.attributes.threshold_c | default('—', true) }} °C.

            # Fan control restore failed
            - conditions:
                - condition: trigger
                  id:
                    - fan_control_restore_failed
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🌀❌ PVE: fan control restore failed for {{ trigger.to_state.attributes.object_name }}"
                    message: >-
                      Status: {{ trigger.to_state.attributes.calibration_status | default('—', true) }} · speed: {{ trigger.to_state.attributes.rpm | default('—', true) }} RPM.

            # Fan control restored
            - conditions:
                - condition: trigger
                  id:
                    - fan_control_restored
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🌀✅ PVE: fan control restored for {{ trigger.to_state.attributes.object_name }}"
                    message: >-
                      Status: {{ trigger.to_state.attributes.calibration_status | default('—', true) }} · speed: {{ trigger.to_state.attributes.rpm | default('—', true) }} RPM.

            # Disk SMART failed
            - conditions:
                - condition: trigger
                  id:
                    - disk_smart_failed
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "💾🔴 PVE: SMART CRITICAL {{ trigger.to_state.attributes.object_name }}"
                    message: >-
                      {% set reasons = trigger.to_state.attributes.health_reasons | default([], true) %}SMART: FAILED{% if reasons %} · reason: {{ reasons | join(', ') }}{% endif %} · temperature: {{ trigger.to_state.attributes.temperature_c | default('—', true) }} °C · wear: {{ trigger.to_state.attributes.wear_used_percent | default('—', true) }}% · media errors: {{ trigger.to_state.attributes.media_errors | default('—', true) }} · unsafe shutdowns: {{ trigger.to_state.attributes.unsafe_shutdowns | default('—', true) }} · CRC errors: {{ trigger.to_state.attributes.crc_errors | default('—', true) }}.

            # Disk SMART restored
            - conditions:
                - condition: trigger
                  id:
                    - disk_smart_restored
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "💾✅ PVE: SMART {{ trigger.to_state.attributes.object_name }} normal"
                    message: >-
                      SMART is normal again · temperature: {{ trigger.to_state.attributes.temperature_c | default('—', true) }} °C · wear: {{ trigger.to_state.attributes.wear_used_percent | default('—', true) }}%.

            # NUT unavailable
            - conditions:
                - condition: trigger
                  id:
                    - nut_unavailable
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋❌ UPS: NUT unavailable"
                    message: >-
                      UPS data is unavailable through NUT.

            # NUT restored
            - conditions:
                - condition: trigger
                  id:
                    - nut_restored
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: NUT connection restored"
                    message: >-
                      UPS monitoring is available again · charge: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · load: {{ trigger.to_state.attributes.load_percent | default('—', true) }}% · input: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} V.

            # Power state unknown
            - conditions:
                - condition: trigger
                  id:
                    - power_state_unknown
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋⚠️ UPS: power state unknown"
                    message: >-
                      Cannot determine power source · input: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} V · output: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} V · charge: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}%.

            # Power state restored
            - conditions:
                - condition: trigger
                  id:
                    - power_state_restored
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: power state restored"
                    message: >-
                      UPS reports a valid power state again · input: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} V · charge: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}%.

            # Line power lost
            - conditions:
                - condition: trigger
                  id:
                    - line_power_lost
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔌⚠️ Line power lost"
                    message: >-
                      {% set r = trigger.to_state.attributes.battery_runtime_seconds | default(none) %}{% if r is number %}{% set rs = r | int %}{% set rh = rs // 3600 %}{% set rm = (rs % 3600) // 60 %}{% endif %}UPS switched to battery · charge: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}%{% if r is number %} · runtime: {{ '%d:%02d' | format(rh, rm) }}{% endif %} · load: {{ trigger.to_state.attributes.load_percent | default('—', true) }}%.

            # Line power restored
            - conditions:
                - condition: trigger
                  id:
                    - line_power_restored
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔌✅ Line power restored"
                    message: >-
                      {% set d = trigger.to_state.attributes.outage_duration_seconds | default(none) %}{% if d is number %}{% set ds = d | int %}{% set dh = ds // 3600 %}{% set dm = (ds % 3600) // 60 %}{% set dsec = ds % 60 %}{% endif %}UPS returned to line power{% if d is number %} · outage: {{ '%02d:%02d:%02d' | format(dh, dm, dsec) }}{% endif %} · charge: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · input: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} V · load: {{ trigger.to_state.attributes.load_percent | default('—', true) }}%.

            # Low battery started
            - conditions:
                - condition: trigger
                  id:
                    - low_battery_started
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋❗ UPS: low battery"
                    message: >-
                      {% set r = trigger.to_state.attributes.battery_runtime_seconds | default(none) %}{% if r is number %}{% set rs = r | int %}{% set rh = rs // 3600 %}{% set rm = (rs % 3600) // 60 %}{% endif %}Charge: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}%{% if r is number %} · runtime: {{ '%d:%02d' | format(rh, rm) }}{% endif %} · load: {{ trigger.to_state.attributes.load_percent | default('—', true) }}% · NUT threshold: {{ trigger.to_state.attributes.low_charge_percent | default('—', true) }}%.

            # Low battery cleared
            - conditions:
                - condition: trigger
                  id:
                    - low_battery_cleared
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: low-battery warning cleared"
                    message: >-
                      Charge: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · runtime: {{ trigger.to_state.attributes.battery_runtime_seconds | default('—', true) }} s · load: {{ trigger.to_state.attributes.load_percent | default('—', true) }}%.

            # High battery started
            - conditions:
                - condition: trigger
                  id:
                    - high_battery_started
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋⚠️ UPS: HIGH BATTERY"
                    message: >-
                      Charge: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · battery voltage: {{ trigger.to_state.attributes.battery_voltage_v | default('—', true) }} V.

            # High battery cleared
            - conditions:
                - condition: trigger
                  id:
                    - high_battery_cleared
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: HIGH BATTERY cleared"
                    message: >-
                      Charge: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · battery voltage: {{ trigger.to_state.attributes.battery_voltage_v | default('—', true) }} V.

            # Replace battery started
            - conditions:
                - condition: trigger
                  id:
                    - replace_battery_started
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋⚠️ UPS: replace battery"
                    message: >-
                      UPS reported REPLACE BATTERY · charge: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · battery voltage: {{ trigger.to_state.attributes.battery_voltage_v | default('—', true) }} V.

            # Replace battery cleared
            - conditions:
                - condition: trigger
                  id:
                    - replace_battery_cleared
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: replace-battery warning cleared"
                    message: >-
                      Charge: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · battery voltage: {{ trigger.to_state.attributes.battery_voltage_v | default('—', true) }} V.

            # Bypass started
            - conditions:
                - condition: trigger
                  id:
                    - bypass_started
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋⚠️ UPS: bypass enabled"
                    message: >-
                      Load: {{ trigger.to_state.attributes.load_percent | default('—', true) }}% · input: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} V · output: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} V.

            # Bypass ended
            - conditions:
                - condition: trigger
                  id:
                    - bypass_ended
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: bypass ended"
                    message: >-
                      Load: {{ trigger.to_state.attributes.load_percent | default('—', true) }}% · input: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} V · output: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} V.

            # Calibration started
            - conditions:
                - condition: trigger
                  id:
                    - calibration_started
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋🧪 UPS: calibration started"
                    message: >-
                      Charge: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · load: {{ trigger.to_state.attributes.load_percent | default('—', true) }}%.

            # Calibration ended
            - conditions:
                - condition: trigger
                  id:
                    - calibration_ended
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: calibration ended"
                    message: >-
                      Charge: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · load: {{ trigger.to_state.attributes.load_percent | default('—', true) }}%.

            # Output off
            - conditions:
                - condition: trigger
                  id:
                    - output_off
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋⏹️ UPS: output off"
                    message: >-
                      Input: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} V · output: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} V · load: {{ trigger.to_state.attributes.load_percent | default('—', true) }}%.

            # Output restored
            - conditions:
                - condition: trigger
                  id:
                    - output_restored
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: output restored"
                    message: >-
                      Input: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} V · output: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} V · load: {{ trigger.to_state.attributes.load_percent | default('—', true) }}%.

            # Overload started
            - conditions:
                - condition: trigger
                  id:
                    - overload_started
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋❌ UPS: overload"
                    message: >-
                      Load: {{ trigger.to_state.attributes.load_percent | default('—', true) }}% · nominal UPS power: {{ trigger.to_state.attributes.nominal_real_power_w | default('—', true) }} W · output: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} V.

            # Overload cleared
            - conditions:
                - condition: trigger
                  id:
                    - overload_cleared
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: overload cleared"
                    message: >-
                      Load: {{ trigger.to_state.attributes.load_percent | default('—', true) }}% · output: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} V.

            # AVR Trim started
            - conditions:
                - condition: trigger
                  id:
                    - trim_started
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "⚡⚠️ UPS: AVR Trim enabled"
                    message: >-
                      High input voltage: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} V · output: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} V · high transfer threshold: {{ trigger.to_state.attributes.input_transfer_high_v | default('—', true) }} V.

            # AVR Trim ended
            - conditions:
                - condition: trigger
                  id:
                    - trim_ended
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "⚡✅ UPS: AVR Trim ended"
                    message: >-
                      Input voltage normalized: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} V · output: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} V.

            # AVR Boost started
            - conditions:
                - condition: trigger
                  id:
                    - boost_started
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "⚡⚠️ UPS: AVR Boost enabled"
                    message: >-
                      Low input voltage: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} V · output: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} V · low transfer threshold: {{ trigger.to_state.attributes.input_transfer_low_v | default('—', true) }} V.

            # AVR Boost ended
            - conditions:
                - condition: trigger
                  id:
                    - boost_ended
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "⚡✅ UPS: AVR Boost ended"
                    message: >-
                      Input voltage normalized: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} V · output: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} V.

            # NUT FSD started
            - conditions:
                - condition: trigger
                  id:
                    - forced_shutdown_started
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋🛑 UPS: Forced Shutdown started"
                    message: >-
                      NUT activated FSD · charge: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · runtime: {{ trigger.to_state.attributes.battery_runtime_seconds | default('—', true) }} s · load: {{ trigger.to_state.attributes.load_percent | default('—', true) }}%.

            # NUT FSD cleared
            - conditions:
                - condition: trigger
                  id:
                    - forced_shutdown_cleared
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: Forced Shutdown cleared"
                    message: >-
                      Charge: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · input: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} V.

            # Alarm started
            - conditions:
                - condition: trigger
                  id:
                    - alarm_started
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋🚨 UPS: alarm active"
                    message: >-
                      Charge: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · load: {{ trigger.to_state.attributes.load_percent | default('—', true) }}% · input: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} V · output: {{ trigger.to_state.attributes.output_voltage_v | default('—', true) }} V.

            # Alarm cleared
            - conditions:
                - condition: trigger
                  id:
                    - alarm_cleared
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: alarm cleared"
                    message: >-
                      Charge: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}% · load: {{ trigger.to_state.attributes.load_percent | default('—', true) }}%.

            # Battery discharge milestone
            - conditions:
                - condition: trigger
                  id:
                    - battery_discharge_level_crossed
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋⚠️ UPS: charge {{ trigger.to_state.attributes.current_charge_percent }}%"
                    message: >-
                      {% set r = trigger.to_state.attributes.battery_runtime_seconds | default(none) %}{% if r is number %}{% set rs = r | int %}{% set rh = rs // 3600 %}{% set rm = (rs % 3600) // 60 %}{% endif %}Runtime: {% if r is number %}{{ '%d:%02d' | format(rh, rm) }}{% else %}—{% endif %} · load: {{ trigger.to_state.attributes.load_percent | default('—', true) }}% · crossed: {{ trigger.to_state.attributes.crossed_thresholds | join(', ') }}%.

            # Battery fully charged
            - conditions:
                - condition: trigger
                  id:
                    - battery_fully_charged
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋✅ UPS: battery charged"
                    message: >-
                      Charge: {{ trigger.to_state.attributes.current_charge_percent | default(trigger.to_state.attributes.battery_charge_percent, true) }}% · load: {{ trigger.to_state.attributes.load_percent | default('—', true) }}% · input: {{ trigger.to_state.attributes.input_voltage_v | default('—', true) }} V.

            # Emergency shutdown committed
            - conditions:
                - condition: trigger
                  id:
                    - shutdown_committed
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋🛑 PVE: emergency shutdown started"
                    message: >-
                      {% set r = trigger.to_state.attributes.battery_runtime_seconds | default(none) %}{% if r is number %}{% set rs = r | int %}{% set rh = rs // 3600 %}{% set rm = (rs % 3600) // 60 %}{% endif %}Reason: {{ trigger.to_state.attributes.reason }} · charge: {{ trigger.to_state.attributes.battery_charge_percent | default('—', true) }}%{% if r is number %} · runtime: {{ '%d:%02d' | format(rh, rm) }}{% endif %} · load: {{ trigger.to_state.attributes.load_percent | default('—', true) }}% · shutdown budget: {{ trigger.to_state.attributes.shutdown_budget_seconds | default('—', true) }} s · reserve: {{ trigger.to_state.attributes.runtime_reserve_seconds | default('—', true) }} s.

            # UPS Trigger configuration changed
            - conditions:
                - condition: trigger
                  id:
                    - config_changed
              sequence:
                - action: persistent_notification.create
                  data:
                    title: "🔋⚙️ UPS Trigger configuration changed"
                    message: >-
                      Charge: {{ trigger.to_state.attributes.old_values.shutdown_battery_charge_threshold_percent }}% → {{ trigger.to_state.attributes.new_values.shutdown_battery_charge_threshold_percent }}% · reserve: {{ trigger.to_state.attributes.old_values.runtime_reserve_seconds }} s → {{ trigger.to_state.attributes.new_values.runtime_reserve_seconds }} s.
