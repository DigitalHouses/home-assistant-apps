          - type: conditional
            conditions:
              - condition: state
                entity: sensor.dh_pve_agent_ups_test_state
                state: Idle
              - condition: state
                entity: binary_sensor.dh_pve_agent_ups_quick_test_supported
                state: 'on'
            card:
              type: custom:mushroom-template-card
              entity: button.dh_pve_agent_ups_test_quick
