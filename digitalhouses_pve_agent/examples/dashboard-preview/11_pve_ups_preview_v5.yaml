        grid_options:
          columns: 12
          rows: 1
      - type: conditional
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity: binary_sensor.dh_pve_agent_ups_quick_test_supported
                state: 'on'
              - condition: state
                entity: binary_sensor.dh_pve_agent_ups_deep_test_supported
                state: 'on'
        card:
          type: heading
          heading: Расписание тестов UPS
          heading_style: subtitle
          icon: mdi:calendar-sync-outline
      - type: conditional
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity: binary_sensor.dh_pve_agent_ups_quick_test_supported
                state: 'on'
              - condition: state
                entity: binary_sensor.dh_pve_agent_ups_deep_test_supported
                state: 'on'
        card:
          type: horizontal-stack
          cards:
            - type: conditional
              conditions:
                - condition: state
                  entity: binary_sensor.dh_pve_agent_ups_quick_test_supported
                  state: 'on'
              card:
                type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    subtitle: Быстрый тест батареи
                  - type: custom:mushroom-number-card
                    entity: number.dh_pve_agent_ups_quick_test_interval_days
                    name: Интервал
                    icon: mdi:calendar-range
                    display_mode: buttons
                  - type: custom:mushroom-entity-card
                    entity: time.dh_pve_agent_ups_quick_test_time
                    name: Время
                    icon: mdi:clock-outline
                    fill_container: true
                    tap_action:
                      action: more-info
                  - type: custom:mushroom-entity-card
                    entity: sensor.dh_pve_agent_ups_next_quick_test
