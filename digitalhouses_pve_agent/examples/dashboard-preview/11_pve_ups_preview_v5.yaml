          {% elif 'fail' in r or 'error' in r %}
            red
          {% elif 'abort' in r or 'stop' in r or 'cancel' in r %}
            orange
          {% elif 'pass' in r or 'success' in r %}
            green
          {% else %}
            blue
          {% endif %}
        multiline_secondary: true
        tap_action:
          action: more-info
