                    icon: mdi:calendar-clock
                    tap_action:
                      action: more-info
                  - type: custom:mushroom-entity-card
                    entity: sensor.dh_pve_agent_ups_last_quick_test
                    name: Последний результат
                    icon: mdi:battery-check
                    tap_action:
                      action: more-info
            - type: conditional
              conditions:
                - condition: state
                  entity: binary_sensor.dh_pve_agent_ups_deep_test_supported
                  state: 'on'
              card:
                type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    subtitle: Глубокий тест батареи
                  - type: custom:mushroom-number-card
                    entity: number.dh_pve_agent_ups_deep_test_interval_days
                    name: Интервал
                    icon: mdi:calendar-range
                    display_mode: buttons
                  - type: custom:mushroom-entity-card
                    entity: time.dh_pve_agent_ups_deep_test_time
                    name: Время
                    icon: mdi:clock-outline
                    fill_container: true
                    tap_action:
                      action: more-info
                  - type: custom:mushroom-entity-card
                    entity: sensor.dh_pve_agent_ups_next_deep_test
                    name: Следующий тест
                    icon: mdi:calendar-clock
                    tap_action:
                      action: more-info
                  - type: custom:mushroom-entity-card
                    entity: sensor.dh_pve_agent_ups_last_deep_test
                    name: Последний результат
                    icon: mdi:battery-check
                    tap_action:
                      action: more-info
      - type: markdown
        title: 🧪 История тестов батареи
        content: >
          {%- set history = state_attr('sensor.dh_pve_agent_ups_test_history',
          'history') or [] -%}

          {%- set ns = namespace(rows=[]) -%}


          {%- for r in history | reverse -%}

            {%- if r.type == 'Standard' -%}
              {%- set test_type = 'Стандартный' -%}
            {%- elif r.type == 'Quick' -%}
              {%- set test_type = 'Быстрый' -%}
            {%- elif r.type == 'Deep' -%}
              {%- set test_type = 'Глубокий' -%}
            {%- else -%}
              {%- set test_type = r.type | default('—', true) -%}
            {%- endif -%}

            {%- if r.source == 'Manual' -%}
              {%- set source_text = 'Вручную' -%}
            {%- elif r.source == 'Scheduled' -%}
              {%- set source_text = 'По расписанию' -%}
            {%- else -%}
              {%- set source_text = r.source | default('—', true) -%}
            {%- endif -%}

            {%- if r.result == 'Passed' -%}
              {%- set result_text = '✅ Пройден' -%}
            {%- elif r.result == 'Failed' -%}
              {%- set result_text = '❌ Ошибка' -%}
            {%- elif r.result == 'Stopped' -%}
              {%- set result_text = '⏹️ Остановлен' -%}
            {%- elif r.result == 'Running' -%}
              {%- set result_text = '⏳ Выполняется' -%}
            {%- elif r.result == 'Started' -%}
              {%- set result_text = '⏳ Ожидается результат' -%}
            {%- else -%}
              {%- set result_text = r.result | default('—', true) -%}
            {%- endif -%}

            {%- if r.duration_seconds is not none -%}
              {%- set duration = '%02d:%02d' | format(
                (r.duration_seconds | int) // 60,
                (r.duration_seconds | int) % 60
              ) -%}
            {%- else -%}
              {%- set duration = '—' -%}
            {%- endif -%}

            {%- if r.battery_charge_before is not none -%}
              {%- set battery =
                (r.battery_charge_before | round(0) | int | string) ~ '%'
              -%}
              {%- if r.battery_charge_after is not none -%}
                {%- set battery = battery ~ ' → ' ~
                  (r.battery_charge_after | round(0) | int | string) ~ '%'
                -%}
              {%- endif -%}
            {%- else -%}
              {%- set battery = '—' -%}
            {%- endif -%}

            {%- set started =
              as_datetime(r.started_at).strftime('%d.%m %H:%M')
              if r.started_at is not none else '—'
            -%}

            {%- set ns.rows = ns.rows + [
              '| ' ~ started ~
              ' | ' ~ test_type ~
              ' | ' ~ source_text ~
              ' | ' ~ result_text ~
              ' | ' ~ duration ~
              ' | ' ~ battery ~ ' |'
            ] -%}

          {%- endfor -%}


          {% if history | count == 0 -%}

          История тестов пока пуста.

          {%- else %}

          {{ '| Дата | Тест | Запуск | Результат | Длительность | Батарея
          |\n|:---|:---|:---|:---|---:|:---:|\n' ~ (ns.rows | join('\n')) }}


          **Всего записей: {{ history | count }}**

          {% endif %}
        grid_options:
          columns: 12
          rows: auto
      - type: heading
        heading: Резервное копирование PVE
        heading_style: subtitle
        icon: mdi:backup-restore
      - type: custom:button-card
        entity: sensor.dh_pve_agent_backup_history
        show_icon: false
        show_name: false
        show_state: false
        tap_action:
          action: none
        styles:
          card:
            - padding: 12px
            - text-align: left
          grid:
            - grid-template-areas: '"backup_tree"'
            - grid-template-columns: 1fr
          custom_fields:
            backup_tree:
              - display: block
              - overflow: visible
              - white-space: normal
              - text-align: left
              - width: 100%
              - pointer-events: auto
        custom_fields:
          backup_tree: |
            [[[
              const a = states['sensor.dh_pve_agent_backup_history']?.attributes || {};
              const items = Array.isArray(a.runs) ? a.runs : [];
              const esc = (v) => String(v ?? '').replace(/&/g, '&amp;')
                .replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
              const date = (s) => {
                if (!s) return '—';
                const d = new Date(s);
                return isNaN(d.getTime()) ? '—'
                  : new Intl.DateTimeFormat('ru-RU', {
                      day: '2-digit', month: '2-digit',
                      hour: '2-digit', minute: '2-digit'
                    }).format(d);
              };
              const length = (s) => {
                if (typeof s !== 'number') return '';
                return s < 60 ? s + ' с'
                  : s < 3600 ? Math.round(s / 60) + ' мин'
                  : Math.floor(s / 3600) + ' ч ' + Math.round(s % 3600 / 60) + ' мин';
              };
              const size = (n, k) => {
                if (typeof n !== 'number' || !Number.isFinite(n)) return '';
                return (k === 'archive' ? 'архив ' : 'обработано ')
                  + n.toFixed(2) + ' GiB';
              };
              const colors = {
                success: '🟢', failed: '🔴', running: '🟡',
                skipped: '⚪', unknown: '⚪'
              };
              const statesText = {
                success: 'Успешно', failed: 'Ошибка',
                running: 'Выполняется', skipped: 'Пропущено',
                unknown: 'Неизвестно'
              };
              let result = '<div style="font-size:13px;line-height:1.65;">';
              if (a.coverage !== 'available') {
                result += '<div style="opacity:.75">⚠ История PVE недоступна или устарела</div>';
              }
              if (!items.length) {
                result += '<div style="opacity:.75">Нет подтверждённых запусков vzdump</div>';
              }
              for (const r of items) {
                const state = r.s || 'unknown';
                const suffix = [statesText[state] || state, length(r.m), size(r.z, r.k)]
                  .filter(Boolean).join(' · ');
                const open = state !== 'success' ? ' open' : '';
                result += '<details' + open + ' style="border-bottom:1px solid var(--divider-color);padding:5px 0;">'
                  + '<summary style="cursor:pointer;white-space:normal;list-style:revert;">'
                  + (colors[state] || '⚪') + ' <b>' + esc(date(r.d))
                  + ' · ' + esc(r.n || 'vzdump') + '</b>'
                  + '<span style="opacity:.75"> · ' + esc(suffix) + '</span></summary>';
                const guests = Array.isArray(r.g) ? r.g : [];
                result += '<div style="padding:4px 0 4px 23px;">';
                if (!guests.length) {
                  result += '<div style="opacity:.65">Детали гостей отсутствуют</div>';
                }
                for (const g of guests) {
                  const detail = [statesText[g.s] || 'Неизвестно', size(g.z, g.t)]
                    .filter(Boolean).join(' · ');
                  result += '<div>' + (colors[g.s] || '⚪') + ' '
                    + esc((g.k || 'VM/CT') + ' ' + g.id)
                    + (g.n ? ' · ' + esc(g.n) : '')
                    + '<span style="opacity:.75"> · ' + esc(detail) + '</span>'
                    + (g.e ? '<div style="color:var(--error-color);padding-left:20px;white-space:normal;">'
                        + esc(g.e) + '</div>' : '')
                    + '</div>';
                }
                if (r.e && state === 'failed') {
                  result += '<div style="opacity:.8">' + esc(r.e) + '</div>';
                }
                result += '</div></details>';
              }
              if (a.details_limited) {
                result += '<div style="opacity:.7;padding-top:4px">Часть деталей скрыта из-за ограничения атрибутов Home Assistant</div>';
              }
              result += '</div>';
              return result;
            ]]]
        grid_options:
          columns: 12
      - type: entities
        entities:
          - entity: number.dh_pve_agent_backup_history_limit
            name: Запусков в истории
        grid_options:
          columns: 6
  - type: grid
    visibility:
      - condition: state
        entity: binary_sensor.dh_pve_agent_ups_configured
        state: 'on'
    cards:
      - type: heading
        heading: Условия аварийного выключения
        heading_style: title
        icon: mdi:shield-power
      - type: custom:mushroom-template-card
        entity: sensor.dh_pve_agent_ups_trigger_policy
        primary: Условия аварийного выключения
        secondary: '{% set charge=state_attr(entity,''active_charge_threshold_percent'') %}
        
          {% set reserve=state_attr(entity,''active_runtime_reserve_seconds'') %}
        
          {% set budget=states(''sensor.dh_pve_agent_ups_shutdown_budget'') %}
        
          Заряд ≤ {{ (charge|round(0)|int|string)~''%'' if charge is number else ''—'' }}
        
          {% if reserve is number and budget | is_number %}
        
          · осталось ≤ {{ ((budget|float + reserve|float)/60)|round(1) }} мин
        
          {% endif %}
        
          · аварийный Low Battery'
        icon: mdi:shield-power
        icon_color: '{% if is_state(''sensor.dh_pve_agent_ups_trigger_policy'',''Active'') %} green
        
          {% elif is_state(''sensor.dh_pve_agent_ups_trigger_policy'',''Pending changes'') %} orange
        
          {% else %} grey {% endif %}'
        multiline_secondary: true
        tap_action:
          action: more-info
        grid_options:
          columns: 12
          rows: auto
      - type: vertical-stack
        cards:
        - type: grid
          columns: 2
          square: false
          cards:
          - type: custom:mushroom-number-card
            entity: number.dh_pve_agent_ups_shutdown_battery_charge_threshold
            name: Черновик · порог заряда
            icon: mdi:battery-alert
            display_mode: buttons
            fill_container: true
          - type: custom:mushroom-number-card
            entity: number.dh_pve_agent_ups_shutdown_runtime_reserve
            name: Черновик · резерв времени
            icon: mdi:timer-plus-outline
            display_mode: buttons
            fill_container: true
        - type: conditional
          conditions:
          - condition: state
            entity: sensor.dh_pve_agent_ups_trigger_policy
            state: Pending changes
          card:
            type: custom:mushroom-template-card
            entity: button.dh_pve_agent_ups_apply_trigger_policy
            primary: Применить изменения
            secondary: "{% set policy = 'sensor.dh_pve_agent_ups_trigger_policy' %} {% set charge =\n  state_attr(policy,\
              \ 'draft_charge_threshold_percent')\n%} {% set reserve =\n  state_attr(policy, 'draft_runtime_reserve_seconds')\n\
              %}\n{% if charge is number and reserve is number %}\n  Черновик: заряд {{ charge | round(0) | int }} %\n \
              \ · резерв {{ (reserve | float / 60) | round(1) }} мин\n{% else %}\n  Есть изменения, ожидающие применения\n\
              {% endif %}"
            icon: mdi:check-decagram-outline
            icon_color: orange
            multiline_secondary: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.dh_pve_agent_ups_apply_trigger_policy
              confirmation:
                text: Применить новые параметры аварийного отключения?
        grid_options:
          columns: 12
          rows: auto
      - type: heading
        icon: mdi:shield-check
        heading: Расчёт shutdown
        heading_style: title
      - type: markdown
        content: '{% set budget = states(''sensor.dh_pve_agent_ups_shutdown_budget'') %}
        
          {% set guests = states(''sensor.dh_pve_agent_ups_guest_shutdown_budget'') %}
        
          {% set reserve = state_attr(''sensor.dh_pve_agent_ups_trigger_policy'',''active_runtime_reserve_seconds'') %}
        
          **Безопасное выключение**
        
          {% if budget | is_number %}
        
          - VM/LXC: **{{ (guests|float/60)|round(1) if guests|is_number else ''—'' }} мин**
        
          - Полный shutdown PVE: **{{ (budget|float/60)|round(1) }} мин**
        
          {% else %}
        
          - Бюджет остановки PVE: **нет данных**
        
          {% endif %}
        
          - Резерв: **{{ (reserve|float/60)|round(1) if reserve is number else ''—'' }} мин**
        
          - Сигнал Low Battery от UPS действует независимо от настроенных порогов.
        
          [Подробнее о механизме shutdown](https://github.com/DigitalHouses/home-assistant-apps/blob/main/digitalhouses_pve_agent/docs/UPS_SHUTDOWN_SETUP.md)'
        grid_options:
          columns: 12
          rows: auto
cards: []
