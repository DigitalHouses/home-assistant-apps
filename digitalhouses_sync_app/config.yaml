name: DigitalHouses Sync App
version: "0.0.1"
slug: digitalhouses_sync_app
description: Experimental DigitalHouses YAML synchronization controller (inventory-only preview).
url: https://github.com/DigitalHouses/home-assistant-apps/tree/main/digitalhouses_sync_app
arch:
  - amd64
  - aarch64
image: ghcr.io/digitalhouses/digitalhouses_sync_app
startup: application
boot: manual
init: false
stage: experimental
services:
  - mqtt:need
map:
  - type: homeassistant_config
    read_only: true
options:
  sync_interval_hours: 24
  log_level: info
schema:
  sync_interval_hours: int(1,168)
  log_level: list(debug|info|warning|error)
