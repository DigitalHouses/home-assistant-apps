name: DigitalHouses Network App
version: 0.1.5
slug: digitalhouses_network_app
description: Network inventory and device presence (Bonjour discovery and service inventory).
url: https://github.com/DigitalHouses/home-assistant-apps/tree/main/digitalhouses_network_app
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
stage: experimental
backup: cold
ingress: true
ingress_port: 0
panel_title: DH Network
panel_icon: mdi:lan
panel_admin: true
homeassistant_api: true
host_network: true
privileged:
  - NET_RAW
options:
  poll_interval_seconds: 60
  scan_interval_seconds: 180
  mdns_interval_seconds: 300
schema:
  poll_interval_seconds: int(15,3600)
  scan_interval_seconds: int(60,3600)
  mdns_interval_seconds: int(120,3600)
