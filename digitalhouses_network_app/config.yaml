name: DigitalHouses Network App
version: 0.1.1
slug: digitalhouses_network_app
description: Network inventory and device presence (experimental HA router discovery).
url: https://github.com/DigitalHouses/home-assistant-apps/tree/main/digitalhouses_network_app
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
stage: experimental
backup: cold
ingress: true
ingress_port: 8099
panel_title: DH Network
panel_icon: mdi:lan
panel_admin: true
homeassistant_api: true
options:
  poll_interval_seconds: 60
schema:
  poll_interval_seconds: int(15,3600)
