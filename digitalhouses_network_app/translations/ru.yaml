configuration:
  poll_interval_seconds:
    name: Интервал опроса роутеров (секунды)
    description: Периодически читать device_tracker интеграций роутеров из Home Assistant.
  scan_interval_seconds:
    name: Интервал сканирования LAN ARP (секунды)
    description: Периодический ARP-опрос основной Ethernet-сети. Диапазоны больше /24 пока не сканируются.
  mdns_interval_seconds:
    name: Интервал Bonjour/mDNS (секунды)
    description: Поиск сервисов в LAN, привязка имён только по подтверждённому ARP.
