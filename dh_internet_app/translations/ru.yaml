configuration:
  router_ip:
    name: IP роутера
    description: LAN IP для различения сбоя роутера и внешней проблемы Internet/ONT.
  connectivity_check:
    name: Проверка соединения
    description: Параметры проверки Internet и роутера.
  connectivity_check.interval_seconds:
    name: Интервал проверки, с
    description: Пауза между обычными проверками соединения.
  connectivity_check.attempts:
    name: Неудачных проверок
    description: Сколько подряд проверок Internet должны завершиться ошибкой до начала инцидента.
  connectivity_check.timeout_seconds:
    name: Таймаут ping, с
    description: Таймаут одной проверки доступности.
  speedtest:
    name: Speedtest
    description: Расписание, таймаут и выбор серверов Ookla Speedtest.
  speedtest.periodic_enabled:
    name: Периодический Speedtest
    description: Автоматически запускать Ookla Speedtest по заданному интервалу.
  speedtest.interval_minutes:
    name: Интервал Speedtest, мин
    description: Минут между автоматическими тестами.
  speedtest.timeout_seconds:
    name: Таймаут Speedtest, с
    description: Максимальное время одной попытки Ookla Speedtest.
  speedtest.server_ids:
    name: Предпочтительные server ID
    description: Упорядоченный список Ookla server ID. Пусто — автоматический выбор.
  speedtest.automatic_server_fallback:
    name: Автоматический fallback
    description: После ошибок выбранных серверов выполнить одну попытку автоматического выбора.
  traffic:
    name: Телеметрия роутера
    description: Опциональные HA-привязки роутера и учёта трафика.
  traffic.traffic_download_total:
    name: Накопительный Download
    description: Накопительный sensor Download. Заполняется вместе с Upload или оба поля пустые.
  traffic.traffic_upload_total:
    name: Накопительный Upload
    description: Накопительный sensor Upload. Заполняется вместе с Download или оба поля пустые.
  traffic.router_wan_status:
    name: WAN status
    description: Опциональный sensor или binary_sensor состояния WAN роутера.
  traffic.router_download_rate:
    name: Текущий Download
    description: Опциональный sensor текущей скорости Download роутера.
  traffic.router_upload_rate:
    name: Текущий Upload
    description: Опциональный sensor текущей скорости Upload роутера.
  recovery:
    name: Восстановление
    description: Автоматическое восстановление ONT и роутера. По умолчанию выключено.
  recovery.enabled:
    name: Включить Recovery
    description: Разрешить App выполнять настроенные действия восстановления ONT и роутера.
  recovery.mode:
    name: Режим Recovery
    description: smart перезагружает проблемный элемент; both всегда выполняет ONT, затем Router.
  recovery.max_cycles:
    name: Максимум циклов
    description: Число циклов восстановления до перехода в cooldown.
  recovery.retry_interval_minutes:
    name: Интервал повтора, мин
    description: Пауза до следующего цикла, если Internet всё ещё недоступен.
  recovery.boot_wait_minutes:
    name: Ожидание загрузки, мин
    description: Пауза на стабилизацию после каждого цикла восстановления.
  recovery.cooldown_minutes:
    name: Cooldown, мин
    description: Пауза после максимума циклов перед возможной новой серией.
  recovery.ont:
    name: Recovery ONT
    description: HA button или switch для восстановления ONT.
  recovery.ont.action:
    name: Действие ONT
    description: button нажимает reboot entity; switch выполняет power-cycle.
  recovery.ont.entity_id:
    name: Entity ONT
    description: button.* или switch.* в соответствии с выбранным действием.
  recovery.ont.power_off_seconds:
    name: ONT выключен, с
    description: Только для switch — сколько держать питание выключенным.
  recovery.router:
    name: Recovery Router
    description: HA button или switch для восстановления роутера.
  recovery.router.action:
    name: Действие Router
    description: button нажимает reboot entity; switch выполняет power-cycle.
  recovery.router.entity_id:
    name: Entity Router
    description: button.* или switch.* в соответствии с выбранным действием.
  recovery.router.power_off_seconds:
    name: Router выключен, с
    description: Только для switch — сколько держать питание выключенным.
  log_level:
    name: Уровень логирования
    description: Подробность логов приложения.
