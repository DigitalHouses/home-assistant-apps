# DH-View-Version: 0.1.2
# DH-View-Date: 2026-11-21
title: PBS
path: dh_pbs_agent
icon: mdi:backup-restore
type: sections
max_columns: 4
sections:
  - type: grid
    cards:
      - type: heading
        heading: Proxmox Backup Server
        heading_style: title
        icon: mdi:backup-restore
      - type: entities
        title: Состояние PBS
        entities:
          - entity: sensor.dh_pbs_agent_health
            name: Состояние
          - entity: binary_sensor.dh_pbs_agent_problem
            name: Есть проблемы
          - entity: sensor.dh_pbs_agent_last_collection
            name: Последний сбор
          - entity: sensor.dh_pbs_agent_zfs_pool_health
            name: ZFS
      - type: markdown
        content: |
          {% set a = state_attr('sensor.dh_pbs_agent_health', 'summary') or {} %}
          **Сводка PBS**

          {% if a %}
          Datastore: {{ a.datastore_count }}

          Правил резервирования: {{ a.freshness_rules }}

          Push Sync: {{ a.push_jobs }}

          Verify: {{ a.verify_jobs }} · Prune: {{ a.prune_jobs }}

          Активных проблем: {{ a.active_problems }}
          {% else %}
          Ожидание достоверных данных.
          {% endif %}
  - type: grid
    cards:
      - type: heading
        heading: Datastore и резервные копии
        heading_style: title
        icon: mdi:database
      - type: markdown
        content: |
          {% set entries = state_attr('sensor.dh_pbs_agent_health', 'datastores') or [] %}
          | Datastore | Заполнено | Свободно |
          | :--- | ---: | ---: |
          {% for d in entries -%}
          | {{ d.name }} | {{ d.used_percent if d.used_percent is defined else '—' }}% | {{ (d.available_bytes / 1073741824) | round(1) if d.available_bytes is defined else '—' }} GiB |
          {% endfor %}
      - type: markdown
        content: |
          {% set rows = state_attr('sensor.dh_pbs_agent_health', 'backup_groups') or [] %}
          {% set coverage = state_attr('sensor.dh_pbs_agent_health', 'backup_groups_status') or 'UNAVAILABLE' %}
          **Группы резервных копий PBS**

          {% if rows %}
          | Группа | Копий | Последняя | Возраст | Контроль |
          | :--- | ---: | :--- | ---: | :--- |
          {% for b in rows -%}
          | {{ b.datastore }}/{{ b.namespace ~ '/' if b.namespace else '' }}{{ b.group }} | {{ b.snapshot_count if b.snapshot_count is not none else '—' }} | {{ as_local(as_datetime(b.last_backup_at)).strftime('%d.%m %H:%M') if b.last_backup_at else '—' }} | {{ (b.age_hours ~ ' ч') if b.age_hours is not none else '—' }} | {{ b.status if b.status != 'NOT_MONITORED' else 'Без правила' }} |
          {% endfor %}
          {% else %}
          {% if coverage == 'COMPLETE' %}
          В datastore пока нет групп резервных копий.
          {% else %}
          Не удалось получить список резервных копий.
          {% endif %}
          {% endif %}
          {% if coverage == 'PARTIAL' %}

          ⚠️ Список неполный — подробности в «Ошибки сбора».
          {% elif coverage == 'UNAVAILABLE' %}

          Инвентаризация недоступна.
          {% endif %}
      - type: markdown
        content: |
          {% set entries = state_attr('sensor.dh_pbs_agent_health', 'backups') or [] %}
          **Контролируемые группы и свежесть копий**

          {% if entries %}
          {% for b in entries %}
          - **{{ b.group }}** ({{ b.datastore }}) — {{ b.status }},
            {{ b.age_hours if b.age_hours is not none else 'нет копии' }} ч
          {% endfor %}
          {% else %}
          Правила свежести копий не настроены.
          {% endif %}
  - type: grid
    cards:
      - type: heading
        heading: Задания PBS
        heading_style: title
        icon: mdi:calendar-check
      - type: markdown
        content: |
          {% set jobs = state_attr('sensor.dh_pbs_agent_health', 'maintenance_jobs') or [] %}
          **Расписание и последний результат**

          {% if jobs %}
          | Тип | Задание | Расписание | Последний запуск | Результат |
          | :--- | :--- | :--- | :--- | :--- |
          {% for j in jobs -%}
          | {{ j.type }} | {{ j.id }} | {{ j.schedule or '—' }} | {{ as_local(as_datetime(j.last_run_at)).strftime('%d.%m %H:%M') if j.last_run_at else '—' }} | {{ j.status }} |
          {% endfor %}
          {% else %}
          Заданий обслуживания PBS нет или они недоступны.
          {% endif %}
      - type: markdown
        content: |
          {% set history = state_attr('sensor.dh_pbs_agent_health', 'task_history') or [] %}
          {% set coverage = state_attr('sensor.dh_pbs_agent_health', 'task_history_status') or 'UNAVAILABLE' %}
          **Последние выполнения PBS**

          {% if history %}
          | Запуск | Операция | Длительность | Результат |
          | :--- | :--- | ---: | :--- |
          {% for h in history -%}
          | {{ as_local(as_datetime(h.started_at)).strftime('%d.%m %H:%M') }} | {{ h.type }} | {{ (h.duration_seconds ~ ' с') if h.duration_seconds is not none else '—' }} | {{ h.status }} |
          {% endfor %}
          {% else %}
          {% if coverage == 'AVAILABLE' %}
          В истории PBS нет подходящих выполнений.
          {% else %}
          История заданий недоступна.
          {% endif %}
          {% endif %}
  - type: grid
    cards:
      - type: heading
        heading: Диагностика
        heading_style: title
        icon: mdi:information-outline
      - type: entities
        entities:
          - entity: sensor.dh_pbs_agent_hostname
          - entity: sensor.dh_pbs_agent_ip
          - entity: sensor.dh_pbs_agent_version
      - type: markdown
        content: |
          {% set errors = state_attr('sensor.dh_pbs_agent_health', 'errors') or [] %}
          **Ошибки сбора**
          {% if errors %}
          {% for error in errors %}
          - {{ error }}
          {% endfor %}
          {% else %}
          Ошибок сбора не зарегистрировано.
          {% endif %}
