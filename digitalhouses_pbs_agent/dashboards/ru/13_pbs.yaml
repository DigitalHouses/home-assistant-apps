# DH-View-Version: 0.1.11
# DH-View-Date: 2026-11-22
title: PBS
path: dh_pbs_agent
icon: mdi:backup-restore
type: sections
max_columns: 4
sections:
  - type: grid
    cards:
      - type: heading
        heading: Proxmox Backup Server
        heading_style: title
        icon: mdi:backup-restore
      - type: vertical-stack
        cards:
          - type: custom:button-card
            entity: sensor.dh_pbs_agent_card
            show_icon: true
            show_name: true
            show_label: true
            update_timer: |
              [[[
                return states['sensor.dh_pbs_agent_card']?.state === 'running' ? 100 : 5000;
              ]]]
            icon: |
              [[[
                const s = states['sensor.dh_pbs_agent_card']?.state;
                const newer = states['binary_sensor.dh_pbs_agent_update_available']?.state === 'on';
                return s === 'running' ? 'mdi:progress-clock'
                  : s === 'error' ? 'mdi:alert-circle'
                  : s === 'success' ? 'mdi:check-circle'
                  : newer ? 'mdi:package-up' : 'mdi:backup-restore';
              ]]]
            name: |
              [[[
                const version = states['sensor.dh_pbs_agent_version']?.state;
                const latest = states['sensor.dh_pbs_agent_latest_version']?.state;
                const known = v => v && !['unknown','unavailable','none'].includes(v);
                const newer = states['binary_sensor.dh_pbs_agent_update_available']?.state === 'on';
                return 'PBS Agent' + (known(version)
                  ? ' · v' + version + (newer && known(latest) ? ' → v' + latest : '')
                  : '');
              ]]]
            label: |
              [[[
                const s = states['sensor.dh_pbs_agent_card'];
                if (!s || ['unknown','unavailable'].includes(s.state)) return 'Нет связи с PBS Agent';
                const a = s.attributes || {};
                const names = {refresh:'Сбор данных',check:'Проверка версии',
                  install:'Установка версии',restart:'Перезапуск агента'};
                if (s.state === 'running') {
                  const start = Date.parse(a.started_at || '');
                  const seconds = Number.isFinite(start) ? Math.max(0, Math.floor((Date.now()-start)/1000)) : 0;
                  return (names[a.operation] || 'Операция') + '… '
                    + String(Math.floor(seconds/60)).padStart(2,'0') + ':'
                    + String(seconds%60).padStart(2,'0');
                }
                if (s.state === 'error') return 'Ошибка: ' + (a.error || 'операция не выполнена');
                if (s.state === 'success') return ({
                    refresh:'Данные обновлены',check:'Версия проверена',
                    install:'Агент обновлён',restart:'Агент перезапущен'
                  }[a.operation] || 'Готово') +
                  (typeof a.duration_seconds === 'number'
                    ? ' · ' + a.duration_seconds.toFixed(1) + ' сек' : '');
                if (states['binary_sensor.dh_pbs_agent_update_available']?.state === 'on')
                  return 'Доступна новая версия';
                const health = states['sensor.dh_pbs_agent_health']?.state;
                if (!health || ['unknown','unavailable'].includes(health))
                  return 'Ожидание данных PBS';
                return 'PBS: ' + health;
              ]]]
            styles:
              card:
                - padding: 12px
                - text-align: left
              grid:
                - grid-template-areas: '"i n" "i l"'
                - grid-template-columns: 48px 1fr
                - grid-template-rows: min-content min-content
              img_cell:
                - width: 40px
                - justify-content: start
              icon:
                - width: 26px
                - color: |
                    [[[
                      const s = states['sensor.dh_pbs_agent_card']?.state;
                      return s === 'error' ? 'var(--error-color)'
                        : s === 'running' ? 'var(--info-color, var(--primary-color))'
                        : s === 'success' ? 'var(--success-color, var(--primary-color))'
                        : states['binary_sensor.dh_pbs_agent_update_available']?.state === 'on'
                        ? 'var(--warning-color, orange)' : 'var(--success-color, var(--primary-color))';
                    ]]]
              name:
                - justify-self: start
                - font-size: 14px
                - font-weight: 600
              label:
                - justify-self: start
                - white-space: normal
                - text-align: left
                - font-size: 13px
                - color: var(--secondary-text-color)
            tap_action:
              action: none
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:refresh
                content: Обновить
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.dh_pbs_agent_refresh
              - type: template
                icon: mdi:cloud-search
                content: Версия
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.dh_pbs_agent_check_updates
              - type: conditional
                conditions:
                  - entity: binary_sensor.dh_pbs_agent_update_available
                    state: 'on'
                chip:
                  type: template
                  icon: mdi:package-down
                  icon_color: orange
                  content: Новая версия
                  tap_action:
                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.dh_pbs_agent_update
                    confirmation:
                      text: Установить новый релиз PBS Agent? Мониторинг временно прервётся, сам PBS и резервные копии не перезапускаются.
              - type: template
                icon: mdi:restart
                content: Перезапуск
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.dh_pbs_agent_restart_agent
                  confirmation:
                    text: Перезапустить только PBS Agent? Сам PBS и задания резервирования продолжат работу.
        grid_options:
          columns: 12
      - type: entities
        title: Состояние PBS
        entities:
          - entity: sensor.dh_pbs_agent_health
            name: Состояние
          - entity: binary_sensor.dh_pbs_agent_problem
            name: Есть проблемы
          - entity: sensor.dh_pbs_agent_last_collection
            name: Последний сбор
          - entity: sensor.dh_pbs_agent_zfs_pool_health
            name: ZFS
      - type: markdown
        content: |
          {% set a = state_attr('sensor.dh_pbs_agent_health', 'summary') or {} %}
          **Сводка PBS**

          {% if a %}
          Datastore: {{ a.datastore_count }}

          Правил резервирования: {{ a.freshness_rules }}

          Push Sync: {{ a.push_jobs }}

          Verify: {{ a.verify_jobs }} · Prune: {{ a.prune_jobs }}

          Активных проблем: {{ a.active_problems }}
          {% else %}
          Ожидание достоверных данных.
          {% endif %}
  - type: grid
    cards:
      - type: heading
        heading: Datastore и резервные копии
        heading_style: title
        icon: mdi:database
      - type: markdown
        content: |
          {%- set ds = state_attr('sensor.dh_pbs_agent_health', 'datastores') or [] -%}
          {%- set groups = state_attr('sensor.dh_pbs_agent_health', 'backup_groups') or [] -%}
          {%- set rules = state_attr('sensor.dh_pbs_agent_health', 'backups') or [] -%}
          {%- set coverage = state_attr('sensor.dh_pbs_agent_health', 'backup_groups_status') or 'UNAVAILABLE' -%}
          {%- set limits = state_attr('sensor.dh_pbs_agent_health', 'view_limits') or {} -%}
          {%- set group_limit = limits.backup_groups | default(10) | int -%}
          {%- set ns = namespace(lines=['PBS', '├─ Datastore (' ~ (ds | count) ~ ')']) -%}
          {%- for d in ds -%}
            {%- set icon = '🟢' if d.health == 'HEALTHY'
                else '🟠' if d.health == 'DEGRADED'
                else '🔴' if d.health in ['CRITICAL', 'UNAVAILABLE']
                else '⚪' -%}
            {%- set branch = '└─' if loop.last else '├─' -%}
            {%- set ns.lines = ns.lines + ['│  ' ~ branch ~ ' ' ~ icon ~ ' ' ~ d.name] -%}
            {%- if d.backend | default('LOCAL') == 'S3' -%}
              {%- set detail = '☁ S3 · ' ~ (d.status | default('UNKNOWN')) -%}
            {%- elif d.total_bytes is defined and d.used_bytes is defined and d.total_bytes > 0 -%}
              {%- set used = (d.used_bytes / 1073741824) | round(1) | string -%}
              {%- set total = (d.total_bytes / 1073741824) | round(1) | string -%}
              {%- set pct = (100 * d.used_bytes / d.total_bytes) | round(1) | string -%}
              {%- set detail = used ~ '/' ~ total ~ ' GiB (' ~ pct ~ '%)' -%}
            {%- else -%}
              {%- set detail = d.status | default('UNKNOWN') -%}
            {%- endif -%}
            {%- set detail_prefix = '│  │  ' if not loop.last else '│     ' -%}
            {%- set ns.lines = ns.lines + [detail_prefix ~ '└─ ' ~ icon ~ ' ' ~ detail] -%}
          {%- endfor -%}
          {%- if not ds -%}
            {%- set ns.lines = ns.lines + ['│  └─ ⚪ Нет данных'] -%}
          {%- endif -%}
          {%- set ns.lines = ns.lines + ['├─ Группы резервных копий (' ~ (groups | count) ~ ')'] -%}
          {%- for g in groups[:group_limit] -%}
            {%- set icon = '🟢' if g.status == 'OK'
                else '🔴' if g.status in ['OVERDUE','NO_SNAPSHOT','UNAVAILABLE']
                else '⚪' -%}
            {%- set when = as_local(as_datetime(g.last_backup_at)).strftime('%d.%m %H:%M') if g.last_backup_at else '—' -%}
            {%- set status = '' if g.status == 'NOT_MONITORED' else ' · ' ~ g.status -%}
            {%- set count = (g.snapshot_count | string) if g.snapshot_count is not none else '?' -%}
            {%- set store_prefix = (g.datastore ~ '/') if (ds | count) > 1 else '' -%}
            {%- set name = store_prefix ~ (g.namespace ~ '/' if g.namespace else '') ~ g.group -%}
            {%- set branch = '└─' if loop.last and groups | count <= group_limit else '├─' -%}
            {%- set ns.lines = ns.lines + ['│  ' ~ branch ~ ' ' ~ icon ~ ' ' ~ name ~ ' · ' ~ count ~ ' коп. · ' ~ when ~ status] -%}
          {%- endfor -%}
          {%- if not groups -%}
            {%- set ns.lines = ns.lines + ['│  └─ ' ~ ('Нет копий' if coverage == 'COMPLETE' else '⚪ Нет достоверного списка')] -%}
          {%- elif groups | count > group_limit -%}
            {%- set ns.lines = ns.lines + ['│  └─ Ещё ' ~ ((groups | count) - group_limit) ~ ' групп'] -%}
          {%- endif -%}
          {%- if coverage != 'COMPLETE' -%}
            {%- set ns.lines = ns.lines + ['│  ⚠ Инвентаризация ' ~ coverage] -%}
          {%- endif -%}
          {%- set ns.lines = ns.lines + ['└─ Контроль свежести (' ~ (rules | count) ~ ')'] -%}
          {%- for b in rules[:8] -%}
            {%- set icon = '🟢' if b.status == 'OK' else '🔴' if b.status in ['OVERDUE','NO_SNAPSHOT'] else '⚪' -%}
            {%- set branch = '└─' if loop.last and (rules | count) <= 8 else '├─' -%}
            {%- set age = (b.age_hours ~ ' ч') if b.age_hours is not none else 'нет копии' -%}
            {%- set ns.lines = ns.lines + ['   ' ~ branch ~ ' ' ~ icon ~ ' ' ~ b.group ~ ' · ' ~ age ~ ' / ' ~ b.max_age_hours ~ ' ч · ' ~ b.status] -%}
          {%- endfor -%}
          {%- if not rules -%}
            {%- set ns.lines = ns.lines + ['   └─ Не настроен'] -%}
          {%- elif rules | count > 8 -%}
            {%- set ns.lines = ns.lines + ['   └─ Ещё ' ~ ((rules | count) - 8) ~ ' правил'] -%}
          {%- endif -%}
          <pre style="margin:0; padding:0; line-height:1.2; font-family:'Courier New',monospace; white-space:pre; overflow-x:auto;">{{ ns.lines | join('\n') }}</pre>
        grid_options:
          columns: 12
  - type: grid
    cards:
      - type: heading
        heading: Задания PBS
        heading_style: title
        icon: mdi:calendar-check
      - type: markdown
        content: |
          {%- set jobs = state_attr('sensor.dh_pbs_agent_health', 'maintenance_jobs') or [] -%}
          {%- set kinds = ['Push Sync','S3 Sync','Pull Sync','Verify','Prune','GC'] -%}
          {%- set shown_kinds = namespace(items=[]) -%}
          {%- for kind in kinds -%}
            {%- if jobs | selectattr('type', 'equalto', kind) | list | count > 0 -%}
              {%- set shown_kinds.items = shown_kinds.items + [kind] -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set ns = namespace(lines=['Задания PBS (' ~ (jobs | count) ~ ')']) -%}
          {%- for kind in shown_kinds.items -%}
            {%- set found = jobs | selectattr('type', 'equalto', kind) | list -%}
            {%- set kind_last = loop.last -%}
            {%- set type_branch = '└─' if kind_last else '├─' -%}
            {%- set type_indent = '   ' if kind_last else '│  ' -%}
            {%- set ns.lines = ns.lines + [type_branch ~ ' ' ~ kind ~ ' (' ~ (found | count) ~ ')'] -%}
            {%- for j in found -%}
              {%- set icon = '🟢' if j.status == 'OK'
                  else '🔴' if j.status in ['FAILED','UNAVAILABLE']
                  else '🟠' if j.status == 'NOT_CONFIGURED'
                  else '⚪' -%}
              {%- set when = as_local(as_datetime(j.last_run_at)).strftime('%d.%m %H:%M') if j.last_run_at else '—' -%}
              {%- set schedule = j.schedule or 'без расписания' -%}
              {%- set branch = '└─' if loop.last else '├─' -%}
              {%- set child_indent = '   ' if loop.last else '│  ' -%}
              {%- set ns.lines = ns.lines + [
                  type_indent ~ branch ~ ' 🕒 ' ~ schedule,
                  type_indent ~ child_indent ~ '└─ ' ~ icon ~ ' ' ~ j.id ~ ' · ' ~ j.status ~ ' · ' ~ when
                ] -%}
            {%- endfor -%}
          {%- endfor -%}
          {%- if not jobs -%}
            {%- set ns.lines = ns.lines + ['└─ ⚪ Заданий нет или данные недоступны'] -%}
          {%- endif -%}
          <pre style="margin:0; padding:0; line-height:1.2; font-family:'Courier New',monospace; white-space:pre; overflow-x:auto;">{{ ns.lines | join('\n') }}</pre>
        grid_options:
          columns: 12
      - type: markdown
        content: |
          {%- set events = state_attr('sensor.dh_pbs_agent_health', 'task_history') or [] -%}
          {%- set limits = state_attr('sensor.dh_pbs_agent_health', 'view_limits') or {} -%}
          {%- set event_limit = limits.task_events | default(10) | int -%}
          {%- set coverage = state_attr('sensor.dh_pbs_agent_health', 'task_history_status') or 'UNAVAILABLE' -%}
          {%- set ns = namespace(lines=['Последние выполнения PBS']) -%}
          {%- for e in events[:event_limit] -%}
            {%- set icon = '🟢' if e.status == 'OK'
                else '🔴' if e.status == 'FAILED'
                else '🟡' if e.status == 'RUNNING'
                else '⚪' -%}
            {%- set when = as_local(as_datetime(e.started_at)).strftime('%d.%m %H:%M') -%}
            {%- set duration = (e.duration_seconds ~ ' с') if e.duration_seconds is not none else '—' -%}
            {%- set branch = '└─' if loop.last and (events | count) <= event_limit else '├─' -%}
            {%- set ns.lines = ns.lines + [branch ~ ' ' ~ icon ~ ' ' ~ when ~ ' · ' ~ e.type ~ ' · ' ~ duration ~ ' · ' ~ e.status] -%}
          {%- endfor -%}
          {%- if not events -%}
            {%- set ns.lines = ns.lines + ['└─ ⚪ ' ~ ('Нет подходящих задач' if coverage == 'AVAILABLE' else 'История недоступна')] -%}
          {%- elif events | count > event_limit -%}
            {%- set ns.lines = ns.lines + ['└─ Ещё ' ~ ((events | count) - event_limit) ~ ' событий'] -%}
          {%- endif -%}
          <pre style="margin:0; padding:0; line-height:1.2; font-family:'Courier New',monospace; white-space:pre; overflow-x:auto;">{{ ns.lines | join('\n') }}</pre>
        grid_options:
          columns: 12
  - type: grid
    cards:
      - type: heading
        heading: Диагностика
        heading_style: title
        icon: mdi:information-outline
      - type: entities
        title: PBS Agent
        entities:
          - entity: sensor.dh_pbs_agent_hostname
          - entity: sensor.dh_pbs_agent_ip
          - entity: sensor.dh_pbs_agent_version
          - entity: switch.dh_pbs_agent_auto_update
            name: Автообновление
      - type: entities
        title: Настройки отображения
        entities:
          - entity: number.dh_pbs_agent_backup_groups_limit
            name: Групп резервных копий
          - entity: number.dh_pbs_agent_task_events_limit
            name: Последних событий
      - type: markdown
        content: |
          {% set errors = state_attr('sensor.dh_pbs_agent_health', 'errors') or [] %}
          **Ошибки сбора**
          {% if errors %}
          {% for error in errors %}
          - {{ error }}
          {% endfor %}
          {% else %}
          Ошибок сбора не зарегистрировано.
          {% endif %}
