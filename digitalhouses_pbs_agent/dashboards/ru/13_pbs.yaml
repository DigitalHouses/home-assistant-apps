# DH-View-Version: 0.1.18
# DH-View-Date: 2026-11-22
title: PBS
path: dh_pbs_agent
icon: mdi:backup-restore
type: sections
max_columns: 4
sections:
  - type: grid
    cards:
      - type: heading
        heading: Proxmox Backup Server
        heading_style: title
        icon: mdi:backup-restore
      - type: vertical-stack
        cards:
          - type: custom:button-card
            entity: sensor.dh_pbs_agent_card
            show_icon: true
            show_name: true
            show_label: true
            update_timer: |
              [[[
                return states['sensor.dh_pbs_agent_card']?.state === 'running' ? 100 : 5000;
              ]]]
            icon: |
              [[[
                const s = states['sensor.dh_pbs_agent_card']?.state;
                const newer = states['binary_sensor.dh_pbs_agent_update_available']?.state === 'on';
                return s === 'running' ? 'mdi:progress-clock'
                  : s === 'error' ? 'mdi:alert-circle'
                  : s === 'success' ? 'mdi:check-circle'
                  : newer ? 'mdi:package-up' : 'mdi:backup-restore';
              ]]]
            name: |
              [[[
                const installed = states['sensor.dh_pbs_agent_version']?.state;
                const latest = states['sensor.dh_pbs_agent_latest_version']?.state;
                const status = states['sensor.dh_pbs_agent_card'];
                const a = status?.attributes || {};
                const valid = (v) =>
                  typeof v === 'string' && !['unknown','unavailable','none',''].includes(v);
                const installing = a.operation === 'install' &&
                  ['running','success','error'].includes(status?.state);
                const source = installing && valid(a.from_version) ? a.from_version : installed;
                const target = installing && valid(a.target_version) ? a.target_version : latest;
                const verified = installing ||
                  states['binary_sensor.dh_pbs_agent_update_available']?.state === 'on';
                const upgrade = verified && valid(source) && valid(target) && source !== target;
                return 'PBS Agent' + (valid(source)
                  ? ' · v' + source + (upgrade ? ' → v' + target : '')
                  : '');
              ]]]
            label: |
              [[[
                const item = states['sensor.dh_pbs_agent_card'];
                if (!item || ['unknown','unavailable'].includes(item.state)) {
                  return 'Нет связи с агентом';
                }
                const a = item.attributes || {};
                const operation = a.operation;
                const names = {
                  refresh: 'Обновление данных',
                  check: 'Проверка версии',
                  install: 'Установка версии',
                  restart: 'Перезапуск агента'
                };
                const duration = (value) =>
                  typeof value === 'number'
                    ? value.toFixed(1).replace('.', ',') + ' сек'
                    : '—';
                const valid = (v) =>
                  typeof v === 'string' && !['unknown','unavailable','none',''].includes(v);
                const versions = operation === 'install' &&
                  valid(a.from_version) && valid(a.target_version)
                  ? ' · v' + a.from_version + ' → v' + a.target_version : '';
                if (item.state === 'running') {
                  const start = Date.parse(a.started_at || '');
                  if (!Number.isFinite(start)) return (names[operation] || 'Операция') + versions + '…';
                  const tenths = Math.max(0, Math.floor((Date.now() - start) / 100));
                  const mm = String(Math.floor(tenths / 600)).padStart(2, '0');
                  const ss = String(Math.floor((tenths % 600) / 10)).padStart(2, '0');
                  return (names[operation] || 'Операция') + versions +
                    '… ' + mm + ':' + ss + ',' + (tenths % 10);
                }
                if (item.state === 'error') {
                  return 'Ошибка' + versions + ': ' + (a.error || 'операция не выполнена');
                }
                if (item.state === 'success') {
                  let message = {
                    refresh: 'Обновлено',
                    check: 'Версия проверена',
                    install: 'Версия установлена',
                    restart: 'Агент перезапущен'
                  }[operation] || 'Готово';
                  if (operation === 'check') {
                    const available = states['binary_sensor.dh_pbs_agent_update_available']?.state;
                    message = available === 'on' ? 'Доступна новая версия'
                      : available === 'off' ? 'Версия актуальна' : 'Проверка завершена';
                  }
                  return message + versions + ' · ' + duration(a.duration_seconds);
                }
                if (states['binary_sensor.dh_pbs_agent_update_available']?.state === 'on') {
                  const current = states['sensor.dh_pbs_agent_version']?.state;
                  const latest = states['sensor.dh_pbs_agent_latest_version']?.state;
                  const change = valid(current) && valid(latest) && current !== latest
                    ? ' · v' + current + ' → v' + latest : '';
                  return 'Доступна новая версия' + change;
                }
                const ts = Date.parse(a.last_collection_at || '');
                if (!Number.isFinite(ts)) return 'Ожидание данных';
                const seconds = Math.max(0, Math.floor((Date.now() - ts) / 1000));
                if (seconds < 60) return 'Обновлено ' + seconds + ' сек назад';
                const minutes = Math.floor(seconds / 60);
                if (minutes < 60) return 'Обновлено ' + minutes + ' мин назад';
                const hours = Math.floor(minutes / 60);
                if (hours < 24) return 'Обновлено ' + hours + ' ч назад';
                return 'Обновлено ' + Math.floor(hours / 24) + ' д назад';
              ]]]
            styles:
              card:
                - padding: 12px
                - text-align: left
              grid:
                - grid-template-areas: '"i n" "i l"'
                - grid-template-columns: 48px 1fr
                - grid-template-rows: min-content min-content
              img_cell:
                - width: 40px
                - justify-content: start
              icon:
                - width: 26px
                - color: |
                    [[[
                      const s = states['sensor.dh_pbs_agent_card']?.state;
                      return s === 'error' ? 'var(--error-color)'
                        : s === 'running' ? 'var(--info-color, var(--primary-color))'
                        : s === 'success' ? 'var(--success-color, var(--primary-color))'
                        : states['binary_sensor.dh_pbs_agent_update_available']?.state === 'on'
                        ? 'var(--warning-color, orange)' : 'var(--success-color, var(--primary-color))';
                    ]]]
              name:
                - justify-self: start
                - font-size: 14px
                - font-weight: 600
              label:
                - justify-self: start
                - white-space: normal
                - text-align: left
                - font-size: 13px
                - color: var(--secondary-text-color)
            tap_action:
              action: none
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:refresh
                content: Обновить
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.dh_pbs_agent_refresh
              - type: template
                icon: mdi:cloud-search
                content: Версия
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.dh_pbs_agent_check_updates
              - type: conditional
                conditions:
                  - entity: binary_sensor.dh_pbs_agent_update_available
                    state: 'on'
                chip:
                  type: template
                  icon: mdi:package-down
                  icon_color: orange
                  content: >-
                    {% set installed = states('sensor.dh_pbs_agent_version') %}
                    {% set latest = states('sensor.dh_pbs_agent_latest_version') %}
                    {% if installed not in ['unknown','unavailable','none','']
                          and latest not in ['unknown','unavailable','none','']
                          and installed != latest %}
                      Новая версия · v{{ installed }} → v{{ latest }}
                    {% else %}
                      Новая версия
                    {% endif %}
                  tap_action:
                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.dh_pbs_agent_update
                    confirmation:
                      text: Установить новый релиз PBS Agent? Мониторинг временно прервётся, сам PBS и резервные копии не перезапускаются.
              - type: template
                icon: mdi:restart
                content: Перезапуск
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.dh_pbs_agent_restart_agent
                  confirmation:
                    text: Перезапустить только PBS Agent? Сам PBS и задания резервирования продолжат работу.
        grid_options:
          columns: 12
      - type: entities
        title: Состояние PBS
        entities:
          - entity: sensor.dh_pbs_agent_health
            name: Состояние
          - entity: binary_sensor.dh_pbs_agent_problem
            name: Есть проблемы
          - entity: sensor.dh_pbs_agent_last_collection
            name: Последний сбор
          - entity: sensor.dh_pbs_agent_zfs_pool_health
            name: ZFS
      - type: markdown
        content: |
          <pre style="margin:0; padding:0; line-height:1.2; white-space:pre-wrap;">{{ state_attr('sensor.dh_pbs_agent_summary_tree', 'text') or 'Ожидание данных PBS Agent…' }}</pre>
  - type: grid
    cards:
      - type: heading
        heading: Хранилища PBS
        heading_style: title
        icon: mdi:database
      - type: custom:auto-entities
        show_empty: false
        unique: true
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          template: |-
            {% set ns = namespace(items=[]) %}
            {% for storage in states.sensor | sort(attribute='entity_id') %}
              {% if state_attr(storage.entity_id, 'pbs_product') == 'digitalhouses_pbs_agent'
                  and state_attr(storage.entity_id, 'pbs_section') == 'datastore'
                  and state_attr(storage.entity_id, 'pbs_metric') == 'used_percent' %}
                {% set entity = storage.entity_id %}
                {% set color = state_attr(entity, 'card_color') or 'grey' %}
                {% set ns.items = ns.items + [{
                  'type': 'custom:entity-progress-card-template',
                  'entity': entity,
                  'name': state_attr(entity, 'card_name') or storage.name,
                  'secondary': state_attr(entity, 'card_secondary') or '',
                  'percent': state_attr(entity, 'card_percent') or 0,
                  'icon': state_attr(entity, 'card_icon') or 'mdi:database',
                  'color': color,
                  'bar_color': color,
                  'bar_size': 'medium',
                  'tap_action': {'action': 'more-info'}
                }] %}
              {% endif %}
            {% endfor %}
            {{- ns.items -}}
        sort:
          method: entity_id
        grid_options:
          columns: 12
      - type: heading
        heading: Резервные копии
        heading_style: subtitle
        icon: mdi:backup-restore
      - type: markdown
        content: |
          <pre style="margin:0; padding:0; line-height:1.2; font-family:'Courier New',monospace; white-space:pre; overflow-x:auto;">{{ state_attr('sensor.dh_pbs_agent_backup_tree', 'text') or 'Ожидание данных PBS Agent…' }}</pre>
        grid_options:
          columns: 12
      - type: heading
        heading: Занято на диске PBS · 30 дней
        heading_style: title
        icon: mdi:chart-bar
      - type: custom:button-card
        entity: sensor.dh_pbs_agent_usage_chart
        show_icon: false
        show_name: false
        show_state: false
        show_label: false
        show_entity_picture: false
        tap_action:
          action: none
        custom_fields:
          chart: |
            [[[
              return entity?.attributes?.html || 'Ожидание истории PBS Agent…';
            ]]]
        styles:
          card:
            - padding: 12px
            - width: 100%
          grid:
            - grid-template-areas: '"chart"'
            - grid-template-columns: minmax(0, 1fr)
            - grid-template-rows: min-content
          custom_fields:
            chart:
              - display: block
              - overflow: hidden
              - width: 100%
              - text-align: left
        grid_options:
          columns: 12
  - type: grid
    cards:
      - type: heading
        heading: Задания PBS
        heading_style: title
        icon: mdi:calendar-check
      - type: markdown
        content: |
          <pre style="margin:0; padding:0; line-height:1.2; font-family:'Courier New',monospace; white-space:pre; overflow-x:auto;">{{ state_attr('sensor.dh_pbs_agent_jobs_tree', 'text') or 'Ожидание данных PBS Agent…' }}</pre>
        grid_options:
          columns: 12
      - type: markdown
        content: |
          <pre style="margin:0; padding:0; line-height:1.2; font-family:'Courier New',monospace; white-space:pre; overflow-x:auto;">{{ state_attr('sensor.dh_pbs_agent_history_tree', 'text') or 'Ожидание данных PBS Agent…' }}</pre>
        grid_options:
          columns: 12
  - type: grid
    cards:
      - type: heading
        heading: Диагностика
        heading_style: title
        icon: mdi:information-outline
      - type: entities
        title: PBS Agent
        entities:
          - entity: sensor.dh_pbs_agent_hostname
          - entity: sensor.dh_pbs_agent_ip
          - entity: sensor.dh_pbs_agent_version
          - entity: sensor.dh_pbs_agent_ha_timezone
            name: Часовой пояс Home Assistant
          - entity: sensor.dh_pbs_agent_upload_stats
            name: Передано за задания (доступна статистика)
          - entity: switch.dh_pbs_agent_auto_update
            name: Автообновление
      - type: entities
        title: Настройки отображения
        entities:
          - entity: number.dh_pbs_agent_backup_groups_limit
            name: Групп резервных копий
          - entity: number.dh_pbs_agent_task_events_limit
            name: Последних событий
      - type: markdown
        content: |
          {% set errors = state_attr('sensor.dh_pbs_agent_health', 'errors') or [] %}
          **Ошибки сбора**
          {% if errors %}
          {% for error in errors %}
          - {{ error }}
          {% endfor %}
          {% else %}
          Ошибок сбора не зарегистрировано.
          {% endif %}
