# DH-View-Version: 0.1.7
# DH-View-Date: 2026-11-22
title: PBS
path: dh_pbs_agent
icon: mdi:backup-restore
type: sections
max_columns: 4
sections:
  - type: grid
    cards:
      - type: heading
        heading: Proxmox Backup Server
        heading_style: title
        icon: mdi:backup-restore
      - type: custom:auto-entities
        show_empty: false
        unique: true
        card:
          type: entities
          title: Состояние PBS
        filter:
          include:
            - attributes:
                pbs_product: digitalhouses_pbs_agent
                pbs_metric: health
              options:
                name: Состояние
            - attributes:
                pbs_product: digitalhouses_pbs_agent
                pbs_metric: problem
              options:
                name: Есть проблемы
            - attributes:
                pbs_product: digitalhouses_pbs_agent
                pbs_metric: last_collection
              options:
                name: Последний сбор
            - attributes:
                pbs_product: digitalhouses_pbs_agent
                pbs_metric: zfs_pool_health
              options:
                name: ZFS
      - type: markdown
        content: |
          {%- set pbs_health = states.sensor
              | selectattr('attributes.pbs_product', 'equalto', 'digitalhouses_pbs_agent')
              | selectattr('attributes.pbs_section', 'equalto', 'health')
              | list -%}
          {%- set health_entity = pbs_health[0].entity_id if pbs_health else 'sensor.dh_pbs_agent_health' -%}
          {% set a = state_attr(health_entity, 'summary') or {} %}
          **Сводка PBS**

          {% if a %}
          Datastore: {{ a.datastore_count }}

          Правил резервирования: {{ a.freshness_rules }}

          Push Sync: {{ a.push_jobs }}

          Verify: {{ a.verify_jobs }} · Prune: {{ a.prune_jobs }}

          Активных проблем: {{ a.active_problems }}
          {% else %}
          Ожидание достоверных данных.
          {% endif %}
  - type: grid
    cards:
      - type: heading
        heading: Datastore и резервные копии
        heading_style: title
        icon: mdi:database
      - type: markdown
        content: |
          {%- set pbs_health = states.sensor
              | selectattr('attributes.pbs_product', 'equalto', 'digitalhouses_pbs_agent')
              | selectattr('attributes.pbs_section', 'equalto', 'health')
              | list -%}
          {%- set health_entity = pbs_health[0].entity_id if pbs_health else 'sensor.dh_pbs_agent_health' -%}
          {%- set ds = state_attr(health_entity, 'datastores') or [] -%}
          {%- set groups = state_attr(health_entity, 'backup_groups') or [] -%}
          {%- set rules = state_attr(health_entity, 'backups') or [] -%}
          {%- set coverage = state_attr(health_entity, 'backup_groups_status') or 'UNAVAILABLE' -%}
          {%- set limits = state_attr(health_entity, 'view_limits') or {} -%}
          {%- set group_limit = limits.backup_groups | default(10) | int -%}
          {%- set ns = namespace(lines=['PBS', '├─ Datastore (' ~ (ds | count) ~ ')']) -%}
          {%- for d in ds -%}
            {%- set icon = '🟢' if d.health == 'HEALTHY'
                else '🟠' if d.health == 'DEGRADED'
                else '🔴' if d.health in ['CRITICAL', 'UNAVAILABLE']
                else '⚪' -%}
            {%- set branch = '└─' if loop.last else '├─' -%}
            {%- set ns.lines = ns.lines + ['│  ' ~ branch ~ ' ' ~ icon ~ ' ' ~ d.name] -%}
            {%- if d.backend | default('LOCAL') == 'S3' -%}
              {%- set detail = '☁ S3 · ' ~ (d.status | default('UNKNOWN')) -%}
            {%- elif d.total_bytes is defined and d.available_bytes is defined and d.total_bytes > 0 -%}
              {%- set free = (d.available_bytes / 1073741824) | round(1) | string -%}
              {%- set total = (d.total_bytes / 1073741824) | round(1) | string -%}
              {%- set pct = (100 * d.available_bytes / d.total_bytes) | round(1) | string -%}
              {%- set detail = free ~ '/' ~ total ~ ' GiB (' ~ pct ~ '%)' -%}
            {%- else -%}
              {%- set detail = d.status | default('UNKNOWN') -%}
            {%- endif -%}
            {%- set ns.lines = ns.lines + ['│       └─ ' ~ icon ~ ' ' ~ detail] -%}
          {%- endfor -%}
          {%- if not ds -%}
            {%- set ns.lines = ns.lines + ['│  └─ ⚪ Нет данных'] -%}
          {%- endif -%}
          {%- set ns.lines = ns.lines + ['├─ Группы резервных копий (' ~ (groups | count) ~ ')'] -%}
          {%- for g in groups[:group_limit] -%}
            {%- set icon = '🟢' if g.status == 'OK'
                else '🔴' if g.status in ['OVERDUE','NO_SNAPSHOT','UNAVAILABLE']
                else '⚪' -%}
            {%- set when = as_local(as_datetime(g.last_backup_at)).strftime('%d.%m %H:%M') if g.last_backup_at else '—' -%}
            {%- set status = '' if g.status == 'NOT_MONITORED' else ' · ' ~ g.status -%}
            {%- set count = (g.snapshot_count | string) if g.snapshot_count is not none else '?' -%}
            {%- set name = (g.namespace ~ '/' if g.namespace else '') ~ g.group -%}
            {%- set branch = '└─' if loop.last and groups | count <= group_limit else '├─' -%}
            {%- set ns.lines = ns.lines + ['│  ' ~ branch ~ ' ' ~ icon ~ ' ' ~ name ~ ' · ' ~ count ~ ' коп. · ' ~ when ~ status] -%}
          {%- endfor -%}
          {%- if not groups -%}
            {%- set ns.lines = ns.lines + ['│  └─ ' ~ ('Нет копий' if coverage == 'COMPLETE' else '⚪ Нет достоверного списка')] -%}
          {%- elif groups | count > group_limit -%}
            {%- set ns.lines = ns.lines + ['│  └─ Ещё ' ~ ((groups | count) - group_limit) ~ ' групп'] -%}
          {%- endif -%}
          {%- if coverage != 'COMPLETE' -%}
            {%- set ns.lines = ns.lines + ['│  ⚠ Инвентаризация ' ~ coverage] -%}
          {%- endif -%}
          {%- set ns.lines = ns.lines + ['└─ Контроль свежести (' ~ (rules | count) ~ ')'] -%}
          {%- for b in rules[:8] -%}
            {%- set icon = '🟢' if b.status == 'OK' else '🔴' if b.status in ['OVERDUE','NO_SNAPSHOT'] else '⚪' -%}
            {%- set branch = '└─' if loop.last and (rules | count) <= 8 else '├─' -%}
            {%- set age = (b.age_hours ~ ' ч') if b.age_hours is not none else 'нет копии' -%}
            {%- set ns.lines = ns.lines + ['   ' ~ branch ~ ' ' ~ icon ~ ' ' ~ b.group ~ ' · ' ~ age ~ ' / ' ~ b.max_age_hours ~ ' ч · ' ~ b.status] -%}
          {%- endfor -%}
          {%- if not rules -%}
            {%- set ns.lines = ns.lines + ['   └─ Не настроен'] -%}
          {%- elif rules | count > 8 -%}
            {%- set ns.lines = ns.lines + ['   └─ Ещё ' ~ ((rules | count) - 8) ~ ' правил'] -%}
          {%- endif -%}
          <pre style="margin:0; padding:0; line-height:1.2; font-family:'Courier New',monospace; white-space:pre; overflow-x:auto;">{{ ns.lines | join('\n') }}</pre>
        grid_options:
          columns: 12
  - type: grid
    cards:
      - type: heading
        heading: Задания PBS
        heading_style: title
        icon: mdi:calendar-check
      - type: markdown
        content: |
          {%- set pbs_health = states.sensor
              | selectattr('attributes.pbs_product', 'equalto', 'digitalhouses_pbs_agent')
              | selectattr('attributes.pbs_section', 'equalto', 'health')
              | list -%}
          {%- set health_entity = pbs_health[0].entity_id if pbs_health else 'sensor.dh_pbs_agent_health' -%}
          {%- set jobs = state_attr(health_entity, 'maintenance_jobs') or [] -%}
          {%- set kinds = ['Push Sync','S3 Sync','Pull Sync','Verify','Prune','GC'] -%}
          {%- set shown_kinds = namespace(items=[]) -%}
          {%- for kind in kinds -%}
            {%- if jobs | selectattr('type', 'equalto', kind) | list | count > 0 -%}
              {%- set shown_kinds.items = shown_kinds.items + [kind] -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set ns = namespace(lines=['Задания PBS (' ~ (jobs | count) ~ ')']) -%}
          {%- for kind in shown_kinds.items -%}
            {%- set found = jobs | selectattr('type', 'equalto', kind) | list -%}
            {%- set kind_last = loop.last -%}
            {%- set type_branch = '└─' if kind_last else '├─' -%}
            {%- set type_indent = '   ' if kind_last else '│  ' -%}
            {%- set ns.lines = ns.lines + [type_branch ~ ' ' ~ kind ~ ' (' ~ (found | count) ~ ')'] -%}
            {%- for j in found -%}
              {%- set icon = '🟢' if j.status == 'OK'
                  else '🔴' if j.status in ['FAILED','UNAVAILABLE']
                  else '🟠' if j.status == 'NOT_CONFIGURED'
                  else '⚪' -%}
              {%- set when = as_local(as_datetime(j.last_run_at)).strftime('%d.%m %H:%M') if j.last_run_at else '—' -%}
              {%- set schedule = j.schedule or 'без расписания' -%}
              {%- set branch = '└─' if loop.last else '├─' -%}
              {%- set child_indent = '   ' if loop.last else '│  ' -%}
              {%- set ns.lines = ns.lines + [
                  type_indent ~ branch ~ ' 🕒 ' ~ schedule,
                  type_indent ~ child_indent ~ '└─ ' ~ icon ~ ' ' ~ j.id ~ ' · ' ~ j.status ~ ' · ' ~ when
                ] -%}
            {%- endfor -%}
          {%- endfor -%}
          {%- if not jobs -%}
            {%- set ns.lines = ns.lines + ['└─ ⚪ Заданий нет или данные недоступны'] -%}
          {%- endif -%}
          <pre style="margin:0; padding:0; line-height:1.2; font-family:'Courier New',monospace; white-space:pre; overflow-x:auto;">{{ ns.lines | join('\n') }}</pre>
        grid_options:
          columns: 12
      - type: markdown
        content: |
          {%- set pbs_health = states.sensor
              | selectattr('attributes.pbs_product', 'equalto', 'digitalhouses_pbs_agent')
              | selectattr('attributes.pbs_section', 'equalto', 'health')
              | list -%}
          {%- set health_entity = pbs_health[0].entity_id if pbs_health else 'sensor.dh_pbs_agent_health' -%}
          {%- set events = state_attr(health_entity, 'task_history') or [] -%}
          {%- set limits = state_attr(health_entity, 'view_limits') or {} -%}
          {%- set event_limit = limits.task_events | default(10) | int -%}
          {%- set coverage = state_attr(health_entity, 'task_history_status') or 'UNAVAILABLE' -%}
          {%- set ns = namespace(lines=['Последние выполнения PBS']) -%}
          {%- for e in events[:event_limit] -%}
            {%- set icon = '🟢' if e.status == 'OK'
                else '🔴' if e.status == 'FAILED'
                else '🟡' if e.status == 'RUNNING'
                else '⚪' -%}
            {%- set when = as_local(as_datetime(e.started_at)).strftime('%d.%m %H:%M') -%}
            {%- set duration = (e.duration_seconds ~ ' с') if e.duration_seconds is not none else '—' -%}
            {%- set branch = '└─' if loop.last and (events | count) <= event_limit else '├─' -%}
            {%- set ns.lines = ns.lines + [branch ~ ' ' ~ icon ~ ' ' ~ when ~ ' · ' ~ e.type ~ ' · ' ~ duration ~ ' · ' ~ e.status] -%}
          {%- endfor -%}
          {%- if not events -%}
            {%- set ns.lines = ns.lines + ['└─ ⚪ ' ~ ('Нет подходящих задач' if coverage == 'AVAILABLE' else 'История недоступна')] -%}
          {%- elif events | count > event_limit -%}
            {%- set ns.lines = ns.lines + ['└─ Ещё ' ~ ((events | count) - event_limit) ~ ' событий'] -%}
          {%- endif -%}
          <pre style="margin:0; padding:0; line-height:1.2; font-family:'Courier New',monospace; white-space:pre; overflow-x:auto;">{{ ns.lines | join('\n') }}</pre>
        grid_options:
          columns: 12
  - type: grid
    cards:
      - type: heading
        heading: Диагностика
        heading_style: title
        icon: mdi:information-outline
      - type: custom:auto-entities
        show_empty: false
        unique: true
        card:
          type: entities
          title: PBS Agent
        filter:
          include:
            - attributes:
                pbs_product: digitalhouses_pbs_agent
                pbs_metric: hostname
            - attributes:
                pbs_product: digitalhouses_pbs_agent
                pbs_metric: ip
            - attributes:
                pbs_product: digitalhouses_pbs_agent
                pbs_metric: version
      - type: custom:auto-entities
        show_empty: false
        unique: true
        card:
          type: entities
          title: Настройки отображения
        filter:
          include:
            - entity_id: "number.dh_pbs_agent_*_limit"
              device_model: PBS Agent
      - type: markdown
        content: |
          {%- set pbs_health = states.sensor
              | selectattr('attributes.pbs_product', 'equalto', 'digitalhouses_pbs_agent')
              | selectattr('attributes.pbs_section', 'equalto', 'health')
              | list -%}
          {%- set health_entity = pbs_health[0].entity_id if pbs_health else 'sensor.dh_pbs_agent_health' -%}
          {% set errors = state_attr(health_entity, 'errors') or [] %}
          **Ошибки сбора**
          {% if errors %}
          {% for error in errors %}
          - {{ error }}
          {% endfor %}
          {% else %}
          Ошибок сбора не зарегистрировано.
          {% endif %}
