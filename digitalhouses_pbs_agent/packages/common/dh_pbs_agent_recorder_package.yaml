# DigitalHouses PBS Agent — Home Assistant Recorder.
# Managed by DH Sync; applicable to every local PBS datastore/installation.
#
# Record only the numeric capacity time series used by the native
# statistics-graph. Do not record rich backup/task trees or MQTT events.
# Recorder database settings (db_url, purge_keep_days, etc.) remain owned
# by Home Assistant and existing configuration.
#
# After DH Sync installs this package, restart Home Assistant to apply
# the Recorder entity filter. HA long-term statistics accumulate thereafter.
dh_pbs_agent_recorder_package:
  recorder:
    include:
      entity_globs:
        - sensor.dh_pbs_agent_datastore_*_used_gib
