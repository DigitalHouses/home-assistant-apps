configuration:
  database_type:
    name: Database type
    description: Recorder database engine used by Home Assistant.
  postgresql:
    name: PostgreSQL
    description: Manual PostgreSQL Recorder database connection.
  postgresql.host:
    name: Host
    description: PostgreSQL server hostname or IP address.
  postgresql.port:
    name: Port
    description: PostgreSQL server port.
  postgresql.database:
    name: Database
    description: Recorder database name.
  postgresql.username:
    name: Username
    description: PostgreSQL username.
  postgresql.password:
    name: Password
    description: PostgreSQL password.
  mariadb:
    name: MariaDB
    description: MariaDB Recorder database connection.
  mariadb.connection:
    name: Connection mode
    description: Use the Supervisor MySQL service or a manual MariaDB connection.
  mariadb.host:
    name: Host
    description: MariaDB server hostname or IP address for manual mode.
  mariadb.port:
    name: Port
    description: MariaDB server port for manual mode.
  mariadb.database:
    name: Database
    description: Recorder database name.
  mariadb.username:
    name: Username
    description: MariaDB username for manual mode.
  mariadb.password:
    name: Password
    description: MariaDB password for manual mode.
  storage:
    name: Storage monitoring
    description: Monitor free disk space and disk usage for the Recorder database storage.
  storage.source:
    name: Storage source
    description: Automatic uses the HAOS data disk for Supervisor MariaDB and SSH when external DB SSH credentials are supplied. SSH forces remote monitoring. Disabled turns storage monitoring off.
  storage.ssh_host:
    name: SSH host
    description: Optional SSH hostname or IP address. Leave empty to use the database host.
  storage.ssh_port:
    name: SSH port
    description: SSH server port.
  storage.ssh_username:
    name: SSH username
    description: Linux user on the external database host. No sudo access is required.
  storage.ssh_password:
    name: SSH password
    description: Password for the Linux SSH user.
  storage.path:
    name: Filesystem path
    description: Optional manual path override. Leave empty and the App will detect an accessible database storage path automatically over SQL/SSH, with / as the final fallback.
  publish_interval_minutes:
    name: Publish interval, min
    description: Interval in minutes between MQTT state publications and Recorder health checks.
  recorder_stale_seconds:
    name: Recorder stale threshold
    description: Maximum age in seconds of the newest state before DB recorder writing is reported as off.
  timezone:
    name: Timezone
    description: Optional IANA timezone for previous-day boundaries, for example Asia/Almaty. Leave empty to use the container timezone or UTC fallback.
  log_level:
    name: Log level
    description: Application logging verbosity.
