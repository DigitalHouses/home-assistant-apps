name: DigitalHouses DB Monitoring
version: 0.1.4
slug: digitalhouses_db_monitoring
description: Monitor Home Assistant Recorder database health and key metrics through MQTT Discovery.
url: https://github.com/DigitalHouses/home-assistant-apps/tree/main/digitalhouses_db_monitoring
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
stage: stable
backup: hot
hassio_api: true
hassio_role: default
services:
  - mqtt:need
  - mysql:want
options:
  database_type: postgresql
  postgresql:
    host: ""
    port: 5432
    database: homeassistant
    username: ""
    password: ""
  mariadb:
    connection: supervisor
    host: ""
    port: 3306
    database: homeassistant
    username: ""
    password: ""
  storage:
    source: automatic
    ssh_host: ""
    ssh_port: 22
    ssh_username: ""
    ssh_password: ""
    path: ""
  publish_interval_minutes: 1
  recorder_stale_seconds: 300
  timezone: ""
  log_level: info
schema:
  database_type: list(postgresql|mariadb)
  postgresql:
    host: str
    port: port
    database: str
    username: str
    password: password
  mariadb:
    connection: list(supervisor|manual)
    host: str
    port: port
    database: str
    username: str
    password: password
  storage:
    source: list(automatic|ssh|disabled)
    ssh_host: str
    ssh_port: port
    ssh_username: str
    ssh_password: password
    path: str
  publish_interval_minutes: int(1,60)
  recorder_stale_seconds: int(30,86400)
  timezone: str
  log_level: list(debug|info|warning|error)
