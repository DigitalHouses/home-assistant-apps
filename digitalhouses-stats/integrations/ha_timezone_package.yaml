# Install only on the designated CORE HA, using the existing CORE MQTT broker.
# now().tzinfo is resolved from Home Assistant's own configured IANA timezone.
dh_stats_ha_timezone_package:
  automation:
    - id: dh_stats_publish_ha_timezone
      alias: "DigitalHouses Stats · Publish HA timezone"
      mode: restart
      triggers:
        - trigger: homeassistant
          event: start
        - trigger: event
          event_type: core_config_updated
        - trigger: event
          event_type: automation_reloaded
        - trigger: mqtt
          topic: homeassistant/status
          payload: online
      actions:
        - action: mqtt.publish
          data:
            topic: DigitalHouses/Global/ha/timezone/state
            payload: "{{ now().tzinfo }}"
            qos: 1
            retain: true
