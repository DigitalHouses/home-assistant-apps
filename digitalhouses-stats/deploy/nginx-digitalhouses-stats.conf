server {
    listen 192.168.11.254:80;
    server_name _;

    access_log off;
    server_tokens off;

    root /var/www/digitalhouses-stats;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "private, max-age=3600";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081/v1/stats/;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8081/healthz;
        proxy_set_header Host localhost;
    }
}
