<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DH Actions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1>DigitalHouses Actions App</h1>
      <small>Физические и логические клавиши · <span id="app-version">v…</span></small>
    </div>
    <nav aria-label="Разделы приложения">
      <button id="devices-nav" class="active" type="button">Клавиши</button>
      <button id="sensors-nav" type="button">Датчики</button>
      <button id="schedules-nav" type="button">Расписания</button>
      <button id="lights-nav" type="button">Lights</button>
      <button id="parameters-nav" type="button">Параметры</button>
    </nav>
    <div class="header-tools">
      <button id="scan" type="button">⟳ Сканировать</button>
      <button id="export" type="button">Сохранить</button>
      <button id="import" type="button">Загрузить</button>
      <input id="import-file" type="file" accept=".json,application/json" hidden>
      <button id="view-json" type="button">JSON</button>
      <button id="toggle-log" type="button" aria-expanded="false">LOG</button>
    </div>
  </header>
  <div class="workspace" id="workspace">
  <main>
    <div class="devices-tools"><h2 id="summary">Клавиши (—)</h2><label id="lights-filter" hidden><input id="smart-lights-only" type="checkbox" checked> Только умные светильники</label></div>
    <div id="notice" class="scan-notice" role="status" aria-live="polite"></div>
    <section id="main">Загрузка…</section>
  </main>
  <aside id="log-panel" hidden aria-label="Журнал нажатий">
    <div class="log-header"><strong>LOG</strong><small id="log-info">Подключение…</small><button id="export-log" type="button" title="Выгрузить весь журнал в JSON">Выгрузить</button></div>
    <div class="log-legend">✓ отправлено · ✓✓ подтверждение · ⚠ нет подтверждения</div>
    <div id="log-scroll"><div id="log-rows"></div></div>
  </aside>
  </div>
  <dialog id="json-dialog">
    <div class="head"><h2>JSON привязок</h2><button id="json-close" type="button">Закрыть</button></div>
    <textarea id="json-text" readonly spellcheck="false" aria-label="JSON привязок"></textarea>
    <div class="toolbar"><button id="json-copy" type="button">Копировать</button><small id="json-status" role="status"></small></div>
  </dialog>
  <script src="entity_picker.js"></script>
  <script src="app.js"></script>
</body>
</html>
