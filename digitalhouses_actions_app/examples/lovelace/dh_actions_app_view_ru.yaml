type: sections
max_columns: 4
title: actions
path: actions
icon: mdi:light-switch
sections:
- type: grid
  column_span: 1
  cards:
  - type: vertical-stack
    cards:
    - type: custom:button-card
      entity: sensor.dh_actions_app_card
      triggers_update:
      - sensor.dh_actions_app_card
      - sensor.dh_actions_app_version
      - sensor.dh_actions_app_latest_version
      - binary_sensor.dh_actions_app_update_available
      - sensor.dh_actions_app_problems
      - update.digitalhouses_actions_app_update
      update_timer: |
        [[[
          const s = states['sensor.dh_actions_app_card']?.state;
          const updating =
            states['update.digitalhouses_actions_app_update']?.attributes?.in_progress === true;
          return s === 'running' || updating ? 1000 : 5000;
        ]]]
      show_icon: true
      show_name: true
      show_label: true
      icon: |
        [[[
          const s = states['sensor.dh_actions_app_card']?.state;
          const health = states['sensor.dh_actions_app_problems']?.state;
          const problems = Number(states['sensor.dh_actions_app_problems']?.attributes?.count ?? -1);
          const upgrade =
            states['binary_sensor.dh_actions_app_update_available']?.state === 'on';
          const updating =
            states['update.digitalhouses_actions_app_update']?.attributes?.in_progress === true;

          if (updating || s === 'running') return 'mdi:progress-clock';
          if (s === 'error' || ['unknown','unavailable'].includes(s) || !s) return 'mdi:alert-circle';
          if (s === 'success') return 'mdi:check-circle';
          if (health === 'unavailable') return 'mdi:lan-disconnect';
          if (Number.isFinite(problems) && problems > 0) return 'mdi:alert-circle';
          if (upgrade) return 'mdi:package-up';
          return 'mdi:light-switch';
        ]]]
      name: |
        [[[
          const installed = states['sensor.dh_actions_app_version']?.state;
          const latest = states['sensor.dh_actions_app_latest_version']?.state;
          const available =
            states['binary_sensor.dh_actions_app_update_available']?.state === 'on';
          const valid = (v) =>
            typeof v === 'string'
            && /^\d+\.\d+\.\d+$/.test(v);
          const upgrade =
            available && valid(installed) && valid(latest) && latest !== installed;

          return 'Actions App' + (valid(installed)
            ? ' · v' + installed + (upgrade ? ' → v' + latest : '')
            : '');
        ]]]
      label: |
        [[[
          const item = states['sensor.dh_actions_app_card'];
          const health = states['sensor.dh_actions_app_problems']?.state;
          const problems = Number(states['sensor.dh_actions_app_problems']?.attributes?.count ?? -1);
          const supervisorUpdate = states['update.digitalhouses_actions_app_update'];

          const elapsedText = (since) => {
            const seconds = Math.max(
              0,
              Math.floor((performance.now() - since) / 1000)
            );
            const mm = String(Math.floor(seconds / 60)).padStart(2, '0');
            const ss = String(seconds % 60).padStart(2, '0');
            return mm + ':' + ss;
          };
          const duration = (value) => {
            if (typeof value !== 'number') return '—';
            const seconds = Math.round(Math.max(0, value));
            const minutes = Math.floor(seconds / 60);
            return minutes
              ? minutes + ' мин ' + String(seconds % 60).padStart(2, '0') + ' сек'
              : seconds + ' сек';
          };

          if (supervisorUpdate?.attributes?.in_progress === true) {
            if (this._dh_actions_timer?.operation !== 'install') {
              this._dh_actions_timer = {
                operation: 'install',
                since: performance.now()
              };
            }
            const pct = supervisorUpdate.attributes.update_percentage;
            return 'Установка версии… '
              + (typeof pct === 'number' ? Math.round(pct) + '% · ' : '')
              + elapsedText(this._dh_actions_timer.since);
          }

          if (!item || ['unknown', 'unavailable'].includes(item.state)) {
            return 'Нет связи с приложением';
          }

          const a = item.attributes || {};
          const operation = a.operation;
          const names = {
            refresh: 'Обновление данных',
            check: 'Проверка версии'
          };

          if (item.state === 'running') {
            const key = String(operation) + '|' + String(a.started_at || '');
            if (this._dh_actions_timer?.key !== key) {
              this._dh_actions_timer = {
                key: key,
                operation: operation,
                since: performance.now()
              };
            }
            return (names[operation] || 'Операция') + '… '
              + elapsedText(this._dh_actions_timer.since);
          }

          this._dh_actions_timer = null;

          if (item.state === 'error') {
            return 'Ошибка: ' + (a.error || 'операция не выполнена');
          }

          if (item.state === 'success') {
            let message = operation === 'refresh'
              ? 'Данные обновлены'
              : operation === 'check'
                ? (
                    states['binary_sensor.dh_actions_app_update_available']?.state === 'on'
                      ? 'Доступна новая версия'
                      : states['binary_sensor.dh_actions_app_update_available']?.state === 'off'
                        ? 'Версия актуальна'
                        : 'Проверка завершена'
                  )
                : 'Готово';
            return message + ' · ' + duration(a.duration_seconds);
          }

          if (health === 'unavailable') return 'Нет связи с приложением';
          if (Number.isFinite(problems) && problems > 0) {
            return 'Проблемы: ' + problems;
          }
          if (states['binary_sensor.dh_actions_app_update_available']?.state === 'on') {
            return 'Доступна новая версия';
          }
          if (health === 'ready') return 'Работает штатно';
          return 'Ожидание данных';
        ]]]
      styles:
        card:
        - padding: 12px
        - text-align: left
        grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 48px 1fr
        - grid-template-rows: min-content min-content
        img_cell:
        - width: 40px
        - justify-content: start
        icon:
        - width: 26px
        - color: |
            [[[
              const s = states['sensor.dh_actions_app_card']?.state;
              const health =
                states['sensor.dh_actions_app_problems']?.state;
              const problems =
                Number(states['sensor.dh_actions_app_problems']?.attributes?.count ?? -1);
              const upgrade =
                states['binary_sensor.dh_actions_app_update_available']?.state === 'on';
              const updating =
                states['update.digitalhouses_actions_app_update']?.attributes?.in_progress === true;

              return s === 'error' || ['unknown','unavailable'].includes(s) || !s || health === 'unavailable'
                ? 'var(--error-color)'
                : s === 'running' || updating
                  ? 'var(--info-color, var(--primary-color))'
                  : s === 'success'
                    ? 'var(--success-color, var(--primary-color))'
                    : Number.isFinite(problems) && problems > 0
                      ? 'var(--warning-color, orange)'
                      : upgrade
                        ? 'var(--warning-color, orange)'
                        : health === 'ready'
                          ? 'var(--success-color, var(--primary-color))'
                          : 'var(--secondary-text-color)';
            ]]]
        name:
        - justify-self: start
        - font-size: 14px
        - font-weight: 600
        label:
        - justify-self: start
        - white-space: normal
        - text-align: left
        - font-size: 13px
        - color: var(--secondary-text-color)
      tap_action:
        action: none
    - type: custom:mushroom-chips-card
      alignment: center
      chips:
      - type: template
        icon: mdi:refresh
        content: Обновить
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.dh_actions_app_refresh
      - type: template
        icon: mdi:cloud-search
        content: Версия
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.dh_actions_app_check_updates
      - type: conditional
        conditions:
        - entity: update.digitalhouses_actions_app_update
          state: 'on'
        chip:
          type: template
          icon: mdi:package-down
          icon_color: orange
          content: Новая версия
          tap_action:
            action: perform-action
            perform_action: update.install
            target:
              entity_id: update.digitalhouses_actions_app_update
            data:
              backup: true
            confirmation:
              text: Установить новую версию Actions App? Перед обновлением Home Assistant создаст резервную копию App. Управление освещением через приложение временно прервётся.
      - type: template
        icon: mdi:restart
        content: Перезапуск
        tap_action:
          action: perform-action
          perform_action: hassio.app_restart
          data:
            app: 8133339d_digitalhouses_actions_app
          confirmation:
            text: Перезапустить Actions App? Управление освещением через приложение временно прервётся.
    grid_options:
      columns: 12
  - type: heading
    heading: Состояние Aqara
    heading_style: title
    icon: mdi:light-switch
  - type: custom:mushroom-template-card
    entity: sensor.dh_actions_app_problems
    primary: |-
      {% set n = state_attr(entity, 'count') %}
      {% if states(entity) != 'ready' %}
        Нет данных о проблемах
      {% elif n == 0 %}
        Проблем не обнаружено
      {% else %}
        Обнаружено проблем: {{ n if n is number else '—' }}
      {% endif %}
    secondary: |-
      {% set active = state_attr(entity, 'active') or [] %}
      {% if states(entity) != 'ready' %}
        Состояние устройств недоступно.
      {% elif active | count == 0 %}
        Выключатели проверены приложением.
      {% else %}
        {% for item in active %}
          • {{ (item.object_name or 'Устройство') | e }} · {{ (item.category or 'unknown') | e }}{% if item.reason %} — {{ item.reason | e }}{% endif %}
          {% if not loop.last %}

          {% endif %}
        {% endfor %}
      {% endif %}
    icon: |-
      {% if states(entity) != 'ready' %}
        mdi:help-circle-outline
      {% elif (state_attr(entity, 'count') or 0) > 0 %}
        mdi:alert-circle
      {% else %}
        mdi:check-circle
      {% endif %}
    icon_color: |-
      {% if states(entity) != 'ready' %}
        grey
      {% elif (state_attr(entity, 'count') or 0) > 0 %}
        red
      {% else %}
        green
      {% endif %}
    multiline_secondary: true
    tap_action:
      action: more-info
    grid_options:
      columns: 12
  - type: heading
    heading: Последнее нажатие
    heading_style: subtitle
    icon: mdi:gesture-tap-button
  - type: markdown
    content: "{% set e = 'sensor.dh_actions_app_last_action' -%}\n{% set status = states(e) -%}\n{% set a = states[e].attributes if states[e] is defined else {} -%}\n{% if status in ['unknown','unavailable'] -%}\n⚪ Нет связи с приложением или данных о последнем нажатии.\n{% elif status == 'idle' -%}\n*После запуска ещё не было назначенных нажатий.*\n{% else -%}\n{% if status == 'sent' -%}\n✅ **Отправлено** · Команда передана выбранным исполнителям.\n{% elif status == 'partial' -%}\n\U0001F7E0 **Частично выполнено** · Некоторые светильники пропущены.\n{% elif status == 'skipped' -%}\n⚠️ **Пропущено** · Команды светильникам не отправлены.\n{% elif status == 'queued' -%}\n⏳ **В очереди** · Ожидается обработка.\n{% elif status == 'error' -%}\n\U0001F534 **Ошибка выполнения**\n{% elif status == 'accepted' -%}\n✅ **Команда принята** · Статус устаревшего исполнителя.\n{% else -%}\n**Состояние:** {{ status | e }}\n{% endif %}\n\n**Выключатель:** `{{ (a.switch or '—') | e }}`  \n**Нажатие:**\
      \ `{{ (a.action or '—') | e }}`  \n**Отправлено:** {{ (a.target or '—') | e }}  \n**Время:** {{ (a.at or '—') | e }}\n{% if a.error -%}\n**Причина:** {{ a.error | e }}\n{% endif -%}\n\n*MQTT/HA подтвердили принятие к отправке, но не физическое переключение светильника.*\n{% endif %}"
- type: grid
  column_span: 3
  cards:
  - type: heading
    heading: Выключатели и назначения
    heading_style: title
    icon: mdi:family-tree
  - type: markdown
    content: |-
      {% set entity = 'sensor.dh_actions_app_devices_details' %}
      {% set rooms = state_attr(entity, 'rooms') or [] %}
      {% if states(entity) != 'ready' %}
      *Нет подтверждённых данных от Actions App.*
      {% elif rooms | count == 0 %}
      *Выключатели пока не импортированы. Откройте Ingress для настройки.*
      {% else %}
      **Aqara · Комнат: {{ rooms | count }}**

      <pre>
      {% for room in rooms -%}
      {{ '└─' if loop.last else '├─' }} 🏠 {{ room.name | e }} ({{ room.switches | count }})
      {% set tab = '   ' if loop.last else '│  ' -%}
      {% for device in room.switches -%}
      {% set state = device.runtime.status if device.runtime is defined else 'unknown' -%}
      {{ tab }}{{ '└─' if loop.last else '├─' }} {{ '🟢' if state == 'same' else '🟠' if state in ['unverified', 'replacement', 'settings_mismatch', 'keep_mode_mismatch', 'offline'] else '🔴' if state in ['incompatible','missing'] else '⚪' }} {{ (device.entity_id or device.logical_name) | e }} · {{ ('проверен' if state == 'same' else 'отключён' if state == 'disabled' else state) | e }}
      {% set inner = tab ~ ('   ' if loop.last else '│  ') -%}
      {{ inner }}├─ ⚙️ Модель: {{ device.fingerprint.model | e }}
      {{ inner }}├─ 🔘 Нажатия: {{ (device.fingerprint.actions | join(', ')) | e }}
      {{ inner }}├─ 🎛️ Режимы:
      {% for key, value in device.settings.items() -%}
      {{ inner }}│  {{ '└─' if loop.last else '├─' }} {{ key | e }}: {{ value | string | e }}
      {% else -%}
      {{ inner }}│  └─ Нет режимов реле (кнопка/панель)
      {% endfor -%}
      {{ inner }}├─ 💡 Назначения:
      {% for key, bind in device.bindings.items() -%}
      {% set targets = bind.targets or [] -%}
      {% set target_prefix = inner ~ '│  ' ~ ('   ' if loop.last else '│  ') -%}
      {{ inner }}│  {{ '└─' if loop.last else '├─' }} {{ key | e }}{% if bind.enabled is defined and not bind.enabled %} ⚠{% endif %} → {{ (bind.action if bind.action is defined and bind.action != 'mixed' else '') | e }}
      {% for target in targets -%}
      {% set light_state = (state_attr(entity, 'target_states') or {}).get(target, 'unknown') -%}
      {% set switch_target = target.startswith('switch.') -%}
      {% set per_target = bind.target_data.get(target, {}) if bind.target_data is defined else {} -%}
      {% set settings = per_target if per_target else (bind.data if bind.data is defined else {}) -%}
      {{ target_prefix }}{{ '└─' if loop.last else '├─' }} {{ ('<ha-icon icon="mdi:toggle-switch" style="color: #f5c542; --mdc-icon-size: 18px;"></ha-icon>' if light_state == 'on' else '<ha-icon icon="mdi:toggle-switch-off-outline" style="color: #9299a4; --mdc-icon-size: 18px;"></ha-icon>' if light_state == 'off' else '❔') | safe if switch_target else ('<ha-icon icon="mdi:lightbulb" style="color: #f5c542; --mdc-icon-size: 18px; vertical-align: middle;"></ha-icon>' if light_state == 'on' else '<ha-icon icon="mdi:lightbulb-outline" style="color: #9299a4; --mdc-icon-size: 18px; vertical-align: middle;"></ha-icon>' if light_state == 'off' else '❔') | safe }} {{ target | e }}{% if bind.target_operations is defined %} · {{ bind.target_operations.get(target, '') | upper | e }}{% endif %} · {{ 'ON' if light_state == 'on' else 'OFF' if light_state == 'off' else 'недоступен' if light_state == 'unavailable' else 'нет данных' }}{% if settings.rgb_color is defined %} · RGB({{ settings.rgb_color | join(',') }}){% endif %}{% if settings.color_temp_kelvin is defined %} · {{ settings.color_temp_kelvin }} K{% endif %}{% if settings.brightness_pct is defined %} · {{ settings.brightness_pct }}%{% endif %}{% if settings.brightness_step_pct is defined %} · Δ{{ settings.brightness_step_pct }}%{% endif %}{% if settings.transition is defined %} · {{ settings.transition }} c{% endif %}
      {% else -%}
      {{ target_prefix }}└─ Светильники не назначены
      {% endfor -%}
      {% else -%}
      {{ inner }}│  └─ Не назначены
      {% endfor -%}
      {{ inner }}└─ 🔌 Щитовое реле: {{ (device.panel_relay or 'не указано') | e }}
      {% endfor -%}
      {% endfor -%}
      </pre>
      {% endif %}
