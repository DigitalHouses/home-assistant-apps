type: sections
max_columns: 4
title: Plex
path: plex
icon: mdi:plex
sections:
  - type: grid
    cards:
      - type: heading
        heading: Plex Media Server
        heading_style: title
        icon: mdi:plex
      - type: custom:mushroom-template-card
        entity: binary_sensor.dh_plex_agent_server_running
        primary: Plex Media Server
        secondary: |-
          {% if is_state('binary_sensor.dh_plex_agent_server_running', 'on') %}
            Работает
          {% else %}
            Остановлен
          {% endif %}
        icon: mdi:plex
        icon_color: |-
          {% if is_state('binary_sensor.dh_plex_agent_server_running', 'on') %}
            green
          {% else %}
            red
          {% endif %}
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        entity: sensor.dh_plex_agent_last_boot
        primary: Время работы Plex сервера
        secondary: >-
          {% set boot = states(entity) %}
          {% if boot not in ['unknown', 'unavailable', 'none', ''] %}
            {% set sec = (as_timestamp(now()) - as_timestamp(boot)) | int %}
            {% set days = sec // 86400 %}
            {% set hours = (sec % 86400) // 3600 %}
            {% set minutes = (sec % 3600) // 60 %}
            {% if days > 0 %}
              {{ days }} д. {{ '%02d:%02d' | format(hours, minutes) }}
            {% else %}
              {{ '%02d:%02d' | format(hours, minutes) }}
            {% endif %}
          {% else %}
            Нет данных
          {% endif %}
        icon: mdi:timer-outline
        icon_color: >-
          {% if states(entity) not in ['unknown', 'unavailable', 'none', ''] %}
            green
          {% else %}
            grey
          {% endif %}
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        entity: sensor.dh_plex_agent_playback_count
        primary: Воспроизведение
        secondary: >-
          {{ states('sensor.dh_plex_agent_playback_count') }} active session(s)
        icon: mdi:play-network
        icon_color: |-
          {% if states('sensor.dh_plex_agent_playback_count') | int(0) > 0 %}
            green
          {% else %}
            grey
          {% endif %}
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        entity: sensor.dh_plex_agent_activity
        primary: Активность
        secondary: |-
          {% set s = states('sensor.dh_plex_agent_activity') %}
          {% set names = {
            'idle': 'Ожидание',
            'scanner': 'Сканирование',
            'credits_detection': 'Поиск титров',
            'intro_detection': 'Поиск заставок',
            'thumbnail_generation': 'Создание миниатюр',
            'transcoding': 'Транскодирование',
            'multiple': 'Несколько задач',
            'plex_not_running': 'Plex не запущен'
          } %}
          {{ names.get(s, s) }}
        icon: |-
          {% set s = states('sensor.dh_plex_agent_activity') %}
          {% if s == 'idle' %}
            mdi:sleep
          {% elif s == 'scanner' %}
            mdi:magnify-scan
          {% elif s == 'credits_detection' %}
            mdi:movie-open-outline
          {% elif s == 'intro_detection' %}
            mdi:movie-filter
          {% elif s == 'thumbnail_generation' %}
            mdi:image-multiple
          {% elif s == 'transcoding' %}
            mdi:movie-cog
          {% elif s == 'multiple' %}
            mdi:cog-sync
          {% else %}
            mdi:plex
          {% endif %}
        icon_color: >-
          {% set s = states('sensor.dh_plex_agent_activity') %}
          {% if s == 'idle' %}
            green
          {% elif s in ['scanner', 'credits_detection', 'intro_detection', 'thumbnail_generation'] %}
            blue
          {% elif s == 'transcoding' %}
            orange
          {% elif s == 'multiple' %}
            red
          {% else %}
            grey
          {% endif %}
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        entity: sensor.dh_plex_agent_current_item
        primary: Текущий объект
        secondary: >-
          {% set item = states('sensor.dh_plex_agent_current_item') %}
          {% if item in ['none', 'unknown', 'unavailable', ''] %}
            Нет активного объекта
          {% else %}
            {{ item }}
          {% endif %}
        icon: mdi:movie-open
        icon_color: >-
          {% if states('sensor.dh_plex_agent_current_item') not in ['none', 'unknown', 'unavailable', ''] %}
            blue
          {% else %}
            grey
          {% endif %}
        multiline_secondary: true
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        entity: button.dh_plex_agent_refresh
        primary: Обновить
        secondary: >-
          {% set v = states('sensor.dh_plex_agent_last_refresh') %}
          {% if v in ['unknown', 'unavailable', 'none', ''] %}
            Ещё не выполнялось
          {% else %}
            {{ as_timestamp(v) | timestamp_custom('%d.%m.%Y %H:%M:%S', true) }}
          {% endif %}
        icon: mdi:refresh
        icon_color: blue
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.dh_plex_agent_refresh
        grid_options:
          columns: 12
          rows: 1
      - type: markdown
        title: Plex — активная работа
        content: >
          {% set items = state_attr('sensor.dh_plex_agent_current_item', 'items') or [] %}

          {% set transcoder = states('sensor.dh_plex_agent_transcoder_count') | int(0) %}

          {% set scanner = state_attr('sensor.dh_plex_agent_current_item', 'scanner_count') | int(0) %}

          {% set playback = states('sensor.dh_plex_agent_playback_count') | int(0) %}

          {% set activity = states('sensor.dh_plex_agent_activity') %}


          <table>

          <tr>
            <td>▶️ <b>Playback:</b> {{ playback }}</td>
            <td>🎬 <b>Activity:</b> {{ activity }}</td>
          </tr>

          <tr>
            <td>⚙️ <b>Transcoder:</b> {{ transcoder }}</td>
            <td>🔎 <b>Scanner:</b> {{ scanner }}</td>
          </tr>

          </table>


          **Active files**


          | # | Media |

          | :---: | :--- |

          {%- for item in items %}

          | {{ loop.index }} | {{ item | replace('|', '&#124;') }} |

          {%- endfor %}

          {%- if items | count == 0 %}

          | — | No active media processing |

          {%- endif %}
      - type: heading
        heading: Activity history
        heading_style: title
        icon: mdi:plex
      - type: logbook
        title: Plex Activity History
        hours_to_show: 6
        entities:
          - sensor.dh_plex_agent_activity
  - type: grid
    cards:
      - type: heading
        heading: CPU Plex
        heading_style: title
        icon: mdi:cpu-64-bit
      - type: custom:mini-graph-card
        name: Plex CPU
        icon: mdi:cpu-64-bit
        entities:
          - entity: sensor.dh_plex_agent_cpu
            name: CPU
        hours_to_show: 6
        points_per_hour: 6
        line_width: 2
        height: 75
        show:
          labels: true
          points: false
          legend: true
          extrema: true
          fill: fade
      - type: custom:mini-graph-card
        name: Scanner CPU
        icon: mdi:magnify-scan
        entities:
          - entity: sensor.dh_plex_agent_scanner_cpu
            name: CPU
        hours_to_show: 6
        points_per_hour: 6
        line_width: 2
        height: 75
        show:
          labels: true
          points: false
          legend: true
          extrema: true
          fill: fade
      - type: custom:mini-graph-card
        name: Transcoder CPU
        icon: mdi:movie-cog
        entities:
          - entity: sensor.dh_plex_agent_transcoder_cpu
            name: CPU
        hours_to_show: 6
        points_per_hour: 6
        line_width: 2
        height: 75
        show:
          labels: true
          points: false
          legend: true
          extrema: true
          fill: fade
      - type: heading
        heading: GPU / Транскодинг
        heading_style: title
        icon: mdi:gpu
      - type: entities
        state_color: true
        show_header_toggle: false
        entities:
          - entity: binary_sensor.dh_plex_agent_hardware_transcode_active
            name: Hardware transcode
          - entity: sensor.dh_plex_agent_gpu_video
            name: GPU Video
          - entity: sensor.dh_plex_agent_gpu_render
            name: GPU Render
          - entity: sensor.dh_plex_agent_gpu_video_enhance
            name: GPU Video Enhance
          - entity: sensor.dh_plex_agent_gpu_frequency
            name: GPU Frequency
          - entity: sensor.dh_plex_agent_gpu_temperature
            name: GPU Temperature
  - type: grid
    cards:
      - type: heading
        heading: Playback
        heading_style: title
        icon: mdi:play-box-multiple
      - type: entities
        state_color: true
        show_header_toggle: false
        entities:
          - entity: binary_sensor.dh_plex_agent_playback_active
            name: Any Playback
          - entity: binary_sensor.dh_plex_agent_video_playback_active
            name: Video
          - entity: binary_sensor.dh_plex_agent_audio_playback_active
            name: Audio
          - entity: sensor.dh_plex_agent_playback_started_at
            name: Запущено
      - type: markdown
        title: Активные сессии
        content: >
          {% set sessions = state_attr('sensor.dh_plex_agent_playback_sessions', 'sessions') or [] %}


          | Type | Media | User | Client | Mode |

          | :---: | :--- | :--- | :--- | :--- |

          {%- for s in sessions %}

          {% set kind = '🎵' if s.content_type == 'audio' else '🎬' %}

          {% if s.content_type == 'audio' %}
            {% set media = ((s.artist or '') ~ ' — ' ~ (s.title or '')) | trim(' —') %}
          {% elif s.media_type == 'episode' %}
            {% set media = ((s.series or '') ~ ' · S' ~ '%02d'|format(s.season or 0) ~ 'E' ~ '%02d'|format(s.episode or 0) ~ ' · ' ~ (s.title or '')) | trim(' ·') %}
          {% else %}
            {% set media = (s.title or '') ~ ((' (' ~ s.year ~ ')') if s.year else '') %}
          {% endif %}

          | {{ kind }} | {{ media | replace('|', '&#124;') }} | {{ s.user or '—' }} | {{ s.player or s.device or '—' }} | {{ s.mode or 'Unknown' }} |

          {%- endfor %}

          {%- if sessions | count == 0 %}

          | — | No active playback | — | — | — |

          {%- endif %}
      - type: heading
        heading: Активность процессов
        heading_style: title
        icon: mdi:cog-play
      - type: entities
        state_color: true
        show_header_toggle: false
        entities:
          - entity: binary_sensor.dh_plex_agent_scanner_running
            name: Media Scanner
          - entity: binary_sensor.dh_plex_agent_credits_detection
            name: Credits Detection
          - entity: binary_sensor.dh_plex_agent_intro_detection
            name: Intro Detection
          - entity: binary_sensor.dh_plex_agent_thumbnail_generation
            name: Thumbnail Generation
          - entity: binary_sensor.dh_plex_agent_transcoder_running
            name: Transcoder
      - type: entities
        title: Process Details
        show_header_toggle: false
        entities:
          - entity: sensor.dh_plex_agent_scanner_actions
            name: Scanner Actions
          - entity: sensor.dh_plex_agent_process_count
            name: Plex Processes
  - type: grid
    cards:
      - type: heading
        heading: Библиотеки
        heading_style: title
        icon: mdi:folder-multiple-play
      - type: custom:auto-entities
        card:
          type: entities
          state_color: true
          title: Библиотеки Plex
          show_header_toggle: false
        filter:
          include:
            - entity_id: sensor.dh_plex_agent_library_*
              options:
                secondary_info: last-changed
        sort:
          method: name
        show_empty: true
      - type: heading
        heading: Диагностика
        heading_style: title
        icon: mdi:stethoscope
      - type: entities
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.dh_plex_agent_collector_status
            name: Process Collector
          - entity: sensor.dh_plex_agent_api_status
            name: Plex API
          - entity: sensor.dh_plex_agent_libraries
            name: Libraries
          - entity: sensor.dh_plex_agent_version
            name: Версия агента
          - entity: sensor.dh_plex_agent_started_at
            name: Агент запущен
          - entity: sensor.dh_plex_agent_publication_profile
            name: Профиль публикации
          - entity: sensor.dh_plex_agent_last_publication
            name: Последняя публикация
          - entity: sensor.dh_plex_agent_last_refresh
            name: Последний Refresh
badges:
  - type: entity
    entity: binary_sensor.dh_plex_agent_server_running
    name: Plex
    show_name: true
    show_state: true
    show_icon: true
  - type: entity
    entity: sensor.dh_plex_agent_playback_count
    name: Playback
    show_name: true
    show_state: true
    show_icon: true
  - type: entity
    entity: binary_sensor.dh_plex_agent_video_playback_active
    name: Video
    show_name: true
    show_state: true
    show_icon: true
  - type: entity
    entity: sensor.dh_plex_agent_cpu
    name: CPU
    show_name: true
    show_state: true
    show_icon: true
header:
  card:
    type: markdown
    text_only: true
    content: '# Plex media server'
cards: []
