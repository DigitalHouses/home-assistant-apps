type: sections
max_columns: 4
title: Plex
path: plex
icon: mdi:plex
sections:
  - type: grid
    cards:
      - type: heading
        heading: Plex Media Server
        heading_style: title
        icon: mdi:plex
      - type: vertical-stack
        cards:
          - type: custom:button-card
            entity: sensor.dh_plex_agent_card
            triggers_update:
              - sensor.dh_plex_agent_card
              - sensor.dh_plex_agent_version
              - sensor.dh_plex_agent_latest_version
              - binary_sensor.dh_plex_agent_update_available
              - sensor.dh_plex_agent_api_status
            update_timer: |
              [[[
                const s = states['sensor.dh_plex_agent_card']?.state;
                const awaitingRestart = ['unavailable', 'unknown'].includes(s)
                  && this._dh_plex_timer?.operation === 'restart';
                return s === 'running' || awaitingRestart ? 1000 : 5000;
              ]]]
            show_icon: true
            show_name: true
            show_label: true
            icon: |
              [[[
                const s = states['sensor.dh_plex_agent_card']?.state;
                const upgrade = states['binary_sensor.dh_plex_agent_update_available']?.state === 'on';
                const awaitingRestart = ['unavailable', 'unknown'].includes(s)
                  && this._dh_plex_timer?.operation === 'restart';
                return s === 'running' || awaitingRestart ? 'mdi:progress-clock'
                  : s === 'error' ? 'mdi:alert-circle'
                  : s === 'success' ? 'mdi:check-circle'
                  : upgrade ? 'mdi:package-up'
                  : 'mdi:robot-outline';
              ]]]
            name: |
              [[[
                const installed = states['sensor.dh_plex_agent_version']?.state;
                const latest = states['sensor.dh_plex_agent_latest_version']?.state;
                const available = states['binary_sensor.dh_plex_agent_update_available']?.state === 'on';
                const valid = (v) =>
                  typeof v === 'string' && !['unknown', 'unavailable', 'none', ''].includes(v);
                const upgrade = available && valid(installed) && valid(latest) && latest !== installed;
                return 'Plex Agent' + (valid(installed)
                  ? ' · v' + installed + (upgrade ? ' → v' + latest : '')
                  : '');
              ]]]
            label: |
              [[[
                const item = states['sensor.dh_plex_agent_card'];
                // The foreground timer starts when this browser first observes
                // running, using its own monotonic clock. Never subtract the Plex
                // server UTC timestamp from the browser wall clock: these clocks
                // may differ by seconds.
                const elapsedText = (since) => {
                  const seconds = Math.max(0, Math.floor((performance.now() - since) / 1000));
                  const mm = String(Math.floor(seconds / 60)).padStart(2, '0');
                  const ss = String(seconds % 60).padStart(2, '0');
                  return mm + ':' + ss;
                };
                if (!item || ['unknown','unavailable'].includes(item.state)) {
                  const pending = this._dh_plex_timer;
                  if (pending?.operation === 'restart') {
                    return 'Ожидание запуска агента… ' + elapsedText(pending.since);
                  }
                  return 'Нет связи с агентом';
                }
                const a = item.attributes || {};
                const operation = a.operation;
                const names = {
                  refresh: 'Обновление данных',
                  check: 'Проверка версии',
                  install: 'Установка версии',
                  restart: 'Перезапуск агента'
                };
                const duration = (value) => {
                  if (typeof value !== 'number') return '—';
                  const seconds = Math.round(Math.max(0, value));
                  const minutes = Math.floor(seconds / 60);
                  return minutes
                    ? minutes + ' мин ' + String(seconds % 60).padStart(2, '0') + ' сек'
                    : seconds + ' сек';
                };
                if (item.state === 'running') {
                  const key = String(operation) + '|' + String(a.started_at || '');
                  if (this._dh_plex_timer?.key !== key) {
                    this._dh_plex_timer = {
                      key: key, operation: operation, since: performance.now()
                    };
                  }
                  return (names[operation] || 'Операция') + '… '
                    + elapsedText(this._dh_plex_timer.since);
                }
                if (item.state === 'error') {
                  return 'Ошибка: ' + (a.error || 'операция не выполнена');
                }
                if (item.state === 'success') {
                  let message = {
                    refresh: 'Обновлено',
                    check: 'Версия проверена',
                    install: 'Версия установлена',
                    restart: 'Агент перезапущен'
                  }[operation] || 'Готово';
                  if (operation === 'check') {
                    const available = states['binary_sensor.dh_plex_agent_update_available']?.state;
                    message = available === 'on' ? 'Доступна новая версия'
                      : available === 'off' ? 'Версия актуальна' : 'Проверка завершена';
                  }
                  return message + ' · ' + duration(a.duration_seconds);
                }
                // A verified new release stays visible after the five-second result.
                if (states['binary_sensor.dh_plex_agent_update_available']?.state === 'on') {
                  return 'Доступна новая версия';
                }
                const api = states['sensor.dh_plex_agent_api_status']?.state;
                if (api === 'error') return 'Ошибка Plex API';
                const ts = Date.parse(a.last_collection_at || '');
                if (!Number.isFinite(ts)) return 'Ожидание данных';
                const sec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
                if (sec < 60) return 'Обновлено ' + sec + ' сек назад';
                const min = Math.floor(sec / 60);
                if (min < 60) return 'Обновлено ' + min + ' мин назад';
                const hr = Math.floor(min / 60);
                if (hr < 24) return 'Обновлено ' + hr + ' ч назад';
                return 'Обновлено ' + Math.floor(hr / 24) + ' д назад';
              ]]]
            styles:
              card:
                - padding: 12px
                - text-align: left
              grid:
                - grid-template-areas: '"i n" "i l"'
                - grid-template-columns: 48px 1fr
                - grid-template-rows: min-content min-content
              img_cell:
                - width: 40px
                - justify-content: start
              icon:
                - width: 26px
                - color: |
                    [[[
                      const s = states['sensor.dh_plex_agent_card']?.state;
                      const upgrade = states['binary_sensor.dh_plex_agent_update_available']?.state === 'on';
                      const awaitingRestart = ['unavailable', 'unknown'].includes(s)
                        && this._dh_plex_timer?.operation === 'restart';
                      return s === 'error' ? 'var(--error-color)'
                        : s === 'running' || awaitingRestart
                          ? 'var(--info-color, var(--primary-color))'
                        : s === 'success' ? 'var(--success-color, var(--primary-color))'
                        : upgrade ? 'var(--warning-color, orange)'
                        : 'var(--success-color, var(--primary-color))';
                    ]]]
              name:
                - justify-self: start
                - font-size: 14px
                - font-weight: 600
              label:
                - justify-self: start
                - white-space: normal
                - text-align: left
                - font-size: 13px
                - color: var(--secondary-text-color)
            tap_action:
              action: none
        
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:refresh
                content: Обновить
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.dh_plex_agent_refresh
        
              - type: template
                icon: mdi:cloud-search
                content: Версия
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.dh_plex_agent_check_updates
        
              - type: conditional
                conditions:
                  - entity: binary_sensor.dh_plex_agent_update_available
                    state: "on"
                chip:
                  type: template
                  icon: mdi:package-down
                  icon_color: orange
                  content: Новая версия
                  tap_action:
                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.dh_plex_agent_update
                    confirmation:
                      text: >-
                        Установить новую версию Plex Agent?
                        Мониторинг Plex временно прервётся. Plex Media Server продолжит работу.
        
              - type: template
                icon: mdi:restart
                content: Перезапуск
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.dh_plex_agent_restart_agent
                  confirmation:
                    text: >-
                      Перезапустить Plex Agent?
                      Мониторинг Plex временно прервётся.
                      Plex Media Server не перезапускается.
        grid_options:
          columns: 12
      - type: custom:mushroom-template-card
        entity: binary_sensor.dh_plex_agent_server_running
        primary: Plex Media Server
        secondary: |-
          {% if is_state('binary_sensor.dh_plex_agent_server_running', 'on') %}
            Работает
          {% else %}
            Остановлен
          {% endif %}
        icon: mdi:plex
        icon_color: |-
          {% if is_state('binary_sensor.dh_plex_agent_server_running', 'on') %}
            green
          {% else %}
            red
          {% endif %}
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        entity: sensor.dh_plex_agent_last_boot
        primary: Время работы Plex сервера
        secondary: >-
          {% set boot = states(entity) %}
          {% if boot not in ['unknown', 'unavailable', 'none', ''] %}
            {% set sec = (as_timestamp(now()) - as_timestamp(boot)) | int %}
            {% set days = sec // 86400 %}
            {% set hours = (sec % 86400) // 3600 %}
            {% set minutes = (sec % 3600) // 60 %}
            {% if days > 0 %}
              {{ days }} д. {{ '%02d:%02d' | format(hours, minutes) }}
            {% else %}
              {{ '%02d:%02d' | format(hours, minutes) }}
            {% endif %}
          {% else %}
            Нет данных
          {% endif %}
        icon: mdi:timer-outline
        icon_color: >-
          {% if states(entity) not in ['unknown', 'unavailable', 'none', ''] %}
            green
          {% else %}
            grey
          {% endif %}
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        entity: sensor.dh_plex_agent_playback_count
        primary: Воспроизведение
        secondary: >-
          {{ states('sensor.dh_plex_agent_playback_count') }} active session(s)
        icon: mdi:play-network
        icon_color: |-
          {% if states('sensor.dh_plex_agent_playback_count') | int(0) > 0 %}
            green
          {% else %}
            grey
          {% endif %}
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        entity: sensor.dh_plex_agent_activity
        primary: Активность
        secondary: |-
          {% set s = states('sensor.dh_plex_agent_activity') %}
          {% set names = {
            'idle': 'Ожидание',
            'scanner': 'Сканирование',
            'credits_detection': 'Поиск титров',
            'intro_detection': 'Поиск заставок',
            'thumbnail_generation': 'Создание миниатюр',
            'transcoding': 'Транскодирование',
            'multiple': 'Несколько задач',
            'plex_not_running': 'Plex не запущен'
          } %}
          {{ names.get(s, s) }}
        icon: |-
          {% set s = states('sensor.dh_plex_agent_activity') %}
          {% if s == 'idle' %}
            mdi:sleep
          {% elif s == 'scanner' %}
            mdi:magnify-scan
          {% elif s == 'credits_detection' %}
            mdi:movie-open-outline
          {% elif s == 'intro_detection' %}
            mdi:movie-filter
          {% elif s == 'thumbnail_generation' %}
            mdi:image-multiple
          {% elif s == 'transcoding' %}
            mdi:movie-cog
          {% elif s == 'multiple' %}
            mdi:cog-sync
          {% else %}
            mdi:plex
          {% endif %}
        icon_color: >-
          {% set s = states('sensor.dh_plex_agent_activity') %}
          {% if s == 'idle' %}
            green
          {% elif s in ['scanner', 'credits_detection', 'intro_detection', 'thumbnail_generation'] %}
            blue
          {% elif s == 'transcoding' %}
            orange
          {% elif s == 'multiple' %}
            red
          {% else %}
            grey
          {% endif %}
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        entity: sensor.dh_plex_agent_current_item
        primary: Текущий объект
        secondary: >-
          {% set item = states('sensor.dh_plex_agent_current_item') %}
          {% if item in ['none', 'unknown', 'unavailable', ''] %}
            Нет активного объекта
          {% else %}
            {{ item }}
          {% endif %}
        icon: mdi:movie-open
        icon_color: >-
          {% if states('sensor.dh_plex_agent_current_item') not in ['none', 'unknown', 'unavailable', ''] %}
            blue
          {% else %}
            grey
          {% endif %}
        multiline_secondary: true
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        entity: button.dh_plex_agent_refresh
        primary: Обновить
        secondary: >-
          {% set v = states('sensor.dh_plex_agent_last_refresh') %}
          {% if v in ['unknown', 'unavailable', 'none', ''] %}
            Ещё не выполнялось
          {% else %}
            {{ as_timestamp(v) | timestamp_custom('%d.%m.%Y %H:%M:%S', true) }}
          {% endif %}
        icon: mdi:refresh
        icon_color: blue
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.dh_plex_agent_refresh
        grid_options:
          columns: 12
          rows: 1
      - type: markdown
        title: Plex — активная работа
        content: >
          {% set items = state_attr('sensor.dh_plex_agent_current_item', 'items') or [] %}

          {% set transcoder = states('sensor.dh_plex_agent_transcoder_count') | int(0) %}

          {% set scanner = state_attr('sensor.dh_plex_agent_current_item', 'scanner_count') | int(0) %}

          {% set playback = states('sensor.dh_plex_agent_playback_count') | int(0) %}

          {% set activity = states('sensor.dh_plex_agent_activity') %}


          <table>

          <tr>
            <td>▶️ <b>Playback:</b> {{ playback }}</td>
            <td>🎬 <b>Activity:</b> {{ activity }}</td>
          </tr>

          <tr>
            <td>⚙️ <b>Transcoder:</b> {{ transcoder }}</td>
            <td>🔎 <b>Scanner:</b> {{ scanner }}</td>
          </tr>

          </table>


          **Active files**


          | # | Media |

          | :---: | :--- |

          {%- for item in items %}

          | {{ loop.index }} | {{ item | replace('|', '&#124;') }} |

          {%- endfor %}

          {%- if items | count == 0 %}

          | — | No active media processing |

          {%- endif %}
      - type: heading
        heading: Activity history
        heading_style: title
        icon: mdi:plex
      - type: logbook
        title: Plex Activity History
        hours_to_show: 6
        entities:
          - sensor.dh_plex_agent_activity
  - type: grid
    cards:
      - type: heading
        heading: CPU Plex
        heading_style: title
        icon: mdi:cpu-64-bit
      - type: custom:mini-graph-card
        name: Plex CPU
        icon: mdi:cpu-64-bit
        entities:
          - entity: sensor.dh_plex_agent_cpu
            name: CPU
        hours_to_show: 6
        points_per_hour: 6
        line_width: 2
        height: 75
        show:
          labels: true
          points: false
          legend: true
          extrema: true
          fill: fade
      - type: custom:mini-graph-card
        name: Scanner CPU
        icon: mdi:magnify-scan
        entities:
          - entity: sensor.dh_plex_agent_scanner_cpu
            name: CPU
        hours_to_show: 6
        points_per_hour: 6
        line_width: 2
        height: 75
        show:
          labels: true
          points: false
          legend: true
          extrema: true
          fill: fade
      - type: custom:mini-graph-card
        name: Transcoder CPU
        icon: mdi:movie-cog
        entities:
          - entity: sensor.dh_plex_agent_transcoder_cpu
            name: CPU
        hours_to_show: 6
        points_per_hour: 6
        line_width: 2
        height: 75
        show:
          labels: true
          points: false
          legend: true
          extrema: true
          fill: fade
      - type: heading
        heading: GPU / Транскодинг
        heading_style: title
        icon: mdi:gpu
      - type: entities
        state_color: true
        show_header_toggle: false
        entities:
          - entity: binary_sensor.dh_plex_agent_hardware_transcode_active
            name: Hardware transcode
          - entity: sensor.dh_plex_agent_gpu_video
            name: GPU Video
          - entity: sensor.dh_plex_agent_gpu_render
            name: GPU Render
          - entity: sensor.dh_plex_agent_gpu_video_enhance
            name: GPU Video Enhance
          - entity: sensor.dh_plex_agent_gpu_frequency
            name: GPU Frequency
          - entity: sensor.dh_plex_agent_gpu_temperature
            name: GPU Temperature
  - type: grid
    cards:
      - type: heading
        heading: Playback
        heading_style: title
        icon: mdi:play-box-multiple
      - type: entities
        state_color: true
        show_header_toggle: false
        entities:
          - entity: binary_sensor.dh_plex_agent_playback_active
            name: Any Playback
          - entity: binary_sensor.dh_plex_agent_video_playback_active
            name: Video
          - entity: binary_sensor.dh_plex_agent_audio_playback_active
            name: Audio
          - entity: sensor.dh_plex_agent_playback_started_at
            name: Запущено
      - type: markdown
        title: Активные сессии
        content: >
          {% set sessions = state_attr('sensor.dh_plex_agent_playback_sessions', 'sessions') or [] %}


          | Type | Media | User | Client | Mode |

          | :---: | :--- | :--- | :--- | :--- |

          {%- for s in sessions %}

          {% set kind = '🎵' if s.content_type == 'audio' else '🎬' %}

          {% if s.content_type == 'audio' %}
            {% set media = ((s.artist or '') ~ ' — ' ~ (s.title or '')) | trim(' —') %}
          {% elif s.media_type == 'episode' %}
            {% set media = ((s.series or '') ~ ' · S' ~ '%02d'|format(s.season or 0) ~ 'E' ~ '%02d'|format(s.episode or 0) ~ ' · ' ~ (s.title or '')) | trim(' ·') %}
          {% else %}
            {% set media = (s.title or '') ~ ((' (' ~ s.year ~ ')') if s.year else '') %}
          {% endif %}

          | {{ kind }} | {{ media | replace('|', '&#124;') }} | {{ s.user or '—' }} | {{ s.player or s.device or '—' }} | {{ s.mode or 'Unknown' }} |

          {%- endfor %}

          {%- if sessions | count == 0 %}

          | — | No active playback | — | — | — |

          {%- endif %}
      - type: heading
        heading: Активность процессов
        heading_style: title
        icon: mdi:cog-play
      - type: entities
        state_color: true
        show_header_toggle: false
        entities:
          - entity: binary_sensor.dh_plex_agent_scanner_running
            name: Media Scanner
          - entity: binary_sensor.dh_plex_agent_credits_detection
            name: Credits Detection
          - entity: binary_sensor.dh_plex_agent_intro_detection
            name: Intro Detection
          - entity: binary_sensor.dh_plex_agent_thumbnail_generation
            name: Thumbnail Generation
          - entity: binary_sensor.dh_plex_agent_transcoder_running
            name: Transcoder
      - type: entities
        title: Process Details
        show_header_toggle: false
        entities:
          - entity: sensor.dh_plex_agent_scanner_actions
            name: Scanner Actions
          - entity: sensor.dh_plex_agent_process_count
            name: Plex Processes
  - type: grid
    cards:
      - type: heading
        heading: Библиотеки
        heading_style: title
        icon: mdi:folder-multiple-play
      - type: custom:auto-entities
        card:
          type: entities
          state_color: true
          title: Библиотеки Plex
          show_header_toggle: false
        filter:
          include:
            - entity_id: sensor.dh_plex_agent_library_*
              options:
                secondary_info: last-changed
        sort:
          method: name
        show_empty: true
      - type: heading
        heading: Диагностика
        heading_style: title
        icon: mdi:stethoscope
      - type: entities
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.dh_plex_agent_collector_status
            name: Process Collector
          - entity: sensor.dh_plex_agent_api_status
            name: Plex API
          - entity: sensor.dh_plex_agent_libraries
            name: Libraries
          - entity: sensor.dh_plex_agent_version
            name: Версия агента
          - entity: sensor.dh_plex_agent_started_at
            name: Агент запущен
          - entity: sensor.dh_plex_agent_publication_profile
            name: Профиль публикации
          - entity: sensor.dh_plex_agent_last_publication
            name: Последняя публикация
          - entity: sensor.dh_plex_agent_last_refresh
            name: Последний Refresh
badges:
  - type: entity
    entity: binary_sensor.dh_plex_agent_server_running
    name: Plex
    show_name: true
    show_state: true
    show_icon: true
  - type: entity
    entity: sensor.dh_plex_agent_playback_count
    name: Playback
    show_name: true
    show_state: true
    show_icon: true
  - type: entity
    entity: binary_sensor.dh_plex_agent_video_playback_active
    name: Video
    show_name: true
    show_state: true
    show_icon: true
  - type: entity
    entity: sensor.dh_plex_agent_cpu
    name: CPU
    show_name: true
    show_state: true
    show_icon: true
header:
  card:
    type: markdown
    text_only: true
    content: '# Plex media server'
cards: []
