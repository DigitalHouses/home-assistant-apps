type: sections
max_columns: 4
title: Plex
path: plex-agent
icon: mdi:plex
sections:
  - type: grid
    cards:
      - type: heading
        heading: Plex Media Server
        heading_style: title
        icon: mdi:plex
      - type: vertical-stack
        cards:
          - type: custom:button-card
            entity: sensor.dh_plex_agent_card
            triggers_update:
              - sensor.dh_plex_agent_card
              - sensor.dh_plex_agent_version
              - sensor.dh_plex_agent_latest_version
              - binary_sensor.dh_plex_agent_update_available
              - sensor.dh_plex_agent_api_status
            update_timer: |
              [[[
                const s = states['sensor.dh_plex_agent_card']?.state;
                const awaitingRestart = ['unavailable', 'unknown'].includes(s)
                  && this._dh_plex_timer?.operation === 'restart';
                return s === 'running' || awaitingRestart ? 1000 : 5000;
              ]]]
            show_icon: true
            show_name: true
            show_label: true
            icon: |
              [[[
                const s = states['sensor.dh_plex_agent_card']?.state;
                const upgrade = states['binary_sensor.dh_plex_agent_update_available']?.state === 'on';
                const awaitingRestart = ['unavailable', 'unknown'].includes(s)
                  && this._dh_plex_timer?.operation === 'restart';
                return s === 'running' || awaitingRestart ? 'mdi:progress-clock'
                  : s === 'error' ? 'mdi:alert-circle'
          : s === 'problem' ? 'mdi:alert-circle-outline'
                  : s === 'success' ? 'mdi:check-circle'
                  : upgrade ? 'mdi:package-up'
                  : 'mdi:robot-outline';
              ]]]
            name: |
              [[[
                const installed = states['sensor.dh_plex_agent_version']?.state;
                const latest = states['sensor.dh_plex_agent_latest_version']?.state;
                const available = states['binary_sensor.dh_plex_agent_update_available']?.state === 'on';
                const valid = (v) =>
                  typeof v === 'string' && !['unknown', 'unavailable', 'none', ''].includes(v);
                const upgrade = available && valid(installed) && valid(latest) && latest !== installed;
                return 'Plex Agent' + (valid(installed)
                  ? ' · v' + installed + (upgrade ? ' → v' + latest : '')
                  : '');
              ]]]
            label: |
              [[[
                const item = states['sensor.dh_plex_agent_card'];
                // The foreground timer starts when this browser first observes
                // running, using its own monotonic clock. Never subtract the Plex
                // server UTC timestamp from the browser wall clock: these clocks
                // may differ by seconds.
                const elapsedText = (since) => {
                  const seconds = Math.max(0, Math.floor((performance.now() - since) / 1000));
                  const mm = String(Math.floor(seconds / 60)).padStart(2, '0');
                  const ss = String(seconds % 60).padStart(2, '0');
                  return mm + ':' + ss;
                };
                if (!item || ['unknown','unavailable'].includes(item.state)) {
                  const pending = this._dh_plex_timer;
                  if (pending?.operation === 'restart') {
                    return 'Ожидание запуска агента… ' + elapsedText(pending.since);
                  }
                  return 'Нет связи с агентом';
                }
                const a = item.attributes || {};
                const operation = a.operation;
                const names = {
                  refresh: 'Обновление данных',
                  check: 'Проверка версии',
                  install: 'Установка версии',
                  restart: 'Перезапуск агента'
                };
                const duration = (value) => {
                  if (typeof value !== 'number') return '—';
                  const seconds = Math.round(Math.max(0, value));
                  const minutes = Math.floor(seconds / 60);
                  return minutes
                    ? minutes + ' мин ' + String(seconds % 60).padStart(2, '0') + ' сек'
                    : seconds + ' сек';
                };
                if (item.state === 'running') {
                  const key = String(operation) + '|' + String(a.started_at || '');
                  if (this._dh_plex_timer?.key !== key) {
                    this._dh_plex_timer = {
                      key: key, operation: operation, since: performance.now()
                    };
                  }
                  return (names[operation] || 'Операция') + '… '
                    + elapsedText(this._dh_plex_timer.since);
                }
                if (item.state === 'error') {
                  return 'Ошибка: ' + (a.error || 'операция не выполнена');
                }
                if (item.state === 'problem') {
                  return 'Обнаружена проблема: ' + (a.problem_message || 'требуется диагностика');
                }
                if (item.state === 'success') {
                  let message = {
                    refresh: 'Обновлено',
                    check: 'Версия проверена',
                    install: 'Версия установлена',
                    restart: 'Агент перезапущен'
                  }[operation] || 'Готово';
                  if (operation === 'check') {
                    const available = states['binary_sensor.dh_plex_agent_update_available']?.state;
                    message = available === 'on' ? 'Доступна новая версия'
                      : available === 'off' ? 'Версия актуальна' : 'Проверка завершена';
                  }
                  return message + ' · ' + duration(a.duration_seconds);
                }
                // A verified new release stays visible after the five-second result.
                if (states['binary_sensor.dh_plex_agent_update_available']?.state === 'on') {
                  return 'Доступна новая версия';
                }
                const api = states['sensor.dh_plex_agent_api_status']?.state;
                if (api === 'error') return 'Ошибка Plex API';
                const ts = Date.parse(a.last_collection_at || '');
                if (!Number.isFinite(ts)) return 'Ожидание данных';
                const sec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
                if (sec < 60) return 'Обновлено ' + sec + ' сек назад';
                const min = Math.floor(sec / 60);
                if (min < 60) return 'Обновлено ' + min + ' мин назад';
                const hr = Math.floor(min / 60);
                if (hr < 24) return 'Обновлено ' + hr + ' ч назад';
                return 'Обновлено ' + Math.floor(hr / 24) + ' д назад';
              ]]]
            styles:
              card:
                - padding: 12px
                - text-align: left
              grid:
                - grid-template-areas: '"i n" "i l"'
                - grid-template-columns: 48px 1fr
                - grid-template-rows: min-content min-content
              img_cell:
                - width: 40px
                - justify-content: start
              icon:
                - width: 26px
                - color: |
                    [[[
                      const s = states['sensor.dh_plex_agent_card']?.state;
                      const upgrade = states['binary_sensor.dh_plex_agent_update_available']?.state === 'on';
                      const awaitingRestart = ['unavailable', 'unknown'].includes(s)
                        && this._dh_plex_timer?.operation === 'restart';
                      return s === 'error' ? 'var(--error-color)'
                        : s === 'problem' ? 'var(--warning-color, orange)'
                        : s === 'running' || awaitingRestart
                          ? 'var(--info-color, var(--primary-color))'
                        : s === 'success' ? 'var(--success-color, var(--primary-color))'
                        : upgrade ? 'var(--warning-color, orange)'
                        : 'var(--success-color, var(--primary-color))';
                    ]]]
              name:
                - justify-self: start
                - font-size: 14px
                - font-weight: 600
              label:
                - justify-self: start
                - white-space: normal
                - text-align: left
                - font-size: 13px
                - color: var(--secondary-text-color)
            tap_action:
              action: none
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:refresh
                content: Обновить
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.dh_plex_agent_refresh
              - type: template
                icon: mdi:cloud-search
                content: Версия
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.dh_plex_agent_check_updates
              - type: conditional
                conditions:
                  - entity: binary_sensor.dh_plex_agent_update_available
                    state: 'on'
                chip:
                  type: template
                  icon: mdi:package-down
                  icon_color: orange
                  content: Новая версия
                  tap_action:
                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.dh_plex_agent_update
                    confirmation:
                      text: >-
                        Установить новую версию Plex Agent? Мониторинг Plex
                        временно прервётся. Plex Media Server продолжит работу.
              - type: template
                icon: mdi:restart
                content: Перезапуск
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.dh_plex_agent_restart_agent
                  confirmation:
                    text: >-
                      Перезапустить Plex Agent? Мониторинг Plex временно
                      прервётся. Plex Media Server не перезапускается.
        grid_options:
          columns: 12
      - type: custom:mushroom-template-card
        entity: sensor.dh_plex_agent_uptime
        primary: >-
          Время работа (DH Plex Agent {{ states('sensor.dh_plex_agent_version')
          }})
        secondary: >-
          {% set value = states(entity) %} {% if value not in ['unknown',
          'unavailable', 'none', ''] %}
            {% set sec = value | float(0) | int %}
            {% set days = sec // 86400 %}
            {% set hours = (sec % 86400) // 3600 %}
            {% set minutes = (sec % 3600) // 60 %}

            {% if days > 0 %}
              {{ days }} д. {{ '%02d:%02d' | format(hours, minutes) }}
            {% else %}
              {{ '%02d:%02d' | format(hours, minutes) }}
            {% endif %}
          {% else %}
            Нет данных
          {% endif %}
        icon: mdi:timer-outline
        tap_action:
          action: more-info
        grid_options:
          columns: 12
          rows: 1
        color: |-
          {% if states(entity) not in ['unknown', 'unavailable', 'none', ''] %}
            green
          {% else %}
            grey
          {% endif %}
        features_position: bottom
      - type: custom:mushroom-template-card
        entity: binary_sensor.dh_plex_agent_server_running
        primary: Plex Media Server
        secondary: >-
          {% if is_state('binary_sensor.dh_plex_agent_server_running', 'on') %}
            Работает
          {% elif is_state('binary_sensor.dh_plex_agent_server_running', 'off')
          %}
            Остановлен
          {% else %}
            Недоступен
          {% endif %}
        icon: mdi:plex
        icon_color: >-
          {% if is_state('binary_sensor.dh_plex_agent_server_running', 'on') %}
            green
          {% elif is_state('binary_sensor.dh_plex_agent_server_running', 'off')
          %}
            red
          {% else %}
            grey
          {% endif %}
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        entity: sensor.dh_plex_agent_activity
        primary: Работа Plex
        secondary: |-
          {% set s = states('sensor.dh_plex_agent_activity') %}
          {% set names = {
            'idle': 'Ожидание',
            'scanner': 'Сканирование',
            'credits_detection': 'Поиск титров',
            'intro_detection': 'Поиск заставок',
            'thumbnail_generation': 'Создание миниатюр',
            'transcoding': 'Транскодирование',
            'multiple': 'Несколько задач',
            'plex_not_running': 'Plex не запущен'
          } %}
          {{ names.get(s, s) }}
        icon: |-
          {% set s = states('sensor.dh_plex_agent_activity') %}
          {% if s == 'idle' %}
            mdi:sleep
          {% elif s == 'scanner' %}
            mdi:magnify-scan
          {% elif s == 'credits_detection' %}
            mdi:movie-open-outline
          {% elif s == 'intro_detection' %}
            mdi:movie-filter
          {% elif s == 'thumbnail_generation' %}
            mdi:image-multiple
          {% elif s == 'transcoding' %}
            mdi:movie-cog
          {% elif s == 'multiple' %}
            mdi:cog-sync
          {% else %}
            mdi:plex
          {% endif %}
        icon_color: >-
          {% set s = states('sensor.dh_plex_agent_activity') %}

          {% if s == 'idle' %}
            green
          {% elif s in ['scanner', 'credits_detection', 'intro_detection',
          'thumbnail_generation'] %}
            blue
          {% elif s == 'transcoding' %}
            orange
          {% elif s == 'multiple' %}
            red
          {% else %}
            grey
          {% endif %}
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        entity: button.dh_plex_agent_refresh
        primary: Обновить
        secondary: >-
          {% set v = states('sensor.dh_plex_agent_last_refresh') %} {% if v in
          ['unknown', 'unavailable', 'none', ''] %}
            Ещё не выполнялось
          {% else %}
            {{ as_timestamp(v) | timestamp_custom('%d.%m.%Y %H:%M:%S', true) }}
          {% endif %}
        icon: mdi:refresh
        icon_color: blue
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.dh_plex_agent_refresh
        grid_options:
          columns: 6
          rows: 1
      - type: custom:mushroom-template-card
        entity: button.dh_plex_agent_refresh
        primary: Последняя публикация
        secondary: >-
          {% set v = states('sensor.dh_plex_agent_last_publication') %} {% if v
          in ['unknown', 'unavailable', 'none', ''] %}
            Ещё не выполнялось
          {% else %}
            {{ as_timestamp(v) | timestamp_custom('%d.%m.%Y %H:%M:%S', true) }}
          {% endif %}
        icon: mdi:information
        icon_color: blue
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.dh_plex_agent_refresh
        grid_options:
          columns: 6
          rows: 1
      - type: heading
        heading_style: title
        icon: mdi:history
        heading: Воспроизведение
      - type: custom:mushroom-template-card
        entity: sensor.dh_plex_agent_playback_started_at
        primary: Воспроизведение
        secondary: >-
          {% set v = states('sensor.dh_plex_agent_playback_started_at') %} {% if
          is_state('binary_sensor.dh_plex_agent_playback_active', 'on')
                and v not in ['unknown', 'unavailable', 'none', ''] %}
            {% set sec = (as_timestamp(now()) - as_timestamp(v)) | int(0) %}
            {% set days = sec // 86400 %}
            {% set hours = (sec % 86400) // 3600 %}
            {% set minutes = (sec % 3600) // 60 %}
            {% if days > 0 %}
              Запущено {{ days }} д. {{ hours }} ч. назад
            {% elif hours > 0 %}
              Запущено {{ hours }} ч. {{ minutes }} мин. назад
            {% elif minutes > 0 %}
              Запущено {{ minutes }} мин. назад
            {% else %}
              Запущено меньше минуты назад
            {% endif %}
          {% else %}
            Нет активного воспроизведения
          {% endif %}
        icon: mdi:play-circle
        color: |-
          {% if is_state('binary_sensor.dh_plex_agent_playback_active', 'on') %}
            green
          {% else %}
            grey
          {% endif %}
        tap_action:
          action: more-info
        grid_options:
          columns: 12
          rows: 1
        features_position: bottom
      - type: markdown
        title: Сейчас воспроизводится
        content: >
          {% set sessions = state_attr('sensor.dh_plex_agent_playback_sessions',
          'sessions') or [] %}


          {% if sessions | count == 0 %}

          _Нет активного воспроизведения._

          {% else %}


          {% for s in sessions %}


          {% if s.get('content_type') == 'audio' %}

          🎵 **{{ s.get('title', '—') }}**


          {{ s.get('artist', '—') }}{% if s.get('album') %} · {{ s.get('album')
          }}{% endif %}{% if s.get('album_year') %} · {{ s.get('album_year')
          }}{% endif %}


          **{{ s.get('mode', 'Unknown') }}** · {{ s.get('user', '—') }} · {{
          s.get('player', '—') }}{% if s.get('location') %} · {{
          s.get('location') | upper }}{% endif %}


          {% if s.get('audio_codec') %}{{ s.get('audio_codec') | upper }}{%
          endif %}{% if s.get('audio_channels') %} · {{ s.get('audio_channels')
          }} ch{% endif %}{% if s.get('sample_rate_hz') %} · {{
          (s.get('sample_rate_hz') / 1000) | round(1) }} kHz{% endif %}{% if
          s.get('media_bitrate_kbps') %} · {{ s.get('media_bitrate_kbps') }}
          kbps{% endif %}


          {% else %}

          🎬 **{{ s.get('title', '—') }}**{% if s.get('year') %} ({{
          s.get('year') }}){% endif %}


          {% if s.get('media_type') == 'episode' %}

          {{ s.get('series', '—') }}{% if s.get('season') and s.get('episode')
          %} · S{{ '%02d' | format(s.get('season') | int) }}E{{ '%02d' |
          format(s.get('episode') | int) }}{% endif %}


          {% endif %}

          **{{ s.get('mode', 'Unknown') }}** · {{ s.get('user', '—') }} · {{
          s.get('player', '—') }}{% if s.get('device') and s.get('device') !=
          s.get('player') %} · {{ s.get('device') }}{% endif %}{% if
          s.get('location') %} · {{ s.get('location') | upper }}{% endif %}


          {% if s.get('video_resolution') %}{{ s.get('video_resolution') }}p{%
          endif %}{% if s.get('video_codec') %} · {{ s.get('video_codec') |
          upper }}{% endif %}{% if s.get('audio_codec') %} · {{
          s.get('audio_codec') | upper }}{% endif %}{% if
          s.get('bandwidth_kbps') %} · {{ s.get('bandwidth_kbps') }} kbps{%
          endif %}{% if s.get('hardware_transcode') %} · ⚙️ HW{% endif %}


          {% endif %}


          {% if not loop.last %}

          ---

          {% endif %}


          {% endfor %}

          {% endif %}
  - type: grid
    cards:
      - type: heading
        heading_style: title
        icon: mdi:cpu-64-bit
        heading: Load history
      - square: false
        type: grid
        columns: 2
        cards:
          - type: tile
            entity: sensor.dh_plex_agent_cpu
            name: Plex CPU
            icon: mdi:cpu-64-bit
            features_position: bottom
            features:
              - type: trend-graph
                hours_to_show: 3
                detail: true
          - type: tile
            entity: sensor.dh_plex_agent_transcoder_cpu
            name: Transcoder CPU
            icon: mdi:movie-cog
            features_position: bottom
            features:
              - type: trend-graph
                hours_to_show: 3
                detail: true
          - type: tile
            entity: sensor.dh_plex_agent_gpu_render
            name: GPU Render
            icon: mdi:expansion-card
            vertical: false
            features:
              - type: trend-graph
                hours_to_show: 3
                detail: true
            features_position: bottom
          - type: tile
            entity: sensor.dh_plex_agent_gpu_video
            name: GPU Video
            icon: mdi:video
            features_position: bottom
            features:
              - type: trend-graph
                hours_to_show: 3
                detail: true
          - type: tile
            entity: sensor.dh_plex_agent_gpu_video_enhance
            name: GPU Video Enhance
            icon: mdi:video-high-definition
            features_position: bottom
            features:
              - type: trend-graph
                hours_to_show: 3
                detail: true
          - type: tile
            entity: sensor.dh_plex_agent_scanner_cpu
            name: Scanner CPU
            icon: mdi:magnify-scan
            features_position: bottom
            features:
              - type: trend-graph
                hours_to_show: 3
                detail: true
      - type: custom:mushroom-template-card
        entity: sensor.dh_plex_agent_gpu_driver_status
        primary: Intel GPU · состояние
        secondary: >-
          {% set driver = state_attr('sensor.dh_plex_agent_gpu_driver_status', 'driver_name') %}
          {% set binding = states('sensor.dh_plex_agent_gpu_driver_status') %}
          {% set gpu = states('sensor.dh_plex_agent_gpu_status') %}
          {% set names = {
            'ok': 'работает',
            'error': 'ошибка работы',
            'tool_missing': 'нет intel_gpu_top',
            'helper_unavailable': 'GPU Helper недоступен',
            'helper_error': 'ошибка GPU Helper',
            'stale': 'данные устарели',
            'unsupported': 'не обнаружен'
          } %}
          {% if binding == 'bound' %}
            Драйвер {{ driver or 'неизвестен' }}: подключён · GPU: {{ names.get(gpu, 'нет данных') }}
          {% elif binding == 'not_bound' %}
            Драйвер не подключён · GPU: недоступен
          {% elif binding == 'not_detected' %}
            Intel GPU не обнаружен
          {% else %}
            Драйвер: неизвестно · GPU: {{ names.get(gpu, 'нет данных') }}
          {% endif %}
        icon: mdi:chip
        icon_color: >-
          {% set binding = states('sensor.dh_plex_agent_gpu_driver_status') %}
          {% set gpu = states('sensor.dh_plex_agent_gpu_status') %}
          {% if binding == 'bound' and gpu == 'ok' %}
            green
          {% elif binding == 'not_detected' %}
            grey
          {% else %}
            orange
          {% endif %}
        tap_action:
          action: more-info
        grid_options:
          columns: 12
          rows: 1
      - type: logbook
        title: Plex Activity History (24 hr)
        hours_to_show: 24
        target:
          entity_id:
            - sensor.dh_plex_agent_activity
        name_detail: auto
  - type: grid
    cards:
      - type: heading
        heading: Фоновые задачи
        heading_style: title
        icon: mdi:cog-play
      - type: entities
        state_color: true
        show_header_toggle: false
        entities:
          - entity: binary_sensor.dh_plex_agent_scanner_running
            name: Media Scanner
          - entity: binary_sensor.dh_plex_agent_credits_detection
            name: Credits Detection
          - entity: binary_sensor.dh_plex_agent_intro_detection
            name: Intro Detection
          - entity: binary_sensor.dh_plex_agent_thumbnail_generation
            name: Thumbnail Generation
          - entity: binary_sensor.dh_plex_agent_transcoder_running
            name: Transcoder
          - entity: sensor.dh_plex_agent_transcoder_count
            name: Transcoder Processes
      - type: entities
        title: Process Details
        show_header_toggle: false
        entities:
          - entity: sensor.dh_plex_agent_scanner_actions
            name: Scanner Actions
          - entity: sensor.dh_plex_agent_process_count
            name: Plex Processes
  - type: grid
    cards:
      - type: heading
        heading: Библиотеки
        heading_style: title
        icon: mdi:folder-multiple-play
      - type: custom:mushroom-template-card
        entity: sensor.dh_plex_agent_libraries
        primary: Библиотеки Plex
        secondary: >-
          {% set n = states('sensor.dh_plex_agent_libraries') %} {% if n in
          ['unknown', 'unavailable', 'none', ''] %}
            Недоступно
          {% else %}
            {{ n }} библиотек
          {% endif %}
        icon: mdi:folder-multiple-play
        icon_color: blue
        tap_action:
          action: more-info
        grid_options:
          columns: 12
          rows: 1
      - type: custom:auto-entities
        card:
          type: entities
          state_color: true
          title: Библиотеки Plex
          show_header_toggle: false
        filter:
          include:
            - entity_id: sensor.dh_plex_agent_library_*
              options:
                secondary_info: last-changed
        sort:
          method: entity_id
        show_empty: true
      - type: heading
        heading: Диагностика
        heading_style: title
        icon: mdi:stethoscope
      - color: state
        type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.dh_plex_agent_api_status
            name: Plex API
          - entity: sensor.dh_plex_agent_collector_status
            name: Process Collector
badges: []
header: {}
cards: []
