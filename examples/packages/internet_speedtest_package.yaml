# ==============================================================================
# DIGITAL HOUSES — INTERNET STATISTICS PACKAGE
# Назначение: Учет online/offline, % доступности и сбоев (на базе Speedtest DNS)
# ==============================================================================

internet_statistics_package:

  input_boolean:
    ib_internet_statistics_v4_initialized:
      name: "Internet statistics v4 initialized"
      icon: mdi:database-check-outline

  input_datetime:
    dt_internet_online_total:
      name: "Internet online total"
      has_date: true
      has_time: true

    dt_internet_offline_total:
      name: "Internet offline total"
      has_date: true
      has_time: true

    dt_internet_last_failure:
      name: "Internet last failure"
      has_date: true
      has_time: true

    dt_internet_last_restore:
      name: "Internet last restore"
      has_date: true
      has_time: true

  counter:
    internet_failure_count:
      name: "Internet failures (month)"
      icon: mdi:alert-decagram-outline

  template:
    - binary_sensor:
        - name: "Internet status"
          unique_id: internet_status_id
          icon: mdi:web-check
          device_class: connectivity
          state: >-
            {{ is_state('binary_sensor.internet_google_dns_connectivity', 'on') or
               is_state('binary_sensor.internet_cloudflare_dns_connectivity', 'on') }}
          availability: >-
            {{ states('binary_sensor.internet_google_dns_connectivity') not in ['unknown', 'unavailable', 'none'] or
               states('binary_sensor.internet_cloudflare_dns_connectivity') not in ['unknown', 'unavailable', 'none'] }}

    - sensor:
        - name: "Internet last failure"
          unique_id: internet_last_failure_sensor_id
          icon: mdi:clock-alert-outline
          device_class: timestamp
          state: >-
            {% set ts = state_attr('input_datetime.dt_internet_last_failure', 'timestamp') %}
            {{ as_local(as_datetime(ts)).isoformat() if ts is number else none }}
          availability: >-
            {% set failure = state_attr('input_datetime.dt_internet_last_failure', 'timestamp') %}
            {% set restore = state_attr('input_datetime.dt_internet_last_restore', 'timestamp') %}
            {{ failure is number and restore is number and (failure - restore) | abs > 1 }}

        - name: "Internet last restore"
          unique_id: internet_last_restore_sensor_id
          icon: mdi:clock-check-outline
          device_class: timestamp
          state: >-
            {% set ts = state_attr('input_datetime.dt_internet_last_restore', 'timestamp') %}
            {{ as_local(as_datetime(ts)).isoformat() if ts is number else none }}
          availability: >-
            {% set failure = state_attr('input_datetime.dt_internet_last_failure', 'timestamp') %}
            {% set restore = state_attr('input_datetime.dt_internet_last_restore', 'timestamp') %}
            {{ failure is number and restore is number and (failure - restore) | abs > 1 }}

        - name: "Internet statistics period start"
          unique_id: internet_statistics_period_start_sensor_id
          icon: mdi:calendar-start
          device_class: timestamp
          state: >-
            {{ now().replace(day=1, hour=0, minute=0, second=0, microsecond=0).isoformat() }}

        - name: "Internet online month"
          unique_id: internet_online_month_id
          icon: mdi:timer-check-outline
          state: >-
            {% set month_start = as_timestamp(now().replace(day=1, hour=0, minute=0, second=0, microsecond=0)) %}
            {% set total = state_attr('input_datetime.dt_internet_online_total', 'timestamp') %}
            {% set failure = state_attr('input_datetime.dt_internet_last_failure', 'timestamp') %}
            {% set restore = state_attr('input_datetime.dt_internet_last_restore', 'timestamp') %}
            {% if total is not number or failure is not number or restore is not number %}
              {{ none }}
            {% else %}
              {% set online = restore > failure %}
              {% set closed = [total - month_start, 0] | max %}
              {% set active = 0 %}
              {% if online %}
                {% set active_start = [restore, month_start] | max %}
                {% set active = [now().timestamp() - active_start, 0] | max %}
              {% endif %}
              {% set sec = [closed + active, 0] | max | int %}
              {% set d = sec // 86400 %}
              {% set h = (sec % 86400) // 3600 %}
              {% set m = (sec % 3600) // 60 %}
              {% set s = sec % 60 %}
              {{ (d ~ ' д. ' if d > 0 else '') ~ ('%02d:%02d:%02d' | format(h,m,s)) }}
            {% endif %}
          availability: >-
            {{
              state_attr('input_datetime.dt_internet_online_total', 'timestamp') is number
              and state_attr('input_datetime.dt_internet_last_failure', 'timestamp') is number
              and state_attr('input_datetime.dt_internet_last_restore', 'timestamp') is number
            }}
          attributes:
            seconds: >-
              {% set month_start = as_timestamp(now().replace(day=1, hour=0, minute=0, second=0, microsecond=0)) %}
              {% set total = state_attr('input_datetime.dt_internet_online_total', 'timestamp') %}
              {% set failure = state_attr('input_datetime.dt_internet_last_failure', 'timestamp') %}
              {% set restore = state_attr('input_datetime.dt_internet_last_restore', 'timestamp') %}
              {% if total is not number or failure is not number or restore is not number %}
                {{ none }}
              {% else %}
                {% set closed = [total - month_start, 0] | max %}
                {% set active = 0 %}
                {% if restore > failure %}
                  {% set active_start = [restore, month_start] | max %}
                  {% set active = [now().timestamp() - active_start, 0] | max %}
                {% endif %}
                {{ [closed + active, 0] | max | round(0) }}
              {% endif %}

        - name: "Internet offline month"
          unique_id: internet_offline_month_id
          icon: mdi:timer-alert-outline
          state: >-
            {% set month_start = as_timestamp(now().replace(day=1, hour=0, minute=0, second=0, microsecond=0)) %}
            {% set total = state_attr('input_datetime.dt_internet_offline_total', 'timestamp') %}
            {% set failure = state_attr('input_datetime.dt_internet_last_failure', 'timestamp') %}
            {% set restore = state_attr('input_datetime.dt_internet_last_restore', 'timestamp') %}
            {% if total is not number or failure is not number or restore is not number %}
              {{ none }}
            {% else %}
              {% set offline = failure > restore %}
              {% set closed = [total - month_start, 0] | max %}
              {% set active = 0 %}
              {% if offline %}
                {% set active_start = [failure, month_start] | max %}
                {% set active = [now().timestamp() - active_start, 0] | max %}
              {% endif %}
              {% set sec = [closed + active, 0] | max | int %}
              {% set d = sec // 86400 %}
              {% set h = (sec % 86400) // 3600 %}
              {% set m = (sec % 3600) // 60 %}
              {% set s = sec % 60 %}
              {{ (d ~ ' д. ' if d > 0 else '') ~ ('%02d:%02d:%02d' | format(h,m,s)) }}
            {% endif %}
          availability: >-
            {{
              state_attr('input_datetime.dt_internet_offline_total', 'timestamp') is number
              and state_attr('input_datetime.dt_internet_last_failure', 'timestamp') is number
              and state_attr('input_datetime.dt_internet_last_restore', 'timestamp') is number
            }}
          attributes:
            seconds: >-
              {% set month_start = as_timestamp(now().replace(day=1, hour=0, minute=0, second=0, microsecond=0)) %}
              {% set total = state_attr('input_datetime.dt_internet_offline_total', 'timestamp') %}
              {% set failure = state_attr('input_datetime.dt_internet_last_failure', 'timestamp') %}
              {% set restore = state_attr('input_datetime.dt_internet_last_restore', 'timestamp') %}
              {% if total is not number or failure is not number or restore is not number %}
                {{ none }}
              {% else %}
                {% set closed = [total - month_start, 0] | max %}
                {% set active = 0 %}
                {% if failure > restore %}
                  {% set active_start = [failure, month_start] | max %}
                  {% set active = [now().timestamp() - active_start, 0] | max %}
                {% endif %}
                {{ [closed + active, 0] | max | round(0) }}
              {% endif %}

        - name: "Internet availability month"
          unique_id: internet_availability_month_id
          icon: mdi:percent-circle-outline
          unit_of_measurement: "%"
          state_class: measurement
          state: >-
            {% set online = state_attr('sensor.internet_online_month', 'seconds') %}
            {% set offline = state_attr('sensor.internet_offline_month', 'seconds') %}
            {% if online is not number or offline is not number %}
              {{ none }}
            {% else %}
              {% set total = online + offline %}
              {{ ((online / total) * 100) | round(2) if total > 0 else none }}
            {% endif %}
          availability: >-
            {{
              state_attr('sensor.internet_online_month', 'seconds') is number
              and state_attr('sensor.internet_offline_month', 'seconds') is number
              and (state_attr('sensor.internet_online_month', 'seconds') + state_attr('sensor.internet_offline_month', 'seconds')) > 0
            }}

        - name: "Internet last outage duration"
          unique_id: internet_last_outage_duration_id
          icon: mdi:timer-outline
          state: >-
            {% set failure = state_attr('input_datetime.dt_internet_last_failure', 'timestamp') %}
            {% set restore = state_attr('input_datetime.dt_internet_last_restore', 'timestamp') %}
            {% if failure is not number or restore is not number or restore < failure %}
              {{ none }}
            {% else %}
              {% set sec = [restore - failure, 0] | max | int %}
              {% set d = sec // 86400 %}
              {% set h = (sec % 86400) // 3600 %}
              {% set m = (sec % 3600) // 60 %}
              {% set s = sec % 60 %}
              {{ (d ~ ' д. ' if d > 0 else '') ~ ('%02d:%02d:%02d' | format(h,m,s)) }}
            {% endif %}
          availability: >-
            {% set failure = state_attr('input_datetime.dt_internet_last_failure', 'timestamp') %}
            {% set restore = state_attr('input_datetime.dt_internet_last_restore', 'timestamp') %}
            {{ failure is number and restore is number and restore > failure and (restore - failure) > 1 }}

        - name: "Internet downtime"
          unique_id: internet_downtime_sensor_id
          icon: mdi:timer-alert-outline
          state: "{{ states('sensor.internet_last_outage_duration') }}"
          availability: >-
            {{ states('sensor.internet_last_outage_duration') not in ['unknown','unavailable','none',''] }}


  automation:
    - id: internet_statistics_engine
      alias: "Internet Statistics Engine"
      description: "Datetime accounting with fixed monthly base and confirmed state sequence"
      mode: queued
      max: 50
      trigger:
        - platform: time
          at: "00:00:01"
          id: month_guard

        - platform: state
          entity_id: binary_sensor.internet_status
          to: "on"
          for: "00:00:05"
          id: internet_on

        - platform: state
          entity_id: binary_sensor.internet_status
          to: "off"
          for: "00:00:15"
          id: internet_off

      variables:
        current_ts: "{{ now().timestamp() | int }}"
        event_ts: >-
          {{
            (as_timestamp(trigger.to_state.last_changed) | int)
            if trigger.id in ['internet_on', 'internet_off']
            else (now().timestamp() | int)
          }}
        month_start_ts: >-
          {{
            as_timestamp(
              now().replace(day=1, hour=0, minute=0, second=0, microsecond=0)
            ) | int
          }}
        current_month: "{{ now().strftime('%Y-%m') }}"
        online_total_ts_before: "{{ state_attr('input_datetime.dt_internet_online_total', 'timestamp') }}"
        offline_total_ts_before: "{{ state_attr('input_datetime.dt_internet_offline_total', 'timestamp') }}"
        failure_ts_before: "{{ state_attr('input_datetime.dt_internet_last_failure', 'timestamp') }}"
        restore_ts_before: "{{ state_attr('input_datetime.dt_internet_last_restore', 'timestamp') }}"
        initialized_v4_before: "{{ is_state('input_boolean.ib_internet_statistics_v4_initialized', 'on') }}"
        online_total_month_before: >-
          {{
            as_local(as_datetime(online_total_ts_before)).strftime('%Y-%m')
            if online_total_ts_before is number
            else none
          }}
        offline_total_month_before: >-
          {{
            as_local(as_datetime(offline_total_ts_before)).strftime('%Y-%m')
            if offline_total_ts_before is number
            else none
          }}
        base_helpers_valid: >-
          {{
            online_total_ts_before is number
            and offline_total_ts_before is number
            and failure_ts_before is number
            and restore_ts_before is number
            and online_total_ts_before >= 946684800
            and offline_total_ts_before >= 946684800
            and failure_ts_before >= 946684800
            and restore_ts_before >= 946684800
            and online_total_ts_before <= current_ts + 60
            and offline_total_ts_before <= current_ts + 60
            and failure_ts_before <= current_ts + 60
            and restore_ts_before <= current_ts + 60
            and states('binary_sensor.internet_status') in ['on', 'off']
          }}
        totals_current_month: >-
          {{
            base_helpers_valid | bool
            and online_total_month_before == current_month
            and offline_total_month_before == current_month
          }}
        accounting_online_before: >-
          {{
            base_helpers_valid | bool
            and restore_ts_before > failure_ts_before
          }}
        accounting_offline_before: >-
          {{
            base_helpers_valid | bool
            and failure_ts_before > restore_ts_before
          }}
        closed_online_before: >-
          {{
            [online_total_ts_before - month_start_ts, 0] | max
            if totals_current_month | bool
            else 0
          }}
        closed_offline_before: >-
          {{
            [offline_total_ts_before - month_start_ts, 0] | max
            if totals_current_month | bool
            else 0
          }}
        active_interval_before: >-
          {% if accounting_online_before | bool %}
            {{ [current_ts - [restore_ts_before, month_start_ts] | max, 0] | max }}
          {% elif accounting_offline_before | bool %}
            {{ [current_ts - [failure_ts_before, month_start_ts] | max, 0] | max }}
          {% else %}
            0
          {% endif %}
        accounted_seconds_before: >-
          {{ closed_online_before + closed_offline_before + active_interval_before }}
        elapsed_seconds_month: "{{ [current_ts - month_start_ts, 0] | max }}"
        accounting_balance_valid: >-
          {{
            totals_current_month | bool
            and (accounting_online_before | bool or accounting_offline_before | bool)
            and (accounted_seconds_before - elapsed_seconds_month) | abs <= 65
          }}

      action:
        # Инициализация
        - if:
            - condition: template
              value_template: "{{ not (initialized_v4_before | bool) or not (base_helpers_valid | bool) }}"
          then:
            - choose:
                - conditions:
                    - condition: state
                      entity_id: binary_sensor.internet_status
                      state: "on"
                  sequence:
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: input_datetime.dt_internet_online_total
                      data:
                        timestamp: "{{ current_ts }}"
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: input_datetime.dt_internet_offline_total
                      data:
                        timestamp: "{{ month_start_ts }}"
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: input_datetime.dt_internet_last_failure
                      data:
                        timestamp: "{{ current_ts - 5 }}"
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: input_datetime.dt_internet_last_restore
                      data:
                        timestamp: "{{ current_ts }}"
                - conditions:
                    - condition: state
                      entity_id: binary_sensor.internet_status
                      state: "off"
                  sequence:
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: input_datetime.dt_internet_online_total
                      data:
                        timestamp: "{{ month_start_ts }}"
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: input_datetime.dt_internet_offline_total
                      data:
                        timestamp: "{{ current_ts }}"
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: input_datetime.dt_internet_last_restore
                      data:
                        timestamp: "{{ current_ts - 5 }}"
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: input_datetime.dt_internet_last_failure
                      data:
                        timestamp: "{{ current_ts }}"
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.ib_internet_statistics_v4_initialized
            - action: counter.reset
              target:
                entity_id: counter.internet_failure_count

        - variables:
            online_total_ts_1: "{{ state_attr('input_datetime.dt_internet_online_total', 'timestamp') }}"
            offline_total_ts_1: "{{ state_attr('input_datetime.dt_internet_offline_total', 'timestamp') }}"
            failure_ts_1: "{{ state_attr('input_datetime.dt_internet_last_failure', 'timestamp') }}"
            restore_ts_1: "{{ state_attr('input_datetime.dt_internet_last_restore', 'timestamp') }}"
            online_total_month_1: >-
              {{ as_local(as_datetime(online_total_ts_1)).strftime('%Y-%m') if online_total_ts_1 is number else none }}
            offline_total_month_1: >-
              {{ as_local(as_datetime(offline_total_ts_1)).strftime('%Y-%m') if offline_total_ts_1 is number else none }}

        # Ротация на новый месяц
        - if:
            - condition: template
              value_template: >-
                {{
                  online_total_month_1 != current_month
                  or offline_total_month_1 != current_month
                }}
          then:
            - action: input_datetime.set_datetime
              target:
                entity_id:
                  - input_datetime.dt_internet_online_total
                  - input_datetime.dt_internet_offline_total
              data:
                timestamp: "{{ month_start_ts }}"
            - action: counter.reset
              target:
                entity_id: counter.internet_failure_count

        - variables:
            online_total_ts: "{{ state_attr('input_datetime.dt_internet_online_total', 'timestamp') }}"
            offline_total_ts: "{{ state_attr('input_datetime.dt_internet_offline_total', 'timestamp') }}"
            failure_ts: "{{ state_attr('input_datetime.dt_internet_last_failure', 'timestamp') }}"
            restore_ts: "{{ state_attr('input_datetime.dt_internet_last_restore', 'timestamp') }}"
            accounting_online: "{{ restore_ts is number and failure_ts is number and restore_ts > failure_ts }}"
            accounting_offline: "{{ restore_ts is number and failure_ts is number and failure_ts > restore_ts }}"

        # Обработка изменения статуса
        - choose:
            - conditions:
                - condition: trigger
                  id: internet_off
                - condition: template
                  value_template: "{{ accounting_online | bool }}"
              sequence:
                - variables:
                    online_closed_s: "{{ [online_total_ts - month_start_ts, 0] | max }}"
                    online_interval_start_ts: "{{ [restore_ts, month_start_ts] | max }}"
                    online_interval_s: "{{ [event_ts - online_interval_start_ts, 0] | max }}"
                    online_total_new_ts: >-
                      {{ month_start_ts + online_closed_s + online_interval_s }}
                - action: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.dt_internet_online_total
                  data:
                    timestamp: "{{ online_total_new_ts }}"
                - action: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.dt_internet_last_failure
                  data:
                    timestamp: "{{ event_ts }}"
                - action: counter.increment
                  target:
                    entity_id: counter.internet_failure_count

            - conditions:
                - condition: trigger
                  id: internet_on
                - condition: template
                  value_template: "{{ accounting_offline | bool }}"
              sequence:
                - variables:
                    offline_closed_s: "{{ [offline_total_ts - month_start_ts, 0] | max }}"
                    offline_interval_start_ts: "{{ [failure_ts, month_start_ts] | max }}"
                    offline_interval_s: "{{ [event_ts - offline_interval_start_ts, 0] | max }}"
                    offline_total_new_ts: >-
                      {{ month_start_ts + offline_closed_s + offline_interval_s }}
                - action: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.dt_internet_offline_total
                  data:
                    timestamp: "{{ offline_total_new_ts }}"
                - action: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.dt_internet_last_restore
                  data:
                    timestamp: "{{ event_ts }}"

        # Восстановление баланса при сбоях
        - if:
            - condition: template
              value_template: >-
                {{
                  initialized_v4_before | bool
                  and trigger.id == 'month_guard'
                  and totals_current_month | bool
                  and not (accounting_balance_valid | bool)
                }}
          then:
            - choose:
                - conditions:
                    - condition: state
                      entity_id: binary_sensor.internet_status
                      state: "on"
                  sequence:
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: input_datetime.dt_internet_online_total
                      data:
                        timestamp: "{{ current_ts }}"
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: input_datetime.dt_internet_offline_total
                      data:
                        timestamp: "{{ month_start_ts }}"
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: input_datetime.dt_internet_last_failure
                      data:
                        timestamp: "{{ current_ts - 5 }}"
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: input_datetime.dt_internet_last_restore
                      data:
                        timestamp: "{{ current_ts }}"
                - conditions:
                    - condition: state
                      entity_id: binary_sensor.internet_status
                      state: "off"
                  sequence:
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: input_datetime.dt_internet_online_total
                      data:
                        timestamp: "{{ month_start_ts }}"
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: input_datetime.dt_internet_offline_total
                      data:
                        timestamp: "{{ current_ts }}"
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: input_datetime.dt_internet_last_restore
                      data:
                        timestamp: "{{ current_ts - 5 }}"
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: input_datetime.dt_internet_last_failure
                      data:
                        timestamp: "{{ current_ts }}"
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.ib_internet_statistics_v4_initialized
            - action: counter.reset
              target:
                entity_id: counter.internet_failure_count