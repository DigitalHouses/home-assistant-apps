title: Internet Speedtest
views:
  - type: sections
    title: Internet
    path: internet
    icon: mdi:web
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: entities
                title: Internet
                state_color: true
                show_header_toggle: false
                entities:
                  - entity: sensor.internet_speed_external_ip
                    name: External IP address
                  - type: divider
                  - entity: binary_sensor.internet_google_dns_connectivity
                    name: Google DNS
                  - entity: binary_sensor.internet_cloudflare_dns_connectivity
                    name: Cloudflare DNS
                  - type: divider
                  - entity: sensor.internet_speed_download
                    secondary_info: last-updated
                    name: Download speed
                  - entity: sensor.internet_speed_upload
                    secondary_info: last-updated
                    name: Upload speed
                  - entity: sensor.internet_speed_ping
                    secondary_info: last-updated
                    name: Ping
                  - entity: sensor.internet_speed_jitter
                    secondary_info: last-updated
                    name: Jitter
                  - entity: sensor.internet_speed_packet_loss
                    secondary_info: last-updated
                    name: Packet loss
                  - type: divider
                  - entity: sensor.internet_speed_provider
                    name: Internet provider
                  - entity: sensor.internet_speed_server
                    name: Speedtest server
                  - type: divider
                  - entity: sensor.internet_speed_last_test
                    name: Last successful test
          - type: entities
            title: Controls and status
            show_header_toggle: false
            entities:
              - entity: button.internet_speed_run
                name: Run speed test
              - entity: button.internet_speed_refresh_servers
                name: Refresh Speedtest server list
              - type: divider
              - entity: sensor.internet_speed_status
                name: Add-on status
              - entity: number.internet_speed_periodic_interval
                name: Periodic test interval
      - type: grid
        cards:
          - type: entities
            title: Thresholds
            show_header_toggle: false
            entities:
              - entity: number.internet_speed_minimum_download
                name: Download threshold
              - entity: number.internet_speed_minimum_upload
                name: Upload threshold
              - entity: number.internet_speed_maximum_ping
                name: Ping threshold
          - type: entities
            title: Problems
            state_color: true
            show_header_toggle: false
            entities:
              - entity: binary_sensor.internet_speed_performance_problem
                name: Internet performance problem
              - type: divider
              - entity: binary_sensor.internet_speed_high_ping
                name: High ping
              - entity: binary_sensor.internet_speed_low_download
                name: Low download speed
              - entity: binary_sensor.internet_speed_low_upload
                name: Low upload speed
          - type: entities
            title: Monthly Internet Statistics
            state_color: true
            show_header_toggle: false
            entities:
              - entity: sensor.internet_availability_month
                name: Availability
              - type: divider
              - entity: counter.internet_failure_count
                name: Failures
              - entity: sensor.internet_online_month
                name: Internet online
              - entity: sensor.internet_offline_month
                name: Internet offline
              - entity: sensor.internet_statistics_period_start
                name: Period start
              - type: divider
              - entity: sensor.internet_last_failure
                name: Last failure
              - entity: sensor.internet_last_restore
                name: Last restore
              - entity: sensor.internet_last_outage_duration
                name: Last outage duration
      - type: grid
        cards:
          - type: history-graph
            title: Speed and connectivity history (last 3 days)
            hours_to_show: 72
            entities:
              - entity: sensor.internet_speed_download
              - entity: sensor.internet_speed_upload
              - entity: number.internet_speed_minimum_download
              - entity: number.internet_speed_minimum_upload
              - entity: binary_sensor.internet_google_dns_connectivity
                name: Google DNS
              - entity: binary_sensor.internet_cloudflare_dns_connectivity
                name: Cloudflare DNS
          - type: history-graph
            title: Latency history (last 3 days)
            hours_to_show: 72
            entities:
              - entity: sensor.internet_speed_ping
              - entity: sensor.internet_speed_jitter
              - entity: number.internet_speed_maximum_ping
      - type: grid
        cards:
          - type: markdown
            title: Available Speedtest Servers
            content: >
              {% set servers =
              state_attr('sensor.internet_speed_available_servers', 'servers')
              %}


              {% if servers %}

              **Updated:** {{
              as_datetime(state_attr('sensor.internet_speed_available_servers',
              'updated_at')).strftime('%d.%m.%Y %H:%M') }}


              | № | Provider | ID | Location |

              | :---: | :--- | :---: | :--- |

              {%- for s in servers %}

              | {{ loop.index }} | **{{ s.provider }}** | {{ s.id }} | {{
              s.location }}, {{ s.country }} |

              {%- endfor %}


              ---

              **Total:** {{ servers | count }} servers


              {% else %}

              No servers available.

              {% endif %}
          - type: markdown
            title: Recent Speedtests
            content: >
              | Date | ⬇️ Mbps | ⬆️ Mbps | 📶 ms | Сервер | Статус |

              | :--- | :---: | :---: | :---: | :--- | :--- |

              {%- for r in state_attr('sensor.internet_speed_recent_results',
              'results')[:10] %}

              | {{ as_datetime(r.timestamp).strftime('%d.%m %H:%M') }} | {{
              r.download_mbps | round(0) }} | {{ r.upload_mbps | round(0) }} |
              {{ r.ping_ms | round(1) }} | {{ r.server }} | {% if
              r.performance_problem %}❌ {{ r.problem_reasons | join(', ') }}{%
              else %}✅ OK{% endif %} |

              {%- endfor %}
    cards: []
